<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>District Secrets</title>
<script>/* "/district-secrets" without the slash would load photos from the wrong folder */
if(/\/district-secrets$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Special+Elite&family=Manrope:wght@500;700;800&display=swap">
<style>
/* District Secrets, the TV. A Capitol archive at midnight: velvet, wax seals, gold foil, holly.
   Phones answer privately; the TV only ever shows sealed envelopes until the reveal. */
:root{
  --night:#0b0a14; --plum:#1b1328; --plum-2:#251a36; --velvet:#3b0d1c;
  --wax:#a3182b; --wax-hi:#d8393f; --wax-d:#5e0a17;
  --gold:#d9b25f; --gold-hi:#f6dfa0; --gold-d:#8a6a26;
  --pine:#1f5a40; --pine-hi:#3f9a68; --berry:#e2343c;
  --parch:#efe2c4; --parch-d:#c9b385; --parch-ink:#2b1d12;
  --ink:#f4ecdb; --muted:#ab9fbe; --good:#86e0a8; --bad:#ff8f80;
  --line:rgba(244,236,219,.14);
  --deco:"Cinzel Decorative","Cinzel",Georgia,serif; --display:"Cinzel",Georgia,serif;
  --type:"Special Elite","Courier New",monospace; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 70% 50% at 50% -10%,rgba(163,24,43,.55),transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 115%,rgba(217,178,95,.16),transparent 70%),
    radial-gradient(circle at 0% 50%,rgba(31,90,64,.28),transparent 40%),
    radial-gradient(circle at 100% 50%,rgba(31,90,64,.28),transparent 40%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 64px);}
/* velvet curtains at the edges */
body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:clamp(18px,4vw,64px);z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,#2a0713 0 10px,#4a1022 10px 18px,#2a0713 18px 26px);box-shadow:0 0 40px rgba(0,0,0,.8)}
body::before{left:0;border-right:2px solid var(--gold-d)}body::after{right:0;border-left:2px solid var(--gold-d)}
#sky,#fx{position:fixed;inset:0;pointer-events:none}#sky{z-index:0}#fx{z-index:8}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.6));animation:candle 3.2s ease-in-out infinite}
@keyframes candle{0%,100%{opacity:1}40%{opacity:.85}60%{opacity:.95}}
/* garland: holly and gold candle flames across the top */
.garland{position:fixed;top:0;left:0;right:0;height:46px;z-index:3;pointer-events:none}
.garland svg{width:100%;height:100%}
.garland .flame{animation:flick 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%{transform:scaleY(1) rotate(-3deg);opacity:1}50%{transform:scaleY(.82) rotate(3deg);opacity:.85}100%{transform:scaleY(1.08) rotate(-1deg);opacity:1}}

.app{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;gap:16px;max-width:1320px;margin:0 auto;
  padding:58px max(clamp(30px,5vw,84px),env(safe-area-inset-right)) 22px max(clamp(30px,5vw,84px),env(safe-area-inset-left))}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.btn{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1a05;font-weight:800;padding:.8em 1.5em;border-radius:12px;font-size:1.05rem;box-shadow:0 4px 0 var(--gold-d),0 10px 24px rgba(0,0,0,.35);letter-spacing:.02em}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.btn.wax{background:linear-gradient(180deg,var(--wax-hi),var(--wax));color:#fff;box-shadow:0 4px 0 var(--wax-d),0 10px 24px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(11,10,20,.5);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.76rem;color:var(--muted);font-weight:800}
.tiny{font-size:.85rem;color:var(--muted)}
.ctl{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.ctl .hint{margin-right:auto}
.linkbtn{text-decoration:underline;color:var(--muted);font-size:.85rem}

/* the seal emblem */
.emblem{width:clamp(110px,14vw,170px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.emblem .spin{animation:slowspin 40s linear infinite;transform-origin:100px 100px}
@keyframes slowspin{to{transform:rotate(360deg)}}

/* ---------- lobby ---------- */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.hero{display:grid;gap:14px;justify-items:center;text-align:center}
.title{font-family:var(--deco);font-weight:900;font-size:clamp(2.6rem,6.6vw,5.4rem);line-height:.95;margin:0;
  background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 55%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 var(--wax-d)) drop-shadow(0 0 24px rgba(217,178,95,.3))}
.tagline{font-family:var(--type);font-size:clamp(1rem,1.8vw,1.25rem);color:var(--parch);margin:0}
.rules{max-width:56ch;margin:0;color:var(--muted);line-height:1.55}
.rules b{color:var(--ink)}
.join{display:flex;gap:18px;align-items:center;background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:14px 18px;transform:rotate(-1deg);
  box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 40px rgba(120,80,30,.25);position:relative;text-align:left}
.join::after{content:"ADMIT ONE TRIBUTE";position:absolute;right:-10px;top:-14px;background:var(--wax);color:#fff;font-family:var(--type);font-size:.72rem;letter-spacing:.14em;padding:.35em .8em;transform:rotate(4deg);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.join .qr{width:clamp(120px,13vw,170px);flex:none;background:#fff;padding:4px;border-radius:4px}
.join .qr svg{display:block;width:100%;height:auto}
.join .eyebrow{color:#6b5233}
.join-url{font-family:var(--type);font-size:clamp(1.05rem,1.8vw,1.45rem);overflow-wrap:anywhere;margin:4px 0}
.join .tiny{color:#6b5233}
.roster{display:grid;gap:12px}
.count{display:flex;align-items:baseline;gap:10px;justify-content:center}
.count .n{font-family:var(--deco);font-size:clamp(3.4rem,7vw,5.4rem);color:var(--gold-hi);line-height:1;text-shadow:0 0 24px rgba(217,178,95,.45)}
.count .n.bump{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
.count .of{font-family:var(--display);font-size:1.6rem;color:var(--muted)}
.count .lbl{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
.status{text-align:center;font-weight:800;color:var(--muted)}
.status.all{color:var(--good);animation:bump 1s ease-in-out infinite alternate}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.p{display:grid;justify-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;background:rgba(27,19,40,.75);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:.9rem;text-align:center;position:relative;transition:opacity .3s}
.p img{width:56px;height:56px;border-radius:50%;object-fit:cover;filter:grayscale(1) brightness(.55);box-shadow:0 0 0 2px var(--line);transition:filter .4s}
.p small{font-weight:700;font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.p.in{box-shadow:inset 0 0 0 2px var(--gold),0 0 20px rgba(217,178,95,.25)}
.p.in img{filter:none;box-shadow:0 0 0 3px var(--gold)}
.p.in small{color:var(--gold-hi)}
.p.new{animation:arrive .9s cubic-bezier(.2,1.5,.4,1)}
.p.off{opacity:.3}.p.off small{color:var(--bad)}
.p .seal{position:absolute;top:6px;right:8px;font-size:1rem}
.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seg{display:inline-flex;gap:4px}
.seg button{padding:.4em .9em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
@keyframes arrive{0%{transform:scale(.4) rotate(-12deg)}60%{transform:scale(1.15) rotate(4deg)}100%{transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- round card + countdown ---------- */
.center{display:grid;place-items:center;align-content:center;gap:16px;text-align:center;min-height:72vh}
.center .num{font-family:var(--type);font-size:clamp(1rem,2vw,1.3rem);color:var(--parch-ink);background:var(--parch);padding:.3em 1em;transform:rotate(-2deg);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.center h1{font-family:var(--deco);font-size:clamp(2.6rem,8vw,6rem);color:var(--gold-hi);text-shadow:0 4px 0 var(--wax-d),0 0 40px rgba(217,178,95,.35);animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
.center p{margin:0;color:var(--muted);font-size:1.15rem;max-width:46ch}
.dial{position:relative;width:clamp(220px,34vw,360px);aspect-ratio:1;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .ring{animation:dialspin .85s cubic-bezier(.5,0,.3,1.4) both;transform-origin:50% 50%}
.dial .big{position:relative;font-family:var(--deco);font-size:clamp(5rem,14vw,9rem);color:var(--gold-hi);line-height:1;text-shadow:0 5px 0 var(--wax-d);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dialspin{from{transform:rotate(-140deg)}to{transform:rotate(0)}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
.gift{display:inline-block;background:linear-gradient(90deg,var(--wax),var(--wax-hi));color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.45em 1.1em;border-radius:999px;box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(217,178,95,.5);animation:bump 1.1s ease-in-out infinite alternate;font-size:.9rem}
.quip{font-family:var(--type);color:var(--parch);font-size:clamp(1rem,2vw,1.3rem)}

/* ---------- question: the secret file ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.qnum{font-family:var(--display);font-size:clamp(1.3rem,2.8vw,2rem);color:var(--gold-hi)}
.timer{position:relative;width:84px;height:84px;flex:none;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer .n{position:relative;font-family:var(--display);font-weight:900;font-size:1.8rem;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--wax-d)}
.timer.hurry{animation:shake .45s infinite}
@keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.file{position:relative;width:min(100%,1000px);margin:0 auto;background:var(--parch);color:var(--parch-ink);border-radius:4px;
  padding:clamp(22px,3.4vw,46px) clamp(22px,4.4vw,64px) clamp(30px,4vw,52px);transform:rotate(-.6deg);
  box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 0 70px rgba(120,80,30,.3),inset 0 0 0 1px rgba(80,50,20,.25);
  background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(60,90,140,.12) 33px 34px),radial-gradient(circle at 85% 15%,rgba(120,80,30,.18),transparent 30%);
  animation:slidein .8s cubic-bezier(.2,1.2,.4,1)}
.file::before{content:"";position:absolute;left:-1px;top:-26px;width:38%;height:30px;background:var(--parch-d);border-radius:8px 8px 0 0;clip-path:polygon(0 100%,6% 0,94% 0,100% 100%)}
@keyframes slidein{from{transform:translateY(40px) rotate(-4deg);opacity:0}to{transform:rotate(-.6deg);opacity:1}}
.file .hdr{display:flex;justify-content:space-between;gap:12px;font-family:var(--type);font-size:clamp(.8rem,1.3vw,1rem);letter-spacing:.08em;color:#6b5233;border-bottom:2px dashed rgba(80,50,20,.35);padding-bottom:10px;margin-bottom:clamp(14px,2.4vw,26px)}
.file .fact{font-family:var(--type);font-size:clamp(1.7rem,4.2vw,3.5rem);line-height:1.2;margin:0;min-height:2.4em;text-wrap:balance}
.file .fact .cur{display:inline-block;width:.5em;border-bottom:4px solid var(--parch-ink);animation:blink .8s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.file .ask{margin-top:clamp(12px,2vw,22px);font-family:var(--display);font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--wax);font-size:clamp(.9rem,1.6vw,1.2rem)}
.stamp{position:absolute;font-family:var(--display);font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--wax);border:5px double var(--wax);border-radius:8px;padding:.15em .6em;
  mix-blend-mode:multiply;opacity:.85;pointer-events:none}
/* time's up: the folder's cover swings shut over the secret, then SEALED slams onto it */
.file.closed::after{content:"";position:absolute;inset:0;border-radius:4px;z-index:2;transform-origin:50% 0;
  background:repeating-linear-gradient(0deg,rgba(80,50,20,.05) 0 2px,transparent 2px 34px),linear-gradient(#ddc89e,#c9b385);
  box-shadow:inset 0 0 0 2px rgba(80,50,20,.25),inset 0 -14px 30px rgba(80,50,20,.18);animation:fileshut .6s cubic-bezier(.35,1.25,.5,1) both}
@keyframes fileshut{0%{transform:perspective(900px) rotateX(-95deg);opacity:.4}100%{transform:none;opacity:1}}
.file.closed .stamp{z-index:3}
.file.closed .stamp.ts{font-size:clamp(.75rem,1.3vw,1.05rem);top:clamp(12px,1.8vw,22px);right:clamp(12px,1.8vw,26px);border-width:3px;transition:all .35s}
.file.closed .stamp.sealed{animation-delay:.55s}
.file.closed .fact,.file.closed .ask,.file.closed .fuse{visibility:hidden;transition:visibility 0s .35s}
.stamp.ts{right:clamp(14px,3vw,40px);top:clamp(58px,7vw,84px);transform:rotate(9deg);font-size:clamp(1rem,2.2vw,1.7rem)}
.stamp.sealed{left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font-size:clamp(2.4rem,7vw,5.6rem);animation:slam .45s cubic-bezier(.3,1.6,.5,1) both;opacity:.9;background:rgba(239,226,196,.5)}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:.9}}
/* the burning fuse: how much time is left */
.fuse{position:absolute;left:clamp(22px,4.4vw,64px);right:clamp(22px,4.4vw,64px);bottom:16px;height:6px;border-radius:3px;background:rgba(80,50,20,.2)}
.fuse i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--wax),#e86a2c)}
.fuse b{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff6c0,#ffb02e 45%,rgba(255,90,20,0) 70%);animation:spark .18s infinite alternate}
@keyframes spark{to{transform:scale(1.5)}}
/* anonymous sealed envelopes: no names on the TV */
.sealedrow{display:grid;gap:10px;justify-items:center;text-align:center}
.envs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.env{width:clamp(46px,5vw,64px);height:auto;transition:transform .3s}
.env.in{animation:sealin .6s cubic-bezier(.2,1.6,.4,1)}
.env .wx{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .2s}
.env.in .wx{opacity:1}
.env:not(.in){opacity:.35}
@keyframes sealin{0%{transform:translateY(-16px) scale(.7)}60%{transform:translateY(3px) scale(1.12)}100%{transform:none}}
.sealedtxt{font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,2.2vw,1.5rem);color:var(--gold-hi)}
.sealedtxt b{font-family:var(--deco)}

/* ---------- reveal ---------- */
.reveal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(18px,3vw,44px);align-items:center}
.polaroid{position:relative;background:#fbf7ee;padding:14px 14px 64px;border-radius:3px;box-shadow:0 26px 50px rgba(0,0,0,.65);transform:rotate(-3deg);
  width:min(100%,520px);justify-self:center;animation:develop 1s cubic-bezier(.2,1.3,.4,1) both}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#222;animation:fadein 1.6s .2s both}
.polaroid .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:var(--type);color:#2b1d12;font-size:clamp(1.1rem,2.2vw,1.6rem)}
.polaroid .tape{position:absolute;top:-14px;left:50%;width:120px;height:30px;margin-left:-60px;background:rgba(239,226,196,.7);transform:rotate(3deg);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.polaroid .stamp{left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);font-size:clamp(1.6rem,3.8vw,2.8rem);animation:slam .45s .7s cubic-bezier(.3,1.6,.5,1) both;background:rgba(251,247,238,.35)}
@keyframes develop{from{transform:rotate(-14deg) scale(.4) translateY(60px);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes fadein{from{filter:brightness(2.4) sepia(1) blur(6px)}to{filter:none}}
.rv{display:grid;gap:16px;align-content:center}
.rv .who{font-family:var(--deco);font-size:clamp(2.2rem,5.4vw,4.4rem);line-height:1;color:var(--gold-hi);text-shadow:0 4px 0 var(--wax-d),0 0 30px rgba(217,178,95,.35);animation:pop .7s .5s both cubic-bezier(.2,1.4,.4,1)}
.rv .dist{font-family:var(--type);color:var(--parch);font-size:1.1rem;letter-spacing:.12em}
.rv .said{font-family:var(--type);font-size:clamp(1.05rem,2vw,1.4rem);color:var(--ink);background:rgba(27,19,40,.8);border-left:4px solid var(--wax);padding:.7em 1em;border-radius:4px;margin:0}
.cracked{display:grid;gap:10px;background:rgba(27,19,40,.75);border-radius:14px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);animation:pop .6s 1s both}
.cracked h3{margin:0;font-family:var(--display);font-size:clamp(1.1rem,2vw,1.4rem);color:var(--gold-hi)}
.faces{display:flex;flex-wrap:wrap;gap:12px}
.face{display:grid;justify-items:center;gap:4px;font-weight:800;font-size:.9rem;animation:arrive .7s both cubic-bezier(.2,1.5,.4,1)}
.face img{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--good),0 0 18px rgba(134,224,168,.4)}
.hostpanel{display:grid;gap:10px;background:rgba(11,10,20,.85);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 2px var(--gold-d)}
.guesses{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.guess{display:grid;gap:2px;text-align:left;padding:8px 12px;border-radius:10px;background:var(--plum-2);box-shadow:inset 0 0 0 2px var(--line);font-weight:800}
.guess span{font-weight:600;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.guess[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--good)}
.guess[aria-pressed="true"]::after{content:"✓ right";color:var(--good);font-size:.8rem}
.guess:disabled{opacity:.4;cursor:default}

/* ---------- scoreboard ---------- */
.ledger{display:grid;gap:7px;width:100%;max-width:920px;margin-inline:auto}
.row{display:grid;grid-template-columns:2.4em 40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 16px;border-radius:10px;background:rgba(27,19,40,.85);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);animation:rowin .5s both cubic-bezier(.2,1.3,.4,1);animation-delay:calc(var(--i)*60ms)}
.row{text-align:left}
.row .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,rgba(163,24,43,.45),rgba(217,178,95,.22));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.row>*{position:relative}
.row .rk{font-family:var(--deco);color:var(--gold-hi);font-size:1.3rem;text-align:center}
.row .av{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
.row .nm{font-weight:800;font-size:1.2rem;overflow-wrap:anywhere}
.row .pts{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.2rem;text-align:right}
.row .delta{display:block;font-size:.8rem;color:var(--good)}
.row .streak{font-size:.8rem;color:var(--gold-hi);margin-left:.5em}
.mv{font-size:.8rem;font-weight:800;margin-left:.5em}.mv.up{color:var(--good)}.mv.dn{color:var(--bad)}
@keyframes rowin{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:12px;max-width:780px;width:100%;margin:0 auto}
.pod{display:grid;gap:8px;justify-items:center;text-align:center}
.pod .av{width:clamp(70px,10vw,116px);height:clamp(70px,10vw,116px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(0,0,0,.5)}
.pod.p1 .av{width:clamp(90px,13vw,150px);height:clamp(90px,13vw,150px)}
.pod .crown{font-size:2.4rem;margin-bottom:-14px;animation:crown 1.2s ease-in-out infinite alternate}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:10px;font-family:var(--deco);font-size:2rem;color:#2a1a05}
.pod.p1 .blk{height:180px;background:linear-gradient(180deg,var(--gold-hi),var(--gold))}.pod.p2 .blk{height:130px;background:linear-gradient(180deg,#eee,#bfc6cc)}.pod.p3 .blk{height:96px;background:linear-gradient(180deg,#e0a77a,#a86b3f)}
.pod .nm{font-weight:800;font-size:clamp(1rem,2.4vw,1.5rem);overflow-wrap:anywhere}
.pod .pts{color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes crown{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;background:var(--wax);color:#fff;font-weight:800;padding:12px 20px;border-radius:14px;box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(0,0,0,.5);text-align:center;max-width:min(92vw,560px)}
/* emoji bursts sent from phones: a name tag pops up and a spray of little themed emojis flies out of it */
.burst{position:fixed;z-index:2147483005;pointer-events:none;width:0;height:0}
.burst .tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(11,10,20,.88);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:0 0 0 2px var(--gold),0 10px 24px rgba(0,0,0,.55);
  font-weight:800;font-size:clamp(1rem,1.6vw,1.3rem);animation:tagpop 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
.burst .tag img{width:clamp(34px,3.2vw,44px);height:clamp(34px,3.2vw,44px);border-radius:50%;object-fit:cover}
.burst .tag .e{font-size:1.5em;line-height:1}
.burst i{position:absolute;left:0;top:0;font-style:normal;font-size:var(--s);line-height:1;transform:translate(-50%,-50%);animation:spray var(--t) cubic-bezier(.15,.7,.3,1) var(--d) forwards;opacity:0;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
@keyframes tagpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{transform:translate(-50%,-50%) scale(1.12);opacity:1}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-160%) scale(.95);opacity:0}}
@keyframes spray{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}8%{opacity:1}75%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.1);opacity:0}}
/* suspect board: who the room accused (never who accused them) */
.suspects{display:grid;gap:8px;background:rgba(27,19,40,.75);border-radius:14px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line);animation:pop .6s 1.3s both}
.suspects h3{margin:0;font-family:var(--display);font-size:1.05rem;color:var(--muted);letter-spacing:.08em}
.sus{display:grid;grid-template-columns:34px 7.5em minmax(0,1fr) 2.2em;align-items:center;gap:10px;font-weight:800}
.sus img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.sus .bar{height:14px;border-radius:7px;background:var(--wax);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1) 1.5s}
.sus.real .bar{background:linear-gradient(90deg,var(--gold),var(--gold-hi))}.sus.real{color:var(--gold-hi)}
.sus .c{text-align:right;font-variant-numeric:tabular-nums}
.fooled{font-family:var(--type);font-size:clamp(1rem,1.8vw,1.25rem);color:var(--gold-hi);animation:pop .6s 1.6s both}
/* end-of-game awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:900px;margin:0 auto}
.award{display:grid;justify-items:center;gap:6px;background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:14px 12px 16px;text-align:center;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 40px rgba(120,80,30,.25);animation:deal .8s both cubic-bezier(.2,1.3,.4,1)}
.award:nth-child(1){transform:rotate(-2deg)}.award:nth-child(2){transform:rotate(1.5deg)}.award:nth-child(3){transform:rotate(-1deg)}
.award .ic{font-size:2rem}.award .t{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--wax)}
.award img{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.award .nm{font-family:var(--type);font-size:1.25rem}.award .why{font-size:.85rem;color:#6b5233;font-weight:700}
@keyframes deal{from{transform:translateY(60px) rotate(-12deg);opacity:0}}
/* ---------- extras switches in the lobby ---------- */
.extras{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.extras button{padding:.4em .85em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:.85rem;opacity:.5}
.extras button[aria-pressed="true"]{opacity:1;box-shadow:inset 0 0 0 2px var(--gold);background:rgba(217,178,95,.12)}
.bonusnote{text-align:center;font-family:var(--type);color:var(--parch)}
/* ---------- the Interrogation: lights down, a spotlight on whoever the room accused most ---------- */
.interro{position:relative;display:grid;justify-items:center;align-content:center;gap:14px;text-align:center;min-height:76vh}
.interro::before{content:"";position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.72);animation:dim .8s both}
@keyframes dim{from{opacity:0}}
.interro .cone{position:fixed;left:50%;top:-10vh;width:70vw;height:110vh;transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,240,190,.16) 14deg,rgba(255,240,190,.22) 20deg,rgba(255,240,190,.16) 26deg,transparent 40deg);animation:swing 1.4s cubic-bezier(.3,1.4,.5,1) both}
@keyframes swing{from{transform:translateX(-50%) rotate(-40deg);opacity:0}to{transform:translateX(-50%) rotate(0);opacity:1}}
.hotseat{display:flex;gap:clamp(16px,4vw,50px);justify-content:center}
.hotseat .s{display:grid;justify-items:center;gap:8px;animation:pop .7s .9s both cubic-bezier(.2,1.5,.4,1)}
.hotseat img{width:clamp(150px,20vw,250px);height:clamp(150px,20vw,250px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--gold-hi),0 0 60px 20px rgba(255,240,190,.35);animation:flickr 2.4s 1.4s infinite}
@keyframes flickr{0%,100%{filter:none}48%{filter:brightness(1.15)}50%{filter:brightness(.8)}52%{filter:brightness(1.1)}}
.hotseat .nm{font-family:var(--deco);font-size:clamp(1.8rem,4vw,3rem);color:var(--gold-hi);text-shadow:0 3px 0 var(--wax-d)}
.interro .charge{font-family:var(--type);font-size:clamp(1.2rem,2.6vw,2rem);color:var(--parch);max-width:40ch;animation:pop .6s 1.3s both}
.interro .clock{font-family:var(--deco);font-size:clamp(3rem,7vw,5rem);color:#fff;text-shadow:0 0 30px rgba(255,90,60,.6)}
.interro .clock.out{color:var(--bad);font-size:clamp(2rem,4vw,3rem)}
/* ---------- Story time ---------- */
.story{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,44px);align-items:center;min-height:72vh}
.story .mic{position:relative;justify-self:center}
.story .mic img{width:clamp(200px,26vw,340px);height:clamp(200px,26vw,340px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--gold),0 0 0 12px var(--wax),0 20px 40px rgba(0,0,0,.6);animation:pop .7s both cubic-bezier(.2,1.4,.4,1)}
.story .mic span{position:absolute;right:-6px;bottom:6px;font-size:clamp(3rem,5vw,4.4rem);animation:bob 1.2s ease-in-out infinite alternate}
.story h1{font-family:var(--deco);font-size:clamp(2rem,4.6vw,3.6rem);color:var(--gold-hi);text-shadow:0 4px 0 var(--wax-d);margin:0}
.story .about{font-family:var(--type);color:var(--parch);font-size:clamp(1rem,1.8vw,1.3rem);margin:0}
.votes{display:grid;gap:10px;margin-top:6px}
.vote{display:grid;grid-template-columns:2.4em 8em minmax(0,1fr) 2em;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.applause .vote .e{font-size:1.5rem}.stage2{padding-top:3vh!important;min-height:0!important}.stage2 h1{font-size:clamp(1.7rem,3.4vw,2.8rem)!important}.stage2 .clock{font-size:2rem}.stage2>div:last-child{gap:8px!important}
.vote.boo .bar{background:linear-gradient(90deg,#3b3f45,#6b7178)!important}.applause .vote{font-size:1rem}.applause{gap:6px}
.vote .e{font-size:2rem}.vote .bar{height:18px;border-radius:9px;background:linear-gradient(90deg,var(--wax),var(--gold));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vote .c{text-align:right;font-variant-numeric:tabular-nums}
.story .clock{font-family:var(--deco);font-size:2.2rem;color:var(--gold-hi)}
/* ---------- bets on the reveal ---------- */
.bets{display:grid;gap:4px;font-family:var(--type);font-size:clamp(.95rem,1.6vw,1.15rem);animation:pop .6s 1.8s both}
.bets .lost{color:var(--bad)}.bets .won{color:var(--good)}
.betcount{font-family:var(--type);color:var(--gold-hi)}
.row .delta.neg{color:var(--bad)}
/* ---------- host phone link ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.7)}
.modal .box{background:var(--parch);color:var(--parch-ink);border-radius:8px;padding:20px 24px;display:grid;gap:10px;justify-items:center;text-align:center;max-width:min(92vw,420px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.modal .qr{width:220px;background:#fff;padding:6px;border-radius:4px}.modal .qr svg{display:block;width:100%;height:auto}
.modal .u{font-family:var(--type);font-size:.85rem;overflow-wrap:anywhere}
/* ---------- How to play: read aloud before the walk-outs ---------- */
.howto{display:grid;gap:14px;justify-items:center;text-align:center}
.howto h1{font-family:var(--deco);font-size:clamp(2.2rem,5vw,3.8rem);color:var(--gold-hi);text-shadow:0 4px 0 var(--wax-d);margin:0}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:1150px;text-align:left}
.step{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:12px;align-items:center;background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:10px 14px;
  box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 0 30px rgba(120,80,30,.22);font-size:clamp(.95rem,1.45vw,1.2rem);line-height:1.3;opacity:.45;transform:scale(.98);transition:opacity .4s,transform .4s,box-shadow .4s;
  animation:rowin .5s both;animation-delay:calc(var(--i)*70ms)}
.step .ic{font-size:clamp(1.6rem,2.6vw,2.2rem);text-align:center}
.step b{font-family:var(--display);color:var(--wax)}
.step.done{opacity:.9;transform:none}
.step.on{opacity:1;transform:scale(1.03);box-shadow:0 0 0 4px var(--gold-hi),0 0 30px rgba(246,223,160,.55),0 10px 24px rgba(0,0,0,.5)}
.speaking{display:flex;gap:4px;align-items:flex-end;height:18px}.speaking i{width:4px;background:var(--gold-hi);border-radius:2px;animation:eq .7s ease-in-out infinite alternate}
.speaking i:nth-child(2){animation-delay:.15s}.speaking i:nth-child(3){animation-delay:.3s}.speaking i:nth-child(4){animation-delay:.45s}
@keyframes eq{from{height:4px}to{height:18px}}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
@media (max-width:860px){.story{grid-template-columns:1fr}}
/* ---------- the last 10 seconds: a giant red number, the screen glowing red; then TIME'S UP ---------- */
#redzone{position:fixed;inset:0;z-index:7;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 50%,rgba(200,20,30,calc(var(--heat,0)*.18)) 0,rgba(200,10,20,calc(.25 + var(--heat,0)*.55)) 100%);
  box-shadow:inset 0 0 calc(60px + var(--heat,0)*180px) rgba(255,30,30,calc(.4 + var(--heat,0)*.5));transition:background .6s,box-shadow .6s;animation:throb 1s ease-in-out infinite}
#redzone .n{font-family:var(--deco);font-size:clamp(9rem,30vw,22rem);line-height:1;color:#fff;opacity:.92;
  text-shadow:0 0 30px #ff2a2a,0 0 80px #ff2a2a,0 8px 0 #5e0a17;animation:boom10 .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes throb{50%{filter:brightness(1.25)}}
@keyframes boom10{0%{transform:scale(2.6);opacity:0}25%{transform:scale(.92);opacity:.95}45%{transform:scale(1.05)}100%{transform:scale(1);opacity:.55}}
#timesup{position:fixed;inset:0;z-index:9;pointer-events:none;display:grid;place-items:center;background:rgba(180,0,10,.55);animation:tuout 2.2s ease-in forwards}
#timesup div{font-family:var(--deco);font-weight:900;font-size:clamp(4rem,13vw,10rem);color:#fff;text-align:center;line-height:.95;
  text-shadow:0 0 40px #ff2a2a,0 10px 0 #5e0a17;animation:slamtu .55s cubic-bezier(.3,1.7,.5,1) both}
#timesup small{display:block;font-family:var(--display);font-size:.28em;letter-spacing:.2em;margin-top:.4em}
@keyframes slamtu{from{transform:scale(3.5) rotate(-8deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes tuout{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
body.shake .app{animation:quake .5s}
@keyframes quake{20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-2px)}}
/* ---------- curtains (into and out of the Interrogation Room) ---------- */
#curtains{position:fixed;inset:0;z-index:25;pointer-events:none}
#curtains i{position:absolute;top:0;bottom:0;width:51%;transition:transform .85s cubic-bezier(.7,0,.3,1);
  background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%),repeating-linear-gradient(90deg,#3a0815 0 18px,#6e1426 18px 34px,#4a0d1c 34px 52px,#2c0610 52px 60px);
  box-shadow:0 0 60px rgba(0,0,0,.8)}
#curtains i::after{content:"";position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,#f6dfa0 0 6px,#d9b25f 6px 12px)}
#curtains i.l{left:0;transform:translateX(-102%)}#curtains i.l::after{right:0}
#curtains i.r{right:0;transform:translateX(102%)}#curtains i.r::after{left:0}

#curtains .sign{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:.35s .5s;z-index:2;font-family:var(--deco);color:var(--gold-hi);font-size:clamp(1.8rem,4vw,3.2rem);text-align:center;text-shadow:0 4px 0 #2c0610,0 0 30px rgba(0,0,0,.8)}
#curtains.shut .sign{opacity:1;transform:translate(-50%,-50%)}
/* ---------- the Interrogation Room ---------- */
.room{position:relative;display:grid;justify-items:center;align-content:center;gap:12px;text-align:center;min-height:80vh}
.room::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 45% 60% at 50% 38%,rgba(255,240,190,.16),transparent 70%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 46px),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 92px),
    linear-gradient(180deg,#2a2b30,#15161a 70%,#0c0c0f)}
.room::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.75))}
.room .lamp{position:fixed;left:50%;top:0;width:0;height:0;z-index:0;transform-origin:0 0;animation:swing 3.2s ease-in-out infinite}
.room .lamp .cord{position:absolute;left:-1px;top:0;width:2px;height:12vh;background:#111}
.room .lamp .shade{position:absolute;left:-42px;top:12vh;width:84px;height:40px;background:linear-gradient(180deg,#3d4b45,#1d2622);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);border-radius:4px}
.room .lamp .bulb{position:absolute;left:-12px;top:calc(12vh + 32px);width:24px;height:24px;border-radius:50%;background:#fff6c8;box-shadow:0 0 40px 18px rgba(255,240,180,.7)}
.room .lamp .beam{position:absolute;left:-30vw;top:calc(12vh + 40px);width:60vw;height:70vh;background:linear-gradient(180deg,rgba(255,240,190,.22),rgba(255,240,190,0) 85%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);pointer-events:none}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.room .tag{font-family:var(--type);letter-spacing:.2em;color:#cfd6d2;background:rgba(0,0,0,.45);padding:.35em 1em;border:1px solid rgba(255,255,255,.2);margin-top:7vh}
.room .hotseat{z-index:1}
.room .hotseat img{width:clamp(120px,24vh,210px);height:clamp(120px,24vh,210px)}
.room .hotseat .nm{font-size:clamp(1.6rem,3.4vw,2.6rem)}
.room{gap:8px;min-height:0;padding-bottom:8px}
.room .hotseat img{box-shadow:0 0 0 6px #e9eadf,0 0 70px 24px rgba(255,240,190,.35)}
.room .charge{z-index:1}
.room .clock{font-family:var(--deco);font-size:clamp(3rem,7vw,5.4rem);color:#fff;text-shadow:0 0 30px rgba(255,80,60,.6);z-index:1;line-height:1}
.room .clock.out{color:var(--bad);font-size:clamp(1.8rem,3.4vw,2.6rem)}
.room .switched{font-family:var(--display);font-weight:900;font-size:clamp(1.2rem,2.6vw,1.9rem);color:var(--gold-hi);z-index:1;min-height:1.3em}

.switches{display:grid;gap:4px;font-family:var(--type);font-size:clamp(.95rem,1.6vw,1.15rem);animation:pop .6s 1.9s both}
.switches .won{color:var(--good)}.switches .lost{color:var(--bad)}
/* ---------- 🎭 Story time: a little theater stage ---------- */
.stagex{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 60% 70% at 50% 35%,#2a1420,#0b0508 75%)}
.stagex .valance{position:absolute;left:0;right:0;top:0;height:13vh;background:repeating-linear-gradient(90deg,#6e1426 0 28px,#8a1a30 28px 52px,#5a0f20 52px 70px);
  -webkit-mask:radial-gradient(circle at 50% -40%,#000 72%,transparent 73%) 0 0/9vh 100% repeat-x;mask:radial-gradient(circle at 50% -40%,#000 72%,transparent 73%) 0 0/9vh 100% repeat-x;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.stagex .side{position:absolute;top:0;bottom:18vh;width:13vw;background:repeating-linear-gradient(90deg,#4a0d1c 0 18px,#7a1830 18px 34px,#3a0815 34px 50px);box-shadow:0 0 50px rgba(0,0,0,.8)}
.stagex .side.l{left:0;border-radius:0 0 60% 0;transform-origin:top left}.stagex .side.r{right:0;border-radius:0 0 0 60%}
.stagex .side::after{content:"";position:absolute;top:44%;width:2.4vw;height:6vh;border-radius:40%;background:linear-gradient(180deg,#f6dfa0,#b0872e)}
.stagex .side.l::after{right:-1vw}.stagex .side.r::after{left:-1vw}
.stagex .floor{position:absolute;left:0;right:0;bottom:0;height:20vh;background:repeating-linear-gradient(90deg,#5a3418 0 6vw,#6b3f1e 6vw 6.15vw,#4e2c14 6.15vw 12vw);box-shadow:inset 0 14px 24px rgba(0,0,0,.6);transform:perspective(500px) rotateX(28deg);transform-origin:bottom}

<script>
/* ================= THE SECRETS ================= */
/* Bump BUILD whenever this game changes: the TV reloads itself between rounds, and phones reload, so nobody plays an old copy. */
const BUILD="ds-build-2026-11-23-12";
const NAMES=["Jessie","Elisha","Grandad","Dash","Jonny","Carsyn","Tinsley","Natalie","Kamdon","Brandon","QUEEN MOTHER","Kyle"];
const HOST="Carsyn";               // runs the TV and knows the real secrets, so she plays as the 🔮 Gamemaker:
                                    // she predicts how many crack each one (exact +500, off by one +200), and guesses normally in the bonus round
const Q=[ /* the real fun facts the family sent in; edit wording here */
 {f:"I have a gorilla statue in my closet.",a:"Dash"},
 {f:"I flunked band one year.",a:"Grandad"},
 {f:"I am obsessed with documentaries.",a:"Jessie"},
 {f:"I hate burritos. And tomatoes.",a:"Natalie"},
 {f:"I'm scared of heights, but I want my pilot's license. I love helicopters.",a:"Jonny"},
 {f:"I love to cook.",a:"Kamdon"},
 {f:"I almost got kicked out of a concert for being too loud.",a:"Carsyn"},
 {f:"I named my dog after a neighbor. Then the neighbor moved away.",a:"QUEEN MOTHER"},
];
const BASE=Q.length;                  // bonus secrets written on phones tonight are added after these
const REAL=Q.slice();                 // the real secrets, before decoys are shuffled in
/* 🃏 Decoy secrets: made up. A few are shuffled in among the real ones each game (never first or last).
   Phones can call a secret FAKE; spotting a decoy scores like a right answer. Edit the list freely. */
const DECOYS=[
 "I once got stuck in a revolving door for twenty minutes.",
 "I've never seen a single Hunger Games movie.",
 "I accidentally crashed a stranger's wedding and stayed for the cake.",
 "I've been banned from a bowling alley.",
 "I can solve a Rubik's cube in under a minute.",
 "I still sleep with the stuffed animal I got in kindergarten.",
 "I once won a hula hoop contest at the county fair.",
 "I've eaten a whole large pizza by myself in one sitting. Twice.",
];
const DECOY_COUNT=3;
const FAKE="🃏 FAKE";                  // what a phone seals when it calls a secret fake
const isFake=v=>v===FAKE||norm(v)==="fake";
/* 🖤 redacted: the longest words are blacked out, then uncovered one at a time while guessing is open */
function redactPlan(f){
  const w=f.split(" "),c=w.map((x,i)=>[i,x.replace(/[^A-Za-z']/g,"").length]).filter(([,n])=>n>=4).sort((a,b)=>b[1]-a[1]);
  const k=Math.max(2,Math.min(5,Math.ceil(w.length*.4)));return c.slice(0,k).map(([i])=>i).sort(()=>Math.random()-.5);
}
const REDACT_COUNT=3;
const LIGHTNING_SECS=10;
const qs=()=>Q[S?.qi]?.lightning?LIGHTNING_SECS:S.secs;   // seconds for this secret
function dressDeck(deck){   // a few redacted files, and one secret golden file (×3), never the first or the double
  if(S.opts?.lightning&&deck.length>=7){const st=Math.floor(deck.length/2)-1;for(let i=st;i<st+3&&i<deck.length-1;i++)deck[i].lightning=true}   // ⚡ 3 in a row
  const idx=deck.map((_,i)=>i).filter(i=>i>0&&i<deck.length-1&&!deck[i].lightning).sort(()=>Math.random()-.5);
  if(S.opts?.redact)idx.slice(0,REDACT_COUNT).forEach(i=>{deck[i].hide=redactPlan(deck[i].f)});
  if(S.opts?.golden&&idx.length)deck[idx[idx.length-1]].golden=true;
  return deck;
}
function buildDeck(){
  // the host's own decoys first (written in 🔑 Host tools), then the built-in ones
  const mine=(dsx.decoys||[]).slice().sort(()=>Math.random()-.5),built=DECOYS.filter(f=>!mine.includes(f)).sort(()=>Math.random()-.5);
  const fakes=[...mine,...built].slice(0,DECOY_COUNT).map(f=>({f,a:null,fake:true})),deck=REAL.map(x=>({...x}));
  fakes.forEach(x=>deck.splice(1+Math.floor(Math.random()*(deck.length-1)),0,x));   // somewhere after the first, before the last
  return deck;
}
// the last secret before any bonus round is worth double
const isDouble=qi=>{let k=-1;Q.forEach((x,i)=>{if(!x.bonus&&!x.ttl)k=i});return qi===k};
const BONUS_WRITER=500;               // points for the writer when their bonus secret is played
const pad=n=>String(n).padStart(2,"0");
const AV=n=>`img/p${pad(NAMES.indexOf(n)+1)}.jpg`;   // small face
const RV=n=>`img/r${pad(NAMES.indexOf(n)+1)}.jpg`;   // big selfie for the reveal
const DISTRICT=n=>NAMES.indexOf(n)+1;
Q.forEach(x=>{const i=new Image();i.src=RV(x.a)});

/* typed guesses: forgiving match (nicknames, caps, spaces, one typo) */
const ALIASES={"Jonny":["jonny","johnny","johnnie","jonnie","jony","jon","john","jt","jtjt"],
  "QUEEN MOTHER":["queenmother","queen","granny","grannie","kathy","grandma","nana","qm"],
  "Grandad":["grandad","granddad","grandpa","grampa","papa","don","dawn","donjackson"],"Elisha":["elisha","mom","momma","mama"],
  "Jessie":["jessie","jesse","jessi","jess","jessica"],"Kamdon":["kamdon","kamden","kam"],
  "Tinsley":["tinsley","tins"],"Natalie":["natalie","nat","nattie"],"Brandon":["brandon"],"Kyle":["kyle"],"Dash":["dash"],"Carsyn":["carsyn","carson"]};
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function matches(typed,answer){const t=norm(typed);if(!t)return false;
  if(answer==null)return isFake(typed);   // a decoy: the right answer is FAKE
  return (ALIASES[answer]||[]).concat(norm(answer)).some(a=>a===t||(a.length>=4&&lev(a,t)<=1))}
/* lets a phone tell "this secret is mine" without the answer being sent to every phone */
const ownTag=(gid,qi,name)=>{let h=5381;for(const c of `${gid}|${qi}|${name}`)h=((h<<5)+h+c.charCodeAt(0))|0;return (h>>>0).toString(36)};

/* ================= ART ================= */
const EMBLEM=`<svg class="emblem" viewBox="0 0 200 200" role="img" aria-label="District Secrets seal">
 <g class="spin"><circle cx="100" cy="100" r="92" fill="none" stroke="#d9b25f" stroke-width="2" stroke-dasharray="2 7"/></g>
 <path d="M100 18c10 0 14 8 24 9s17-5 25 1 5 15 11 23 15 9 17 19-6 15-5 25 8 17 3 26-15 7-22 14-6 17-16 21-15-3-25-1-16 9-25 4-6-14-14-20-17-6-21-15 4-16 2-26-10-17-5-26 15-8 21-15 4-17 13-22 15 2 22-3 8-9 17-9z" fill="#a3182b"/>
 <circle cx="100" cy="100" r="58" fill="none" stroke="#5e0a17" stroke-width="5"/>
 <circle cx="100" cy="100" r="52" fill="#b8202f"/>
 <path d="M100 66a16 16 0 0 1 9 29l7 37H84l7-37a16 16 0 0 1 9-29z" fill="#f6dfa0" stroke="#8a6a26" stroke-width="2"/>
 <path d="M34 158 166 52" stroke="#d9b25f" stroke-width="5" stroke-linecap="round"/><path d="M166 52l-17 3 7 9z" fill="#f6dfa0"/>
 <path d="M34 158l9-2-2-9-9 3zm6 6 9-2-2-9" fill="#f4ecdb"/>
 <g fill="#2e7a52" stroke="#1f5a40" stroke-width="1.5"><path d="M56 150c4-14 18-20 30-14-6 4-6 10-2 16-10-6-18 2-28-2z"/><path d="M62 166c12-8 26-6 32 4-8 0-10 6-8 12-6-10-16-6-24-16z"/></g>
 <g fill="#e2343c"><circle cx="88" cy="152" r="6"/><circle cx="98" cy="158" r="6"/><circle cx="90" cy="163" r="5"/></g>
</svg>`;
const ENV=`<svg class="env" viewBox="0 0 64 46" aria-hidden="true"><rect x="1" y="1" width="62" height="44" rx="3" fill="#efe2c4" stroke="#c9b385" stroke-width="2"/>
 <path d="M2 3l30 22L62 3" fill="none" stroke="#c9b385" stroke-width="2"/>
 <g class="wx"><circle cx="32" cy="25" r="9" fill="#a3182b"/><circle cx="32" cy="25" r="6" fill="none" stroke="#5e0a17" stroke-width="1.5"/><path d="M32 20.5l1.4 3h3l-2.4 2 1 3.1-3-1.9-3 1.9 1-3.1-2.4-2h3z" fill="#f6dfa0"/></g></svg>`;
(function garland(){
  const n=Math.max(8,Math.round(innerWidth/120));let s="";
  for(let i=0;i<n;i++){const x=(i+.5)*1000/n;
    s+=`<g transform="translate(${x} 0)"><path d="M-18 10c6 6 12 6 18 0 6 6 12 6 18 0" fill="#2e7a52" stroke="#1f5a40"/><circle cx="0" cy="14" r="3.4" fill="#e2343c"/>`+
      (i%2?`<rect x="-3" y="18" width="6" height="12" rx="1" fill="#efe2c4"/><path class="flame" style="animation-delay:${(i*.27)%1.3}s" d="M0 7c4 5 3 9 0 11-3-2-4-6 0-11z" transform="translate(0 4)" fill="#ffb02e"/>`
           :`<circle cx="0" cy="24" r="5" fill="#d9b25f"/><circle cx="-1.5" cy="22.5" r="1.5" fill="#fff6c0"/>`)+`</g>`}
  document.getElementById("garland").innerHTML=`<svg viewBox="0 0 1000 46" preserveAspectRatio="none"><path d="M0 8Q250 22 500 8T1000 8" fill="none" stroke="#1f5a40" stroke-width="4"/>${s}</svg>`;
})();

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3600)}

/* ================= MUSIC: original mystery music (detective / heist style, written for this game) =================
   lobby:      "Mystery Lounge"  slow walking bass, vibraphone chords, brushes, snaps and a sneaky tiptoe melody (D minor)
   question:   "The Sneak"       creeping plucked strings, a ticking clock and a heartbeat (speeds up in the last 5 seconds)
   scoreboard: "Case Closed"     jazzier walking bass, snaps, vibes and a little sleigh-bell sparkle (F minor) */
let AC=null,master,musicBus,sfxBus,noiseBuf,song=null,timerId=0,tempoMul=1,musicOn=true;
function ensureAudio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
      const verb=AC.createConvolver(),len=AC.sampleRate*2.2,ir=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
      verb.buffer=ir;const wet=AC.createGain();wet.gain.value=.28;verb.connect(wet);wet.connect(master);
      musicBus=AC.createGain();musicBus.gain.value=.5;musicBus.connect(master);musicBus.connect(verb);
      sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);sfxBus.connect(verb);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==="suspended")AC.resume();
    return true;
  }catch(e){return false}
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dec)}
function osc(type,f,t,dur,vol,dest,cut,att=.006){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  let n=o;if(cut){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=cut;o.connect(fl);n=fl}
  n.connect(g);g.connect(dest);env(g,t,att,vol,dur);o.start(t);o.stop(t+dur+.05);
}
function noise(t,dur,vol,dest,type,freq,q){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;
  f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;s.connect(f);f.connect(g);g.connect(dest);env(g,t,.003,vol,dur);s.start(t,Math.random()*.5);s.stop(t+dur+.05);
}
const INST={
  vibe:(t,m,d,v)=>{osc("sine",hz(m),t,Math.max(.6,d),v*.2,musicBus);osc("sine",hz(m)*4,t,.18,v*.04,musicBus);
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();   // the vibraphone's slow wobble
    o.type="sine";o.frequency.value=hz(m);lfo.frequency.value=5.5;lg.gain.value=v*.05;lfo.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(musicBus);
    env(g,t,.01,v*.08,Math.max(.8,d*1.3));o.start(t);lfo.start(t);o.stop(t+Math.max(.8,d*1.3)+.05);lfo.stop(t+Math.max(.8,d*1.3)+.05)},
  upright:(t,m,d,v)=>{osc("triangle",hz(m),t,Math.min(d,.55),v*.5,musicBus,600);osc("sine",hz(m),t,.08,v*.25,musicBus)},
  brush:(t,m,d,v)=>noise(t,.18,v*.07,musicBus,"bandpass",4200,.6),
  ride:(t,m,d,v)=>{noise(t,.12,v*.06,musicBus,"highpass",7500);osc("sine",hz(100),t,.3,v*.012,musicBus)},
  snap:(t,m,d,v)=>{noise(t,.03,v*.22,musicBus,"bandpass",2600,3);noise(t+.005,.02,v*.1,musicBus,"highpass",6000)},
  sleigh:(t,m,d,v)=>{noise(t,.08,v*.06,musicBus,"bandpass",9500,1.4);noise(t+.03,.06,v*.04,musicBus,"bandpass",7200,1.6)},
  box:(t,m,d,v)=>{osc("sine",hz(m),t,1.6,v*.22,musicBus);osc("sine",hz(m)*4.02,t,.25,v*.05,musicBus);osc("triangle",hz(m)*2,t,.4,v*.04,musicBus)},
  drone:(t,m,d,v)=>{osc("sawtooth",hz(m),t,d,v*.05,musicBus,420,.8);osc("sine",hz(m-12),t,d,v*.12,musicBus,0,.8)},

  if(!S.opts?.ttl||S.ttlDone)return;S.ttlDone=true;
  const on=new Set(active().map(p=>p.name)),pool=Object.entries(dsx.ttl||{}).filter(([n])=>on.has(n)).map(([n,v])=>{try{return [n,JSON.parse(v)]}catch(e){return null}}).filter(Boolean).sort(()=>Math.random()-.5).slice(0,2);
  pool.forEach(([n,v])=>{const opts=[...v.truths,v.lie].sort(()=>Math.random()-.5);const item={ttl:true,a:n,f:`${n}'s two truths and a lie`,opts,lie:opts.indexOf(v.lie)};S.extra.push(item);Q.push(item)});
}

function render(){
  cancelAnimationFrame(raf);clearInterval(typeT);clearInterval(clockT);
  if(S.phase!=="interro"){clearInterval(drumT);drumT=0}
  if(S.phase!=="question"||S.locked)clearRedzone();
  const v={last:lastView,likely:likelyView,lightcard:lightView,ttlcard:ttlCardView,showdown:duelView,howto:howView,lobby:lobbyView,roundcard:roundView,ready:readyView,question:questionView,interro:interroView,reveal:revealView,story:storyView,board:boardView,final:finalView,bonuscard:bonusView}[S.phase]||lobbyView;
  $("#app").innerHTML=v();wire();
  if(S.phase==="interro"){startClock(".room .clock",ROOM_SECS,S.hotAt||Date.now(),closeRoom);showSwitches();
    // tense music while the room is open; the drumroll builds over the last 8 seconds
    if(S.roomOpen)playSong("count");
    if(!drumT)drumT=setInterval(()=>{const left=ROOM_SECS-(Date.now()-(S.hotAt||Date.now()))/1000;if(left<=0){clearInterval(drumT);drumT=0;return}if(left<=8)sfx("roll",1-left/8)},90)}
  if(S.phase==="likely"&&!S.likely?.show)startClock(".likelyclock",LIKELY_SECS,S.likely.at,likelyResults);
  if(S.phase==="last")startClock(".lastclock",LAST_SECS,S.lastAt||Date.now(),()=>setTimeout(()=>S.phase==="last"&&newGame(),1200));
  if(S.phase==="story"&&S.storyState==="on"){startClock(".stage2 .clock",30,S.storyAt||Date.now(),()=>sfx("gong"));showVotes()}
  if(S.phase==="story"&&S.storyState==="ask"&&$(".askclock"))startClock(".askclock",STORY_ASK,S.askAt||Date.now(),async()=>{await pollX();if(S.storyState==="ask"&&!curX().storyAns)storyDecide(hasPhone(cur().a)?"late":"skip")});
  if(S.phase==="question"){drawTimer();typeFact();if(!S.locked)tick(performance.now());showSealed()}
  if(S.phase==="reveal"||S.phase==="likely")requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".sus .bar").forEach(b=>b.style.width=b.dataset.w)));
  if(S.phase==="board"||S.phase==="final")requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w)));
}

const hiddenNow=()=>{const x=cur();if(!x?.hide)return[];if(S.phase!=="question"||S.locked)return[];
  const t0=qs()*.2,step=qs()*.6/x.hide.length,k=Math.max(0,Math.floor((S.elapsed-t0)/step)+1);return x.hide.slice(Math.min(k,x.hide.length))};
function drawRedact(){
  const el=$(".file .fact");if(!el||!cur().hide)return;const hide=new Set(hiddenNow());
  el.querySelectorAll(".rd").forEach(sp=>{const open=!hide.has(+sp.dataset.i);if(open&&!sp.classList.contains("open")){sp.classList.add("open");sfx("tear")}});
}
function typeFact(){ // the secret types itself out on the file
  if(cur()?.ttl)return;
  const el=$(".file .fact");if(!el)return;const f=`“${cur().f}”`;
  if(cur().hide){const hide=new Set(hiddenNow()),w=cur().f.split(" ");S.typed=f.length;   // redacted: no typing, black bars instead
    el.innerHTML="“"+w.map((x,i)=>cur().hide.includes(i)?`<span class="rd${hide.has(i)?"":" open"}" data-i="${i}">${esc(x)}</span>`:esc(x)).join(" ")+"”";return}
  if(S.typed>=f.length||calm){el.textContent=f;S.typed=f.length;return}
  el.innerHTML=`${esc(f.slice(0,S.typed))}<span class="cur"></span>`;
  typeT=setInterval(()=>{S.typed=Math.min(f.length,S.typed+1);el.innerHTML=esc(f.slice(0,S.typed))+(S.typed<f.length?'<span class="cur"></span>':"");
    if(S.typed%3===0&&S.typed<f.length)sfx("click");if(S.typed>=f.length)clearInterval(typeT)},38);
}

/* 🔮 how the Gamemaker's prediction went */
function gmHTML(){
  if(!gmPredicts())return"";const pick=gmPick(),top=wantedTop(),mult=isDouble(S.qi)?2:1;

  return `<div class="fooled">🕵️ ${HOST}'s Most Wanted: <b>${esc(pick)}</b> · the room accused ${top.length?esc(top.join(" & ")):"nobody"}${hit?` · NAILED IT! +${WANTED_PTS*mult}`:""}</div>`;

/* 🃏 the reveal for a decoy: nobody said it */
function fakeView(){
  const x=cur(),right=S.correct.filter(n=>S.players.find(p=>p.name===n)?.on),tot=guessers().length,g=S.guesses||{};

  return `<div class="top"><div><div class="eyebrow">Secret ${S.qi+1} of ${Q.length} · Declassified</div></div>${giftTag()}${sndBtn()}</div>
  <section class="reveal">
    <div class="polaroid" style="display:grid;place-items:center;width:min(100%,380px);aspect-ratio:1/1.1"><div style="font-size:clamp(7rem,16vw,12rem);line-height:1">🃏</div><div class="stamp" style="color:#a3182b">FAKE!</div><div class="cap">Planted by the Capitol</div></div>
    <div class="rv">
      <div class="dist">IT BELONGS TO…</div>

        ${right.length?`<div class="faces">${right.map((n,i)=>`<div class="face" style="animation-delay:${1.1+i*.12}s"><img src="${AV(n)}" alt="">${esc(n)}</div>`).join("")}</div>`:""}</div>
      ${gmHTML()}${frameHTML()}${moleHTML()}${switchHTML()}${betsHTML()}
      ${suspectsHTML(null).replace("WHO THE ROOM ACCUSED","WHO THE ROOM BLAMED (FOR NOTHING)")}
      ${hostOpen?`<div class="hostpanel"><div class="eyebrow">Host check: tap a name to fix a call</div><div class="guesses">${active().map(p=>`<button class="guess" data-ok="${esc(p.name)}" aria-pressed="${S.correct.includes(p.name)}">${esc(p.name)}<span>${g[p.name]!=null?"said “"+esc(g[p.name])+"”":hasPhone(p.name)?"no guess":"no phone"}</span></button>`).join("")}</div></div>`:""}
    </div></section>
  <div class="ctl"><button class="btn ghost" id="host">${hostOpen?"Hide guesses":"🔑 Host: check guesses"}</button><span class="hint tiny">Space: scores</span><button class="btn" id="score">Show scores</button></div>`;
}
/* who changed their vote in the Interrogation Room, and how it went */
function switchHTML(){
  const a=cur().a,out=[];
  Object.keys(S.switched||{}).forEach(n=>{if(!S.players.find(p=>p.name===n)?.on)return;const ok=S.correct.includes(n),was=matches(S.orig?.[n],a);
    out.push(ok?`<div class="won">🔄 ${esc(n)} switched… to the right answer! +250</div>`:was?`<div class="lost">🔄 ${esc(n)} was right… and got talked out of it!</div>`:`<div class="lost">🔄 ${esc(n)} switched… and still missed</div>`)});
  return out.length?`<div class="switches">${out.slice(0,5).join("")}</div>`:"";
}
/* who bet big on this secret, and how it went */
function betsHTML(){
  if(!S.opts?.bets)return"";const a=cur().a,out=[];
  Object.entries(S.bets||{}).forEach(([n,b])=>{if(n===a||b==="hunch"||S.guesses?.[n]==null||!S.players.find(p=>p.name===n)?.on)return;const ok=S.correct.includes(n);
    out.push(b==="allin"?(ok?`<div class="won">💀 ${esc(n)} went all in… and doubled it!</div>`:`<div class="lost">💀 ${esc(n)} went all in… and lost it.</div>`)
      :(ok?`<div class="won">🎯 ${esc(n)}'s sure bet paid off</div>`:`<div class="lost">🎯 ${esc(n)} was sure… and wrong</div>`))});
  return out.length?`<div class="bets">${out.slice(0,5).join("")}</div>`:"";
}
function suspectsHTML(real){
  const acc=accusations().slice(0,5);if(!acc.length)return"";const max=acc[0][1];
  return `<div class="suspects"><h3>WHO THE ROOM ACCUSED</h3>${acc.map(([n,c])=>`<div class="sus${n===real?" real":""}"><img src="${AV(n)}" alt=""><span>${esc(n)}${n===real?" ✓":""}</span><div><div class="bar" data-w="${(c/max*100).toFixed(0)}%"></div></div><span class="c">×${c}</span></div>`).join("")}</div>`;
}
function rows(){
  const r=ranked(),max=Math.max(1,...r.map(p=>p.score));let rank=0,prev=null;
  return r.map((p,i)=>{if(p.score!==prev){rank=i+1;prev=p.score}
    return `<div class="row" style="--i:${i}"><div class="fill" data-w="${(p.score/max*100).toFixed(1)}%"></div><div class="rk">${rank}</div><img class="av" src="${AV(p.name)}" alt="">
      <div class="nm">${esc(p.name)}${p.move>0?`<span class="mv up">▲${p.move}</span>`:p.move<0?`<span class="mv dn">▼${-p.move}</span>`:""}${p.streak>1?`<span class="streak">🔥 ${p.streak} in a row</span>`:""}</div>
      <div class="pts">${p.score.toLocaleString()}${p.delta>0?`<span class="delta">+${p.delta.toLocaleString()}</span>`:p.delta<0?`<span class="delta neg">−${(-p.delta).toLocaleString()}</span>`:""}</div></div>`}).join("");
}
function quip(){
  const r=ranked();if(!r.length)return"";const lead=r[0].name,last=r[r.length-1].name,hot=r.find(p=>p.streak>=3),got=r.filter(p=>p.delta).length;
  const lines=[`${lead} knows too much. The Capitol is concerned.`,`Sponsors are lining up for ${lead}.`,`Somebody send ${last} a parachute. And a hint.`,
    got===0?"Not one tribute cracked that. Secrets this good should be illegal.":`${got} tribute${got>1?"s":""} cracked that file.`,
    hot?`${hot.name} is on fire. Nobody tell them anything.`:r.find(p=>p.note.startsWith("🎭"))?`${r.find(p=>p.note.startsWith("🎭")).name} lied to all your faces. Beautifully.`:"Plenty of secrets left. Trust no one.",`${last}, the odds are not currently in your favor.`];
  return esc(lines[(S.qi*7+got)%lines.length]);
}
function boardView(){
  return `<div class="top"><div><div class="eyebrow">After secret ${S.qi+1} of ${Q.length}</div><h2 class="qnum">The Capitol Ledger</h2></div>${sndBtn()}</div>
  <div class="quip" style="text-align:center">${quip()}</div>
  <div class="ledger">${rows()}</div>
  <div class="ctl"><span class="hint tiny">Space: next secret</span><button class="btn wax" id="next">${Q[S.qi+1]?.bonus&&!cur().bonus?"📝 On to the bonus round":"Next secret"}</button></div>`;
}
function finalView(){
  const r=ranked(),top=r[0]?.score??0,tied=r.filter(p=>p.score===top&&top>0);
  const pod=[r[1],r[0],r[2]].map((p,i)=>p?`<div class="pod p${[2,1,3][i]}">${i===1?'<div class="crown">👑</div>':""}<img class="av" src="${AV(p.name)}" alt=""><div class="nm">${esc(p.name)}</div><div class="pts">${p.score.toLocaleString()} pts</div><div class="blk">${[2,1,3][i]}</div></div>`:"<div></div>").join("");
  return `<section class="center" style="min-height:0;gap:14px">
    <div class="eyebrow">The vault is empty</div>
    <h1 style="font-size:clamp(2rem,6vw,4.4rem)">${S.champ?"⚔️ "+esc(S.champ)+" wins the showdown! ⚔️":tied.length>1?"It's a tie!":"🎄 "+esc(r[0]?.name??"")+" knows all! 🎄"}</h1>
    <p>${tied.length>1?`${tied.map(p=>esc(p.name)).join(" and ")} are tied. Settle it with rock, paper, scissors!`:"Our victor claims a major award. Remember, no second major award until everyone has one."}</p>
    <div class="podium">${pod}</div>
    ${awards().length?`<div class="eyebrow" style="margin-top:8px">The Capitol's special honors</div><div class="awards">${awards().map((a,i)=>`<div class="award" style="animation-delay:${.6+i*.25}s"><div class="ic">${a.ic}</div><div class="t">${a.t}</div><img src="${AV(a.av)}" alt=""><div class="nm">${esc(a.name)}</div><div class="why">${a.why}</div></div>`).join("")}</div>`:""}
    <div class="ledger">${rows()}</div>
    <div class="ctl" style="justify-content:center">${sndBtn()}<button class="btn ghost" id="lobby">Back to the lobby</button><button class="btn" id="again">Play again</button></div></section>`;
}

/* ================= CONTROLS ================= */
function primary(){
  ensureAudio();
  if(S.phase==="lobby")return active().length>=2&&howTo();
  if(S.phase==="howto")return readyGo();
  if(["roundcard","bonuscard","lightcard","ttlcard"].includes(S.phase))return beginQuestion();
  if(S.phase==="likely")return S.likely?.show?proceed():likelyResults();
  if(S.phase==="last")return newGame();
  if(S.phase==="ready")return (clearInterval(readyT),sfx("go"),startQuestion());
  if(S.phase==="question")return S.locked?afterLock():lock();
  if(S.phase==="interro")return reveal();
  if(S.phase==="reveal")return S.opts?.story&&!cur().fake&&!cur().lightning&&!cur().ttl?storyTime():score();
  if(S.phase==="showdown")return S.champ?finishShowdown():duelGo();
  if(S.phase==="story")return S.storyState==="ask"?(S.storyState="skip",score()):score();
  if(S.phase==="board")return next();
}
function wire(){
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const p=S.players[+b.dataset.tog];p.on=!p.on;sfx("click");render()});
  document.querySelectorAll("[data-secs]").forEach(b=>b.onclick=()=>{S.secs=+b.dataset.secs;render()});
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{S.opts[b.dataset.opt]=!S.opts[b.dataset.opt];sfx("click");render()});
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{const n=b.dataset.ok,i=S.correct.indexOf(n);i<0?S.correct.push(n):S.correct.splice(i,1);sfx("click");render()});
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=()=>{ensureAudio();fn()}};
  on("go",howTo);on("reread",readRules);on("hush",()=>{stopReading();howI=99;render()});on("readygo",readyGo);on("begin",beginQuestion);on("lock",lock);on("reveal",reveal);on("unseal",afterLock);on("story",storyTime);on("likelyshow",likelyResults);on("lastgo",newGame);on("likelynext",proceed);on("duelgo",duelGo);on("duelfinal",finishShowdown);on("storyyes",()=>storyDecide("on"));on("storyno",()=>storyDecide("skip"));on("score",score);on("next",next);on("again",newGame);
  on("host",()=>{hostOpen=!hostOpen;render()});
  on("lobby",()=>{clearInterval(readyT);stopReading();S.phase="lobby";stopSong();render()});
  on("music",()=>{musicOn=true;stopSong();playSong("lobby");render()});
  on("snd",window.toggleMusic=()=>{musicOn=!musicOn;if(!musicOn)stopSong();else{const m={lobby:"lobby",question:S.locked?null:"count",board:"board",final:"winner"}[S.phase];m&&playSong(m)}
    const e=$("#snd");if(e){e.textContent=musicOn?"🔊 Music on":"🔇 Music off";e.setAttribute("aria-pressed",musicOn)}});
  on("clearphones",async()=>{if(!confirm("Clear every phone sign-in? Everyone will need to tap their name again."))return;try{await post({action:"clearPlayers"})}catch(e){}phones=[];render()});
}
document.addEventListener("keydown",e=>{
  if(e.key==="m"||e.key==="M"){if($("#snd"))$("#snd").click();else if(window.toggleMusic){toggleMusic();render()}return}
  if(e.code!=="Space"&&e.key!=="Enter")return;
  if(e.target.closest&&e.target.closest("button,input"))return;
  e.preventDefault();primary();
});
/* a TV reload mid-question picks up with the guesses locked */
S=saved()||freshState();
S.opts={...freshState().opts,...(S.opts||{})};S.extra=S.extra||[];S.players.forEach(p=>p.story=p.story||0);
if(S.deck?.length)Q.splice(0,Q.length,...S.deck);  // a reload mid game keeps the same decoys in the same places
if(S.extra.length)Q.push(...S.extra);               // a reload mid bonus round keeps the bonus secrets
if(S.phase==="interro")S.phase="question";
if(S.phase==="question")S.locked=true;
/* the host phone (approving bonus secrets) proves itself with this key */
S.hostKey=S.hostKey||(crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):Math.random().toString(36).slice(2)+Date.now().toString(36));
dsPost({op:"hostkey",k:S.hostKey}).catch(()=>{});
if(S.phase==="ready")S.phase="roundcard";
render();
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
setInterval(()=>{push();maybePoll();if(Date.now()-lastSave>1000){lastSave=Date.now();save()}arena()},250);

/* ---------- floating secrets: envelopes, wax seals, keys, quills, magnifiers, padlocks, scrolls ---------- */
let lastArena="";
function arena(){
  if(typeof Ambient==="undefined")return;
  const ph=S.phase,k=`${ph}:${S.qi}:${S.locked}`;
  const m=ph==="lobby"||ph==="roundcard"||ph==="final"||ph==="ready"?["full",{theme:"ds",max:5,every:[1500,2800]}]
    :ph==="question"||ph==="board"?["edges",{theme:"ds",max:3,every:[2000,3400]}]:["off"];
  Ambient.set(...m);
  if(k!==lastArena){ if(ph==="question"&&!S.locked&&!lastArena.startsWith("question:"+S.qi))sweep(); lastArena=k; }
}
// a big magnifying glass sweeps across the secret file as it appears
function sweep(){
  if(calm)return;
  const el=document.createElement("div");el.innerHTML=Ambient.ART.magnifier;
  el.style.cssText="position:fixed;z-index:6;pointer-events:none;width:clamp(120px,14vw,200px);left:0;top:30vh;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))";
  document.body.appendChild(el);
  el.animate([{transform:"translate(-25vw,0) rotate(-15deg)"},{transform:"translate(30vw,8vh) rotate(10deg)"},{transform:"translate(60vw,-4vh) rotate(-8deg)"},{transform:"translate(110vw,6vh) rotate(12deg)"}],
    {duration:3200,easing:"ease-in-out"}).onfinish=()=>el.remove();
}
// a sealed guess just came in: an envelope flies into the row
function flyEnvelope(){
  if(calm)return;
  const row=document.querySelector(".envs");if(!row)return;
  const r=row.getBoundingClientRect(),el=document.createElement("div");el.innerHTML=Ambient.ART.envelope;
  el.style.cssText="position:fixed;z-index:6;pointer-events:none;width:70px;left:0;top:0";
  document.body.appendChild(el);
  const fromX=Math.random()<.5?-80:innerWidth+10,toX=r.left+r.width/2-35,toY=r.top;
  el.animate([{transform:`translate(${fromX}px,${innerHeight*.9}px) rotate(-30deg) scale(.6)`},{transform:`translate(${(fromX+toX)/2}px,${toY-160}px) rotate(15deg) scale(1.2)`},
    {transform:`translate(${toX}px,${toY}px) rotate(0) scale(.8)`,opacity:1},{transform:`translate(${toX}px,${toY+10}px) scale(.4)`,opacity:0}],{duration:1300,easing:"ease-in-out"}).onfinish=()=>el.remove();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pollKey="";maybePoll()}});
/* a newer version went live: reload, but only between rounds (the game is saved, so nothing is lost) */
setInterval(async()=>{
  if(!["lobby","board","final"].includes(S.phase)||location.protocol==="file:")return;
  try{const t=await (await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})).text();
    const m=t.match(/const BUILD="([^"]+)"/);if(m&&m[1]!==BUILD){save();location.reload()}}catch(e){}
},45000);

/* ---------- host menu: a faint ⚙ in the corner, easy to miss on purpose ---------- */

// ⏭ jump straight to the winners screen (fanfare, confetti, the winners' song). Scores stay as they are.
function skipToEnd(asked){
  if(S.phase==="final"){stopSong();playSong("winner");return}
  if(!asked&&!confirm("Skip to the winners screen? The game ends here with the scores as they are. (Good for testing the music.)"))return;
  ensureAudio();clearInterval(readyT);clearInterval(clockT);clearRedzone?.();stopReading?.();
  if(S.qi==null||S.qi<0)S.qi=0;S.locked=true;S.duel=null;
  S.phase="final";stopSong();confetti(260,true);playSong("winner");render();
}
// A QR code for the host's own phone: it lists the bonus secrets people wrote (anonymous) to approve or skip.
// Scanning it once also marks that phone as the host's, so signing in as Carsyn there shows 🔑 Host tools.
function hostPhone(){
  const url=`${location.origin}/district-secrets/host?k=${S.hostKey}`;dsPost({op:"hostkey",k:S.hostKey}).catch(()=>{});
  let qr="";try{const q=qrcode(0,"M");q.addData(url);q.make();qr=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){}
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><div class="eyebrow" style="color:#6b5233">Host only</div><h2 style="margin:0">Scan once with your phone</h2><div class="qr">${qr}</div>
    <div class="u">${esc(url)}</div><div class="tiny" style="color:#6b5233">After this, sign in as Carsyn on that phone and tap 🔑 Host tools to approve bonus secrets (you'll never see who wrote them). Close this before anyone else scans it.</div><button class="btn wax">Close</button></div>`;
  m.onclick=e=>{if(e.target===m||e.target.tagName==="BUTTON")m.remove()};document.body.appendChild(m);

// Back to the lobby with a clean slate. Phones keep their names and follow along.
function restartGame(ask=true){
  if(ask&&!confirm("Restart from the beginning? This ends the current game and clears the scores."))return;
  stopReading();
  clearInterval(readyT);clearInterval(typeT);cancelAnimationFrame(raf);stopSong();
  S.players.forEach(p=>{p.score=0;p.streak=0;p.delta=0;p.move=0;p.right=0;p.fooled=0;p.accused=0;p.story=0;p.fakes=0;p.note=""});
  Object.assign(S,{phase:"lobby",qi:0,elapsed:0,locked:false,correct:[],guesses:{},typed:0,gid:Date.now(),extra:[],bonusDone:false,bets:{},votes:{},deck:null});Q.splice(0,Q.length,...REAL);

}
/* 🏆 live leaderboard along the bottom during the game (showtime.js) */
if(window.Ticker)Ticker.start({theme:"secrets",label:"🏆 Leaderboard",photo:AV,
  rows:()=>["lobby","howto","last","board","final","interro","story","showdown","likely","lightcard","ttlcard"].includes(S.phase)?null:active().map(p=>({name:p.name,score:p.score}))});
/* ⏭️ test button (showtime.js): straight to the winners screen and its song */
window.MusicPill&&MusicPill.add({on:()=>musicOn,toggle:()=>{ensureAudio();window.toggleMusic&&toggleMusic();render()}});
window.SkipEnd&&SkipEnd.add(()=>skipToEnd(true));
</script>
<script>
/* 🎵 lobby music as soon as the page opens. Browsers hold sound back until the first click or key press,

(function autoLobby(){
