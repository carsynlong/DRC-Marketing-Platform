<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1f18">
<title>Who's That Tribute? · Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<style>
/* The phone is a controller: no photos, no sound. Watch the TV. */
:root{
  --night:#0d1f18; --night-2:#16302a; --ink:#fbf6ea; --muted:#bccabd;
  --gold:#e8b04b; --gold-d:#9a6c1c; --red:#b8322a; --red-d:#6e1712;
  --a1:#c8412f; --a2:#2f6fb3; --a3:#d79a1f; --a4:#3e8a52; --good:#6fd38a; --bad:#ff8a7a;
  --line:rgba(251,246,234,.16);
  --display:"Rye","Georgia",serif; --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:18px;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -20%,rgba(184,50,42,.45),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(232,176,75,.16),transparent 60%);
  min-height:100dvh;-webkit-user-select:none;user-select:none}
.app{min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* top strip: who I am + score */
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--night-2);border-radius:14px;padding:10px 14px;box-shadow:0 0 0 1px var(--line)}
.me .nm{font-weight:800;font-size:1.15rem;overflow-wrap:anywhere}
.me .pts{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.me .pts small{display:block;color:var(--muted);font-weight:600;font-size:.75rem}

/* big centered message screens */
.msg{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:10px 0}
.msg .icon{font-size:4.5rem;line-height:1}
.msg h1{font-size:clamp(1.9rem,9vw,2.6rem);color:var(--gold);text-shadow:0 3px 0 var(--red-d)}
.msg p{margin:0;max-width:30ch;line-height:1.45;color:var(--muted)}
.msg .said{font-size:1.2rem;color:var(--ink)}
.big{font-family:var(--display);font-size:clamp(3rem,16vw,4.5rem);color:var(--gold);text-shadow:0 4px 0 var(--red-d)}
.gift{display:inline-block;background:linear-gradient(90deg,var(--red),#e0453a);color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:.45em 1em;border-radius:999px;box-shadow:0 0 0 3px var(--gold)}
.right h1{color:var(--good)} .wrong h1{color:var(--bad)}

/* name picker */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{min-height:64px;border-radius:14px;background:var(--night-2);box-shadow:0 0 0 2px var(--line);font-weight:800;font-size:1.1rem;padding:8px;overflow-wrap:anywhere}
.pick button:active{background:var(--gold);color:#2a1c05}
.pick button:disabled{opacity:.35;cursor:not-allowed}
.pick button small{display:block;font-weight:600;font-size:.75rem;color:var(--muted)}

/* the four colored answer buttons, same order, colors and shapes as the TV */
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:min(62dvh,520px)}
.tile{border-radius:16px;color:#fff;font-weight:800;font-size:clamp(1.15rem,5.6vw,1.6rem);display:grid;place-content:center;justify-items:center;gap:10px;padding:10px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);overflow-wrap:anywhere;text-align:center}
.tile:active{transform:scale(.97)}
.tile svg{width:2.4em;height:2.4em}
/* after tapping: gold frame on your pick, the others fade */
.tile.sel{box-shadow:0 0 0 6px var(--gold),0 0 28px rgba(232,176,75,.75),inset 0 -6px 0 rgba(0,0,0,.25);position:relative;animation:pick .35s cubic-bezier(.2,1.5,.4,1)}
.tile.sel::after{content:"✓";position:absolute;top:8px;right:10px;width:1.5em;height:1.5em;border-radius:50%;background:var(--gold);color:#2a1c05;display:grid;place-items:center;font-size:.9em}
.tile.dim{opacity:.25}
.tile:disabled{cursor:default}
.locked-in{text-align:center;font-family:var(--display);color:var(--gold);font-size:clamp(1.5rem,7vw,2rem);text-shadow:0 3px 0 var(--red-d)}
@keyframes pick{from{transform:scale(.92)}to{transform:none}}
.k0{background:var(--a1)}.k1{background:var(--a2)}.k2{background:var(--a3)}.k3{background:var(--a4)}

/* typed answer */
.typeit{display:grid;gap:12px;margin-top:auto;margin-bottom:auto}
.typeit input{font:inherit;font-size:1.5rem;font-weight:800;background:rgba(0,0,0,.3);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:.6em .7em;width:100%;-webkit-user-select:text;user-select:text}
.typeit input:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--gold);color:#2a1c05;font-weight:800;padding:.9em 1.4em;border-radius:999px;font-size:1.2rem;box-shadow:0 4px 0 var(--gold-d);min-height:60px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.btn:disabled{opacity:.4}
.link{color:var(--muted);text-decoration:underline;font-size:.9rem;padding:8px}

.toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));background:var(--red);color:#fff;font-weight:800;border-radius:14px;padding:14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
.offline{text-align:center;font-size:.85rem;font-weight:800;color:#2a1c05;background:var(--gold);border-radius:999px;padding:.35em 1em}
/* ---------- animation: snow behind, confetti on top, every screen pops in ---------- */
#snow,#fx{position:fixed;inset:0;pointer-events:none}#snow{z-index:0}#fx{z-index:6}
.app{position:relative;z-index:1}
.msg{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.msg .icon{display:inline-block;animation:bob 1.4s ease-in-out infinite alternate}
.right .icon{animation:spinin .8s cubic-bezier(.2,1.5,.4,1) both,bob 1.4s .8s ease-in-out infinite alternate}
.right h1{animation:bump .6s .3s both}
.wrong .icon{animation:shake .45s 2,bob 1.4s .9s ease-in-out infinite alternate}
.wrong h1{animation:shake .45s .15s 2}
.late .icon{animation:boom .7s cubic-bezier(.2,1.5,.4,1) both,shake .4s .7s 2}
.ready h1{animation:heartbeat .9s ease-in-out infinite}
.win .icon{animation:crown 1s ease-in-out infinite alternate;font-size:6rem}
.win h1{animation:shimmer 1.6s linear infinite;background:linear-gradient(90deg,var(--gold),#fff6d6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%}
.locked-in{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.locked-in .lk{display:inline-block;animation:wiggle .7s .25s}
.pick button{animation:rise .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms)}
.tile{animation:tilein .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms)}
.tile.sel{animation:pick .35s cubic-bezier(.2,1.5,.4,1),glow 1.1s .35s ease-in-out infinite alternate}
.tile.dim{animation:dimout .5s both}
.typeit{animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.me .pts.bump{animation:bump .7s}
.gift{animation:bump 1s ease-in-out infinite alternate}
.train{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--red);animation:pop .6s 1.2s both}.train small{font-size:1rem;color:#7a5a20;margin-left:4px}
.horn{width:min(70vw,260px);animation:spinin .9s cubic-bezier(.2,1.4,.4,1) both,bob 1.6s .9s ease-in-out infinite alternate}.horn svg{width:100%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.reacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(22,48,42,.85);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1px var(--line);position:relative;z-index:6}
.reacts .lbl{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.reacts button{font-size:1.9rem;min-height:56px;border-radius:12px;background:rgba(255,255,255,.05)}
.reacts button:active{background:rgba(232,176,75,.25)}
.mgplay{flex:1;display:grid;grid-template-rows:auto auto 1fr;gap:10px;justify-items:center;text-align:center}
.mgn{font-family:var(--display);font-size:clamp(3.5rem,18vw,6rem);color:var(--gold);line-height:1;text-shadow:0 4px 0 var(--red-d)}
.mgbtn{width:100%;min-height:46dvh;border-radius:28px;background:radial-gradient(circle at 50% 40%,#e0453a,#8b1a14);color:#fff;font-family:var(--display);font-size:clamp(3rem,16vw,5rem);
  box-shadow:0 10px 0 #5e0f0b,0 0 0 4px var(--gold);touch-action:manipulation;-webkit-user-select:none;user-select:none;display:grid;place-content:center}
.mgbtn small{display:block;font-family:var(--body);font-size:1rem;opacity:.8}
.mgbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #5e0f0b,0 0 0 4px var(--gold)}
.tip{min-height:2.6em;text-align:center;color:var(--gold);font-weight:800;font-size:.95rem;max-width:30ch;margin:0 auto;transition:opacity .4s}
.tiphint{text-align:center;color:var(--muted);font-size:.8rem;margin:0}
.switch{display:block;margin:4px auto 0;background:transparent;color:var(--ink);font-weight:800;font-size:1rem;padding:.75em 1.3em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);min-height:52px;animation:rise .5s .4s both}
.switch:active{background:var(--night-2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{to{transform:translateY(-10px) rotate(5deg)}}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
@keyframes boom{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
@keyframes heartbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}50%{transform:scale(.97)}}
@keyframes crown{from{transform:translateY(0) rotate(-8deg) scale(1)}to{transform:translateY(-14px) rotate(8deg) scale(1.08)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes wiggle{20%{transform:rotate(-18deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes tilein{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 0 6px var(--gold),0 0 18px rgba(232,176,75,.5),inset 0 -6px 0 rgba(0,0,0,.25)}to{box-shadow:0 0 0 8px #ffd36b,0 0 40px rgba(255,211,107,.95),inset 0 -6px 0 rgba(0,0,0,.25)}}
@keyframes dimout{from{opacity:1}to{opacity:.25;transform:scale(.94)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
/* ---------- Hunger Games touches (all original art) ---------- */
/* tribute card in the header: your headshot + district; it catches fire on a 3+ streak */
.me .who{display:flex;align-items:center;gap:10px;min-width:0}
.me .av{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold);flex:none}
.me.fire{box-shadow:0 0 0 2px #ff7a1a,0 0 22px rgba(255,90,20,.6);animation:flick .25s infinite alternate}
.me.fire .av{box-shadow:0 0 0 3px #ff7a1a,0 0 18px #ff4d00;animation:flick .2s infinite alternate}
@keyframes flick{from{filter:brightness(1)}to{filter:brightness(1.18) saturate(1.2)}}
.sound{display:flex;gap:8px;justify-content:center}
.sound button{font-weight:800;font-size:.9rem;padding:.5em 1em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);min-height:44px}
.sound button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
/* the reaping: a paper slip unfolds with your name on it */
.slip{background:linear-gradient(#fbf6ea,#efe4c8);color:#2a1c05;border-radius:6px;padding:16px 26px;box-shadow:0 10px 30px rgba(0,0,0,.5);transform-origin:top;
  animation:unfold .9s .15s cubic-bezier(.2,1.2,.4,1) both;display:grid;gap:6px;justify-items:center;min-width:220px}
.slip .eyebrow{color:#7a5a20}
.slip .nm{font-family:var(--display);font-size:clamp(1.8rem,9vw,2.4rem);line-height:1}
.slip img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold-d);animation:pop .6s .8s both}
@keyframes unfold{0%{transform:scaleY(0) rotate(-6deg);opacity:0}60%{transform:scaleY(1.08) rotate(2deg);opacity:1}100%{transform:none}}
/* sponsor parachute drifting down on a double-points face */
.chute{width:120px;height:auto;animation:drift 2.6s ease-in-out both,sway 1.6s 2.6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(-60vh) rotate(-12deg)}to{transform:none}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* lock-in: an arrow flies into the target */
.shot{position:relative;width:200px;height:70px;margin:0 auto}
.shot .target{position:absolute;right:0;top:0;width:70px;height:70px}
.shot .arrow{position:absolute;left:0;top:27px;width:150px;height:16px;animation:fly .45s cubic-bezier(.5,0,.9,.6) both}
.shot .target{animation:hit .4s .42s both}
@keyframes fly{from{transform:translateX(-160px);opacity:0}20%{opacity:1}to{transform:translateX(0)}}
@keyframes hit{50%{transform:scale(1.25) rotate(8deg)}}
/* the cannon: white flash + the whole screen jolts */
.flashbang{position:fixed;inset:0;background:#fff;z-index:7;pointer-events:none;animation:flash .7s both}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.jolt{animation:jolt .5s}
@keyframes jolt{20%{transform:translate(-8px,6px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
/* on fire */
.onfire{font-family:var(--display);font-size:clamp(1.4rem,7vw,1.9rem);background:linear-gradient(0deg,#ff3d00,#ffb300,#fff3b0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:heartbeat .8s infinite}
.win h1{text-shadow:none;filter:drop-shadow(0 3px 0 var(--red-d))}
.round-sym{width:120px;height:auto;animation:spinin .9s cubic-bezier(.2,1.5,.4,1) both,bob 1.6s .9s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main class="app" id="app" aria-live="polite"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>

<script src="phone-fx.js"></script>
<script src="ambient.js"></script>
<script>
const SHAPES=[
 '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 20H2z" fill="#fff"/></svg>',
 '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12z" fill="#fff"/></svg>',
 '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff"/></svg>',
 '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="#fff"/></svg>'];
const $=s=>document.querySelector(s);
const ART={
  // silver parachute carrying a gift box
  chute:`<svg class="chute" viewBox="0 0 120 150" aria-hidden="true"><path d="M8 52C8 20 32 4 60 4s52 16 52 48c-9-7-17-7-26 0-9-7-17-7-26 0-9-7-17-7-26 0-9-7-17-7-26 0z" fill="#dfe6ee" stroke="#9aa7b4" stroke-width="2"/>
    <path d="M8 52 52 112M34 52 56 112M60 52v60M86 52 64 112M112 52 68 112" stroke="#c9d2dc" stroke-width="1.5"/>
    <rect x="44" y="108" width="32" height="30" rx="3" fill="#b8322a"/><rect x="57" y="108" width="6" height="30" fill="#e8b04b"/><rect x="44" y="119" width="32" height="6" fill="#e8b04b"/></svg>`,
  target:`<svg class="target" viewBox="0 0 70 70" aria-hidden="true"><circle cx="35" cy="35" r="33" fill="#fbf6ea"/><circle cx="35" cy="35" r="25" fill="#b8322a"/><circle cx="35" cy="35" r="16" fill="#fbf6ea"/><circle cx="35" cy="35" r="8" fill="#e8b04b"/></svg>`,
  arrow:`<svg class="arrow" viewBox="0 0 150 16" aria-hidden="true"><path d="M2 8h128" stroke="#e8b04b" stroke-width="3"/><path d="M150 8l-22-7v14z" fill="#fbf6ea"/><path d="M2 8 14 1h10L14 8l10 7H14z" fill="#b8322a"/></svg>`,
  // bow and arrow for the round cards
  bow:`<svg class="round-sym" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 10c50 20 50 80 0 100" fill="none" stroke="#e8b04b" stroke-width="7" stroke-linecap="round"/><path d="M30 10v100" stroke="#fbf6ea" stroke-width="2"/>
    <path d="M14 60h96" stroke="#fbf6ea" stroke-width="4"/><path d="M118 60l-16-7v14z" fill="#b8322a"/><path d="M14 60l10-6h8l-8 6 8 6h-8z" fill="#b8322a"/></svg>`,
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

// This phone's random id, kept so a reload gets the same name back.
let pid=store.get("tribute-pid");
if(!pid){pid=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));store.set("tribute-pid",pid)}
let myName=store.get("tribute-name");

let D={game:undefined,me:null,taken:[],myAnswer:null}; // last server reply
let pending=null;   // {gid,qi,answer} sent but not yet confirmed by a poll
let offline=0, timer=0, lastKey="", shownScore=0;
let coins=(()=>{try{return JSON.parse(store.get("tribute-coins"))||{gid:null,n:0}}catch(e){return {gid:null,n:0}}})();
const myCoins=()=>D.game&&coins.gid===D.game.gid?coins.n:0;
function addCoin(){
  if(!D.game)return 0;
  if(coins.gid!==D.game.gid)coins={gid:D.game.gid,n:0};
  coins.n++;store.set("tribute-coins",JSON.stringify(coins));
  post("/api/coins",{name:myName,coins:coins.n}).catch(()=>{});
  const e=document.querySelector(".me .eyebrow");if(e&&!/🪙/.test(e.textContent))e.insertAdjacentText("beforeend"," · 🪙 "+coins.n);else if(e)e.textContent=e.textContent.replace(/🪙 \d+/,"🪙 "+coins.n);
  return coins.n;
}

async function poll(){
  clearTimeout(timer);
  if(document.hidden)return;               // resumes on visibilitychange
  try{
    const r=await fetch(`/api/state?pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(myName||"")}`,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    D=await r.json(); offline=0;
    if(D.me!==myName){myName=D.me;store.set("tribute-name",myName)}
    if(pending&&D.game&&(pending.gid!==D.game.gid||pending.qi!==D.game.qi||D.myAnswer))pending=null;
  }catch(e){offline++}
  render();
  timer=setTimeout(poll,1500);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});

async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pid,...body})});
  return {status:r.status,data:await r.json().catch(()=>({}))};
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}

async function join(name){
  try{
    const {status,data}=await post("/api/join",{name});
    if(status===200){myName=data.me;store.set("tribute-name",myName)}
    else if(status===409)toast(`Someone already picked ${name}. If that's really you, ask the host.`);
    else toast("Couldn't pick that name. Try again.");
  }catch(e){toast("No connection. Try again.")}
  poll();
}
async function leave(){
  try{await post("/api/join",{leave:true})}catch(e){}
  myName=null;store.set("tribute-name",null);poll();
}
async function answer(text){
  buzz(15);PFX.sfx("tap");
  const g=D.game;text=String(text||"").trim();
  if(!text||!g)return;
  pending={gid:g.gid,qi:g.qi,answer:text};render();
  try{
    const {status,data}=await post("/api/answer",{name:myName,qi:g.qi,answer:text});
    if(status===200)pending.answer=data.answer;
    else{pending=null;toast(status===409?"Too late! Answers are locked.":"That didn't go through. Try again.")}
  }catch(e){pending=null;toast("No connection. Tap again.")}
  render();
}

/* ---------- animation helpers (phones stay silent; a short buzz on Android) ---------- */
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
(function snow(){
  const c=$("#snow"),x=c.getContext("2d");let W,H,f=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;f=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.3,w:Math.random()*6.28}))};
  size();addEventListener("resize",size);if(calm)return;
  (function loop(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.75)";
    for(const p of f){p.y+=p.s;p.w+=.01;p.x+=Math.sin(p.w)*.35;if(p.y>H){p.y=-4;p.x=Math.random()*W}x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    requestAnimationFrame(loop)})();
})();
const FX=(()=>{const c=$("#fx"),x=c.getContext("2d");let P=[],on=false;
  const size=()=>{c.width=innerWidth;c.height=innerHeight};size();addEventListener("resize",size);
  const cols=["#ff5a4e","#e8b04b","#6fe38e","#fbf6ea","#6fb6ff"];
  function loop(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.y<c.height+30&&p.life-->0);
    for(const p of P){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.star){x.font="16px serif";x.fillText("❄",-7,7)}else x.fillRect(-4,-2.5,8,5);x.restore()}
    if(P.length)requestAnimationFrame(loop);else on=false}
  return (n,from)=>{if(calm)return;for(let i=0;i<n;i++){const side=i%2,mid=from==="mid";
    P.push({x:mid?c.width/2:side?c.width*.05:c.width*.95,y:mid?c.height*.4:c.height*.8,vx:mid?(Math.random()-.5)*16:(side?1:-1)*(3+Math.random()*7),vy:-(mid?6+Math.random()*10:9+Math.random()*11),
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%5],star:Math.random()<.2,life:300})}
    if(!on){on=true;requestAnimationFrame(loop)}}})();
function countUp(){
  document.querySelectorAll("[data-to]").forEach(el=>{
    const a=+el.dataset.from||0,b=+el.dataset.to||0;if(a===b||calm)return;
    const t0=performance.now(),d=900;
    (function step(t){const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(a+(b-a)*e).toLocaleString();if(k<1)requestAnimationFrame(step)})(t0);
  });
}
/* ---------- the host (🔮 Gamemaker): knows every face, so she predicts how many will get it right ---------- */
function hostScreen(g,key){
  const mine=D.myAnswer??(pending&&pending.gid===g.gid&&pending.qi===g.qi?pending.answer:null),pick=/^🔮(\d+)$/.exec(mine||"")?.[1];
  if(g.phase==="reveal"){const n=(g.correct||[]).length,d=pick==null?null:Math.abs(+pick-n);
    return [key+"hr"+pick,header()+msg(d===0?"🔮":d===1?"✨":"🎙️",d===0?"Perfect prediction!":d===1?"So close!":pick==null?"No prediction":"Not this time",
      `<p class="said">${n} tribute${n===1?"":"s"} got it right${pick!=null?` · you said ${pick}`:""}</p><p>${d===0?"+500 points":d===1?"+200 points":"Points on the scoreboard."}</p>`,d!=null&&d<2?"right":"")+reactBar(),d===0?"right":""];}
  if(pick!=null)return [key+"hp"+pick,header()+msg("🔮",`You predicted ${pick}`,"<p>Exactly right: +500. Off by one: +200. Eyes on the TV!</p>")+reactBar(),"lock"];
  if(g.locked)return [key+"hl",header()+msg("💥","Time's up!","<p>No prediction this time.</p>")];
  const n=(g.playing||[]).length;
  return [key+"ha",header()+`<section class="msg" style="flex:none"><div class="icon">🔮</div><h1>You're the Gamemaker</h1>
    <p>You know this face! How many tributes will get it right?</p></section>
    <div class="pick">${Array.from({length:n+1},(_,i)=>`<button data-pred="${i}">${i}<small>${i===0?"nobody":i===n?"everyone":"tributes"}</small></button>`).join("")}</div>`];
}

/* ---------- mini-games: tap race and tree climb ---------- */
const MG={race:{icon:"🏃",title:"Run to the Cornucopia!",how:"When the TV says GO, tap the big button as fast as you can!"},
          climb:{icon:"🌲",title:"Climb the Tree!",how:"When the TV says GO, shake your phone as hard as you can!"}};
let mg={id:null,n:0,sent:0,motion:false},mgT=0,lastMag=0,lastShake=0;
function mgBump(){if(D.game?.mini?.stage!=="live")return;mg.n++;const el=$("#mgn");if(el){el.textContent=mg.n;el.animate([{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:120})}buzz(8)}
function onMotion(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const m=Math.hypot(a.x||0,a.y||0,a.z||0),now=Date.now();
  if(Math.abs(m-lastMag)>11&&now-lastShake>150){lastShake=now;mgBump()}lastMag=m}
async function enableShake(){
  try{if(typeof DeviceMotionEvent!=="undefined"&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!=="granted")throw 0}
    if(!mg.motion){addEventListener("devicemotion",onMotion);mg.motion=true}toast("✅ Shaking is on. Get ready!")}catch(e){toast("No shaking on this phone: just tap the button instead!")}
  lastKey="";render()}
function miniScreen(g,key){
  const m=g.mini||{},info=MG[m.kind]||MG.race;
  if(mg.id!==m.id){mg={id:m.id,n:0,sent:0,motion:mg.motion}}
  if(m.stage==="intro")return [key+"intro"+mg.motion,header()+`<section class="msg"><div class="icon">${info.icon}</div><div class="eyebrow">Mini-game · bonus points</div><h1>${info.title}</h1><p>${info.how}</p>
      ${m.kind==="climb"?(mg.motion?`<p class="said">✅ Shaking is on</p>`:`<button class="btn" id="shakeon">Allow shaking 📳</button>`):""}<p>Top 3 win +500, +300 and +200!</p></section>`,"gift"];
  if(m.stage==="count")return [key+"count"+m.count,header()+msg("",`<span class="big">${m.count}</span>`,`<p>${info.title}</p>`,"ready")];
  if(m.stage==="live")return [key+"live",header()+`<section class="mgplay"><div class="eyebrow">${info.title}</div><div class="mgn" id="mgn">${mg.n}</div>
      <button class="mgbtn" id="mgtap">${m.kind==="climb"?"SHAKE!<small>or tap here</small>":"TAP!"}</button></section>`];
  if(m.stage==="tally")return [key+"tally",header()+msg("💥","Time!",`<p class="said">You did ${mg.n}!</p><p>Eyes on the TV…</p>`,"late")];
  const all=m.all||[],i=all.findIndex(([n])=>n===D.me),bonus=[500,300,200][i];
  return [key+"done",header()+msg(i===0?"🏆":i>0&&i<3?"🥇":"🏅",i<0?"No score":`You came #${i+1}!`,`<p class="said">${i>=0?`${all[i][1]} ${m.kind==="climb"?"shakes":"taps"}`:""}${bonus?` · <b style="color:var(--good)">+${bonus} points</b>`:""}</p><p>Eyes on the TV.</p>`,bonus?"right":"")+reactBar(),bonus?"points":""];
}
// send the count to the TV a few times a second while the race is on
setInterval(()=>{const m=D.game?.mini;if(D.game?.phase!=="mini"||!m||m.id!==mg.id||(m.stage!=="live"&&m.stage!=="tally")||mg.n===mg.sent)return;
  const n=mg.n;post("/api/mini",{name:myName,id:m.id,n}).then(()=>{mg.sent=Math.max(mg.sent,n)}).catch(()=>{})},300);

/* arena tips that rotate while you wait */
const TIPS=["Sponsors love a confident tribute.","Never eat berries you can't name.","Tracker jackers hate being swatted. Swat them anyway.",
  "Find water first. Then find the cocoa.","The President is watching. Smile.","Camouflage tip: wear the ugly sweater.",
  "A care package could be bread. Or burn cream. Or socks.","Stay out of the bushes. Something buzzes in there.",
  "Allies are good. Allies who share cookies are better.","The bird knows things. Listen to the bird.","Keep your eyes on the TV and your hands off the berries.",
  "Every face you know is a step closer to victory.","Hold your phone like it's your last arrow."];
let tipT=0,tipI=Math.random()*TIPS.length|0;
function startTips(){clearInterval(tipT);const el=$("#tip");if(!el)return;const show=()=>{el.style.opacity=0;setTimeout(()=>{el.textContent="💡 "+TIPS[tipI++%TIPS.length];el.style.opacity=1},350)};show();tipT=setInterval(show,4500)}
function effect(fx){
  const SND={reap:"reap",gong:"gong",gift:"gift",whistle:"whistle",lock:"lock",cannon:"cannon",right:"right",own:"right",wrong:"wrong",points:"points",fire:"fire",win:"win",final:"gong"};
  if(SND[fx])PFX.sfx(SND[fx]);
  if(fx==="cannon"&&!calm){document.body.insertAdjacentHTML("beforeend",'<div class="flashbang"></div>');setTimeout(()=>$(".flashbang")?.remove(),800);
    $("#app").classList.remove("jolt");void $("#app").offsetWidth;$("#app").classList.add("jolt")}
  if(fx==="fire"){FX(70,"mid");buzz([20,30,20,30,20])}
  if(fx==="reap")FX(30,"mid");
  if(fx==="right"){FX(90);buzz([30,50,30])}
  if(fx==="own"){FX(40,"mid")}
  if(fx==="wrong"||fx==="late")buzz(180);
  if(fx==="points")FX(50,"mid");
  if(fx==="win"){FX(140);setTimeout(()=>FX(140),800);setTimeout(()=>FX(140,"mid"),1700);buzz([40,60,40,60,120])}
  if(fx==="final")FX(50,"mid");
}

/* ---------- screens ---------- */
const meScore=()=>D.game?.scores?.find(s=>s.name===D.me);
const fmt=n=>Number(n||0).toLocaleString();
function header(){
  const s=meScore();
  const d=D.game.names.indexOf(D.me)+1, fire=s&&s.streak>=3;
  return `<div class="me${fire?" fire":""}"><div class="who"><img class="av" src="img/p${String(d).padStart(2,"0")}.jpg" alt=""><div><div class="eyebrow">District ${d} · ⭐ ${Ambient.training(D.me)}${myCoins()?` · 🪙 ${myCoins()}`:""}${fire?" · 🔥":""}</div><div class="nm">${esc(D.me)}</div></div></div>
    <div class="pts${s&&s.score!==shownScore?" bump":""}">${s?`<span data-from="${shownScore}" data-to="${s.score}">${fmt(s.score)}</span> pts<small>#${s.rank} of ${D.game.scores.length}</small>`:""}</div></div>`;
}
const REACTS=["🏹","🔥","🌹","🍞","🐦","🎁","😱","😂"];
const reactBar=()=>`<div class="reacts"><div class="lbl">Tap to send to the TV</div>${REACTS.map(e=>`<button data-react="${e}" aria-label="Send ${e}">${e}</button>`).join("")}</div>`;
let lastReact=0;
async function react(e,btn){
  const now=Date.now();if(now-lastReact<350)return;lastReact=now;   // no spamming the TV
  buzz(10);PFX.sfx("tap");btn.animate([{transform:"scale(1)"},{transform:"scale(1.35)"},{transform:"scale(1)"}],{duration:300});
  const f=document.createElement("div");f.textContent=e;const r=btn.getBoundingClientRect();     // a little one floats up on your phone too
  f.style.cssText=`position:fixed;left:${r.left+r.width/2-14}px;top:${r.top}px;font-size:28px;z-index:8;pointer-events:none`;document.body.appendChild(f);
  f.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-120px) scale(1.4)",opacity:0}],{duration:900,easing:"ease-out"}).onfinish=()=>f.remove();
  try{await post("/api/react",{name:myName,e})}catch(err){}
}
const soundBar=()=>`<div class="sound"><button id="snd" aria-pressed="${PFX.prefs.sound}">${PFX.prefs.sound?"🔊":"🔇"} Sounds</button><button id="mus" aria-pressed="${PFX.prefs.music}">🎵 Music ${PFX.prefs.music?"on":"off"}</button></div>`;
const msg=(icon,title,body,cls="")=>`<section class="msg ${cls}">${icon?`<div class="icon" aria-hidden="true">${icon}</div>`:""}<h1>${title}</h1>${body||""}</section>`;

function view(){
  const g=D.game;
  if(g===undefined)return ["load",msg("🎄","Loading…")];
  if(!g)return ["nogame",msg("📺","Waiting for the TV","<p>Ask the host to open the game on the TV, then this page will update.</p>")];
  if(!D.me){
    const taken=new Set(D.taken||[]), away=new Set(D.away||[]);
    return ["pick:"+[...taken].join("|")+"/"+[...away].join("|"),`<section class="msg" style="flex:none;padding-top:20px"><div class="eyebrow">Who's That Tribute?</div><h1>Who are you?</h1><p>Tap your name.</p></section>
      <div class="pick">${g.names.map((n,i)=>{const t=taken.has(n)&&!away.has(n),back=away.has(n);
        return `<button style="--i:${i}" data-name="${esc(n)}" ${t?"disabled":""}>${esc(n)}${t?"<small>taken</small>":back?"<small>tap to rejoin</small>":""}</button>`}).join("")}</div>`];
  }
  const s=meScore(), playing=g.playing.includes(D.me), key=`${g.gid}:${g.phase}:${g.qi}`;
  const notYou=`<button class="switch" id="leave">🔄 Not ${esc(D.me)}? Switch name</button>`;
  if(g.phase==="lobby")return [key+playing, header()+(playing
    ?`<section class="msg"><img src="bird.svg" alt="" style="width:96px;animation:spinin .9s cubic-bezier(.2,1.5,.4,1) both"><div class="eyebrow">The Reaping has chosen</div><div class="slip"><div class="eyebrow">District ${g.names.indexOf(D.me)+1} tribute</div><img src="img/p${String(g.names.indexOf(D.me)+1).padStart(2,"0")}.jpg" alt=""><div class="nm">${esc(D.me)}</div><div class="eyebrow" style="margin-top:4px">Training score</div><div class="train"><span data-from="1" data-to="${Ambient.training(D.me)}">${Ambient.training(D.me)}</span><small>/ 12</small></div></div><p>You're in! Eyes on the TV. The Games begin soon.</p><p class="tiphint">🪂 While you wait: tap the care packages, swat the wasps, catch the bird!</p></section>`
    :msg("🪑","You're sitting out","<p>Want to play? Ask the host to tap your name on the TV.</p>"))+(playing?reactBar():"")+soundBar()+notYou,playing?"reap":""];
  if(D.me===g.host&&(g.phase==="question"||g.phase==="reveal"))return hostScreen(g,key);
  if(!playing&&g.tb)return [key+"tbwatch",header()+msg("⚔️","Showdown!","<p>It's a tie at the top. Watch the TV and cheer for your favorite!</p>")+reactBar()];
  if(!playing)return [key+"out",header()+msg("📺","Watch the TV","<p>You're sitting out this game. Cheer loudly.</p>")+notYou];
  if(g.phase==="rules")return [key,header()+msg("📜","Listen up, tribute!","<p>The rules are being read on the TV. Eyes up!</p>")+reactBar()];
  if(g.phase==="tbcard")return [key,header()+msg("⚔️","You're in the showdown!","<p>One more face. The fastest right answer wins the Games. Get ready to type!</p>"),"gift"];
  if(g.phase==="mini")return miniScreen(g,key);

  const gift=g.feast?`<span class="gift">🍗 Triple points</span>`:g.double?`<span class="gift">🎁 Double points</span>`:"";
  const faceNo=`<div class="eyebrow">Face ${g.qi+1} of ${g.total}</div>`;
  if(g.phase==="roundcard")return [key,header()+`<section class="msg">${g.feast?`<div class="horn">${Ambient.CORNUCOPIA}</div>`:`<img class="round-sym" src="bird.svg" alt="">`}<div class="eyebrow">${esc(g.round?.num||"")}</div><h1>${esc(g.round?.name||"Next round")}</h1><p>${g.feast?"Every face is worth triple. Everything you need is at the cornucopia!":"Let the Games begin. Eyes on the TV."}</p></section>`+soundBar(),"gong"];
  if(g.phase==="ready"&&g.feast)return [key,header()+`<section class="msg ready"><div class="horn">${Ambient.CORNUCOPIA}</div><h1>The Feast!</h1>${faceNo}${gift}<p>This face is worth triple. Run for the cornucopia!</p></section>`,"gift"];
  if(g.phase==="ready")return [key,header()+(g.double
      ?`<section class="msg ready">${ART.chute}<h1>Get ready!</h1>${faceNo}${gift}<p>A sponsor sent a gift: this face is worth double!</p></section>`
      :msg("⏳",`Get ready!`,`${faceNo}<p>Watch the TV. Your buttons appear here.</p>`,"ready")),g.double?"gift":""];

  if(g.phase==="question"){
    const mine=D.myAnswer??(pending&&pending.gid===g.gid&&pending.qi===g.qi?pending.answer:null);
    if(mine&&g.mode==="choice"&&g.choices.includes(mine))return [key+"done:"+mine,header()+`<div class="shot">${ART.arrow}${ART.target}</div><div class="locked-in"><span class="lk">🔒</span> Locked in!</div>
      <div class="tiles">${g.choices.map((n,k)=>`<button style="--i:0" class="tile k${k} ${n===mine?"sel":"dim"}" disabled aria-pressed="${n===mine}">${SHAPES[k]}<span>${esc(n)}</span></button>`).join("")}</div>
      <p class="tip" id="tip"></p><p class="tiphint">🪂 Tap the care packages for sponsor gifts!</p>${reactBar()}`,"lock"];
    if(mine)return [key+"done:"+mine,header()+`<section class="msg"><div class="shot">${ART.arrow}${ART.target}</div><h1>Locked in!</h1><p class="said">You said <b>${esc(mine)}</b></p><p class="tip" id="tip"></p><p class="tiphint">🪂 Tap the care packages for sponsor gifts!</p></section>${reactBar()}`,"lock"];
    if(g.locked)return [key+"late",header()+msg("💥","Time's up!","<p>The cannon fired before you answered. Get the next one!</p>","late"),"cannon"];
    if(g.mode==="choice")return [key+"ask",header()+`<div class="bar" style="display:flex;justify-content:space-between;align-items:center">${faceNo}${gift}</div>
      <div class="tiles">${g.choices.map((n,k)=>`<button style="--i:${k}" class="tile k${k}" data-ans="${esc(n)}">${SHAPES[k]}<span>${esc(n)}</span></button>`).join("")}</div>`,"whistle"];
    return [key+"type",header()+`<div class="bar" style="display:flex;justify-content:space-between;align-items:center">${faceNo}${gift}</div>
      <form class="typeit" id="typeit"><label class="eyebrow" for="guess">Who is it?</label>
      <input id="guess" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="send" maxlength="40" placeholder="Type a name">
      <button class="btn" type="submit">Lock it in</button></form>`,"whistle"];
  }
  if(g.phase==="reveal"){
    const mine=D.myAnswer, said=mine?`<p class="said">You said <b>${esc(mine)}</b></p>`:`<p class="said">You didn't answer</p>`;
    const right=(g.correct||[]).includes(D.me);
    return [key+right+mine,header()+(right
      ?msg("✅","Right!",`<p class="said">It's ${esc(g.answer)}!</p>`,"right")
      :msg("❌","Not this time",`<p class="said">It's ${esc(g.answer)}.</p>${said}`,"wrong"))+reactBar(),right?"right":"wrong"];
  }
  if(g.phase==="board"){
    const got=s&&s.delta>0;
    return [key+(s?.score),header()+msg(got?"🎉":"🏹",got?`+<span data-from="0" data-to="${s.delta}">${fmt(s.delta)}</span>`:"No points",
      `${s?.streak>=3?`<div class="onfire">🔥 You're on fire! 🔥</div><p class="said">${s.streak} in a row</p>`:s?.streak>1?`<p class="said">🔥 ${s.streak} in a row</p>`:""}<p>You're <b>#${s?.rank}</b> with ${fmt(s?.score)} points. Eyes on the TV.</p>`,got?"right":"")+reactBar()+soundBar(),got?(s.streak>=3?"fire":"points"):""];
  }
  if(g.phase==="final"){
    const won=s&&s.rank===1&&s.score>0;
    return [key+(s?.rank),header()+msg(won?"👑":"🎄",won?"You won!":`You finished #${s?.rank}`,
      `<p>${fmt(s?.score)} points. ${won?"Go claim your mystery package!":"Merry Christmas, tribute!"}</p>${myCoins()?`<p class="said">🪙 You collected ${myCoins()} Capitol coin${myCoins()>1?"s":""}. Check the TV for the coin champion!</p>`:""}`,won?"win":"")+reactBar()+soundBar(),won?"win":"final"];
  }
  return [key,header()+msg("📺","Watch the TV")];
}

function render(){
  const [k,html,fx]=view();
  const key=k+(offline>2?"off":"");
  if(key===lastKey)return;   // nothing changed: leave the screen alone (keeps your typing)
  lastKey=key;
  $("#app").innerHTML=(offline>2?`<div class="offline">Reconnecting…</div>`:"")+html;
  document.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>join(b.dataset.name));
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>answer(b.dataset.ans));
  const f=$("#typeit");if(f)f.onsubmit=e=>{e.preventDefault();const i=$("#guess");i.blur();answer(i.value)};
  const l=$("#leave");if(l)l.onclick=leave;
  document.querySelectorAll("[data-react]").forEach(b=>b.onclick=()=>react(b.dataset.react,b));
  document.querySelectorAll("[data-pred]").forEach(b=>b.onclick=()=>answer("🔮"+b.dataset.pred));
  const tap=$("#mgtap");if(tap)tap.onpointerdown=e=>{e.preventDefault();mgBump()};
  const so=$("#shakeon");if(so)so.onclick=enableShake;
  const sb=$("#snd");if(sb)sb.onclick=()=>{PFX.toggle("sound");lastKey="";render()};
  const mb=$("#mus");if(mb)mb.onclick=()=>{PFX.toggle("music");lastKey="";render()};
  const ph=D.game?.phase;PFX.music(!D.me?null:ph==="lobby"?"jingle":ph==="board"||ph==="final"?"deck":null);
  countUp(); effect(fx);
  const asking=document.querySelector("[data-ans]:not(:disabled),#typeit,[data-name],#mgtap,[data-pred]");
  if(!D.me||asking||!D.game){Ambient.set("off");if(asking)Ambient.clear()}
  else Ambient.set("full",{tap:true,sound:k=>PFX.sfx(k),burst:()=>FX(30,"mid"),coin:addCoin,max:3,every:[2000,3400]});
  startTips();
  const s=meScore(); if(s) shownScore=s.score;
}
poll();
</script>
