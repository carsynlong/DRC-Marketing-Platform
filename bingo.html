<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>District Bingo</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;gap:14px;max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:44px 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
h1.title{font-size:clamp(2rem,5vw,3.4rem);color:var(--gold);text-shadow:0 3px 0 var(--red-d);line-height:1}
.layout{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr);gap:28px;align-items:start}
.ballzone{display:grid;justify-items:center;gap:14px;text-align:center}
.ball{width:min(34vw,320px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,#fff 0 8%,var(--bc,#b8322a) 60%,#3a0c09);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 -10px 30px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.ball .face{width:62%;aspect-ratio:1;border-radius:50%;background:#fbf6ea;color:#13271f;display:grid;place-items:center;align-content:center;line-height:.9}
.ball .l{font-family:var(--display);font-size:clamp(1.6rem,4vw,3rem);color:var(--bc,#b8322a)}
.ball .n{font-weight:800;font-size:clamp(3rem,9vw,6.4rem);font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px 6px;width:100%;max-width:520px;justify-self:center}
.board .L{font-family:var(--display);color:#fff;border-radius:8px;display:grid;place-items:center;font-size:1.5rem;padding:4px 0}
.board .c{height:clamp(24px,4.1vh,44px);border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:clamp(.8rem,1.6vh,1.15rem);background:rgba(255,255,255,.06);color:rgba(251,246,234,.5);font-variant-numeric:tabular-nums;transition:transform .12s}
.board .c:hover{transform:scale(1.12);box-shadow:inset 0 0 0 2px var(--gold);color:var(--ink)}
.board .c.on{background:var(--gold);color:#2a1c05;box-shadow:0 0 12px rgba(232,176,75,.5)}
.board .c.new{background:#fbf6ea;color:var(--red);transform:scale(1.15)}
.panel{background:var(--night-2);border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line);display:grid;gap:10px}
.check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check input{font:inherit;font-weight:800;font-size:1.1rem;width:5.5em;background:rgba(0,0,0,.3);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:.4em .6em}
.mini{display:grid;grid-template-columns:repeat(5,2.8em);gap:4px;margin-top:6px}
.mini .h{font-family:var(--display);text-align:center;color:var(--gold)}
.mini div:not(.h){aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.06)}
.mini div.hit:not(.h){background:var(--gold);color:#2a1c05}.mini div.win:not(.h){background:var(--good);color:#06210f}
.verdict{font-family:var(--display);font-size:1.6rem}
.last{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.last span{padding:.25em .6em;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800;font-size:.9rem}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{display:flex;align-items:center;gap:8px;padding:.4em .8em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:.95rem}
.modes button[aria-pressed="true"]{background:var(--gold);color:#2a1c05;box-shadow:none}
.shape{display:inline-grid;grid-template-columns:repeat(5,7px);gap:2px}
.shape i{width:7px;height:7px;border-radius:2px}
.nowmode{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--night-2);border-radius:14px;padding:8px 14px;box-shadow:0 0 0 2px var(--gold)}
.nowmode .shape{grid-template-columns:repeat(5,12px)}.nowmode .shape i{width:12px;height:12px}
.bigwin{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,16,12,.93);text-align:center;padding:20px}
.bigwin h1{font-size:clamp(3rem,10vw,8rem);color:var(--gold);text-shadow:0 6px 0 var(--red-d);animation:slam .8s cubic-bezier(.2,1.4,.4,1) both}
@media (max-height:820px){.ball{width:min(26vw,230px)}.board .c{height:clamp(22px,3.6vh,34px)}.mini{grid-template-columns:repeat(5,2.3em)}.mini div:not(.h){aspect-ratio:auto;height:2em}.app{gap:10px;padding-block:40px 12px}}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="app" id="app"><p style="margin-top:20vh;text-align:center">Loading the bingo cards…</p></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="/xmas/xmas.js"></script>
<script>XM.useNicknames();XM.setSound(true) /* a game page always starts with sound on, even if the show was muted earlier */</script>
<script>
/* District Bingo board. Numbers come out of the real bingo cage; the Gamemaker taps each one here.
   Card checks use /xmas/bingo-cards.json: the exact numbers on the 100 printed cards (xmas/bingo-cards.pdf).
   Each card is 5 columns (B, I, N, G, O) of 5 numbers, top to bottom. The middle square is FREE on the printed cards. */
document.getElementById("lights").outerHTML=XM.lights(26);
XM.snow(document.getElementById("snow"));
const {esc,sfx,playSong,stopSong,ensureAudio}=XM;
let CARDS=[];
const LET="BINGO",LC=["#b8322a","#1f6b4a","#c8921f","#2f6fb3","#7a3fb0"];
const letterOf=n=>Math.floor((n-1)/15);
let S={bingos:(v=>v&&!Array.isArray(v)&&typeof v==="object"?v:{})(XM.store.get("xmas-bingo-winners",{})),mode:(m=>["line","corners","x","frame"].includes(m)?m:"line")(XM.store.get("xmas-bingo-mode","line")),called:XM.store.get("xmas-bingo-called",[]),checked:null};
const save=()=>{XM.store.set("xmas-bingo-called",S.called)};

let lastTap={n:0,t:0};
function call(n){
  ensureAudio();
  const i=S.called.indexOf(n);
  if(i>=0&&lastTap.n===n&&Date.now()-lastTap.t<700)return; // ignore an accidental double-tap
  lastTap={n,t:Date.now()};
  if(i>=0){ // tapped a called number again: take it back
    if(n!==S.called[S.called.length-1]&&!confirm(`Un-call ${LET[letterOf(n)]} ${n}?`))return;
    S.called.splice(i,1);sfx("untap");
  }else{S.called.push(n);sfx("reveal")}
  S.checked=null;save();render();
}
function rowLines(card){const has=(c,r)=>(c===2&&r===2)||S.called.includes(card[c][r]);const out=[];
  for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>has(c,r)))out.push([0,1,2,3,4].map(c=>[c,r]));
  for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>has(c,r)))out.push([0,1,2,3,4].map(r=>[c,r]));
  if([0,1,2,3,4].every(i=>has(i,i)))out.push([0,1,2,3,4].map(i=>[i,i]));
  if([0,1,2,3,4].every(i=>has(i,4-i)))out.push([0,1,2,3,4].map(i=>[i,4-i]));return out}
/* Game types. Each returns the winning groups of [col,row] squares (empty = no bingo yet). */
const ALL=[];for(let c=0;c<5;c++)for(let r=0;r<5;r++)ALL.push([c,r]);
const MODES={
  line:{name:"Regular",desc:"5 in a row: across, down, or diagonal"},
  corners:{name:"Four Corners",desc:"All 4 corner squares",cells:[[0,0],[4,0],[0,4],[4,4]]},
  x:{name:"Big X",desc:"Both diagonals",cells:ALL.filter(([c,r])=>c===r||c===4-r)},
  frame:{name:"Picture Frame",desc:"The whole outside edge",cells:ALL.filter(([c,r])=>c===0||c===4||r===0||r===4)},
};
const hasSq=(card,c,r)=>(c===2&&r===2)||S.called.includes(card[c][r]);
function lines(card){const m=MODES[S.mode]||MODES.line;if(!m.cells)return rowLines(card);return m.cells.every(([c,r])=>hasSq(card,c,r))?[m.cells]:[]}
function shapeMini(k){const m=MODES[k];const on=new Set((m.cells||[[0,2],[1,2],[2,2],[3,2],[4,2]]).map(p=>p.join()));
  let g="";for(let r=0;r<5;r++)for(let c=0;c<5;c++)g+=`<i style="background:${on.has(c+","+r)?"var(--gold)":"rgba(255,255,255,.12)"}"></i>`;
  return `<span class="shape">${g}</span>`}
function setMode(k){S.mode=k;S.checked=null;XM.store.set("xmas-bingo-mode",k);sfx("reveal");render();
  if(window.Briefing){briefRound(k);return}
  XM.say(k==="line"?"Regular bingo!":`${MODES[k].name} bingo!`,null,{pitch:.1,rate:.85,interrupt:true})}
// 🎱 read out what this round's pattern needs, with Reread; Start just closes it
function briefRound(k){const m=MODES[k],won=(S.bingos&&S.bingos[k]||[]).length;
  const pat={line:["5 in a row: across, down or diagonal.","Five in a row. Across, down, or diagonal."],corners:["All <b>4 corner squares</b>. Nothing else matters.","All four corner squares. Nothing else matters."],
    x:["Both diagonals: a <b>big X</b> through the middle.","Both diagonals. A big X through the middle."],frame:["The whole <b>outside edge</b> of your card: all 16 squares.","The whole outside edge of your card. All sixteen squares."]}[k]||[m.desc,m.desc];
  Briefing.show({eyebrow:"🎱 DISTRICT BINGO",title:`${m.name} Bingo`,intro:`${m.name} bingo. Here's what you need.`,
    steps:[["🎯",`To win this round: ${pat[0]}`,`To win this round: ${pat[1]}`],["⭐","The middle <b>FREE</b> square counts for everyone.","The middle free square counts for everyone."],
      ["🔊","Mark every number the Gamemaker calls. Got it? Yell <b>BINGO!</b>","Mark every number that gets called. Got it? Yell bingo!"],
      ["🔍","The Gamemaker checks your card number on the TV.","The Gamemaker checks your card number on the TV."],
      ["🎁",`First real bingo wins this round's <b>major award</b>.${won?" (This round already has a winner.)":""}`,"First real bingo wins this round's major award."]],
    outro:"Good luck, tributes.",start:"▶ Let's play",muted:()=>!XM.sound})}
function check(){const k=+document.getElementById("cardno").value;if(!(Number.isInteger(k)&&k>=1&&k<=CARDS.length)){S.checked={err:true};render();return}
  const ln=lines(CARDS[k-1]);S.checked={k,ln};
  if(ln.length){const list=S.bingos[S.mode]=S.bingos[S.mode]||[];if(!list.includes(k)){list.push(k);XM.store.set("xmas-bingo-winners",S.bingos)}const place=list.indexOf(k)+1;
    bigWin(`Card ${k}`,"",place);XM.celebrate("",{line:place===1?`Bingo! Card ${k} wins the ${MODES[S.mode].name} round!`:`Bingo! Card ${k}!`})}else sfx("cannon");render();const v=document.querySelector(".mini");if(v)v.scrollIntoView({block:"nearest",behavior:"smooth"});}
function bigWin(who,sub="",place=1){
  document.querySelectorAll(".bigwin").forEach(x=>x.remove());
  const o=document.createElement("div");o.className="bigwin";
  o.innerHTML=`<div style="display:grid;gap:16px;justify-items:center"><div class="eyebrow" style="font-size:1rem">${esc(sub)}${sub?" · ":""}${esc(MODES[S.mode].name)}</div><h1>${place===1?"🏆 ":""}BINGO!</h1>
    <p style="font-family:var(--display);font-size:clamp(1.5rem,4vw,3rem);margin:0">${place===1?`${esc(who)} wins the ${esc(MODES[S.mode].name)} round and a major award!`:`${esc(who)} got a bingo too!`}</p><p class="tiny" style="font-size:1.1rem">${place===1?"Next: pick the next game type, then tap New game.":"This round's major award is already claimed."}</p>
    <button class="btn" style="font-size:1.2rem">Keep playing</button></div>`;
  document.body.appendChild(o);o.querySelector("button").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};
}
function miniCard(card,winSet,big){
  let g=LET.split("").map(l=>`<div class="h">${l}</div>`).join("");
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){const free=c===2&&r===2,n=card[c][r],hit=free||S.called.includes(n);g+=`<div class="${winSet.has(c+","+r)?"win":hit?"hit":""}">${free?"★":n}</div>`}
  return `<div class="mini" ${big?'style="grid-template-columns:repeat(5,3.2em)"':""}>${g}</div>`;
}
function render(){
  const last=S.called[S.called.length-1];
  const fresh=last!==S.shownBall;S.shownBall=last;
  const ball=last?`<div class="ball" style="--bc:${LC[letterOf(last)]};${fresh?"":"animation:none"}" key="${last}"><div class="face"><span class="l">${LET[letterOf(last)]}</span><span class="n">${last}</span></div></div>`
    :`<div class="ball" style="--bc:#1f6b4a"><div class="face"><span class="l" style="font-size:1.6rem">Ready?</span></div></div>`;
  // laid out like the real masterboard: B I N G O across the top, 15 numbers down each column
  let board="";for(let l=0;l<5;l++)board+=`<div class="L" style="background:${LC[l]}">${LET[l]}</div>`;
  for(let i=1;i<=15;i++)for(let l=0;l<5;l++){const n=l*15+i;board+=`<button class="c ${n===last?"new":S.called.includes(n)?"on":""}" data-n="${n}" aria-label="${LET[l]} ${n}${S.called.includes(n)?", called":""}">${n}</button>`}
  let res="",resCard="";const C=S.checked;
  if(C&&C.err)res=`<div class="verdict" style="color:#ff8a7a">Cards go from 1 to ${CARDS.length}.</div>`;
  else if(C){const win=new Set(C.ln.flat().map(p=>p.join()));
    res=`<div class="verdict" style="color:${C.ln.length?"var(--good)":"#ff8a7a"}">${C.ln.length?"🎉 BINGO! Card "+C.k+" wins a major award!":"🪦 Not yet, Card "+C.k+". Keep playing."}</div>`;resCard=miniCard(CARDS[C.k-1],win)}
  document.getElementById("app").innerHTML=`<div class="bar"><div><div class="eyebrow">The 2026 Christmas Games · Game 8</div><h1 class="title">District Bingo</h1></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-mute aria-label="Mute">${XM.sound?"🔊":"🔇"}</button><button class="btn ghost" id="music">🔔 Music</button><button class="btn ghost" id="tb">⚔️ Tiebreaker</button><button class="btn ghost" id="reset">New game</button><button class="btn ghost" id="back">← Back to the show</button></div></div>
  <div class="layout"><div class="ballzone"><div class="nowmode">${shapeMini(S.mode)}<div style="text-align:left"><div class="eyebrow">Now playing</div><b style="font-family:var(--display);font-size:1.4rem;color:var(--gold)">${MODES[S.mode].name}</b><div class="tiny">${MODES[S.mode].desc}</div></div></div>${ball}
    <div class="tiny" style="font-size:1rem">Tap each number on the board as it comes out of the cage.<br>${S.called.length} called · ${75-S.called.length} left</div>
    <div class="last">${S.called.slice(-6,-1).reverse().map(n=>`<span>${LET[letterOf(n)]} ${n}</span>`).join("")}</div>
    ${last?`<button class="btn ghost" id="undo" style="font-size:.9rem">↩ Undo ${LET[letterOf(last)]} ${last}</button>`:""}
      <div class="panel" style="width:100%;text-align:left"><div class="eyebrow">Someone yelled BINGO? Check their card</div>
      <div style="display:flex;gap:14px;align-items:flex-start;justify-content:space-between"><div style="display:grid;gap:8px">
      <div class="check"><input id="cardno" type="number" step="1" min="1" max="${CARDS.length}" placeholder="Card #" value="${C&&!C.err?C.k:""}"><button class="btn" id="chk">Check card</button></div>${res.replace('class="verdict"','class="verdict" style="font-size:1.25rem"').replace('style="font-size:1.25rem" style="','style="font-size:1.25rem;')}
      <div class="tiny">4 rounds, one winner each: the first bingo in each round wins a major award.</div>
      <div class="tiny" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b style="color:var(--ink)">Round winners:</b>${Object.keys(MODES).map(k=>`<span>${MODES[k].name}: ${(S.bingos[k]||[])[0]?`<b style="color:var(--gold)">🏆 Card ${S.bingos[k][0]}</b>`:"open"}</span>`).join(" · ")}${Object.values(S.bingos).some(a=>a&&a.length)?`<button class="btn ghost" id="resetwin" style="font-size:.8rem;padding:.3em .8em">Reset winners</button>`:""}</div></div>${resCard}</div></div>
    </div>
    <div style="display:grid;gap:14px">
      <div class="panel"><div class="eyebrow">Game type · pick before you start</div><div class="modes">${Object.entries(MODES).map(([k,m])=>`<button data-mode="${k}" aria-pressed="${S.mode===k}" title="${m.desc}">${shapeMini(k)}${m.name}</button>`).join("")}</div></div>
      <div class="board">${board}</div>
      </div></div>`;
  wire();
}
function wire(){const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=()=>{ensureAudio();fn(e)}};
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>call(+b.dataset.n));
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ensureAudio();setMode(b.dataset.mode)});
  on("chk",check);
  {const rw=document.getElementById("resetwin");if(rw)rw.onclick=()=>{if(rw.dataset.sure){S.bingos={};XM.store.set("xmas-bingo-winners",{});render()}else{rw.dataset.sure=1;rw.textContent="Tap again to reset";setTimeout(()=>{if(rw.isConnected){delete rw.dataset.sure;rw.textContent="Reset winners"}},3000)}}}on("undo",()=>{S.called.pop();S.checked=null;sfx("untap");save();render()});
  {const r=document.getElementById("reset");r.onclick=()=>{if(r.dataset.sure){S.called=[];S.checked=null;save();render()}else{r.dataset.sure=1;r.textContent="Tap again to clear";setTimeout(()=>{if(r.isConnected){delete r.dataset.sure;r.textContent="New game"}},3000)}}}
  on("music",()=>{if(XM.currentSong())stopSong();else playSong("lobby")});
  on("tb",()=>{stopSong();XM.tiebreaker({game:"bingo"})});
  on("back",()=>{try{window.close()}catch(e){}setTimeout(()=>{location.href="/show#bingo-board"},300)});
  document.querySelectorAll("[data-mute]").forEach(b=>b.onclick=()=>XM.toggleSound());
  const i=document.getElementById("cardno");if(i)i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};}
// Hidden tester: triple-click the "District Bingo" title, or press Shift+T, to preview a win (changes nothing)
function testWin(){ensureAudio();const k=1+Math.floor(Math.random()*CARDS.length);bigWin(`Card ${k}`,"Test run");XM.celebrate("",{line:`Bingo! Card ${k} is a winner!`})}
document.addEventListener("click",e=>{if(e.detail===3&&e.target.closest&&e.target.closest("h1.title"))testWin()});
document.addEventListener("keydown",e=>{if(e.key==="T"&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!(e.target.closest&&e.target.closest("input")))testWin()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelectorAll(".bigwin").forEach(x=>x.remove())}});
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==="m"||e.key==="M"){if(!(e.target.closest&&e.target.closest("input")))XM.toggleSound()}});
fetch("/xmas/bingo-cards.json",{cache:"no-cache"}).then(r=>r.json()).then(c=>{CARDS=c;render()})
  .catch(()=>{document.getElementById("app").innerHTML=`<p style="margin-top:20vh;text-align:center">Couldn't load the bingo cards. Check the internet connection and refresh.</p>`});
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/xmas-sw.js").catch(()=>{}));</script>
</body>
</html>
