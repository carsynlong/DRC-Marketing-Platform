<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The 2027 Reaping</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
body{min-height:100vh;overflow:hidden}
.wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px 16px}
.in{display:grid;gap:22px;justify-items:center}
h1{font-family:var(--display);font-weight:400;color:var(--gold);text-shadow:0 5px 0 var(--red-d);font-size:clamp(2.4rem,6vw,5rem);margin:0;line-height:1.05}
.q{font-size:clamp(1.2rem,2.6vw,2rem);font-weight:800}
.bowl{font-size:clamp(6rem,16vw,11rem);line-height:1;transition:transform .2s}
.bowl.shake{animation:shake .18s infinite alternate}
@keyframes shake{from{transform:rotate(-8deg) translateY(-4px)}to{transform:rotate(8deg) translateY(4px)}}
.slip{min-height:1.3em;font-family:var(--display);font-size:clamp(2rem,5vw,4rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.5)}
.win{display:grid;gap:10px;justify-items:center;animation:pop .6s both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.win img{width:clamp(180px,22vw,300px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px var(--gold),0 20px 50px rgba(0,0,0,.6)}
.btn{font-size:clamp(1.1rem,2vw,1.6rem)}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="wrap"><div class="in">
  <h1>The 2027 Reaping</h1>
  <div class="q" id="q">Who will host the 2027 Christmas Games?</div>
  <div class="bowl" id="bowl">🥣</div>
  <div class="slip" id="slip"></div>
  <div id="res"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="btn red" id="draw">🎟️ Draw a name</button>
    <button class="btn ghost" id="mode">Switch: who picks the 2027 theme</button>
  </div>
</div></div>
<script src="/xmas/xmas.js"></script>
<script>
// 🎟️ The 2027 Reaping: pull one tribute's name from the bowl (QUEEN MOTHER's slip is in there too)
document.getElementById("lights").outerHTML=XM.lights(14);XM.snow(document.getElementById("snow"));
const Q=["Who will host the 2027 Christmas Games?","Who picks the theme for the 2027 Games?"];let qi=0,busy=false;
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
document.getElementById("mode").onclick=()=>{qi=1-qi;document.getElementById("q").textContent=Q[qi];document.getElementById("res").innerHTML="";document.getElementById("slip").textContent=""};
document.getElementById("draw").onclick=()=>{if(busy)return;busy=true;XM.ensureAudio();
  const names=XM.TRIBUTES.map(t=>t.name),pick=names[Math.floor(Math.random()*names.length)],bowl=document.getElementById("bowl"),slip=document.getElementById("slip"),res=document.getElementById("res");
  res.innerHTML="";bowl.classList.add("shake");XM.sfx("drumroll");say(qi?"Who will choose the theme for next year? The bowl decides.":"The time has come to choose the host of the 2027 Christmas Games.");
  let n=0;const iv=setInterval(()=>{slip.textContent=XM.dn(names[n++%names.length]);XM.sfx("tick")},140);
  setTimeout(()=>{clearInterval(iv);bowl.classList.remove("shake");slip.textContent="";const t=XM.TRIBUTES.find(x=>x.name===pick);
    res.innerHTML=`<div class="win"><img src="${t.full||t.img}" alt="" onerror="this.src='${t.img}'"><h1>${XM.esc(XM.dn(pick))}</h1><div class="q">${qi?"picks the 2027 theme!":"hosts the 2027 Christmas Games!"}</div></div>`;
    XM.sfx("cannon");XM.sfx("fanfare");XM.confetti(260,true);say((qi?"The theme for 2027 will be chosen by ":"The host of the 2027 Christmas Games is ")+XM.dn(pick)+"!");busy=false},5200)};
</script>
</body>
</html>
