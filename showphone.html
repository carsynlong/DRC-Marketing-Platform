<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Join the Christmas Games</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
body{min-height:100%;overflow-x:hidden}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:46px max(16px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1.t{font-family:var(--display);font-weight:400;color:var(--gold);text-shadow:0 3px 0 var(--red-d);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.05;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid button{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px var(--line)}
.grid button img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.grid button b{font-size:.9rem}
.grid button:active{transform:scale(.96)}
.grid button.taken{opacity:.35}
.card{background:rgba(22,48,42,.95);border-radius:18px;padding:14px 16px;box-shadow:0 0 0 1px var(--line)}
.me{display:flex;align-items:center;gap:12px}
.me img{width:54px;height:54px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.me b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.4rem}
.me .x{margin-left:auto;font-size:.85rem;color:var(--muted);text-decoration:underline}
.tv .eyebrow{display:flex;justify-content:space-between}
.tv h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.5rem;margin:6px 0}
.tv p{margin:0;white-space:pre-line;line-height:1.4;font-size:1.02rem}
.reacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.reacts button{font-size:2rem;min-height:64px;border-radius:14px;background:rgba(255,255,255,.06)}
.reacts button:active{background:rgba(232,176,75,.3);transform:scale(.94)}
.live{display:grid;gap:10px;justify-items:center}
.live video{width:180px;height:180px;border-radius:50%;object-fit:cover;transform:scaleX(-1);box-shadow:0 0 0 4px #c41e1e}
.pop{position:fixed;font-size:2.4rem;pointer-events:none;z-index:9;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-220px) scale(1.4);opacity:0}}
.tiny{text-align:center;font-size:.95rem}
.app .eyebrow{font-size:.88rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{scroll-margin-top:50px;display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 14px;border-radius:16px;background:rgba(22,48,42,.95);box-shadow:0 0 0 1px var(--line);font-weight:800;font-size:1.05rem;text-align:left;color:inherit}
.tile .ti{font-size:1.6rem;line-height:1}
.tile.open{background:var(--gold);color:#13271f}
.tile.royal{box-shadow:0 0 0 2px var(--gold)}

.tpanel[hidden]{display:none}
.ptitle{font-weight:800;text-align:center;font-size:1.05rem}
.pres{text-align:center;font-weight:800;font-size:1.05rem;min-height:0}.pres:empty{display:none}
.pres.solo{background:rgba(232,196,106,.15);border-radius:14px;padding:12px;box-shadow:0 0 0 2px var(--gold)}
.link{background:none;border:0;color:var(--gold);font-weight:800;font-size:1rem;text-decoration:underline;padding:8px;justify-self:center}
.btn.nf{width:100%;font-size:1.15rem;padding:.6em}
details.more summary{cursor:pointer;font-weight:800;font-size:1.05rem;list-style:none;text-align:center;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}
details.more>.card{margin-top:12px;box-shadow:0 0 0 1px var(--line)}
.card.own{padding:12px 16px}
.owntog{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:1.05rem;min-height:44px;background:none;color:inherit}
#owncnt{color:var(--gold);font-size:.95rem;margin-left:auto}
.confirm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(6,16,12,.94);padding:20px;text-align:center}
.confirm .in{display:grid;gap:14px;justify-items:center;max-width:360px}
.confirm img{width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--gold)}
.confirm h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:2rem;margin:0}
.confirm .row{display:flex;gap:12px}.confirm .row .btn{font-size:1.2rem;padding:.8em 1.6em}
.grid button.taken img{filter:grayscale(1)}
.host{box-shadow:0 0 0 2px var(--gold)}

.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}

.qov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#8a1414,#200606);animation:qin .3s both}

.qov .in{display:grid;gap:14px;justify-items:center}

.qfaces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:6px}
.qfaces button{display:grid;justify-items:center;gap:2px;padding:4px 0;border-radius:12px;font-size:.68rem;font-weight:800;background:rgba(255,255,255,.05)}
.qfaces img,.qfaces .r{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--line);display:grid;place-items:center;font-size:1.6rem}
.qfaces button.on img,.qfaces button.on .r{box-shadow:0 0 0 3px var(--gold)}

select,textarea{width:100%;font-size:16px;font-weight:600;font-family:inherit;padding:10px;border-radius:12px;border:0;margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:8px}

.chips button.on{background:var(--gold);color:#13271f}
.vfaces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vfaces button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.82rem;font-weight:800;line-height:1.1}
.vfaces img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--line)}
.vfaces button.on{background:rgba(232,176,75,.28)}.vfaces button.on img{box-shadow:0 0 0 3px var(--gold)}
.vote{box-shadow:0 0 0 2px var(--gold)}
.sb{display:grid;gap:6px}
.sb .g{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.sb .g b{color:var(--gold)}
.dlayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dlayer i{position:absolute;top:-60px;font-style:normal;opacity:.35;animation:dfall var(--s) linear var(--d) infinite}
@keyframes dfall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
html{touch-action:manipulation}
.booth .phprev{margin-bottom:10px;text-align:center}.booth .phprev img{max-width:100%;max-height:52vh;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.booth [hidden]{display:none!important}.booth .phrow{display:flex;gap:8px;margin-top:4px}.booth .phrow .btn{flex:1}
.allrise{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#5a1a6e,#1b0726);color:#f3d27a;animation:arIn .35s both}
.allrise .cr{font-size:110px;animation:arBob 1s ease-in-out infinite alternate}
.allrise h2{font-family:var(--display);font-weight:400;font-size:3.6rem;margin:6px 0 4px;text-shadow:0 4px 0 rgba(0,0,0,.5)}
.allrise p{font-size:1.2rem;font-weight:800;color:#fff;margin:0}
@keyframes arIn{from{opacity:0;transform:scale(1.1)}}@keyframes arBob{to{transform:translateY(-12px) rotate(-6deg)}}
.race{position:fixed;inset:0;z-index:25;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden;padding:24px 16px max(24px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at center,#1d3b32,#06100c);text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.race .tapb{align-self:center;justify-self:center;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff6a5a,#b8322a 60%,#6e1712);color:#fff;font-family:var(--display);font-size:3.4rem;box-shadow:0 0 0 8px var(--gold),0 20px 40px rgba(0,0,0,.6);touch-action:manipulation}
.race .tapb:active{transform:scale(.94)}
.race .tapb:disabled{filter:grayscale(.7);opacity:.6}
.race .bar{height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.race .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd36b);width:0;transition:width .15s}
.htabs{position:sticky;top:26px;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px -6px 10px;padding:6px;background:rgba(13,31,24,.97);border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.htabs button{padding:8px 0;border-radius:10px;font-weight:800;font-size:.72rem;line-height:1.1;background:transparent;color:var(--ink)}
.htabs button .i{display:block;font-size:1.3rem}
.htabs button.on{background:var(--gold);color:#13271f}
.hpane{display:none}.hpane.on{display:block}
details.picker{margin:0 0 8px;border-radius:14px;background:rgba(255,255,255,.06);padding:8px 10px}details.picker summary{font-weight:800;cursor:pointer;list-style:none}details.picker summary::-webkit-details-marker{display:none}details.picker[open] summary{margin-bottom:8px}
details.hfold{margin:12px 0 4px;border-radius:14px;background:rgba(255,255,255,.05);padding:8px 10px}details.hfold summary{font-weight:800;cursor:pointer;list-style:none}details.hfold summary::-webkit-details-marker{display:none}details.hfold[open] summary{margin-bottom:8px}
details.hfold.mini{display:inline-block;padding:2px 12px;margin:6px 0 0}details.hfold.mini[hidden]{display:none}
[data-when][hidden]{display:none!important}
#host #qmsg:empty{display:none}
.tvctl.slim{padding:10px 14px}.tvctl.slim .eyebrow{margin:0}
#score summary{cursor:pointer;list-style:none;font-family:var(--display);color:var(--gold);font-size:1.2rem;text-align:center}
#score summary::-webkit-details-marker{display:none}
.todo{margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(232,176,75,.16);box-shadow:inset 0 0 0 1px var(--gold);font-weight:800;font-size:1.02rem}
.todo:empty{display:none}
.helpbtn{width:100%;background:#6e1712!important;color:#fff!important}
.coach{box-shadow:0 0 0 2px #2f73a8;background:rgba(18,40,60,.95)}
.coach b.n{color:#9fd0ff}
.helpcard{box-shadow:0 0 0 3px #ff4d4d;background:rgba(80,10,10,.95);animation:qin .3s both}
.mcard{box-shadow:0 0 0 2px #6a3c9c;background:rgba(40,20,60,.95)}
.qov.royal{background:radial-gradient(ellipse at center,#6b4a12,#1a0f02)}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dec button{min-height:52px;padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.06);font-weight:800;font-size:.95rem;line-height:1.2;color:inherit;border:0}.dec button.on{background:var(--gold);color:#13271f}
.qov.spy{background:radial-gradient(ellipse at center,#3a1f5c,#0a0612)}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:9ch;font:800 1.4rem var(--body,inherit);text-align:center;letter-spacing:.3em;border-radius:12px;border:0;padding:8px}
.tvctl{box-shadow:0 0 0 2px var(--gold);background:rgba(40,30,10,.95)}
.tvctl.tvpop{box-shadow:0 0 0 3px #e85b4a;animation:tvpulse 1.2s ease-in-out 2}
@keyframes tvpulse{50%{box-shadow:0 0 0 6px #e85b4a}}
.tvctl h4{margin:2px 0 8px;font-size:1.15rem;line-height:1.2}
.tvb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tvb button{min-height:56px;border-radius:14px;background:rgba(255,255,255,.09);font-weight:800;font-size:1rem;line-height:1.15;padding:6px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.tvb.nums{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px}.tvb.nums button{min-height:42px;font-size:1.05rem}
.tvb button img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.tvb button.on{background:var(--gold);color:#13271f}
.tvb button.armed{background:#c0392b;color:#fff}
.tvb button.sent{outline:3px solid #fff}
.tvpages{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tvpages button{border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.08);font-weight:800;font-size:.9rem}.tvpages button.on{background:var(--gold);color:#13271f}
.jump{display:flex;gap:8px;margin-bottom:10px}.jump select{flex:1;margin:0}.jump .btn{white-space:nowrap}
#rbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#08140f;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
#rbar button{display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:rgba(255,255,255,.08);color:inherit;border:0;font-weight:800;font-size:.82rem;font-family:inherit}
#rbar button .i{font-size:1.5rem}#rbar button.on{background:var(--gold);color:#13271f}
body.hasbar{padding-bottom:96px}body.hasbar .app{padding-bottom:110px}
.htabs [data-tab]{position:relative}.htabs .badge{position:absolute;top:2px;right:6px;min-width:20px;height:20px;border-radius:999px;background:#c0392b;color:#fff;font-weight:900;font-size:.75rem;line-height:20px;text-align:center;padding:0 5px}
.hgrid button.armed{background:#7a1010!important;color:#fff;box-shadow:0 0 0 2px var(--gold)}
</style>

<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="app" id="app"></div>
<script src="/xmas/xmas.js"></script>
<script>XM.useNicknames()</script>
<script>
/* Phone companion for the Christmas Games show: join as your tribute, read what's on the TV,
   send emoji reactions to the TV, and go live in a corner of the TV with your camera. */
document.getElementById("lights").outerHTML=XM.lights(14);
XM.snow(document.getElementById("snow"));
const {esc,TRIBUTES}=XM;
const DECREES=["Bring the QUEEN more iced tea","Bring the QUEEN a snack","Give the QUEEN a shoulder massage","Bring the QUEEN a drink","Compliment the QUEEN's outfit","Do 10 jumping jacks","Bow and say 'Your Majesty'","Serve the QUEEN dessert","Sing a Christmas carol",
 "Give the QUEEN a foot rub... just kidding, a hug","Tell the QUEEN why she's the best","Do your best royal wave","Fetch the QUEEN a napkin","Dance for 10 seconds","Speak in a British accent until the next game"];
const EMOJI=["🏹","🔥","🌹","🍞","🐦","🎁","😱","😂"];
// your own district's emojis (matches your profile on the TV)
const DEMOJI={Jessie:["💎","✨","💍","👑"],Elisha:["🪨","🧱","🛡️","⚔️"],Grandad:["⚡","🔌","💡","🤖"],Dash:["🐟","🔱","🎣","🫧"],Jonny:["🔋","💥","☀️","⚡"],Carsyn:["🚂","🚆","🚗","✈️"],Tinsley:["🪵","🌲","🪓","🍂"],Natalie:["🧵","🪡","🧶","👗"],Kamdon:["🌾","🍞","🥖","🌽"],Brandon:["🐄","🐑","🐖","🤠"],"QUEEN MOTHER":["🍎","🍑","🚜","🌻"],Kyle:["⛏️","🪨","🔦","🖤"]};
const DIND={1:"Luxury",2:"Masonry",3:"Technology",4:"Fishing",5:"Power",6:"Transportation",7:"Lumber",8:"Textiles",9:"Grain",10:"Livestock",11:"Agriculture",12:"Coal Mining"};
// Android phones vibrate. iPhones can't (Apple blocks it for websites), so they get a flash and a sound instead.
// if the phone got zoomed in, snap back to normal size (so full-screen pop-ups fit)
function unzoom(){const m=document.querySelector('meta[name=viewport]');if(!m)return;const c=m.content;m.content=c.replace(/,?maximum-scale=[^,]*/,"")+",maximum-scale=1";window.scrollTo(0,window.scrollY);setTimeout(()=>{m.content=c},400)}
// 📸 phone photo booth: take a selfie, frame it like the TV booth, send it to the Capitol
async function framePhoto(file){
  const url=URL.createObjectURL(file);try{
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  try{await document.fonts.load('40px Rye')}catch(e){}
  const W=600,H=750,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const sc=Math.max(W/im.naturalWidth,H/im.naturalHeight);x.drawImage(im,(W-im.naturalWidth*sc)/2,(H-im.naturalHeight*sc)/2,im.naturalWidth*sc,im.naturalHeight*sc);
  x.lineWidth=26;x.strokeStyle="#b8322a";x.strokeRect(13,13,W-26,H-26);x.lineWidth=10;x.strokeStyle="#e8b04b";x.strokeRect(29,29,W-58,H-58);
  const g=x.createLinearGradient(0,H-200,0,H-34);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.8)");x.fillStyle=g;x.fillRect(34,H-200,W-68,166);
  x.textAlign="center";x.fillStyle="#fff";x.font="800 30px Outfit, system-ui, sans-serif";x.fillText(XM.dn(me),W/2,H-102);
  x.fillStyle="#e8b04b";x.font="34px Rye, Georgia, serif";x.fillText("The 2026 Christmas Games",W/2,H-58);
  let q=.72,out=c.toDataURL("image/jpeg",q);while(out.length>110000&&q>.35){q-=.1;out=c.toDataURL("image/jpeg",q)}return out}finally{URL.revokeObjectURL(url)}}
function wireBooth(){const app=document.getElementById("app");const f=app.querySelector("#phfile");if(!f)return;let shot=null;
  const msg=t=>{app.querySelector("#phmsg").textContent=t};
  const reset=()=>{shot=null;app.querySelector("#phprev").hidden=true;app.querySelector("#phrow").hidden=true;app.querySelector("#phtake").hidden=false;f.value=""};
  app.querySelector("#phtake").onclick=()=>f.click();app.querySelector("#phretake").onclick=()=>{reset();f.click()};
  f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;msg("Developing your photo...");
    try{shot=await framePhoto(file)}catch(e){msg("Couldn't read that photo. Try again.");return}
    app.querySelector("#phimg").src=shot;app.querySelector("#phprev").hidden=false;app.querySelector("#phrow").hidden=false;app.querySelector("#phtake").hidden=true;msg("Looking good. Send it?")};
  app.querySelector("#phsend").onclick=async()=>{if(!shot)return;const b=app.querySelector("#phsend");b.disabled=true;msg("Sending...");
    const r=await api({a:"photo",name:me,img:shot});b.disabled=false;
    if(r.ok){buzz(60);reset();msg("📸 Sent! It shows up at the end of the night.")}else msg(r.status===429?"The Capitol is still developing your last photo. Try again in a few seconds.":r.status===400?"That photo was too big. Tap Retake.":"Couldn't send. Check your internet.")}}
function buzz(p){try{if(navigator.vibrate&&navigator.vibrate(p))return}catch(e){}
  const big=Array.isArray(p)||p>=150;if(!big)return;const f=document.createElement("div");f.style.cssText="position:fixed;inset:0;z-index:99;background:#fff;pointer-events:none;transition:opacity .5s";document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.opacity="0"});setTimeout(()=>f.remove(),600);try{XM.sfx("stinger")}catch(e){}}
const pid=(()=>{try{let p=localStorage.getItem("xmas-sh-pid");if(!p){p=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("xmas-sh-pid",p)}return p}catch(e){return "p"+Math.random()}})();
let myEpoch=XM.store.get("xmas-sh-epoch",null);

    if(k==="help")return sendHelp();if(k==="bday")return singToMe();

    app.querySelectorAll("[data-panel]").forEach(x=>{x.hidden=true});app.querySelectorAll("[data-tile]").forEach(x=>{x.classList.remove("open");x.setAttribute("aria-expanded","false")});

  box.querySelector("#clrphones").onclick=arm(box.querySelector("#clrphones"),async()=>{const r=await call({a:"clearphones"});
    if(!r.ok){qmsg("Couldn't clear. Check your internet.");return}
    myEpoch=typeof r.epoch==="number"?r.epoch:null;XM.store.set("xmas-sh-epoch",myEpoch);await api({a:"join",name:"Carsyn"});qmsg("🧹 Every phone is signed out. They scan the QR code to join again.")});
  box.querySelector("#pplus").onclick=pts(1);box.querySelector("#pminus").onclick=pts(-1);
  const sendC=async x=>{buzz(20);
    const r=await api({a:"cmd",name:me,pin,cmd:x.dataset.c});
    if(r.ok){qmsg("✅ Sent to the TV");if(x.dataset.c==="predictreveal"){setPred(null);hostState()}const [k,v]=x.dataset.c.split(":");if(TOGGLES.includes(k)&&(v==="on"||v==="off")){const st=XM.store.get("xmas-sh-toggles",{})||{};st[k]=v;XM.store.set("xmas-sh-toggles",st);showToggles()}}else if(r.status===403&&r.error==="Gamemaker only"){XM.store.set("xmas-sh-pin",null);hostCard()}else if(r.status===403){qmsg("Another phone took your name. Tap Not you? and rejoin.")}else qmsg("Couldn't send. Try again.")};
  box.querySelectorAll("[data-c]").forEach(x=>x.onclick=ARM.includes(x.dataset.c)?arm(x,()=>sendC(x)):()=>sendC(x));
  // ⚙ on/off settings: the news ticker (on by default)
  const TGL={ticker:["📺","News ticker"]},TDEF={ticker:"on"};
  function showToggles(){const st=XM.store.get("xmas-sh-toggles",{})||{};box.querySelectorAll("[data-tg]").forEach(x=>{const k=x.dataset.tg,v=st[k]||TDEF[k];x.classList.toggle("on",v==="on");x.innerHTML=`<span class="i">${TGL[k][0]}</span>${TGL[k][1]}: <b>${v==="on"?"ON":"OFF"}</b>`})}
  box.querySelectorAll("[data-tg]").forEach(x=>x.onclick=async()=>{const k=x.dataset.tg,st=XM.store.get("xmas-sh-toggles",{})||{},v=(st[k]||TDEF[k])==="on"?"off":"on";buzz(20);
    const r=await api({a:"cmd",name:me,pin,cmd:k+":"+v});if(r.ok){st[k]=v;XM.store.set("xmas-sh-toggles",st);showToggles();qmsg(`${TGL[k][1]}: ${v.toUpperCase()}`)}else qmsg("Couldn't send. Try again.")});
  showToggles();hostState();
  remoteBar(pin);
}
const TOGGLES=["ticker"];  // chaos mode and random sponsor gifts are retired
let hostRace=null;
// 🔮 predictions on this phone: "open" -> "locked" -> revealed (null). The server only tells phones while they're open, so lock/reveal are remembered here.
const predSt=()=>XM.store.get("xmas-sh-pred",null),setPred=v=>XM.store.set("xmas-sh-pred",v);
function hostState(){const box=document.getElementById("host");if(!box)return;
  if(predict&&predict.open){if(predSt()!=="open")setPred("open")}else if(predSt()==="open")setPred("locked");
  const S={revealable:predSt()==="open"||predSt()==="locked",vote:!!vote,bet:!!bet,betopen:!!(bet&&bet.state==="open"),race:!!(hostRace&&hostRace.state==="live"),hot:!!hot,mercy:!!mercy,predict:!!(predict&&predict.open)};
  box.querySelectorAll("[data-when]").forEach(x=>{const w=x.dataset.when,neg=w.startsWith("no")&&!(w in S),k=neg?w.slice(2):w;x.hidden=neg?S[k]:!S[k]})}
/* ---- 📍 jump to a slide (the list comes from the TV) ---- */
function gmCmd(cmd,data){return api({a:"cmd",name:me,pin:XM.store.get("xmas-sh-pin",null),cmd,data})}
async function gotoSlide(id){buzz(20);const r=await gmCmd("goto",{id});const m=document.getElementById("qmsg");if(m){m.textContent=r.ok?"📍 Jumping on the TV":"Couldn't send. Try again.";setTimeout(()=>m.textContent="",2500)}fastPoll=true}
function fillJump(){const sel=document.getElementById("jsel"),q=document.getElementById("jquick");if(!sel||!q)return;
  const list=XM.store.get("xmas-sh-slides",null)||[];
  if(!list.length){sel.innerHTML=`<option value="">Start the show on the laptop first</option>`;q.innerHTML="";return}
  const keep=sel.value;sel.innerHTML=list.map(([id,t],i)=>`<option value="${esc(id)}">${i+1}. ${esc(t)}</option>`).join("");if(keep)sel.value=keep;
  const ic={lobby:"⏮",victors:"👑",end:"⏭",halftime:"☕","bingo-board":"🎱"};
  const quick=list.filter(([id])=>id==="lobby"||id.startsWith("game-")||id==="halftime"||id==="victors"||id==="end");
  q.innerHTML=quick.map(([id,t])=>`<button data-go="${esc(id)}"><span class="i">${ic[id]||"🎮"}</span>${esc(id==="lobby"?"Beginning (Lobby)":id==="end"?"The end":t)}</button>`).join("");
  q.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>gotoSlide(b.dataset.go))}
/* ---- 👆 the buttons on the TV right now (pop-ups, pickers, corner buttons) ---- */
let tvSeen="",tvPage=null,fastPoll=false;
const TVPAGE={show:"📺 Show",wheel:"🎡 Wheel",bingo:"🎱 Bingo"};
function tvCtl(all){
  if(me!=="Carsyn"||!XM.store.get("xmas-sh-pin",null))return;
  if(all&&all.show&&all.show.slides){const k=JSON.stringify(all.show.slides);if(k!==JSON.stringify(XM.store.get("xmas-sh-slides",null))){XM.store.set("xmas-sh-slides",all.show.slides);fillJump()}}
  const pages=Object.keys(TVPAGE).filter(k=>all&&all[k]);
  const key=JSON.stringify([all,tvPage]);if(key===tvSeen)return;tvSeen=key;
  let c=document.getElementById("tvctl");const h=document.getElementById("host");if(!h)return;
  if(!c){c=document.createElement("div");c.className="card tvctl";c.id="tvctl";h.before(c)}
  if(!pages.length){c.classList.add("slim");c.innerHTML=`<div class="tiny" style="text-align:left">👆 Click Start the show on the laptop first.</div>`;return}
  c.classList.remove("slim");
  // the screen in front: an open Wheel or Bingo tab beats the show behind it
  const front=pages.slice().sort((a,b)=>(all[b].visible-all[a].visible)||(a==="show")-(b==="show"))[0];
  const pg=pages.includes(tvPage)?tvPage:front,d=all[pg];
  const wasPop=c.dataset.pop==="1";c.dataset.pop=d.popup?"1":"0";c.classList.toggle("tvpop",!!d.popup);
  if(d.popup&&!wasPop){buzz([60,40,60]);c.scrollIntoView({behavior:"smooth",block:"start"})}
  const face=l=>{const t=TRIBUTES.find(x=>XM.dn(x.name)===l||x.name===l)||TRIBUTES.find(x=>l.startsWith(XM.dn(x.name)+" "));return t?`<img src="${t.img}" alt="">`:""};
  const nums=d.list.filter(x=>/^\d{1,2}$/.test(x[1])),btns=d.list.filter(x=>!/^\d{1,2}$/.test(x[1]));   // bingo numbers go in a small grid
  const extra=pg==="show"&&d.video?[["vt","⏯ Play / pause the video"],["vr","⏮ Restart the video"]]:[];
  c.innerHTML=`<div class="eyebrow">👆 On the TV right now${pages.length>1?"":" · "+TVPAGE[pg]}</div>
    ${pages.length>1?`<div class="tvpages">${pages.map(k=>`<button data-pg="${k}" class="${k===pg?"on":""}">${TVPAGE[k]}${all[k].visible?" (in front)":""}</button>`).join("")}</div>`:""}
    <h4>${d.popup?"🔔 ":""}${esc(d.title||(d.popup?"A pop-up is open":"The slide"))}</h4>
    ${d.list.length||extra.length?`<div class="tvb">${btns.map(([rid,l,on])=>`<button data-rid="${esc(rid)}" class="${on?"on":""}">${face(l)}<span>${esc(l)}</span></button>`).join("")}${extra.map(([k,l])=>`<button data-vid="${k}">${l}</button>`).join("")}</div>
      ${nums.length?`<div class="tvb nums">${nums.map(([rid,l,on])=>`<button data-rid="${esc(rid)}" class="${on?"on":""}">${esc(l)}</button>`).join("")}</div>`:""}`
      :""}`;c.classList.toggle("slim",!d.list.length&&!extra.length&&!d.popup);
  c.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{tvPage=b.dataset.pg;tvSeen="";tvCtl(all)});
  const RISKY=/start over|clear|reset|new game/i;
  c.querySelectorAll("[data-rid]").forEach(b=>b.onclick=async()=>{
    if((RISKY.test(b.textContent)||(b.classList.contains("on")&&b.closest(".nums")))&&!b._armed){b._armed=true;b.classList.add("armed");const k=b.innerHTML;b.innerHTML="⚠️ Tap again to confirm";b._t=setTimeout(()=>{b._armed=false;b.classList.remove("armed");b.innerHTML=k},3000);return}
    clearTimeout(b._t);buzz(20);b.classList.add("sent");const r=await gmCmd("click",{page:pg,rid:b.dataset.rid});
    if(!r.ok){b.classList.remove("sent");const m=document.getElementById("qmsg");if(m){m.textContent="Couldn't send. Try again.";setTimeout(()=>m.textContent="",3000)}}fastPoll=true});
  c.querySelectorAll("[data-vid]").forEach(b=>b.onclick=async()=>{buzz(20);b.classList.add("sent");await gmCmd("video",{op:b.dataset.vid==="vr"?"restart":"toggle"});setTimeout(()=>b.classList.remove("sent"),400)});
}
// ⬅️ ✖️ ▶️ ➡️ 🔇 always at the bottom of the Gamemaker's screen
function remoteBar(pin){let bar=document.getElementById("rbar");if(!bar){bar=document.createElement("div");bar.id="rbar";document.body.appendChild(bar);document.body.classList.add("hasbar")}
  bar.innerHTML=[["prev","⬅️","Back"],["close","✖️","Close"],["briefgo","▶️","Start"],["next","➡️","Next"],["mute","🔇","Mute"]].map(([c,i,l])=>`<button data-rb="${c}"><span class="i">${i}</span>${l}</button>`).join("");
  bar.querySelectorAll("[data-rb]").forEach(x=>x.onclick=async()=>{buzz(20);x.classList.add("on");const r=await api({a:"cmd",name:me,pin,cmd:x.dataset.rb});setTimeout(()=>x.classList.remove("on"),250);
    if(!r.ok){const m=document.getElementById("qmsg");if(m){m.textContent="Couldn't send. Try again.";setTimeout(()=>m.textContent="",3000)}}})}
function dropBar(){const b=document.getElementById("rbar");if(b)b.remove();document.body.classList.remove("hasbar")}
function signedOut(){if(!me)return;const wasMe=me;stopLive();me=null;myEpoch=null;XM.store.set("xmas-sh-me",null);XM.store.set("xmas-sh-epoch",null);XM.store.set("xmas-sh-pin",null);
  document.querySelectorAll(".qov").forEach(n=>n.remove());render();alert(wasMe==="Carsyn"?"Done. Tap your face again to rejoin.":"The Gamemaker reset the phones. Tap your face to join again.")}
function showSlide(){
  const n=document.getElementById("tvn"),t=document.getElementById("tvt"),b=document.getElementById("tvb");if(!t){coach();return}
  if(!slide){t.textContent="Waiting for the Gamemaker...";b.textContent="";n.textContent="";return}
  n.textContent=slide.total?`${slide.n} / ${slide.total}`:"";t.textContent=slide.title||"";
  // tidy the slide text: drop emoji-only lines and stitch short fragments together
  {const L=String(slide.body||"").split("\n").map(x=>x.trim()).filter(x=>/[A-Za-z0-9]/.test(x)),out=[];
   for(const x of L){if(out.length&&(x.length<28||out[out.length-1].length<28))out[out.length-1]+=" · "+x;else out.push(x)}
   b.textContent=out.slice(0,6).join("\n")}
  const d=document.getElementById("tvdo");if(d)d.textContent=slide.todo?"👉 Right now: "+slide.todo:"";
  coach();
}
/* ---- 🎬 the Gamemaker's coach: what to do on the slide that's on the TV ---- */
function coachNote(id){
  const g=id.replace(/^(game|how|wheel|tie|order|idk)-/,""),k=(id.match(/^(game|how|wheel|tie|order|idk)-/)||[])[1];
  const N={lobby:"Leave this up while people arrive. Check the joined count. Press → when it's time.",title:"The announcer welcomes everyone. Wait for it.",welcome:"Read your speech: \"Citizens of the living room!\"",
    rules:"The announcer reads the rules. Let it finish.",phoneguide:"Phone guide: let it play, or tap Next to skip ahead.",lineup:"The 8 games. Press → when ready.",tributes:"All 12 tributes. Press →.",begin:"Your song plays. It stops when you press →.",
    halftime:"Games 1 to 4 victors and who's leading. Good time for a break or a twist.",victors:"Every victor. 2+ wins? Tap Reveal the Ultimate Victor (it reads how it's decided first). Then tap Next for the end-of-night slides.",
    "fin-predict":"Tap Next to reveal the predictions. Tap Next again to move on.","fin-awards":"Tap Next to start the awards. Each Next shows the next award, then moves on.",
    "fin-recap":"Tap Next to play the recap. It runs on its own; Next skips ahead.","fin-fallen":"Tap Next for the Fallen Tributes slideshow. It runs on its own; Next skips ahead.",
    "fin-crown":"Tap Next to crown the Ultimate Victor. Next again goes to the last slide.",
    end:"The end. Merry Thanksmas! The 🕯️ Fallen Tributes button is still here.","bingo-board":"Open the bingo board. Pick the round type (a briefing reads the pattern), tap each number, check BINGO card numbers."};
  if(N[id])return N[id];
  if(/^d\d+$/.test(id))return "Tribute profile. Let the announcer finish the weapon, strategy and odds, then →.";
  const by={game:{cookie:"Title slide. Good time to open bets (Phones tab) and start the arena clock (Show tab).",scoop:"Title slide. Open bets (Phones tab)?",tribute:"Click Play (new tab). Close it when the game ends.",feud:"Click Play (new tab). Close it when the game ends.",secrets:"Click Play (new tab). Close it when the game ends.",mitten:"Title slide.",lrc:"Title slide. Chips and dice ready?",bingo:"Title slide. Hand out cards and pens."},
    how:{cookie:"The announcer reads the steps.",scoop:"The announcer reads the steps.",bingo:"The announcer reads the steps."},
    wheel:{cookie:"Click SPIN THE WHEEL. Spin twice per face-off, tap who won. Winners go back on. Save the champion, close the tab.",scoop:"Same as Game 1, with a 30-second timer."},
    tie:{cookie:"Tie? Tap who tied (a briefing reads the tiebreaker). No tie: skip.",scoop:"Tie? Tap who tied. No tie: skip.",lrc:"Tie? Tap who tied. No tie: skip.",bingo:"Tie? Closest Call tiebreaker, or skip."},
    idk:{mitten:"The joke slide. Granny explains the rules.",lrc:"The joke slide. Mom explains the rules."},
    order:{mitten:"Tap to sit people out, then Shuffle. Everyone wins this one.",lrc:"Shuffle for the rolling order."}};
  return (by[k]&&by[k][g])||"";
}
function coach(){if(me!=="Carsyn")return;let c=document.getElementById("coach");const h=document.getElementById("host");if(!h)return;
  if(!c){c=document.createElement("div");c.className="card coach";c.id="coach";h.before(c)}
  if(!slide){c.innerHTML=`<div class="eyebrow">🎬 Your coach</div><div class="tiny" style="text-align:left">Start the show on the laptop and your next step shows here.</div>`;return}
  c.innerHTML=`<div class="eyebrow">🎬 Now on the TV · <b class="n">${slide.n||""} / ${slide.total||""}</b></div><div style="font-weight:800;margin:4px 0 2px">${esc(slide.title||"")}</div><div style="font-size:.95rem">👉 ${esc(coachNote(slide.id||"")||"Press → when ready.")}</div>`}
let pollN=0;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollN=0});   // coming back: next check is a full one
async function poll(){
  if(document.hidden){setTimeout(poll,4000);return}   // screen off or another app: don't use up database calls
  pollN++;try{const r=await fetch("/api/show?a=phone"+(me?"&me="+encodeURIComponent(me):"")+(pollN%3===1?"&full=1&pid="+encodeURIComponent(pid):""),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();const s=j.slide;if(!me&&Array.isArray(j.taken)){takenNames=j.taken;markTaken()}
    if(JSON.stringify(s)!==JSON.stringify(slide)){slide=s;showSlide()}
    if(me==="Carsyn"&&j.tvbtns!==undefined)tvCtl(j.tvbtns);
    if(me&&typeof j.epoch==="number"&&myEpoch!==null&&j.epoch>myEpoch){signedOut();return setTimeout(poll,2000)}   // the Gamemaker cleared all phones
    if(me&&myEpoch===null&&typeof j.epoch==="number"){myEpoch=j.epoch;XM.store.set("xmas-sh-epoch",myEpoch)}
    skew=(j.now||Date.now())-Date.now();if(j.points)points=j.points;if(j.qbUses!==undefined&&j.qbUses!==qbUses){qbUses=j.qbUses;qbShow()}online(true);showMyPoints();myQuest(j.quest);if(j.mission!==undefined)myMission(j.mission);vote=j.vote||null;bet=j.bet||null;hot=j.hot||null;mercy=j.mercy||null;predict=j.predict||null;myRace(j.race||null);myBday(j.bday||null);myAllRise(j.allrise||null);showExtras();if(me==="Carsyn"){hostRace=j.race||null;hostState()}}catch(e){online(false)}
  const busyNow=(quest&&quest.status==="live")||(race&&race.state==="live");
  const tvPop=me==="Carsyn"&&document.querySelector("#tvctl.tvpop");
  setTimeout(poll,fastPoll?(fastPoll=false,700):busyNow?1000:tvPop?1500:(vote||bet||mercy||hot||(predict&&predict.open))?2000:me==="Carsyn"?2000:3000);
}

/* ---- go live: send a small camera frame about twice a second for 20 seconds ---- */
let stream=null,liveUntil=0,liveTimer=0;
let liveStarting=false;
async function goLive(){
  const box=document.getElementById("live");if(stream||liveStarting)return;liveStarting=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480},height:{ideal:480}},audio:false})}
  catch(e){liveStarting=false;box.querySelector(".tiny").textContent="Camera blocked. Allow camera access for this site in your phone's settings, then try again.";return}
  liveStarting=false;
  liveUntil=Date.now()+20000;
  box.innerHTML=`<video autoplay playsinline muted></video><div class="eyebrow" id="lv" style="color:#ff8a7a">🔴 LIVE ON THE TV</div><button class="btn ghost" id="stop">Stop</button>`;
  const v=box.querySelector("video");v.srcObject=stream;box.querySelector("#stop").onclick=stopLive;
  const c=document.createElement("canvas");c.width=c.height=240;const x=c.getContext("2d");
  const send=async()=>{if(!stream)return;const left=Math.ceil((liveUntil-Date.now())/1000);
    if(left<=0){stopLive();return}
    const lv=document.getElementById("lv");if(lv)lv.textContent=`🔴 LIVE ON THE TV · ${left}s`;
    if(v.videoWidth){const s=Math.min(v.videoWidth,v.videoHeight);x.save();x.translate(240,0);x.scale(-1,1);
      x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,240,240);x.restore();
      await api({a:"cam",name:me,img:c.toDataURL("image/jpeg",.55)})}
    liveTimer=setTimeout(send,450)};
  send();
}
function stopLive(){
  clearTimeout(liveTimer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;if(me)api({a:"camoff",name:me})}
  const box=document.getElementById("live");if(box){box.innerHTML=`<button class="btn red" id="golive" style="width:100%;font-size:1.15rem">🎥 Go live on the TV</button><div class="tiny">Your camera shows on the TV for 20 seconds.</div>`;box.querySelector("#golive").onclick=goLive}
}
addEventListener("pagehide",stopLive);
["touchend","click"].forEach(t=>addEventListener(t,()=>{try{XM.ensureAudio()}catch(e){}},{passive:true}));
render();poll();
// keep our name claimed while the page is open
setInterval(()=>{if(me&&document.visibilityState==="visible")api({a:"join",name:me,epoch:myEpoch}).then(r=>{if(r.status===410)signedOut();else if(r.status===409){me=null;XM.store.set("xmas-sh-me",null);render()}})},20000);
</script>
