<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Golden songbird in a Santa hat">
  <!-- Original emblem for the Christmas Games: a golden songbird in a Santa hat, inside a ring with holly. -->
  <style>
    .wing{transform-origin:108px 108px;animation:flap 1.1s ease-in-out infinite alternate}
    .back{transform-origin:104px 110px;animation:flap2 1.1s ease-in-out infinite alternate}
    .pom{transform-origin:176px 62px;animation:bob 1.1s ease-in-out infinite alternate}
    .glint{animation:glint 3s ease-in-out infinite}
    @keyframes flap{from{transform:rotate(6deg)}to{transform:rotate(-10deg)}}
    @keyframes flap2{from{transform:rotate(-4deg)}to{transform:rotate(8deg)}}
    @keyframes bob{to{transform:translate(1px,4px)}}
    @keyframes glint{0%,70%,100%{opacity:0}80%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#e8b04b"/><stop offset="1" stop-color="#9a6c1c"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf74"/><stop offset="1" stop-color="#b9831f"/></linearGradient>
  </defs>
  <!-- ring -->
  <circle cx="100" cy="108" r="70" fill="none" stroke="url(#g)" stroke-width="10"/>
  <circle cx="100" cy="108" r="61" fill="none" stroke="#9a6c1c" stroke-width="1.5" opacity=".7"/>
  <!-- back wing -->
  <path class="back" fill="url(#g2)" stroke="#9a6c1c" stroke-width="1.2" d="M104 110C92 86 92 62 106 44c2 16 8 26 16 34-1-12 2-22 8-30 2 22-6 44-26 62z"/>
  <!-- tail feathers -->
  <path fill="url(#g2)" stroke="#9a6c1c" stroke-width="1.2" d="M72 126 30 150l14-14-18 2 18-10-14-4 42-6z"/>
  <path d="M66 128 38 144M64 124 34 130" stroke="#9a6c1c" stroke-width="1"/>
  <!-- body -->
  <path fill="url(#g)" stroke="#9a6c1c" stroke-width="1.4" d="M62 122c8-22 44-32 70-22 14 6 20 18 14 28-12 16-50 18-76 6-6-3-9-7-8-12z"/>
  <path d="M84 132c14 4 34 4 48-2M90 124c10 2 24 2 34-2" stroke="#b9831f" stroke-width="1.2" fill="none" opacity=".8"/>
  <!-- head, beak, eye -->
  <circle cx="142" cy="96" r="15" fill="url(#g)" stroke="#9a6c1c" stroke-width="1.4"/>
  <path d="M155 92 176 97 155 102z" fill="#b9831f" stroke="#7a5212" stroke-width="1"/>
  <circle cx="147" cy="93" r="2.6" fill="#2a1c05"/><circle cx="148" cy="92" r=".9" fill="#fff"/>
  <!-- front wing, raised -->
  <g class="wing">
    <path fill="url(#g)" stroke="#9a6c1c" stroke-width="1.4" d="M98 112C84 84 88 52 112 30c0 18 6 30 16 38 0-14 6-26 16-34-2 30-14 58-46 78z"/>
    <path d="M104 104c2-20 6-38 14-52M112 100c6-14 12-26 22-38M100 96c-2-16 0-30 6-44" stroke="#9a6c1c" stroke-width="1.1" fill="none" opacity=".75"/>
    <path class="glint" d="M110 44c4 10 6 20 4 30" stroke="#fffbe6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Santa hat -->
  <path fill="#c8312a" stroke="#7d1510" stroke-width="1.2" d="M128 86c0-18 18-30 40-26 8 2 10 4 8 6-10-2-18 2-22 10-2 4-3 8-3 12z"/>
  <path d="M136 80c6-8 16-12 28-12" stroke="#e0453a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="124" y="82" width="34" height="10" rx="5" fill="#fbf6ea" stroke="#d8cdb4" stroke-width="1" transform="rotate(-8 141 87)"/>
  <circle class="pom" cx="176" cy="64" r="7" fill="#fbf6ea" stroke="#d8cdb4" stroke-width="1"/>
  <!-- holly on the ring -->
  <g transform="translate(100 176)">
    <path d="M-6 0c-10-8-26-8-34 0 10 2 14 10 34 0z" fill="#3e8a52"/><path d="M6 0c10-8 26-8 34 0-10 2-14 10-34 0z" fill="#3e8a52"/>
    <path d="M-34-1c8-1 18-1 28 1M34-1c-8-1-18-1-28 1" stroke="#2c6a3c" stroke-width="1"/>
    <circle cx="-5" cy="-2" r="5.5" fill="#e0453a"/><circle cx="5" cy="-2" r="5.5" fill="#e0453a"/><circle cx="0" cy="-10" r="5.5" fill="#e0453a"/>
  </g>
</svg>
