  const m=document.createElement("div");m.className="moment unbox";document.body.appendChild(m);let alive=true;
  const close=m._close=()=>{alive=false;m.remove();announcer.stop();document.removeEventListener("keydown",key,true);refreshCorners();if(prev)XM.playSong(prev,true)};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}else if(e.key==="m"||e.key==="M"){e.preventDefault();e.stopPropagation();XM.toggleSound();if(!XM.sound&&window.speechSynthesis)speechSynthesis.cancel()}else if(["ArrowRight","ArrowLeft"," ","Enter"].includes(e.key)){e.preventDefault();e.stopPropagation()}};
  document.addEventListener("keydown",key,true);m.onclick=e=>e.stopPropagation();
  m.innerHTML=`<div class="inner"><div class="eb">${esc(GAMES[g].name)} · ${place===1?"🥇 1st place":"🥈 2nd place"} major award</div>
    ${XM.photo(who)?`<img src="${XM.photo(who)}" alt="" style="width:130px;height:130px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--gold)">`:""}
    <h1>${esc(who)}, open it!</h1><div class="gift">🎁</div>
    <div class="eb" style="font-size:1rem;color:var(--ink)">What's inside? The Capitol will judge.</div>
    <div style="font-weight:800;font-size:clamp(1rem,2vw,1.4rem);color:var(--gold)">✋ Touch it, it's yours. No shaking, no swapping.</div>
    <div class="row"><button class="btn rate" data-r="treasure">💎 Treasure</button><button class="btn rate" data-r="mystery">❓ Mystery</button><button class="btn red rate" data-r="junk">🗑️ Junk</button></div>
    <button class="btn ghost" id="u-x">Close (Esc)</button></div>`;
  XM.sfx("drumroll");announcer.say(`${XM.spoken(who)}... open your major award!`,null,{pitch:.1,rate:.82});
  const SAY={treasure:"Treasure! The Capitol approves!",mystery:"A mystery! Nobody knows what that is.",junk:"Junk! Better luck next year."};
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=e=>{e.stopPropagation();const r=b.dataset.r;const a=awards();a[akey]=r;XM.store.set("xmas-awards",a);
    m.querySelector(".gift").textContent=AWARD[r];m.querySelector(".gift").style.animation="popIn .6s both";
    announcer.stop();announcer.say(SAY[r],null,{pitch:.15,rate:.85});
    if(r==="junk")XM.sfx("trombone");else{XM.sfx("fanfare");XM.confetti(r==="treasure"?240:120,r==="treasure")}
    setTimeout(()=>alive&&close(),3500)});
  m.querySelector("#u-x").onclick=e=>{e.stopPropagation();close()};
}

/* ---------- victors board ---------- */
let editing=null,curSave=null;
function drawVictors(grid,anim){
  const V=XM.victors();
  grid.innerHTML=Object.entries(GAMES).map(([k,g],i)=>{
    const v=k==="mitten"?"everyone!":V[k]||"",ph=k!=="mitten"&&XM.photo(v),S2=XM.seconds();
    return `<div class="card vcard ${anim?(i%2?"fr":"fl"):""}" ${anim?d(.5+i*.18):""} data-v="${k}" style="--gc:${g.color}" ${k==="mitten"?'title="Mitten Mayhem: everyone wins"':""}>
      <div class="ic"><img src="${ICON(k+"-w")}" alt=""></div><div style="flex:1;min-width:0"><div class="gn">${esc(g.name)}</div>
      ${editing===k?`<input id="vin" list="tnames" value="${esc(v)}" placeholder="Type the winner, then Enter" autocomplete="off">`
        :`<div class="vn"><span class="lab">Victor:</span>${ph?`<img src="${ph}" alt="">`:""}<span>${esc(v)}</span>${awards()[k]?`<span title="Major award rating" style="margin-left:auto">${AWARD[awards()[k]]}</span>`:""}</div>`}
      ${k!=="mitten"&&k!=="bingo"?`<button class="sec2" data-second="${k}">🥈 ${S2[k]?`${XM.photo(S2[k])?`<img src="${XM.photo(S2[k])}" alt="">`:""}${esc(S2[k])}${awards()[k+"_2"]?" "+AWARD[awards()[k+"_2"]]:""}`:"Add 2nd place"}</button>`:""}</div></div>`}).join("")+
    `<datalist id="tnames">${XM.NAMES.map(n=>`<option value="${esc(n)}">`+(XM.aka&&XM.aka(n)?`<option value="${esc(XM.aka(n))}">`:"")).join("")}</datalist>`;
  grid.querySelectorAll("[data-d]").forEach(n=>n.style.setProperty("--d",n.dataset.d+"s"));
  grid.querySelectorAll("[data-second]").forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=e=>{e.stopPropagation();if(curSave)curSave();pickVictor(b.dataset.second,2)}});
  grid.querySelectorAll("[data-v]").forEach(c=>{
    // keep the open name box from losing focus on press, so the click lands on this card
    c.onmousedown=e=>{if(!e.target.closest("input"))e.preventDefault()};
    c.onclick=e=>{e.stopPropagation();const k=c.dataset.v;if(editing===k)return;if(curSave)curSave();
      if(k==="mitten"){XM.confetti(80);XM.sfx("sparkle");return}editing=k;XM.sfx("tap");drawVictors(grid)}});
  const inp=grid.querySelector("#vin");
  if(inp){inp.focus();inp.select();
    const k=editing;let done=false;curSave=()=>save();
    const save=()=>{if(done)return;done=true;curSave=null;if(editing===k)editing=null;let val=realName(inp.value);
      const was=XM.victors()[k]||"";XM.setVictor(k,val);drawVictors(grid);{const u=document.getElementById("ult");if(u&&!u.querySelector(".ultimate")){u.innerHTML="";revealUltimate(curEl)}}if(val&&val!==was){XM.sfx("fanfare");XM.confetti(120)}};
    inp.onkeydown=e=>{e.stopPropagation();if(e.key==="Enter"){e.preventDefault();save()}if(e.key==="Escape"){done=true;editing=null;drawVictors(grid)}};
    inp.onblur=()=>save();inp.onclick=e=>e.stopPropagation();}
}

/* ---------- who goes first (Mitten Mayhem, Left Right Capitol) ---------- */
function orderView(k,area,blurb,slideEl){
  const here=()=>curEl===slideEl;area.classList.add("noadv");
  const key="xmas-order-"+k,saved=XM.store.get(key,null);
  const present=XM.store.get("xmas-present",Object.fromEntries(XM.NAMES.map(n=>[n,true])));
  const draw=(order,reveal)=>{draw0(order,reveal);area.querySelectorAll("[data-d]").forEach(n=>n.style.setProperty("--d",n.dataset.d+"s"))};
  const draw0=(order,reveal)=>{
    if(!order){
      area.innerHTML=`<div class="fade" style="font-size:34px">${esc(blurb)}</div>
        <div class="eb fade">Tap a face to sit them out</div>
        <div class="ochips">${TRIBUTES.map((t,i)=>`<button class="ochip pop" ${d(.3+i*.05)} data-p="${esc(t.name)}" aria-pressed="${present[t.name]!==false}"><img src="${t.img}" alt="">${esc(t.name)}</button>`).join("")}</div>
        <button class="btn red bigbtn pop" ${d(1)} id="shuf">🔀 Shuffle the order</button>`;
      area.querySelectorAll("[data-p]").forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.dataset.p;present[n]=present[n]===false;XM.store.set("xmas-present",present);b.setAttribute("aria-pressed",present[n]!==false);XM.sfx(present[n]!==false?"tap":"untap")});
      area.querySelector("#shuf").onclick=e=>{e.stopPropagation();shuffleOrder()};
      return;
    }
    area.innerHTML=`<div class="ogrid" style="grid-template-columns:repeat(${order.length>8?6:Math.min(order.length,4)},220px)">${order.map((n,i)=>`<div class="oslot ${reveal?"":"pop"} ${i===0?"first":""}" ${reveal?"":d(i*.12)} data-i="${i}"><span class="num">${i+1}</span><img src="${XM.photo(n)}" alt=""><b>${esc(n)}</b></div>`).join("")}</div>
      <div class="row" style="display:flex;gap:16px;justify-content:center"><button class="btn red" style="font-size:26px" id="shuf">🔀 Shuffle again</button><button class="btn ghost" style="font-size:22px" id="who">Change who's playing</button></div>`;
    area.querySelector("#shuf").onclick=e=>{e.stopPropagation();shuffleOrder()};
    area.querySelector("#who").onclick=e=>{e.stopPropagation();XM.store.set(key,null);draw(null)};
  };
  const shuffleOrder=()=>{
    const names=XM.NAMES.filter(n=>present[n]!==false);if(names.length<2){XM.sfx("untap");return}
    const fin=names.slice();for(let i=fin.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[fin[i],fin[j]]=[fin[j],fin[i]]}
    XM.playSong("count");let n=0;
    const spin=setInterval(()=>{if(!here()){clearInterval(spin);return}const tmp=names.slice().sort(()=>Math.random()-.5);draw(tmp,true);area.querySelectorAll(".oslot").forEach(s=>s.classList.add("blur"));
      area.querySelectorAll("button").forEach(b=>b.disabled=true);XM.sfx("tick");
      if(++n>=22){clearInterval(spin);XM.stopSong();XM.store.set(key,fin);draw(fin,true);
        const slots=[...area.querySelectorAll(".oslot")];slots.forEach(s=>{s.style.opacity=0});
        slots.forEach((s,i)=>setTimeout(()=>{if(!here())return;s.style.opacity=1;s.animate([{transform:"scale(0) rotate(-30deg)"},{transform:"scale(1.2)"},{transform:"none"}],{duration:450,easing:"cubic-bezier(.2,1.4,.4,1)"});XM.sfx(i===0?"thud":"pop");if(i===0)shake()},300+i*260));
        setTimeout(()=>{if(here()){XM.sfx("fanfare");XM.confetti(140)}},300+slots.length*260)}},120);
  };
  draw(saved,false);
}

/* ---------- how-to videos ---------- */
// A video file on this laptop (picked with the button) wins; otherwise /videos/<name>.mp4 on the site; otherwise "coming soon".
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("xmas-videos",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=k=>idb().then(db=>new Promise(res=>{const q=db.transaction("v").objectStore("v").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})).catch(()=>null);
const idbPut=(k,v)=>idb().then(db=>new Promise(res=>{const t=db.transaction("v","readwrite");t.objectStore("v").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})).catch(()=>false);
const idbDel=k=>idb().then(db=>new Promise(res=>{const t=db.transaction("v","readwrite");t.objectStore("v").delete(k);t.oncomplete=()=>res(true)})).catch(()=>false);
async function loadVideo(k,box){
  const local=await idbGet(k);
  const pickBtn=(label)=>`<label class="btn ghost noadv" style="font-size:22px;cursor:pointer">${label}<input type="file" accept="video/*" hidden id="vpick"></label>`;
  const soon=()=>{box.innerHTML=`<div class="soon"><img src="${ICON("play")}" alt=""><div style="font-family:var(--display);font-size:64px;color:var(--gold)">Video coming soon</div>
      <div style="font-size:26px;color:var(--muted)">The tributes will have to wing it.</div>${pickBtn("📁 Add a video from this laptop")}</div>`;wirePick()};
  const wirePick=()=>{const i=box.querySelector("#vpick");if(i)i.onchange=async()=>{const f=i.files[0];if(!f)return;await idbPut(k,f);loadVideo(k,box)}};
  const show=(src,isLocal)=>{box.innerHTML=`<video controls playsinline preload="metadata" src="${src}"></video>${isLocal?`<div style="position:absolute;top:14px;right:14px;display:flex;gap:8px">${pickBtn("Swap video")}<button class="btn ghost noadv" id="vdel" style="font-size:18px">Remove</button></div>`:""}`;
    const v=box.querySelector("video");v.onplay=()=>XM.stopSong();
    if(!isLocal)v.onerror=()=>soon();wirePick();const del=box.querySelector("#vdel");if(del)del.onclick=async e=>{e.stopPropagation();await idbDel(k);loadVideo(k,box)}};
  if(local){show(URL.createObjectURL(local),true);return}
  show(`/videos/${VIDNAME[k]}.mp4`,false);
}

/* ---------- Fallen Tributes slideshow ---------- */
/* ---------- 📸 photos from phones: a polaroid pops up in the corner ---------- */
const photoCache=new Map();
async function photoImg(id){if(photoCache.has(id))return photoCache.get(id);
  try{const r=await fetch("/api/show?a=photo&id="+encodeURIComponent(id),{cache:"no-store"});if(!r.ok)return null;const j=await r.json();if(j.img)photoCache.set(id,j.img);return j.img||null}catch(e){return null}}
async function photoIn(x){photoImg(x.id)}  // phone photos stay hidden until the end of the night (end slide + Fallen Tributes); just cache the image

/* ---------- 🕯️ Fallen Tributes: a sad slideshow of tonight's photos ---------- */
const FALLEN_LINES=["Taken too soon. Mostly by the cookie.","Survived the Games. Did not survive the leftovers.","Never once read the rules. Respect.","Fought bravely. Lost to a mitten.",
 "Gone, but their trash talk lives on.","Bet everything. Kept nothing.","Their final words: it's not fair.","Outplayed by a 4-year-old card. Rest easy.","They died as they lived: arguing about points.",
 "Brought snacks to the arena. A true hero.","Too pure for the Capitol.","Last seen guarding the pie.","Sponsors are still not returning their calls."];
let mjCtx=null;
function mockingjay(){try{if(!XM.sound)return;mjCtx=mjCtx||new (window.AudioContext||window.webkitAudioContext)();const ac=mjCtx;if(ac.state!=="running")ac.resume();
  const t0=ac.currentTime+.05;[[784,.45],[932,.45],[880,.45],[587,.9]].reduce((t,[f,d])=>{const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();
    o.type="sine";o.frequency.value=f;v.frequency.value=6;vg.gain.value=f*.012;v.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.05);g.gain.setValueAtTime(.18,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g).connect(ac.destination);o.start(t);v.start(t);o.stop(t+d+.05);v.stop(t+d+.05);return t+d+.04},t0)}catch(e){}}
async function fallenTributes(){
  if(!started)return;closeMoments(".moment.twist");if(busy())return busyToast();
  document.querySelectorAll(".phtoast").forEach(n=>n.remove());
  let adv=0;const {m,T,close}=openMoment("fallen");SNOW.set(.5);m.onClose=()=>{SNOW.set(1);clearTimeout(adv)};
  m.innerHTML=`<div class="eb2" style="letter-spacing:.5em;color:#c9c2b0;font-weight:800">🕯️ GATHERING THE FALLEN...</div>`;
  XM.playSong("dirge",true);
  // tonight's photos: phones (from the server) + the TV photo booth (this laptop)
  let list=[];try{const j=await (await fetch("/api/show?a=photos",{cache:"no-store"})).json();list=(j.photos||[]).filter(p=>XM.NAMES.includes(p.name))}catch(e){}
  // one photo per tribute: a random one of the photos they took tonight, or their profile photo if they took none
  const items=[];
  for(const t of TRIBUTES){if(!m.isConnected)return;const mine=list.filter(p=>p.name===t.name);let img=null;
    while(mine.length&&!img){const p=mine.splice(Math.floor(Math.random()*mine.length),1)[0];img=await photoImg(p.id)}
    items.push({img:img||t.full||t.img,name:t.name})}
  if(!m.isConnected)return;
  const lines=[...FALLEN_LINES].sort(()=>Math.random()-.5);let i=-1;
  const card=k=>{const x=items[k],t=x.name&&TRIBUTES.find(z=>z.name===x.name),fx=t&&DISTRICT_FX[t.d];
    return `<div class="fl"><div class="pol" style="--r:${k%2?3.5:-4}deg"><img src="${x.img}" alt="" onerror="this.src='/xmas/emblem.png'"><b>${x.name?esc(XM.dn(x.name)):"The Capitol Photo Booth"}</b></div>
      <div class="txt"><div class="eb2">${x.name?"FALLEN TRIBUTE":"FALLEN TRIBUTES"}</div><h1>${x.name?esc(XM.dn(x.name)):"Captured on camera"}</h1>
      ${t?`<div class="dist">DISTRICT ${t.d}${fx?" · "+fx.ind:""}</div>`:x.cap?`<div class="dist">${esc(XM.nick(x.cap.replace(/^🏆 /,"")))}</div>`:""}<div class="line">${esc(lines[k%lines.length])}</div></div></div>`};
  const group=()=>`<div class="grp"><div class="eb2">🕯️ IN LOVING MEMORY OF TONIGHT</div><div class="faces">${TRIBUTES.map(t=>`<img src="${t.img}" alt="">`).join("")}</div>
      <h1>May the odds be ever in your favor.</h1><div class="line" style="text-align:center">See you at the 2027 Games.</div></div>`;
  const bar=`<div class="bar"><button class="btn ghost" id="flprev">◀ Back</button><button class="btn ghost" id="flnext">Next ▶</button><button class="btn ghost" id="flx">Close (Esc)</button></div>`;
  const show=k=>{if(!m.isConnected)return;clearTimeout(adv);i=Math.max(0,Math.min(items.length,k));
    if(i===items.length){m.innerHTML=group()+bar;mockingjay();announcer.say("May the odds be ever in your favor. See you at the 2027 Games.",null,{rate:.85,pitch:.6})}
    else{m.innerHTML=card(i)+bar;XM.sfx("cannon");if(i===0)T(mockingjay,1200);adv=setTimeout(()=>show(i+1),7000)}
    m.querySelector("#flprev").onclick=e=>{e.stopPropagation();show(i-1)};m.querySelector("#flnext").onclick=e=>{e.stopPropagation();show(i+1)};m.querySelector("#flx").onclick=e=>{e.stopPropagation();close()}};
  const key=e=>{if(!m.isConnected){document.removeEventListener("keydown",key,true);return}
    if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter")show(i+1);else if(e.key==="ArrowLeft")show(i-1)};
  document.addEventListener("keydown",key,true);
  m.innerHTML=`<div class="grp"><div class="eb2">🕯️ A MOMENT OF SILENCE</div><h1>Let us remember the fallen.</h1><div class="line" style="text-align:center">Tributes, please rise.</div></div>`+bar;
  m.querySelector("#flprev").onclick=e=>{e.stopPropagation()};m.querySelector("#flnext").onclick=e=>{e.stopPropagation();show(0)};m.querySelector("#flx").onclick=e=>{e.stopPropagation();close()};
  announcer.say("Tributes, please rise. Let us remember the fallen.",null,{rate:.82,pitch:.6});adv=setTimeout(()=>show(0),5500);
}
function memorial(){
  const m=document.createElement("div");m.className="memorial";
  m.innerHTML=[1,2,3,4,5,6].map((i,j)=>`<div class="ph" style="--r:${j%2?3:-3}deg"><div class="pola"><img src="/xmas/past/past${i}.jpg" alt=""></div></div>`).join("")+
    `<div class="cap">The 2025 Christmas Games. Gone, but never forgotten.</div><button class="btn ghost x">✕ Close (Esc)</button>`;
  document.body.appendChild(m);XM.playSong("dirge",true);SNOW.set(.6);
  const ph=[...m.querySelectorAll(".ph")];let i=0;const show=()=>{ph.forEach((p,j)=>p.classList.toggle("on",j===i))};
  setTimeout(show,100);const t=setInterval(()=>{i=(i+1)%ph.length;show()},7000);
  const close=()=>{clearInterval(t);m.remove();XM.stopSong();SNOW.set(1);document.removeEventListener("keydown",key,true)};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}
    else if(["ArrowRight","ArrowLeft"," "].includes(e.key)){e.preventDefault();e.stopPropagation();i=(i+(e.key==="ArrowLeft"?ph.length-1:1))%ph.length;show()}};
  document.addEventListener("keydown",key,true);
  m.querySelector(".x").onclick=e=>{e.stopPropagation();close()};
}
