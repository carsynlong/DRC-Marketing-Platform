<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Night Check</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
body{min-height:100%;overflow-x:hidden}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:40px 16px 50px;display:grid;gap:16px}
h1.t{font-family:var(--display);font-weight:400;color:var(--gold);text-shadow:0 4px 0 var(--red-d);font-size:clamp(2rem,5vw,3rem);margin:0;text-align:center}
.sub{text-align:center;color:var(--muted);margin-top:-6px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:rgba(22,48,42,.95);border-radius:16px;padding:12px 16px;box-shadow:0 0 0 1px var(--line)}
.row .s{font-size:1.8rem;text-align:center}
.row b{display:block;font-size:1.05rem}
.row span{color:var(--muted);font-size:.92rem}
.row .fix{color:#ffb4a8}
.row button{font:800 .9rem "Outfit",sans-serif;border:0;border-radius:999px;padding:8px 14px;background:var(--gold);color:#13271f;cursor:pointer;white-space:nowrap}
.sum{text-align:center;font-family:var(--display);font-size:1.6rem;color:var(--gold);min-height:1.2em}
video{width:220px;border-radius:14px;display:block;margin-top:8px;transform:scaleX(-1)}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="wrap">
  <img src="/xmas/emblem.png" alt="" style="width:80px;justify-self:center">
  <h1 class="t">Game Night Check</h1>
  <div class="sub">Open this on the TV laptop, in Chrome, on the day. Green means good to go.</div>
  <div class="sum" id="sum">Checking...</div>
  <div id="list" style="display:grid;gap:10px"></div>
  <button class="btn red" id="again" style="justify-self:center">↻ Check again</button>
</div>
<script src="/xmas/xmas.js"></script>
<script>
/* 🩺 one page that checks everything the show needs, with what to do if something's off */
document.getElementById("lights").outerHTML=XM.lights(14);
XM.snow(document.getElementById("snow"));
const {esc}=XM;
const CHECKS=[
 {id:"browser",t:"Browser",run:async()=>/Chrome\//.test(navigator.userAgent)&&!/Edg\//.test(navigator.userAgent)?[true,"Chrome. Perfect."]:[false,"Not Chrome.","Open the show in Google Chrome. The voices and sound work best there."]},
 {id:"net",t:"Internet",run:async()=>{try{const r=await fetch("/api/show?a=phone",{cache:"no-store"});return r.ok?[true,"Connected."]:[false,"The site answered with an error.","Reload this page. If it keeps failing, the phone extras will be off but the show still works."]}catch(e){return [false,"No internet.","Connect the laptop to Wi-Fi. The show itself still works offline, but phones won't."]}}},
 {id:"db",t:"Phone database",run:async()=>{try{const j=await (await fetch("/api/show?a=ping",{cache:"no-store"})).json();return j.ok?[true,`Working (${j.ms} ms). ${j.joined} phone${j.joined===1?"":"s"} joined right now.`]:[false,"Can't save.","The online database isn't answering. Check the Upstash/Vercel dashboard (it may be out of free requests)."]}catch(e){return [false,"Can't reach it.","Check the internet first."]}}},
 {id:"pin",t:"Gamemaker PIN",run:async()=>{let pin=null;try{pin=localStorage.getItem("xmas-host-pin")}catch(e){}
   if(!pin)return [false,"Not unlocked on this laptop yet.","Open /host and unlock Side quests with your PIN, or click Fix and type it here.",async()=>{const v=prompt("Gamemaker PIN:");if(v){try{localStorage.setItem("xmas-host-pin",v)}catch(e){}}run()}];
   try{const r=await fetch("/api/show",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({a:"pin",pin})});return r.ok?[true,"Unlocked. Twists, points and quests will work from this laptop."]:[false,"The saved PIN is wrong.","Click Fix and type the right PIN.",async()=>{const v=prompt("Gamemaker PIN:");if(v){try{localStorage.setItem("xmas-host-pin",v)}catch(e){}}run()}]}catch(e){return [false,"Couldn't check.","Check the internet first."]}}},
 {id:"screen",t:"TV screen",run:async()=>{const w=screen.width*devicePixelRatio,h=screen.height*devicePixelRatio;return w>=1900?[true,`${Math.round(w)} x ${Math.round(h)}. Looks like the TV.`]:[null,`${Math.round(w)} x ${Math.round(h)}. This looks like the laptop screen.`,"That's fine for testing. On game night, plug in the TV (Mirror or Extend) and open the show on the TV screen, then press F for fullscreen."]}},
 {id:"sound",t:"Sound",run:async()=>[null,"Click Test, then listen for a fanfare.","No sound? Turn up the laptop and the TV volume, and make sure sound goes to the TV (HDMI).",()=>{XM.ensureAudio();XM.setSound(true);XM.sfx("fanfare")}]},
 {id:"voice",t:"Announcer voice",run:async()=>{const v=window.speechSynthesis?speechSynthesis.getVoices():[];
   return window.speechSynthesis?[v.length?true:null,v.length?`${v.length} voices ready. Click Test to hear it.`:"Voices still loading. Click Test.","No voice? Use Chrome, and check the volume.",()=>{XM.ensureAudio();XM.say?XM.say("Welcome, tributes. The Game maker is ready.",null,{rate:.9}):speechSynthesis.speak(new SpeechSynthesisUtterance("Welcome, tributes. The Game maker is ready."))}]:[false,"This browser can't talk.","Use Chrome."]}},
 {id:"cam",t:"Laptop camera (live broadcast and photo booth)",run:async()=>[null,"Click Test. Chrome will ask to use the camera: click Allow.","Blocked? Click the camera icon in Chrome's address bar and choose Allow.",async row=>{try{const s=await navigator.mediaDevices.getUserMedia({video:true});const v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.srcObject=s;row.querySelector(".d").appendChild(v);setTimeout(()=>s.getTracks().forEach(t=>t.stop()),8000);setStatus(row,true,"Camera works.")}catch(e){setStatus(row,false,"Camera blocked or missing.")}}]},
 {id:"offline",t:"Offline backup",run:async()=>navigator.serviceWorker&&navigator.serviceWorker.controller?[true,"Installed. If the Wi-Fi drops, the show keeps working."]:[null,"Not installed yet.","Open the show (/show) once, then come back here and Check again."]},
 {id:"phones",t:"Phones",run:async()=>[null,"Have someone scan the QR code on the show and tap their face.",`They should see "Now on the TV". Their face lights up in the lobby on the TV.`]},
];
function setStatus(row,ok,txt){row.querySelector(".s").textContent=ok===true?"✅":ok===false?"❌":"🟡";row.querySelector(".m").textContent=txt;summary()}
function summary(){const all=[...document.querySelectorAll(".row .s")].map(x=>x.textContent);const bad=all.filter(x=>x==="❌").length,maybe=all.filter(x=>x==="🟡").length;
  document.getElementById("sum").textContent=bad?`❌ ${bad} thing${bad>1?"s":""} to fix`:maybe?`🟡 ${maybe} thing${maybe>1?"s":""} to test by hand`:"✅ Ready for game night!"}
async function run(){
  const list=document.getElementById("list");list.innerHTML="";document.getElementById("sum").textContent="Checking...";
  for(const c of CHECKS){const row=document.createElement("div");row.className="row";row.innerHTML=`<div class="s">⏳</div><div class="d"><b>${esc(c.t)}</b><span class="m"></span><div><span class="fix"></span></div></div><div class="a"></div>`;list.appendChild(row);
    let r;try{r=await c.run()}catch(e){r=[false,"Check failed."]}const [ok,msg,fix,act]=r;
    row.querySelector(".s").textContent=ok===true?"✅":ok===false?"❌":"🟡";row.querySelector(".m").textContent=" "+msg;if(fix&&ok!==true)row.querySelector(".fix").textContent=fix;
    if(act){const b=document.createElement("button");b.textContent=ok===false?"Fix":"Test";b.onclick=()=>act(row);row.querySelector(".a").appendChild(b)}}
  summary()}
document.getElementById("again").onclick=run;
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
run();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/xmas-sw.js").catch(()=>{});
</script>
</body>
</html>
