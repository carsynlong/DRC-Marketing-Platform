<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>District Secrets · Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Special+Elite&family=Manrope:wght@500;700;800&display=swap">
<style>
/* District Secrets, the phone. Your name, your sealed guess, nobody else's. */
:root{
  --night:#0b0a14; --plum:#1b1328; --plum-2:#251a36;
  --wax:#a3182b; --wax-hi:#d8393f; --wax-d:#5e0a17;
  --gold:#d9b25f; --gold-hi:#f6dfa0; --gold-d:#8a6a26;
  --pine:#1f5a40; --parch:#efe2c4; --parch-d:#c9b385; --parch-ink:#2b1d12;
  --ink:#f4ecdb; --muted:#ab9fbe; --good:#86e0a8; --bad:#ff8f80; --line:rgba(244,236,219,.14);
  --deco:"Cinzel Decorative","Cinzel",Georgia,serif; --display:"Cinzel",Georgia,serif;
  --type:"Special Elite","Courier New",monospace; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:18px;overflow-x:hidden;min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(ellipse 90% 45% at 50% -10%,rgba(163,24,43,.55),transparent 70%),radial-gradient(ellipse 80% 40% at 50% 115%,rgba(217,178,95,.15),transparent 70%)}
#sky,#fx{position:fixed;inset:0;pointer-events:none}#sky{z-index:0}#fx{z-index:6}
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2{font-family:var(--display);font-weight:900;margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--muted);font-weight:800}
.btn{background:linear-gradient(180deg,var(--wax-hi),var(--wax));color:#fff;font-weight:800;padding:.9em 1.4em;border-radius:14px;font-size:1.2rem;box-shadow:0 4px 0 var(--wax-d);min-height:60px;width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wax-d)}
.btn:disabled{opacity:.45}

/* top strip: you */
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(27,19,40,.9);border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.me .who{display:flex;align-items:center;gap:10px;min-width:0}
.me .av{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold);flex:none}
.me .nm{font-weight:800;font-size:1.1rem;overflow-wrap:anywhere;line-height:1.1}
.me .pts{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.me .pts small{display:block;color:var(--muted);font-weight:700;font-size:.72rem}
.me .pts.bump{animation:bump .7s}

/* centered screens */
.msg{flex:1;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:8px 0;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.msg .icon{font-size:4.4rem;line-height:1;animation:bob 1.4s ease-in-out infinite alternate}
.msg h1{font-size:clamp(1.9rem,9vw,2.5rem);color:var(--gold-hi);text-shadow:0 3px 0 var(--wax-d)}
.msg p{margin:0;max-width:30ch;line-height:1.45;color:var(--muted)}
.msg .said{font-family:var(--type);font-size:1.2rem;color:var(--ink)}
.right h1{color:var(--good)}.wrong h1{color:var(--bad)}
.right .icon{animation:spinin .8s cubic-bezier(.2,1.5,.4,1) both,bob 1.4s .8s ease-in-out infinite alternate}
.wrong .icon,.wrong h1{animation:shake .45s 2}
.big{font-family:var(--deco);font-size:clamp(3rem,15vw,4.4rem);color:var(--gold-hi);text-shadow:0 4px 0 var(--wax-d)}

/* sign in */
.signin{display:grid;gap:6px;text-align:center;padding-top:8px}
.signin h1{font-family:var(--deco);font-size:clamp(2rem,10vw,2.8rem);background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.signin p{margin:0;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick>button:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}   /* 12 tributes + the Gamemaker: the last name sits in the middle */
.pick button{min-height:62px;border-radius:12px;background:var(--parch);color:var(--parch-ink);font-family:var(--type);font-size:1.15rem;padding:8px;overflow-wrap:anywhere;
  box-shadow:0 4px 0 var(--parch-d),0 8px 16px rgba(0,0,0,.35);animation:rise .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*40ms)}
.pick button:nth-child(odd){transform:rotate(-1deg)}.pick button:nth-child(even){transform:rotate(1deg)}
.pick button:active{background:var(--gold-hi)}
.pick button:disabled{opacity:.3;cursor:not-allowed}
.pick button small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:#6b5233}

/* your tribute card */
.card{position:relative;width:min(88%,330px);background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:18px 18px 22px;text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 0 50px rgba(120,80,30,.3);animation:deal .9s cubic-bezier(.2,1.3,.4,1) both;transform:rotate(-2deg)}
.card .eyebrow{color:#6b5233}
.card img{width:62%;aspect-ratio:1;border-radius:50%;object-fit:cover;margin:10px auto 8px;display:block;box-shadow:0 0 0 5px var(--gold),0 0 0 9px var(--wax)}
.card .nm{font-family:var(--deco);font-size:clamp(1.7rem,8vw,2.3rem);line-height:1.05;overflow-wrap:anywhere}
.card .seal{position:absolute;right:-14px;bottom:-14px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--wax-hi),var(--wax) 60%,var(--wax-d));
  display:grid;place-items:center;font-size:1.8rem;box-shadow:0 6px 12px rgba(0,0,0,.5);animation:press .5s .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes deal{from{transform:translateY(80px) rotate(-18deg) scale(.6);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes press{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}

/* the secret + your guess */
.file{background:var(--parch);color:var(--parch-ink);border-radius:4px;padding:14px 16px 16px;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 40px rgba(120,80,30,.3);transform:rotate(-.8deg);position:relative;animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
.file .hdr{font-family:var(--type);font-size:.75rem;letter-spacing:.08em;color:#6b5233;border-bottom:2px dashed rgba(80,50,20,.3);padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between}
.file p{margin:0;font-family:var(--type);font-size:1.2rem;line-height:1.3}
.gift{display:inline-block;background:linear-gradient(90deg,var(--wax),var(--wax-hi));color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;padding:.4em .9em;border-radius:999px;box-shadow:0 0 0 2px var(--gold);animation:bump 1.1s ease-in-out infinite alternate}
.guess{display:grid;gap:12px;margin-block:auto;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.guess label{font-family:var(--deco);font-size:clamp(1.8rem,9vw,2.4rem);color:var(--gold-hi);text-align:center;text-shadow:0 3px 0 var(--wax-d)}
.guess input{font-family:var(--type);font-size:1.6rem;background:rgba(239,226,196,.08);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:.55em .7em;width:100%;text-align:center;-webkit-user-select:text;user-select:text}
.guess input:focus{outline:none;border-color:var(--gold)}
.guess .hint{text-align:center;color:var(--muted);font-size:.85rem;margin:0}
.mine{background:rgba(163,24,43,.25);border-radius:14px;padding:12px 14px;text-align:center;box-shadow:inset 0 0 0 2px var(--wax-hi);animation:pop .5s both}
.mine b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--gold-hi)}
.mine span{color:var(--ink);font-size:.95rem}
/* sealed! */
.envelope{width:min(70%,240px);margin:0 auto;animation:fly .9s cubic-bezier(.2,1.3,.4,1) both}
.envelope .wx{transform-box:fill-box;transform-origin:center;animation:press .45s .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fly{from{transform:translateY(60px) rotate(-10deg) scale(.7);opacity:0}to{transform:none;opacity:1}}

.sound{display:flex;justify-content:center}
.sound button{font-weight:800;font-size:.9rem;padding:.55em 1.1em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.switch{display:block;margin:0 auto;color:var(--muted);font-weight:800;font-size:.95rem;padding:.7em 1.2em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);min-height:48px}
.toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));background:var(--wax);color:#fff;font-weight:800;border-radius:14px;padding:14px;text-align:center;box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(0,0,0,.4);z-index:7}
.offline{text-align:center;font-size:.85rem;font-weight:800;color:#2a1a05;background:var(--gold);border-radius:999px;padding:.35em 1em}
.onfire{font-family:var(--display);font-size:1.4rem;color:#ffb02e;animation:bump .8s infinite alternate}
.win h1{background:linear-gradient(90deg,var(--gold),#fff6d6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shimmer 1.6s linear infinite;text-shadow:none}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{opacity:1}}
@keyframes bob{to{transform:translateY(-10px) rotate(5deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}to{transform:none}}
@keyframes shake{25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
/* emoji reactions: tap to send them flying across the TV */
.reacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(27,19,40,.85);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1px var(--line)}
.reacts .lbl{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.reacts button{display:grid;justify-items:center;gap:2px;font-size:1.9rem;min-height:66px;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.04);transition:transform .1s;line-height:1}
.reacts button small{font-size:.62rem;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.reacts button:active{transform:scale(.85);background:rgba(217,178,95,.2)}
.fly{position:fixed;font-size:2.4rem;pointer-events:none;z-index:8;animation:fly2 1s ease-out forwards}
@keyframes fly2{to{transform:translate(var(--dx),-55vh) scale(1.4) rotate(var(--rot));opacity:0}}
.note{font-weight:800;color:var(--gold-hi)}
/* who's in the lead: a strip under your name, and a mini leaderboard on the score screens */
.lead{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:-6px;font-weight:800;font-size:.88rem;color:var(--muted)}
.lead img{width:24px;height:24px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
.lead b{color:var(--gold-hi)}
.lead{max-width:100%;flex-wrap:wrap}
.lead.mine{color:var(--gold-hi);animation:bump 1.2s ease-in-out infinite alternate}
.mini{display:grid;gap:6px;background:rgba(27,19,40,.85);border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line);animation:rise .5s .2s both}
.mini .lbl{text-align:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.mr{display:grid;grid-template-columns:1.6em 32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;font-weight:800}
.mr .rk{font-family:var(--deco);color:var(--gold-hi);text-align:center}
.mr img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.mr .nm{overflow-wrap:anywhere}.mr .pt{font-variant-numeric:tabular-nums}
.mr.me{background:rgba(217,178,95,.16);box-shadow:inset 0 0 0 2px var(--gold)}
.mr.gap{padding:0;text-align:center;color:var(--muted);display:block;font-size:.8rem}
.awards{display:grid;gap:8px;width:100%}
.award{display:flex;align-items:center;gap:10px;background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:8px 12px;text-align:left;font-weight:700;font-size:.95rem}
.award.me{box-shadow:0 0 0 3px var(--gold),0 0 20px rgba(217,178,95,.5)}
.award .ic{font-size:1.6rem}.award b{display:block;font-family:var(--display);color:var(--wax);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
/* write a bonus secret */
.write{display:grid;gap:8px;background:var(--parch);color:var(--parch-ink);border-radius:6px;padding:12px 14px;box-shadow:0 10px 22px rgba(0,0,0,.45);transform:rotate(-.6deg)}
.write b{font-family:var(--display);color:var(--wax);font-size:.95rem;letter-spacing:.04em;padding-right:34px}
.write{position:relative}
.write .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;background:rgba(107,82,51,.14);color:#6b5233;font-size:1.1rem;font-weight:800;line-height:1}
.write .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.write .two button{min-height:46px;border-radius:12px;font-weight:800;font-size:.95rem;background:#e7dcc4;color:#6b5233;box-shadow:0 3px 0 #c9b385}
.write p{margin:0;font-size:.85rem;color:#6b5233}
.write textarea{font-family:var(--type);font-size:1.05rem;border:2px dashed #c9b385;border-radius:6px;background:rgba(255,255,255,.4);padding:8px;min-height:74px;resize:vertical;color:var(--parch-ink);-webkit-user-select:text;user-select:text}
.write .btn{min-height:48px;font-size:1rem}
.write .done{font-family:var(--type)}
.linkish{color:#6b5233;text-decoration:underline;font-size:.85rem;justify-self:start}
/* sponsor bet */
.bet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bet .lbl{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bet button{display:grid;gap:2px;justify-items:center;padding:8px 4px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:.95rem;line-height:1.15}
.bet button span{font-size:1.5rem}.bet button small{font-size:.68rem;color:var(--muted);font-weight:700}
.bet button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(217,178,95,.14)}
.bet button.allin[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--wax-hi);background:rgba(163,24,43,.3)}
.betnote{font-weight:800;color:var(--gold-hi)}
/* story votes */
.rate{display:grid;gap:10px;width:100%}
.rate button{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:1.25rem;background:rgba(27,19,40,.8)}
.rate button span{font-size:2.2rem}
.rate button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(217,178,95,.16);animation:bump .5s}
.hot{width:min(60%,220px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--gold-hi),0 0 40px 10px rgba(255,240,190,.3)}
/* How to play on the phone: one short card per rule, grouped, appearing as the TV reads them */
.rules{display:grid;gap:8px}
.rules .sec{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:8px 0 0 4px}
.pstep{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;background:rgba(27,19,40,.9);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line);animation:rise .45s cubic-bezier(.2,1.3,.4,1) both}
.pstep .e{font-size:2.1rem;text-align:center;line-height:1}
.pstep b{display:block;font-size:1.12rem;color:var(--ink)}
.pstep .ln{display:block;font-size:.98rem;line-height:1.35;color:var(--muted);min-height:1.35em}
.pstep.on{background:var(--parch);box-shadow:0 0 0 3px var(--gold-hi),0 10px 24px rgba(0,0,0,.5)}
.pstep.on b{color:var(--wax)}.pstep.on .ln{color:var(--parch-ink)}
.pstep.wait{opacity:.22;animation:none}.pstep.wait .ln{visibility:hidden}
.pstep .ln i{display:inline-block;width:.45em;border-bottom:2px solid currentColor;animation:blink .8s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.progress{display:flex;gap:5px;justify-content:center}.progress i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}.progress i.on{background:var(--gold-hi)}
/* 🔑 host tools (Carsyn's phone only) */
#hostbtn{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:11;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#2a1a05;font-weight:800;border-radius:999px;padding:.7em 1.1em;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#hostbtn b{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;margin-left:.4em;border-radius:999px;background:var(--wax);color:#fff;font-size:.8em}
#rulesbtn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:13;background:rgba(27,19,40,.92);color:var(--ink);font-weight:800;font-size:.85rem;border-radius:999px;padding:.6em .95em;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(0,0,0,.5)}
body.hasrules .app{padding-bottom:76px}   /* a class, not :has(), for older iPhones */
#rulesbox{position:fixed;inset:0;z-index:12;background:rgba(11,10,20,.97);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 90px}
#rulesbox .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
#rulesbox h2{font-family:var(--deco);color:var(--gold-hi);margin:0}
#rulesbox .sec{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-top:6px}
#rulesbox .r{display:grid;grid-template-columns:2em 1fr;gap:10px;align-items:start;background:var(--plum);border-radius:12px;padding:10px 12px;line-height:1.35}
#rulesbox .r .e{font-size:1.5rem;line-height:1}#rulesbox .r b{display:block;color:var(--ink)}#rulesbox .r span span{color:var(--muted);font-size:.92rem}
#rulesbox .close{position:sticky;bottom:0;margin-top:8px}
#hosttools{position:fixed;inset:0;z-index:10;background:rgba(11,10,20,.97);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 90px}
#hosttools .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
#hosttools h2{font-family:var(--display);color:var(--gold-hi);margin:0}
#hosttools .hcard{background:var(--parch);color:var(--parch-ink);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
#hosttools .hcard.skipped{opacity:.55}
#hosttools .tag{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2em .7em;border-radius:999px;justify-self:start}
#hosttools .new .tag{background:#f6dfa0}#hosttools .approved .tag{background:#bfe9cc}#hosttools .skipped .tag{background:#e7c9c9}
#hosttools .t{font-family:var(--type);font-size:1.15rem;line-height:1.3}
#hosttools .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#hosttools .row button{padding:.75em;border-radius:10px;font-weight:800}
#hosttools .ok{background:#2e7a52;color:#fff}#hosttools .no{background:#e7dcc4;color:#6b5233}
/* the last 10 seconds, and TIME'S UP */
.hurry{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wax);color:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:1.05rem;box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,40,40,.6);animation:hpulse .5s ease-in-out infinite alternate}
body.hurrying #hurry{display:none}   /* the big red bar at the top is already counting down */

<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="app" id="app"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden></div>
<script src="/ambient.js"></script>
<script src="/howto.js"></script>
<script src="/memes.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
/* same as the TV: lets this phone know a secret is its own without the answer being sent */
const ownTag=(gid,qi,name)=>{let h=5381;for(const c of `${gid}|${qi}|${name}`)h=((h<<5)+h+c.charCodeAt(0))|0;return (h>>>0).toString(36)};
const ENV=`<svg class="envelope" viewBox="0 0 64 46" aria-hidden="true"><rect x="1" y="1" width="62" height="44" rx="3" fill="#efe2c4" stroke="#c9b385" stroke-width="2"/>
 <path d="M2 3l30 22L62 3" fill="none" stroke="#c9b385" stroke-width="2"/>
 <g class="wx"><circle cx="32" cy="25" r="9" fill="#a3182b"/><circle cx="32" cy="25" r="6" fill="none" stroke="#5e0a17" stroke-width="1.5"/><path d="M32 20.5l1.4 3h3l-2.4 2 1 3.1-3-1.9-3 1.9 1-3.1-2.4-2h3z" fill="#f6dfa0"/></g></svg>`;

/* this phone's id, kept so a reload gets the same name back */
const BUILD="ds-build-2026-11-26-3";   // must match the TV; when the TV is newer, this page reloads itself
let pid=store.get("ds-pid");
if(!pid){pid=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);store.set("ds-pid",pid)}
let myName=store.get("ds-name");
let D={game:undefined,me:null,taken:[],myAnswer:null},pending=null,offline=0,timer=0,lastKey="",shownScore=0;
let sound=store.get("ds-sound")!=="off";

async function poll(){
  clearTimeout(timer);if(document.hidden)return;
  try{
    const r=await fetch(`/api/state?g=ds&pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(myName||"")}`,{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    D=await r.json();offline=0;
    if(D.me!==myName){myName=D.me;store.set("ds-name",myName)}
    if(D.game?.v&&D.game.v!==BUILD&&store.get("ds-reloaded")!==D.game.v){store.set("ds-reloaded",D.game.v);location.reload();return}
    if(pending&&D.game&&(pending.gid!==D.game.gid||pending.qi!==D.game.qi||D.myAnswer))pending=null;
    // ↺ the TV started completely over: forget the bonus secret and two truths and a lie this phone wrote (the server wiped them)
    if(D.game?.wiped&&store.get("ds-wiped")!==String(D.game.wiped)){store.set("ds-wiped",String(D.game.wiped));
      ["ds-mysecret","ds-nobonus","ds-ttl","ds-nottl"].forEach(k=>store.set(k,null));
      mySecret="";editing=false;declined=false;myTTL=null;ttlEdit=false;ttlNo=false;lastKey=""}
  }catch(e){offline++}
  // quick while a clock runs or a vote is open; every 3 seconds the rest of the time
  render();timer=setTimeout(poll,["question","ready","interro","story","likely","showdown","scspin"].includes(D.game?.phase)?1500:3000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({g:"ds",pid,...body})});
  return {status:r.status,data:await r.json().catch(()=>({}))};
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3400)}
async function join(name){
  sfx("tap");
  try{const {status,data}=await post("/api/join",{name});
    if(status===200){myName=data.me;store.set("ds-name",myName)}
    else if(status===409)toast(`Someone already signed in as ${name}. If that's really you, ask the host.`);
    else toast("Couldn't sign in. Try again.");
  }catch(e){toast("No connection. Try again.")}
  poll();
}
/* emoji reactions */
const EMOJI=[["🤫","Shh"],["🔥","On fire"],["🏹","Bullseye"],["🎁","Sponsor"],["🕵️","Sus"],["😱","No way"],["😂","LOL"],["🎄","Merry"]];
const SPRAY={"🤫":["🔒","🗝️"],"🔥":["🔥","✨"],"🏹":["🎯","✨"],"🎁":["🪂","🎀"],"🕵️":["🔍","👀"],"😱":["💥","⚡"],"😂":["🤣","😆"],"🎄":["❄️","⭐"]};
let lastReact=0;
async function react(e,btn){
  const now=Date.now();if(now-lastReact<350)return;lastReact=now;
  sfx("tap");buzz(10);
  if(!calm){const r=btn.getBoundingClientRect(),set=[e,...(SPRAY[e]||[])];   // a little preview of the burst on your own phone
    for(let k=0;k<4;k++){const el=document.createElement("div");el.className="fly";el.textContent=set[k%set.length];
      el.style.left=r.left+r.width/2-18+"px";el.style.top=r.top+"px";el.style.setProperty("--dx",(k-1.5)*36+(Math.random()*20-10)+"px");el.style.setProperty("--rot",(Math.random()*50-25)+"deg");
      el.style.fontSize=k?"1.6rem":"2.4rem";document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}}
  try{const {status}=await post("/api/react",{name:myName,e});
    if(status===400)toast("This page is out of date. Refresh it to get the new emojis.");
    else if(status===403)toast("You're not signed in on this phone anymore. Tap your name again.");
    else if(status>=500)toast("That emoji didn't reach the TV. Try again.");
  }catch(err){toast("No connection. That emoji didn't reach the TV.")}
}
const reactBar=()=>`<div class="reacts"><div class="lbl">Tap to pop it up on the TV with your name</div>${EMOJI.map(([e,l])=>`<button data-react="${e}" aria-label="Send ${l}">${e}<small>${l}</small></button>`).join("")}</div>`;
/* 🔑 Host tools: the host's phone scanned the TV's host code once (host.html saves the key);
   when it's signed in as Carsyn, a button opens the bonus secrets to approve. Anonymous: text only, never who wrote it. */
const HOST_NAME="Carsyn";
const AKA={Jessie:"Lucky PomPoms",Tinsley:"Pee Pee Balls",Grandad:"Grandad the Ancient and Wise",Dash:"Chad Thundercock",Jonny:"HumblePie1",Natalie:"Buzz Buzz",Elisha:"Bye Felicia",Kamdon:"Big Daddy Kam",Brandon:"Iron Balls III",Kyle:"Kachow",Carsyn:"Clo",Caleb:"Cable"};
const dn=n=>window.XM?.dn?XM.dn(n):(AKA[n]||n);   // nickname, for text the page's name swap can't reach (pop-ups, capitals)
const NO_GUESS=200;
const FAKE="🃏 FAKE";   // sealed when you call a secret fake (matches the TV)   // points lost for not sealing a guess in time (matches the TV)
const hostKey=()=>store.get("ds-hostkey");
const isHost=()=>D.me===HOST_NAME;   // signed in as Carsyn on her own phone: that's all it takes
let hostOpen=false,hostList=null,hostErr="",hostT=0,hostDecoys=[],hostTTL={};
async function hostDecoy(op,t){
  try{await fetch("/api/ds",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,name:myName,pid,text:t})})}catch(e){}
  sfx("tap");hostLoad();
}
async function hostLoad(){
  try{const r=await fetch(`/api/ds?op=review&name=${encodeURIComponent(myName||"")}&pid=${encodeURIComponent(pid)}`,{cache:"no-store"});
    if(r.status===403){hostErr="Only Carsyn's own phone can approve. Sign in as Carsyn again.";hostList=null}
    else{hostErr="";const d=await r.json();hostList=d.list;hostDecoys=d.decoys||[];hostTTL=d.ttl||{}}
  }catch(e){hostErr="No connection. Trying again…"}
  hostDraw();
}
async function hostDecide(id,ok){
  sfx("tap");buzz(15);
  try{await fetch("/api/ds",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"approve",name:myName,pid,id,ok})})}catch(e){}
  hostLoad();
}
function hostDraw(){
  let b=$("#hostbtn"),p=$("#hosttools");
  if(!isHost()){b?.remove();p?.remove();hostOpen=false;clearInterval(hostT);return}
  const waiting=(hostList||[]).filter(x=>x.status==="new").length;
  if(!b){b=document.createElement("button");b.id="hostbtn";b.onclick=()=>{hostOpen=!hostOpen;if(hostOpen){hostLoad();clearInterval(hostT);hostT=setInterval(hostLoad,3000)}else clearInterval(hostT);hostDraw()};document.body.appendChild(b)}
  b.innerHTML=hostOpen?"✕ Close host tools":`🔑 Host tools${waiting?`<b>${waiting}</b>`:""}`;
  if(!hostOpen){p?.remove();return}
  if(!p){p=document.createElement("div");p.id="hosttools";document.body.appendChild(p)}
  const n=(hostList||[]).filter(x=>x.status==="approved").length;
  const dt=p.querySelector("#decoytext"),draft=dt?.value||"",dfoc=document.activeElement===dt;   // keep a half-typed decoy across refreshes
  p.innerHTML=`<div class="in"><div class="eyebrow">Host only · keep this to yourself</div><h2>📝 Bonus secrets</h2>
    <p style="margin:0;color:var(--muted)">Anonymous: you see the secret, never who wrote it. Approved ones play as a bonus round after the main secrets, and each writer earns +500. ${n?`<b style="color:var(--good)">${n} approved.</b>`:""}</p>
    ${hostErr?`<div class="offline" style="background:var(--wax);color:#fff">${esc(hostErr)}</div>`:""}
    ${hostList&&!hostList.length?`<p style="text-align:center;color:var(--muted)">Nothing yet. This updates by itself.</p>`:""}
    ${(hostList||[]).map((x,i)=>`<div class="hcard ${x.status}"><span class="tag">Secret ${i+1} · ${x.status}</span><div class="t">“${esc(x.text)}”</div>
      <div class="row"><button class="ok" data-hok="${esc(x.id)}">✓ Approve</button><button class="no" data-hno="${esc(x.id)}">Skip</button></div></div>`).join("")}
    <h2 style="margin-top:14px">🃏 Decoy secrets</h2>
    <p style="margin:0;color:var(--muted)">Made-up secrets that get shuffled in when the vault opens (3 per game). Yours go in first; the game has 8 built-in ones too. Write them in the same style as the real ones!</p>
    ${hostDecoys.map(t=>`<div class="hcard"><div class="t">“${esc(t)}”</div><div class="row"><span></span><button class="no" data-undecoy="${esc(t)}">🗑 Remove</button></div></div>`).join("")}
    <form id="decoyform" class="hcard" style="gap:8px"><textarea id="decoytext" maxlength="200" placeholder="I once…" style="font-family:var(--type);font-size:1.05rem;border:2px dashed #c9b385;border-radius:6px;background:rgba(255,255,255,.5);padding:8px;min-height:64px;color:var(--parch-ink)"></textarea>
      <button class="ok" type="submit" style="padding:.75em;border-radius:10px;font-weight:800">🃏 Add this decoy</button></form>
    ${D.game?.opts?.ttl?`<h2 style="margin-top:14px">🤥 Two truths & a lie</h2>
    <p style="margin:0;color:var(--muted)">Up to 2 get played near the end. Remove any that give too much away. (The lie is marked so you can check it.)</p>
    ${Object.keys(hostTTL).length?Object.entries(hostTTL).map(([n,v])=>{let t;try{t=JSON.parse(v)}catch(e){return""}return `<div class="hcard"><span class="tag">${esc(n)}</span><div class="t" style="font-size:.95rem">✓ ${esc(t.truths[0])}<br>✓ ${esc(t.truths[1])}<br>🤥 ${esc(t.lie)}</div><div class="row"><span></span><button class="no" data-unttl="${esc(n)}">🗑 Remove</button></div></div>`}).join(""):`<p style="text-align:center;color:var(--muted)">Nobody has written one yet.</p>`}`:""}</div>`;
  p.querySelectorAll("[data-hok]").forEach(x=>x.onclick=()=>hostDecide(x.dataset.hok,true));
  p.querySelectorAll("[data-hno]").forEach(x=>x.onclick=()=>hostDecide(x.dataset.hno,false));
  const dt2=p.querySelector("#decoytext");if(dt2&&draft){dt2.value=draft;if(dfoc)dt2.focus()}
  p.querySelectorAll("[data-unttl]").forEach(x=>x.onclick=async()=>{if(!confirm(`Remove ${dn(x.dataset.unttl)}'s two truths and a lie?`))return;try{await post("/api/ds",{op:"ttlremove",name:myName,who:x.dataset.unttl})}catch(e){}sfx("tap");hostLoad()});
  p.querySelectorAll("[data-undecoy]").forEach(x=>x.onclick=()=>hostDecoy("undecoy",x.dataset.undecoy));
  const df2=p.querySelector("#decoyform");if(df2)df2.onsubmit=e=>{e.preventDefault();const t=p.querySelector("#decoytext").value.trim();if(t){p.querySelector("#decoytext").value="";hostDecoy("decoy",t)}};
}
/* ❓ the rules again, any time during the game: a little button bottom-left opens them */
let lastSeen=null;   // which ⏳ last-chance screen this phone already reopened the cards for
let rulesOpen=false;window.HOWTO_OWN_BUTTON=true;   // howto.js leaves its ❓ off this page
function rulesDraw(){
  const g=D.game,want=g&&D.me&&!["lobby","howto"].includes(g.phase);
  let b=$("#rulesbtn"),box=$("#rulesbox");
  if(!want){b?.remove();box?.remove();rulesOpen=false;document.body.classList.remove("hasrules");return}
  if(!b){b=document.createElement("button");b.id="rulesbtn";b.textContent="❓ How to play";b.onclick=()=>{rulesOpen=!rulesOpen;sfx("tap");rulesDraw()};document.body.appendChild(b);document.body.classList.add("hasrules")}
  b.textContent="❓ How to play";b.style.display=rulesOpen?"none":"";
  if(!rulesOpen){box?.remove();return}
  if(box)return;   // already open: don't redraw (keeps the scroll spot)
  box=document.createElement("div");box.id="rulesbox";let sec="";
  box.innerHTML=`<div class="in"><div class="eyebrow">Only on your phone · the game keeps going</div><h2>📜 How to play</h2>
    ${phoneRules(g.opts||{}).map(([sc,e,t,l])=>{const h=sc!==sec?`<div class="sec">${esc(sc)}</div>`:"";sec=sc;return h+`<div class="r"><span class="e" aria-hidden="true">${e}</span><span><b>${esc(t)}</b><span>${esc(l)}</span></span></div>`}).join("")}
    <button class="btn close" id="rulesclose">👍 Got it, back to the game</button></div>`;
  box.querySelector("#rulesclose").onclick=()=>{rulesOpen=false;sfx("tap");rulesDraw()};
  document.body.appendChild(box);
}
/* the rules, short and grouped (matches the TV's order step for step) */
function phoneRules(o){
  const gmOn=(D.game?.playing||[]).includes(HOST_NAME);
  const r=[["The basics","🤫","A secret appears","A real secret from someone here pops up on the TV."],
    ["The basics","📱","You guess who","Type WHO it belongs to. Only you see your guess."],
    ["Points","⏰","Don't run out of time","No guess sealed before time's up = −200."],
    ["Points","⚡","Be fast","Right = 1,000 points. Faster = more. Streaks = more."],
    ["Points","🎭","Your own secret?","Type a decoy. +150 for every person you fool."]];
  if(o.decoys)r.push(["Extras","🃏","Spot the fakes","Some secrets are made up. Think nobody said it? Tap 🃏 It's fake. Right = points!"]);
  if(o.bets)r.push(["Extras","🎲","Bet on it","🎯 Sure: +500 / −250  ·  💀 All in: ×2 / −500"]);
  if(o.interro)r.push(["Extras","🔦","Interrogation Room","Most accused defends themselves. You can change your vote: right = +250, talked out of it = −500."]);
  if(o.story)r.push(["Extras","🎤","Story time","Your secret? Accept to tell the story: +300. Decline or no answer: −200. Rate others 🔥 😂 🤯 🤔 😴 👎"]);
  if(o.redact)r.push(["Extras","🖤","Redacted files","Words are blacked out and uncovered one by one. Guess early = bigger bonus."]);
  if(o.golden)r.push(["Extras","✨","Golden file","One secret is secretly worth TRIPLE. You find out which one when it's revealed."]);
  if(o.frame)r.push(["Extras","🎯","Frame job","Your secret? Pick someone to frame. Room accuses them most = +400."]);
  if(o.fifth)r.push(["Extras","🤐","Plead the Fifth","In the hot seat? End it once per game. Costs 100."]);
  if(o.showdown)r.push(["Extras","⚔️","Quick Draw","Tied at the end? When the TV says DRAW, first tap wins. Too soon = you lose!"]);
  if(o.mole)r.push(["Twists","🐀","The mole","Each secret, someone is secretly told to push a wrong name. +150 for each person they fool. Trust no one!"]);
  if(o.lightning)r.push(["Twists","🌩️","Lightning round","Halfway through: 3 secrets, 10 seconds each, double points."]);
  if(o.ttl)r.push(["Twists","🤥","Two truths & a lie","Write yours here. The room hunts for your lie: +150 for each person you fool."]);
  if(o.mostlikely)r.push(["Twists","🗳️","Most likely to…","Quick votes between secrets. No points, just bragging rights."]);
  if(o.bonus)r.push(["Extras","📝","Bonus secret","Write one. If it's played: +500 points for you!"]);
  if(gmOn)r.push(["Have fun","🕵️","Most Wanted",`${HOST_NAME} knows the secrets, so she bets on who you'll wrongly accuse most. Nail it: +400. Bonus round: she guesses too!`]);
  r.push(["Have fun","😂","Emojis","Tap them to pop up on the TV with your name."]);
  r.push(["Have fun","👑","Winning","Most points wins the major award. Last secret = double!"]);
  return r;
}
/* bonus secret: written in the lobby, approved by the host, played as a bonus round */
// the bonus secret card: ask first (Yes / No thanks), then write, then sealed. "No thanks" is remembered on this phone.
let mySecret=store.get("ds-mysecret")||"",editing=false,declined=store.get("ds-nobonus")==="1";
async function deleteSecret(){
  if(!confirm("Delete your bonus secret? It won't be played."))return;
  try{const {status}=await post("/api/ds",{op:"unsecret",name:myName});if(status!==200){toast("That didn't go through. Try again.");return}}catch(e){toast("No connection. Try again.");return}
  mySecret="";store.set("ds-mysecret",null);editing=false;declined=true;store.set("ds-nobonus","1");sfx("tap");toast("Deleted. It won't be played.");lastKey="";render();
}
async function writeSecret(){
  const t=$("#secret")?.value.trim();if(!t){$("#secret")?.focus();return}
  try{const {status,data}=await post("/api/ds",{op:"secret",name:myName,text:t});
    if(status===200){mySecret=t;store.set("ds-mysecret",t);editing=false;sfx("seal");buzz(40);lastKey="";render()}
    else toast(data.error||"That didn't go through. Try again.");
  }catch(e){toast("No connection. Try again.")}
}
const writeCard=()=>!D.game?.opts?.bonus?"":
  !mySecret&&!editing&&declined?`<button class="linkish" id="yesbonus" style="justify-self:center;color:var(--muted)">📝 Changed your mind? Add a bonus secret (+500)</button>`
  :!mySecret&&!editing?`<div class="write"><b>📝 Want to add a bonus secret?</b><p>Something true nobody here knows about you. If it gets played, <b>+500 points</b> go to your score. Totally optional, and anonymous.</p>
     <button class="x" id="nobonus" aria-label="No thanks">✕</button>
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="yesbonus" style="min-height:48px;font-size:1rem">✍️ Yes, write one</button><button class="btn" id="nobonus" style="min-height:48px;font-size:1rem;background:#e7dcc4;color:#6b5233;box-shadow:0 4px 0 #c9b385">No thanks</button></div></div>`
  :editing
  ?`<div class="write"><b>📝 Add a bonus secret · earn +500 points</b><p>Something true that nobody here knows about you. If it gets played in the bonus round, <b>+500 points go to your score</b>, plus 150 for everyone you fool. It's anonymous: not even the host sees who wrote it.</p>
     <button class="x" id="${mySecret?"canceledit":"nobonus"}" aria-label="Never mind">✕</button>
     <textarea id="secret" maxlength="200" placeholder="I once…">${esc(mySecret)}</textarea><button class="btn" id="sendsecret">🔏 Seal my secret</button>
     <button class="linkish" id="${mySecret?"canceledit":"nobonus"}">${mySecret?"Never mind, keep the one I have":"Never mind, no thanks"}</button></div>`
  :`<div class="write"><b>📝 Your bonus secret is sealed · +500 if it's played</b><div class="done">“${esc(mySecret)}”</div>
     <div class="two"><button id="editsecret">✏️ Change it</button><button id="delsecret">🗑 Delete it</button></div></div>`;
/* 🤥 two truths and a lie: written in the lobby (optional) */
let myTTL=(()=>{try{return JSON.parse(store.get("ds-ttl"))}catch(e){return null}})(),ttlEdit=false,ttlNo=store.get("ds-nottl")==="1";
async function saveTTL(){

/* ---------- little sounds (the TV plays the music) ---------- */
let AC=null;
function sfx(kind){
  if(!sound)return;
  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){return}
  const t=AC.currentTime+.01,hz=m=>440*Math.pow(2,(m-69)/12);
  const tone=(m,d,dur,v,type="sine")=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=hz(m);o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+dur);o.start(t+d);o.stop(t+d+dur+.05)};
  if(kind==="tap")tone(84,0,.08,.08,"triangle");
  if(kind==="buzz"){tone(45,0,.9,.14,"sawtooth");tone(46,0,.9,.1,"square")}
  if(kind==="welcome")[67,71,74,79].forEach((m,k)=>tone(m+12,k*.09,.7,.08));
  if(kind==="seal"){tone(43,0,.25,.4,"triangle");tone(88,.12,.5,.06);tone(95,.18,.6,.05)}
  if(kind==="right")[72,76,79,84].forEach((m,k)=>tone(m,k*.08,.5,.1,"triangle"));
  if(kind==="wrong")[60,55].forEach((m,k)=>tone(m,k*.18,.35,.12,"triangle"));
  if(kind==="shh")tone(76,0,.6,.06);
  if(kind==="win")[67,72,76,79,84].forEach((m,k)=>tone(m,k*.12,k===4?1.4:.4,.1,"triangle"));
}

(function sky(){
  const c=$("#sky"),x=c.getContext("2d");let W,H,f=[];
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;f=Array.from({length:Math.round(W*H/8000)},(_,i)=>({e:i%6===0,x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,s:Math.random()*.6+.25,w:Math.random()*6.28}))};
  size();addEventListener("resize",size);if(calm)return;
  (function loop(){x.clearRect(0,0,W,H);
    for(const p of f){p.w+=.012;p.x+=Math.sin(p.w)*.35;
      if(p.e){p.y-=p.s;if(p.y<-6){p.y=H+6;p.x=Math.random()*W}x.fillStyle=`rgba(255,150,60,${.4+Math.sin(p.w*4)*.3})`}
      else{p.y+=p.s;if(p.y>H){p.y=-4;p.x=Math.random()*W}x.fillStyle="rgba(255,255,255,.7)"}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    requestAnimationFrame(loop)})();
})();
const FX=(()=>{const c=$("#fx"),x=c.getContext("2d");let P=[],on=false;
  const size=()=>{c.width=innerWidth;c.height=innerHeight};size();addEventListener("resize",size);
  const cols=["#d9b25f","#f6dfa0","#a3182b","#e2343c","#2e7a52","#f4ecdb"];
  function loop(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.y<c.height+30&&p.life-->0);
    for(const p of P){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-5,-2,10,4*Math.abs(Math.cos(p.r*3))+1);x.restore()}
    if(P.length)requestAnimationFrame(loop);else on=false}
  return n=>{if(calm)return;for(let i=0;i<n;i++)P.push({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*16,vy:-(6+Math.random()*10),r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%6],life:300});
    if(!on){on=true;requestAnimationFrame(loop)}}})();

// vault keys collected by tapping floating keys (kept on this phone, per game)
let keys=(()=>{try{return JSON.parse(store.get("ds-keys"))||{gid:null,n:0}}catch(e){return {gid:null,n:0}}})();
function addKey(){if(!D.game)return 0;if(keys.gid!==D.game.gid)keys={gid:D.game.gid,n:0};keys.n++;store.set("ds-keys",JSON.stringify(keys));return keys.n}
/* the moment guesses lock: buzz + red flash on every phone (even if your screen doesn't change) */
function lockFlash(){
  const lk=D.game&&D.game.phase==="question"&&D.game.locked?`${D.game.gid}:${D.game.qi}`:"";
  if(lk&&lk!==lockFlash.last&&D.me&&D.game.playing?.includes(D.me)){lockFlash.last=lk;sfx("buzz");buzz([300,100,300]);
    if(!calm){const f=document.createElement("div");f.id="tuflash";f.innerHTML="⏰<br>TIME'S UP!";document.body.appendChild(f);setTimeout(()=>f.remove(),1900)}}
}
function render(){
  lockFlash();
  // the secret's owner and the Gamemaker (picking Most Wanted) can't lose points, so no "too slow" warning for them
  const safe=!!(D.game&&D.me&&((D.game.own&&typeof ownTag==="function"&&D.game.own===ownTag(D.game.gid,D.game.qi,D.me))||(D.me===HOST_NAME&&!D.game.bonus)));
  if(window.HowTo)HowTo.sync(D.game,{me:D.me,answered:safe||!!(D.myAnswer||(typeof pending!=="undefined"&&pending&&D.game&&pending.gid===D.game.gid&&pending.qi===D.game.qi))});   // How to play cards while the TV shows them
  const [k,html,fx]=view();
  const key=k+(offline>2?"off":"");
  if(key===lastKey)return;   // nothing changed: leave the screen alone (keeps your typing)
  lastKey=key;
  const typing=$("#g")?.value,focused=document.activeElement?.id==="g";   // keep a half-typed guess when the screen redraws
  const drafting=$("#secret")?.value,dfocus=document.activeElement?.id==="secret";
  const swd=$("#sw")?.value,swf=document.activeElement?.id==="sw";
  const ttd=["t1","t2","tl"].map(id=>$("#"+id)?.value),ttf=document.activeElement?.id;
  $("#app").innerHTML=(offline>2?`<div class="offline">Reconnecting…</div>`:"")+html;
  const gi=$("#g");if(gi&&typing){gi.value=typing;if(focused)gi.focus()}
  const si=$("#secret");if(si&&drafting){si.value=drafting;if(dfocus)si.focus()}
  const swi=$("#sw");if(swi&&swd){swi.value=swd;if(swf)swi.focus()}
  ["t1","t2","tl"].forEach((id,i)=>{const el=$("#"+id);if(el&&ttd[i]!=null){el.value=ttd[i];if(ttf===id)el.focus()}});
  document.querySelectorAll("[data-name]").forEach(b=>b.onclick=()=>join(b.dataset.name));
  const f=$("#guess");if(f)f.onsubmit=e=>{e.preventDefault();const i=$("#g");if(!i.value.trim()){i.focus();return}i.blur();send(i.value)};
  const l=$("#leave");if(l)l.onclick=leave;
  document.querySelectorAll("[data-react]").forEach(b=>b.onclick=()=>react(b.dataset.react,b));
  document.querySelectorAll("[data-bet]").forEach(b=>b.onclick=()=>pickBet(b.dataset.bet));
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>vote(b.dataset.vote));
  const ss=$("#sendsecret");if(ss)ss.onclick=writeSecret;
  const es=$("#editsecret");if(es)es.onclick=()=>{editing=true;lastKey="";render();$("#secret")?.focus()};
  const yb=$("#yesbonus");if(yb)yb.onclick=()=>{sfx("tap");editing=true;declined=false;store.set("ds-nobonus",null);lastKey="";render();$("#secret")?.focus()};
  document.querySelectorAll("#canceledit").forEach(b=>b.onclick=()=>{sfx("tap");editing=false;lastKey="";render()});
  const ds=$("#delsecret");if(ds)ds.onclick=deleteSecret;
  document.querySelectorAll("#ttlyes,#ttlchange").forEach(b=>b.onclick=()=>{sfx("tap");ttlEdit=true;ttlNo=false;store.set("ds-nottl",null);lastKey="";render();$("#t1")?.focus()});
  document.querySelectorAll("#ttlno").forEach(b=>b.onclick=()=>{sfx("tap");ttlNo=true;ttlEdit=false;store.set("ds-nottl","1");lastKey="";render()});
  const tc=$("#ttlcancel");if(tc)tc.onclick=()=>{sfx("tap");ttlEdit=false;if(!myTTL){ttlNo=true;store.set("ds-nottl","1")}lastKey="";render()};
  const tsv=$("#ttlsave");if(tsv)tsv.onclick=saveTTL;
  const tdl=$("#ttldel");if(tdl)tdl.onclick=dropTTL;
  document.querySelectorAll("[data-ttl]").forEach(b=>b.onclick=()=>{sfx("tap");buzz(15);send("TTL"+b.dataset.ttl)});
  document.querySelectorAll("[data-likely]").forEach(b=>b.onclick=()=>likelyVote(b.dataset.likely));
  document.querySelectorAll("#nobonus").forEach(b=>b.onclick=()=>{sfx("tap");declined=true;editing=false;store.set("ds-nobonus","1");lastKey="";render()});
  document.querySelectorAll("[data-frame]").forEach(b=>b.onclick=()=>frameSomeone(b.dataset.frame));
  const ff=$("#fifth");if(ff)ff.onclick=pleadFifth;
  const dt3=$("#drawtap");if(dt3){dt3.onpointerdown=e=>{e.preventDefault();drawTap()}}
  const sy=$("#storyyes");if(sy)sy.onclick=()=>storyAnswer(true);
  const sn=$("#storyno");if(sn)sn.onclick=()=>storyAnswer(false);
  clearInterval(render.ac);if($("#askclock")&&D.game?.askLeft!=null){const end=Date.now()+D.game.askLeft*1000;render.ac=setInterval(()=>{const b=$("#askclock b");if(!b)return clearInterval(render.ac);b.textContent=Math.max(0,Math.ceil((end-Date.now())/1000))},200)}
  document.querySelectorAll("[data-pred]").forEach(b=>b.onclick=()=>{sfx("tap");buzz(15);send("🔮"+b.dataset.pred)});
  document.querySelectorAll("[data-wanted]").forEach(b=>b.onclick=()=>{sfx("tap");buzz(15);send("🕵️"+b.dataset.wanted)});
  const cv=$("#changevote");if(cv)cv.onclick=()=>{sfx("tap");mySwitch.open=true;lastKey="";render();$("#sw")?.focus()};
  const kv=$("#keepvote");if(kv)kv.onclick=()=>{sfx("tap");buzz(15);toast("Kept. Your sealed guess stands.")};
  const sc=$("#swcancel");if(sc)sc.onclick=()=>{mySwitch.open=false;lastKey="";render()};
  const fb=$("#fakebtn");if(fb)fb.onclick=()=>{$("#g")?.blur();send(FAKE)};
  const swf2=$("#swfake");if(swf2)swf2.onclick=()=>{$("#sw").value=FAKE;switchVote()};
  const sf=$("#swform");if(sf)sf.onsubmit=e=>{e.preventDefault();$("#sw")?.blur();switchVote()};
  // the room's clock counts down here between polls
  clearInterval(render.rc);if($("#roomclock")&&D.game?.roomLeft){const end=Date.now()+D.game.roomLeft*1000;render.rc=setInterval(()=>{const b=$("#roomclock b");if(!b)return clearInterval(render.rc);b.textContent=Math.max(0,Math.ceil((end-Date.now())/1000))},200)}
  const sb=$("#snd");if(sb)sb.onclick=()=>{sound=!sound;store.set("ds-sound",sound?"on":"off");lastKey="";render();sfx("tap")};
  countUp();effect(fx);hostDraw();rulesDraw();
  // the hurry banner counts down here between polls
  clearInterval(render.hu);if($("#hurry")&&D.game?.left){const end=Date.now()+D.game.left*1000;render.hu=setInterval(()=>{const b=$("#hurry b");if(!b)return clearInterval(render.hu);b.textContent=Math.max(0,Math.ceil((end-Date.now())/1000))},200)}

  const ty=document.querySelector(".pstep.on .ln");
  if(ty){clearInterval(render.ty);const full=ty.dataset.type;let n=0;
    if(calm)ty.textContent=full;else render.ty=setInterval(()=>{n=Math.min(full.length,n+2);ty.innerHTML=esc(full.slice(0,n))+(n<full.length?"<i></i>":"");if(n>=full.length)clearInterval(render.ty)},28);
    ty.closest(".pstep").scrollIntoView({block:"center",behavior:calm?"auto":"smooth"})}
  const s=meScore();if(s)shownScore=s.score;
  // floating secrets while you wait (never over the name list or the guess box)
  const busy=document.querySelector("#g,[data-name],#secret,#t1,[data-ttl],[data-likely],[data-vote],#app figure,#drawtap,.write")||["interro","howto"].includes(D.game?.phase);   // nothing floating over text people need to read
  if(!D.me||busy||!D.game){Ambient.set("off");if(busy)Ambient.clear()}
  else Ambient.set("full",{theme:"ds",tap:true,sound:k=>sfx(k),key:addKey,max:3,every:[2000,3400]});
}
setInterval(()=>{if(isHost()&&!hostOpen&&!document.hidden)hostLoad()},10000);
poll();
</script>
</body>
</html>
