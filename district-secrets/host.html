<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<meta name="robots" content="noindex">
<title>District Secrets · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Special+Elite&family=Manrope:wght@500;700;800&display=swap">
<style>
/* The host's own phone: read the bonus secrets people wrote (anonymous: never who wrote them), approve or skip each one.
   Opening this link also marks this phone as the host's: sign in as Carsyn on the game page and 🔑 Host tools appears there. */
:root{--night:#0b0a14;--plum:#1b1328;--wax:#a3182b;--wax-hi:#d8393f;--gold:#d9b25f;--gold-hi:#f6dfa0;--parch:#efe2c4;--parch-ink:#2b1d12;
  --ink:#f4ecdb;--muted:#ab9fbe;--good:#86e0a8;--line:rgba(244,236,219,.14);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--night);color:var(--ink);font:16px "Manrope",system-ui,sans-serif;
  background-image:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(163,24,43,.5),transparent 70%)}
.app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:grid;gap:14px}
h1{font-family:"Cinzel",Georgia,serif;font-weight:900;color:var(--gold-hi);margin:0;font-size:1.7rem}
p{margin:0;color:var(--muted);line-height:1.45}
button{font:inherit;cursor:pointer;border:0}
.card{background:var(--parch);color:var(--parch-ink);border-radius:8px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 22px rgba(0,0,0,.45)}
.card .who{display:flex;align-items:center;gap:10px;font-weight:800}
.card .who img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold)}
.card .who small{margin-left:auto;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:.25em .7em;border-radius:999px}
.card.new .who small{background:#f6dfa0}.card.approved .who small{background:#bfe9cc}.card.skipped .who small{background:#e7c9c9}
.card.skipped{opacity:.6}
.card .t{font-family:"Special Elite","Courier New",monospace;font-size:1.15rem;line-height:1.3}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row button{padding:.75em;border-radius:10px;font-weight:800}
.ok{background:#2e7a52;color:#fff}.no{background:#e7dcc4;color:#6b5233}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.bad{background:var(--wax);color:#fff;border-radius:12px;padding:14px;text-align:center;font-weight:800}
.clear{justify-self:center;background:transparent;color:var(--muted);text-decoration:underline;font-size:.85rem}
</style>
</head>
<body>
<main class="app" id="app"><p>Loading…</p></main>
<script>
const NAMES=["Jessie","Elisha","Grandad","Dash","Jonny","Carsyn","Tinsley","Natalie","Kamdon","Brandon","QUEEN MOTHER","Kyle","Caleb"];
const k=new URLSearchParams(location.search).get("k")||"";
try{if(k)localStorage.setItem("ds-hostkey",k)}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
let list=null,err="";
async function load(){
  try{const r=await fetch(`/api/ds?op=review&k=${encodeURIComponent(k)}`,{cache:"no-store"});
    if(r.status===403){err="This link doesn't match the TV. On your phone, open the game and sign in as Clo.";list=null}
    else{err="";list=(await r.json()).list}
  }catch(e){err="No connection. Trying again…"}
  render();
}
async function decide(id,ok){
  try{await fetch("/api/ds",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"approve",k,id,ok})})}catch(e){}
  load();
}
async function clearAll(){
  if(!confirm("Throw away every bonus secret? People would have to write new ones."))return;
  try{await fetch("/api/ds",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"clearSecrets",k})})}catch(e){}
  load();
}
function render(){
  const app=document.getElementById("app");
  const n=list?.filter(x=>x.status==="approved").length||0;
  app.innerHTML=`<div><div style="font-size:.75rem;letter-spacing:.18em;color:var(--muted);font-weight:800">HOST ONLY · KEEP THIS SCREEN TO YOURSELF</div><h1>Bonus secrets</h1></div>
    <p>Anonymous: you only see the secret, never who wrote it. Approved ones play as a bonus round after the main secrets. ${n?`<b style="color:var(--good)">${n} approved.</b>`:""}</p>
    <p>✅ This phone is now the host's phone. On the game page, sign in as <b>Clo</b> and tap <b>🔑 Host tools</b> to get back here.</p>
    <a href="play" style="justify-self:start;color:var(--gold-hi);font-weight:800">→ Go to the game page</a>
    ${err?`<div class="bad">${esc(err)}</div>`:""}
    ${list&&!list.length?`<div class="empty">Nothing yet. This updates by itself.</div>`:""}
    ${(list||[]).map((x,i)=>`<div class="card ${x.status}"><div class="who">🔏 Secret ${i+1}<small>${{new:"new",approved:"approved",skipped:"skipped"}[x.status]}</small></div>
      <div class="t">“${esc(x.text)}”</div>
      <div class="row"><button class="ok" data-ok="${esc(x.id)}">✓ Approve</button><button class="no" data-no="${esc(x.id)}">Skip</button></div></div>`).join("")}
    ${list?.length?`<button class="clear" id="clear">Throw them all away</button>`:""}`;
  app.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>decide(b.dataset.ok,true));
  app.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>decide(b.dataset.no,false));
  const c=document.getElementById("clear");if(c)c.onclick=clearAll;
}
load();setInterval(()=>{if(!document.hidden)load()},3000);
</script>
</body>
</html>
