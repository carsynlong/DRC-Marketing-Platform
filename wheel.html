<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Matchup Wheel</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;gap:14px;max-width:1400px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:44px 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.emblem{width:clamp(110px,14vw,170px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
h1.title{font-size:clamp(2rem,5vw,3.6rem);color:var(--gold);text-shadow:0 3px 0 var(--red-d);line-height:1;text-align:center}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{padding:.55em 1.1em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1000px}
.chip{display:flex;align-items:center;gap:8px;padding:.3em .9em .3em .3em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;background:rgba(13,31,24,.6)}
.chip img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.chip[aria-pressed="true"]{background:var(--night-2);box-shadow:inset 0 0 0 2px var(--gold)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.wheelbox{position:relative;display:grid;place-items:center}
#wheel{width:min(100%,600px,72vh);aspect-ratio:1;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));z-index:2}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(22%,130px);aspect-ratio:1;border-radius:50%;background:var(--night) url(/xmas/emblem.png) center/92% no-repeat;box-shadow:0 0 0 6px var(--gold)}
.side{display:grid;gap:14px}
.panel{background:var(--night-2);border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--line);display:grid;gap:12px}
.now{text-align:center;display:grid;gap:10px;min-height:150px;align-content:center}
.now .vs{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.now .p{display:grid;justify-items:center;gap:4px;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.now img{width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--gold)}
.now b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--gold)}
.now .x{font-family:var(--display);font-size:2rem;color:var(--red)}
.now .q{font-family:var(--display);font-size:3rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.match .who{display:flex;align-items:center;gap:8px;justify-content:center;padding:.45em .6em;border-radius:12px;background:rgba(0,0,0,.25);font-weight:800;text-align:center;box-shadow:inset 0 0 0 2px var(--line);overflow-wrap:anywhere}
.match .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.match .who[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--good);background:rgba(111,211,138,.15)}
.match .who.lost{opacity:.35;text-decoration:line-through}
.match .v{font-family:var(--display);color:var(--red)}
.mrow{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0;padding-bottom:0}
.mrow .tools{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.mini-btn{padding:.35em .8em;border-radius:999px;box-shadow:inset 0 0 0 2px var(--gold);font-weight:800;font-size:.85rem}
.timer{font-family:var(--display);font-size:clamp(5rem,16vw,11rem);color:var(--gold);line-height:1;text-shadow:0 5px 0 var(--red-d);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(6,16,12,.95);display:grid;place-items:center;text-align:center;padding:50px 20px 20px;overflow:auto}
.overlay .inner{display:grid;gap:18px;justify-items:center}
.champ img{width:min(46vw,300px);height:min(46vw,300px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px var(--gold),0 0 0 14px var(--red)}
.crown{font-size:3.8rem;margin-bottom:-38px;position:relative;z-index:1;animation:crownDrop .9s .3s cubic-bezier(.2,1.5,.4,1) both,bob 1.1s 1.2s ease-in-out infinite alternate}
.bye{font-size:.95rem;color:var(--gold);font-weight:700;text-align:center}
/* big VS reveal */
.vsov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(184,50,42,.55),rgba(6,16,12,.97) 65%)}
.vsov .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(232,176,75,.10) 0 8deg,transparent 8deg 16deg);animation:rays 30s linear infinite}
@keyframes rays{to{transform:rotate(360deg)}}
.vsov .row3{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(10px,3vw,50px);width:min(1500px,96vw)}
.vsov .fighter{display:grid;justify-items:center;gap:8px}
.vsov .fighter img{width:min(34vw,440px,42vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px var(--gold),0 0 0 20px var(--red),0 30px 70px rgba(0,0,0,.6)}
.vsov .fighter b{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,4.6rem);color:var(--gold);text-shadow:0 5px 0 var(--red-d)}
.vsov .fighter .dd{font-weight:800;letter-spacing:.2em;color:var(--muted)}
.vsov .odds{font-weight:800;font-size:clamp(.9rem,1.5vw,1.3rem);color:var(--ink);background:rgba(0,0,0,.35);border-radius:999px;padding:.25em .9em}
.vsov .fav{position:relative;margin-top:.4vh;font-family:var(--display);font-size:clamp(1.1rem,2vw,1.8rem);color:var(--gold);text-align:center;animation:popIn .5s 1.4s both}
@media (max-height:900px){.vsov .fighter img{width:min(30vw,330px,34vh)}.vsov .fighter b{font-size:clamp(1.6rem,4vw,3.2rem)}.vsov .VS{font-size:clamp(3rem,8vw,7rem)}.vsov .ctl{margin-top:1.4vh}.vsov .top{margin-bottom:1vh}}
.upset{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
.upset b{font-family:var(--display);font-weight:400;font-size:clamp(4rem,14vw,12rem);color:#fff;text-shadow:0 8px 0 var(--red),0 0 60px rgba(255,60,40,.9);animation:upset 2.8s cubic-bezier(.2,1.4,.4,1) both;transform:rotate(-8deg)}
@keyframes upset{0%{opacity:0;transform:rotate(-8deg) scale(.3)}15%{opacity:1;transform:rotate(-8deg) scale(1.1)}80%{opacity:1;transform:rotate(-8deg) scale(1)}100%{opacity:0;transform:rotate(-8deg) scale(1.2)}}
.vsov .L{animation:inL .7s cubic-bezier(.2,1.3,.4,1) both}
.vsov .R{animation:inR .7s .15s cubic-bezier(.2,1.3,.4,1) both}
.vsov .VS{font-family:var(--display);font-size:clamp(4rem,11vw,10rem);color:#fff;text-shadow:0 6px 0 var(--red),0 0 40px rgba(255,90,78,.8);animation:slam .7s .7s cubic-bezier(.2,1.4,.4,1) both}
.vsov .top{position:relative;margin-bottom:2vh;text-align:center}
.vsov .ctl{position:relative;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:3vh;animation:popIn .5s 1.2s both}
@keyframes inL{from{transform:translateX(-80vw) rotate(-30deg)}}
@keyframes inR{from{transform:translateX(80vw) rotate(30deg)}}
@keyframes crownDrop{from{transform:translateY(-60vh) rotate(-40deg)}}
@keyframes bob{to{transform:translateY(-6px) rotate(4deg)}}
.fallen{position:fixed;left:6vw;bottom:6vh;z-index:60;display:grid;justify-items:center;gap:6px;pointer-events:none;animation:ascend 5s ease-in both}
.fallen img{width:min(18vh,160px);aspect-ratio:1;border-radius:50%;object-fit:cover;filter:grayscale(1) brightness(1.2);box-shadow:0 0 30px rgba(255,255,255,.6)}
.fallen b{font-family:var(--display);font-weight:400;color:#e8eef0;font-size:1.4rem;text-shadow:0 2px 6px #000}
@keyframes ascend{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.95;transform:translateY(-4vh) scale(1)}100%{transform:translateY(-75vh) scale(.7);opacity:0}}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="app" id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="/xmas/xmas.js"></script>
<script>XM.singleTab("wheel")</script>
<script src="/remote-tv.js"></script>
<script>addEventListener("load",()=>{if(window.RemoteTV)RemoteTV.start({page:"wheel",poll:true})})  /* 📱 Carsyn's remote can press the buttons here too */</script>
<script>XM.useNicknames();XM.setSound(true) /* a game page always starts with sound on, even if the show was muted earlier */</script>
<script>
/* Matchup Wheel: spin twice per 1 vs 1 face-off, free pass for an odd player out,
   tap winners, winners go back on the wheel until one champion is left. */
document.getElementById("lights").outerHTML=XM.lights(26);
XM.snow(document.getElementById("snow"));
const {esc,NAMES}=XM;
const {playSong,stopSong,sfx,ensureAudio}=XM;
const confetti=(n,big)=>XM.confetti(n,big);
const AV=n=>XM.photo(n);
const GAMES={
  cookie:{name:"Smart Cookie Showdown",verb:"Cookie face-off",timer:60,rule:"Cookie on the forehead, no hands. First cookie in the mouth wins."},
  scoop:{name:"Blind Snowball Scoop",verb:"Snowball scoop-off",timer:30,rule:"Blindfolds on, spoon in hand. Most snowballs in 30 seconds wins."},
};
const COLORS=["#b8322a","#e8b04b","#3e8a52","#2f6fb3","#c8412f","#d79a1f","#1f6b4a","#7a3fb0"];
NAMES.forEach(n=>{const i=new Image();i.src=AV(n)});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let S={phase:"setup",history:[],game:(location.hash.slice(1) in GAMES)?location.hash.slice(1):"cookie",
  present:XM.store.get("xmas-present",Object.fromEntries(NAMES.map(n=>[n,true]))),round:1,pool:[],matches:[],bye:null,pick:null,spinning:false,rot:0,last:null,champ:null};
NAMES.forEach(n=>{if(S.present[n]===undefined)S.present[n]=true});
const G=()=>GAMES[S.game];
// Keep each game's bracket on this laptop so a refresh doesn't lose it
const SKEY=g=>"xmas-wheel-"+g;
function saveS(){const c={...S,spinning:false};delete c.present;XM.store.set(SKEY(S.game),c.phase==="setup"?null:c)}
function loadS(g){const v=XM.store.get(SKEY(g),null);if(v&&v.phase&&v.phase!=="setup"){const keep=S.present;S={...S,second:false,second2:null,champ:null,runner:null,...v,game:g,spinning:false,secPend:0,history:v.history||[],present:keep};return true}return false}
loadS(S.game);

/* ---------- wheel ---------- */
function drawWheel(){
  const c=document.getElementById("wheel");if(!c)return;const x=c.getContext("2d"),W=c.width,R=W/2-14,n=S.pool.length;
  x.clearRect(0,0,W,W);x.save();x.translate(W/2,W/2);
  x.beginPath();x.arc(0,0,R+10,0,7);x.fillStyle="#e8b04b";x.fill();
  if(!n){x.beginPath();x.arc(0,0,R,0,7);x.fillStyle="#16302a";x.fill();x.restore();return}
  x.rotate(S.rot);const sl=2*Math.PI/n;
  for(let i=0;i<n;i++){
    x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i*sl,(i+1)*sl);x.closePath();
    x.fillStyle=n===1?COLORS[0]:COLORS[i%(n%COLORS.length===1?COLORS.length-1:COLORS.length)];x.fill();if(S.pool[i]===S.flash){x.fillStyle="rgba(255,236,170,.55)";x.fill()}
    x.strokeStyle="rgba(251,246,234,.6)";x.lineWidth=3;x.stroke();
    x.save();x.rotate(i*sl+sl/2);x.textAlign="right";x.textBaseline="middle";
    const name=XM.dn(S.pool[i]);let fs=Math.min(46,Math.max(22,sl*R*.42));x.font=`800 ${fs}px Outfit, system-ui, sans-serif`;
    while(x.measureText(name).width>R*.62&&fs>16){fs-=2;x.font=`800 ${fs}px Outfit, system-ui, sans-serif`}
    x.fillStyle="#fff";x.shadowColor="rgba(0,0,0,.55)";x.shadowBlur=6;x.fillText(name,R-26,0);x.restore();
  }
  for(let i=0;i<n;i++){x.save();x.rotate(i*sl);x.beginPath();x.arc(R+3,0,6,0,7);x.fillStyle="#fbf6ea";x.fill();x.restore()}
  x.restore();
}
const idxAtPointer=()=>{const n=S.pool.length,sl=2*Math.PI/n;let a=(-Math.PI/2-S.rot)%(2*Math.PI);if(a<0)a+=2*Math.PI;return Math.floor(a/sl)%n};
function spin(){
  if(S.spinning||S.phase!=="spin"||!S.pool.length)return;ensureAudio();
  if(S.pool.length===1&&!S.pick)return;
  S.spinning=true;render();
  const start=S.rot,dist=2*Math.PI*(5+Math.random()*3)+Math.random()*2*Math.PI,dur=4200+Math.random()*900,t0=performance.now();
  let lastIdx=idxAtPointer();playSong("battle");
  const ease=t=>1-Math.pow(1-t,4);
  const step=now=>{const t=Math.min(1,(now-t0)/dur);S.rot=start+dist*ease(t);drawWheel();
    const i=idxAtPointer();if(i!==lastIdx){lastIdx=i;sfx("tick")}
    if(t<1)requestAnimationFrame(step);else land(S.pool[i])};
  requestAnimationFrame(step);
}
function land(name){
  // keep the landed slice glowing under the pointer for a moment so the room sees it
  S.flash=name;drawWheel();sfx("thud");setTimeout(()=>{S.flash=null;land2(name)},1100);
}
function land2(name){
  stopSong();S.spinning=false;S.pool=S.pool.filter(n=>n!==name);
  let showVs=null;
  if(!S.pick){S.pick=name;S.last=null;sfx("reveal");XM.say(XM.spoken(name)+"!",null,{pitch:.1,rate:.8,interrupt:true})}
  else{S.matches.push({a:S.pick,b:name,win:null});S.last={a:S.pick,b:name};showVs=S.matches.length-1;S.pick=null}
  if(S.second&&S.matches.length){S.pool=[]}
  else if(!S.pick&&S.pool.length===1){S.bye=S.pool[0];S.pool=[]}
  if(!S.pool.length&&!S.pick){S.phase="play"}
  render();
  if(showVs!==null)versus(showVs);else if(S.phase==="play")playSong("board");
}

/* ---------- the big "X vs Y" reveal ---------- */
// 📊 Capitol Odds: each fighter's record tonight (games won + face-offs won on the wheels)
function record(n){const rn=x=>XM.realName?XM.realName(x):x;
  const games=Object.values(XM.victors()||{}).filter(v=>v&&rn(v)===n).length;let fo=0;
  for(const g of Object.keys(GAMES)){const st=g===S.game?S:XM.store.get(SKEY(g),null);if(!st)continue;
    (st.history||[]).forEach(r=>(r.matches||[]).forEach(m=>{if(m.win===n)fo++}));(st.matches||[]).forEach(m=>{if(m.win===n)fo++})}
  return {games,fo,score:games*3+fo}}
function favOf(m){const a=record(m.a),b=record(m.b);return a.score===b.score?null:a.score>b.score?m.a:m.b}
function upsetCheck(m){if(m.fav&&m.win&&m.win!==m.fav){const u=document.createElement("div");u.className="upset";u.innerHTML="<b>UPSET!</b>";document.body.appendChild(u);
  sfx("siren");setTimeout(()=>u.remove(),2900);setTimeout(()=>XM.say("Upset! The underdog wins!",null,{pitch:.1,rate:.9}),2600)}}
function versus(i){
  const m=S.matches[i];document.getElementById("vsov")?.remove();
  const ov=document.createElement("div");ov.className="vsov";ov.id="vsov";
  const rec=n=>{const r=record(n);return `🏆 ${r.games} game${r.games===1?"":"s"} won · ⚔️ ${r.fo} face-off${r.fo===1?"":"s"} won`};m.fav=favOf(m);
  const f=(n,cls)=>`<div class="fighter ${cls}"><img src="${AV(n)}" alt=""><b>${esc(n)}</b><span class="dd">${XM.where(n)}</span><span class="odds">${rec(n)}</span></div>`;
  ov.innerHTML=`<div class="rays"></div><div style="position:relative;display:grid;justify-items:center">
    <div class="top"><div class="eyebrow" style="font-size:1rem">${esc(G().name)} · ${S.second?"🎡 Second Chance":"Round "+S.round+" · Face-off "+(i+1)}</div><div class="fav">${m.fav?`📊 Capitol favorite: ${esc(m.fav)}`:"📊 Capitol Odds: dead even"}</div></div>
    <div class="row3">${f(m.a,"L")}<div class="VS">VS</div>${f(m.b,"R")}</div>
    <div class="ctl"><button class="btn red" id="vs-timer" style="font-size:1.2rem">⏱ Start the ${G().timer}s timer</button>
      <button class="btn ghost" id="vs-close" style="font-size:1.2rem">${S.phase==="spin"?"🎡 Back to the wheel":"✅ Back to the matchups"}</button></div>
    <div class="ctl" style="animation-delay:1.4s"><span class="eyebrow" style="align-self:center;font-size:.95rem">Who won?</span>
      <button class="btn" data-vswin="a" style="font-size:1.2rem">👑 ${esc(m.a)}</button><button class="btn" data-vswin="b" style="font-size:1.2rem">👑 ${esc(m.b)}</button>
      <button class="btn ghost" id="vs-tie" style="font-size:1.1rem">⚔️ It's a tie</button></div></div>`;
  document.body.appendChild(ov);
  sfx("whoosh");setTimeout(()=>{sfx("cannon");confetti(140)},700);
  setTimeout(()=>{if(!ov.isConnected)return;XM.say(XM.spoken(m.a)+"...",()=>{if(!ov.isConnected)return;
    XM.say("versus...",()=>{if(ov.isConnected)XM.say(XM.spoken(m.b)+"!",()=>booms(ov),{pitch:.05,rate:.75})},{pitch:.1,rate:.7})},{pitch:.05,rate:.75,interrupt:true})},900);
  const close=()=>{XM.hush();ov.remove();if(S.phase==="play")playSong("board")};
  ov.querySelector("#vs-close").onclick=close;
  ov.querySelector("#vs-timer").onclick=()=>{XM.hush();ov.remove();openTimer(i)};
  ov.querySelectorAll("[data-vswin]").forEach(b=>b.onclick=()=>{XM.hush();m.win=m[b.dataset.vswin];ov.remove();render();stopSong();XM.celebrate(m.win);fallen(m.win===m.a?m.b:m.a);upsetCheck(m);if(S.phase==="play")setTimeout(()=>playSong("board"),4200)});
  ov.querySelector("#vs-tie").onclick=()=>{XM.hush();ov.remove();tiebreak([m.a,m.b],m)};
}

// BOOM. BOOM. BOOM. after the announcer calls the matchup
function booms(ov){
  [0,650,1300].forEach((d,k)=>setTimeout(()=>{if(!document.body.contains(ov))return;sfx("boom");
    ov.animate([{transform:"translate(-18px,8px)"},{transform:"translate(16px,-8px)"},{transform:"translate(-8px,4px)"},{transform:"none"}],{duration:380});
    const v=ov.querySelector(".VS");if(v)v.animate([{transform:"scale(1)"},{transform:`scale(${1.35+k*.15})`,filter:"brightness(1.8)"},{transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.2,1.4,.4,1)"});
    ov.querySelectorAll(".fighter img").forEach(i=>i.animate([{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],{duration:300}));
    if(k===2)confetti(120)},d));
}

// The losing tribute gets the cannon and fades up into the sky, like in the books
function fallen(name){
  if(!name)return;sfx("cannon");
  const f=document.createElement("div");f.className="fallen";
  f.innerHTML=`<img src="${AV(name)}" alt=""><b>${esc(name)}</b>`;document.body.appendChild(f);setTimeout(()=>f.remove(),5200);
}

/* ---------- flow ---------- */
// a fresh bracket: no Second Chance mode, champion or Second Victor left over from before
function clearBracket(){S.second=false;S.second2=null;S.champ=null;S.runner=null;S.secPend=0;S.saved=false;S.pool=[];S.matches=[];S.bye=null;S.pick=null;S.last=null;S.flash=null}
function start(){
  const ps=NAMES.filter(n=>S.present[n]);if(ps.length<2)return;
  clearBracket();S.round=1;S.history=[];newRound(shuffle(ps));
}
function newRound(names){
  S.pool=names;S.matches=[];S.bye=null;S.pick=null;S.saved=false;
  // no free pass two rounds in a row: last round's free-pass tribute is up first and has to fight
  {const lb=S.history.length?S.history[S.history.length-1].bye:null;if(lb&&names.length%2===1&&names.includes(lb)){S.pool=names.filter(n=>n!==lb);S.pick=lb}}
  S.last=null;S.phase="spin";S.rot=Math.random()*6.28;sfx("gong");playSong("lobby");render();
}
// 🎡 Second Chance: the wheel picks 2 tributes who played (never the champion); their face-off winner is the Second Victor
function playedNames(){const set=new Set();(S.history||[]).forEach(r=>{(r.matches||[]).forEach(m=>{set.add(m.a);set.add(m.b)});if(r.bye)set.add(r.bye)});return [...set]}
function secondChance(){
  S.secPend=0;const pool=playedNames().filter(n=>n!==S.champ);if(pool.length<2)return;
  S.second=true;S.pool=shuffle(pool);S.matches=[];S.bye=null;S.pick=null;S.last=null;S.phase="spin";S.rot=Math.random()*6.28;
  sfx("gong");playSong("lobby");render();XM.say("Second chance! Two more tributes fight for the second major award.",null,{pitch:.1,rate:.9});
}
function finishSecond(w){
  if(!S.second)return;if(XM.tiebreakerOpen())XM.closeTiebreaker(true);   // decided by a tiebreaker: close it first so it doesn't stop the walk-up
  S.secPend=0;S.second=false;S.second2=w;S.phase="champ";S.pool=[];XM.setSecond(S.game,w);saveS();render();stopSong();
  XM.celebrate(w,{intro:"Your Second Victor",then:()=>{if(S.phase==="champ")XM.walkUp(w).then(ok=>{if(!ok&&S.phase==="champ")playSong("lobby")})}});   // walk-up once the line is said
}
function nextRound(){
  if(S.second){const m=S.matches[0];if(m&&m.win)finishSecond(m.win);return}
  const w=S.matches.map(m=>m.win).concat(S.bye?[S.bye]:[]);
  S.history.push({round:S.round,matches:S.matches.map(m=>({a:m.a,b:m.b,win:m.win})),bye:S.bye});
  if(w.length===1){S.champ=w[0];{const fm=S.matches.find(m=>m.win===S.champ);S.runner=fm?(fm.win===fm.a?fm.b:fm.a):null}S.phase="champ";
    {const oldV=XM.victors()[S.game],oldS=XM.seconds()[S.game];   // a new bracket's champion: an old Second Victor from before is stale (or is now the champ)
      if(oldS&&(XM.realName(oldS)===S.champ||(oldV&&XM.realName(oldV)!==S.champ)))XM.setSecond(S.game,"")}
    XM.setVictor(S.game,S.champ);S.saved=true;S.second2=null;saveS();stopSong();render();
    XM.celebrate(S.champ,{intro:`Your ${G().name.replace("?","")} victor`,then:()=>{if(S.phase==="champ")XM.walkUp(S.champ).then(ok=>{if(!ok&&S.phase==="champ")playSong("lobby")})}});return}
  S.round++;newRound(shuffle(w));
}
function openTimer(i){
  const m=S.matches[i];const total=G().timer;let left=total,iv=0,to=0;
  document.getElementById("tov")?.remove();
  const ov=document.createElement("div");ov.className="overlay";ov.id="tov";
  ov.innerHTML=`<div class="inner"><div class="eyebrow">${esc(G().verb)}</div>
    <div style="display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap"><img src="${AV(m.a)}" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--gold)">
    <h2 style="font-size:clamp(1.6rem,4vw,2.8rem)">${esc(m.a)} <span style="color:var(--red)">vs</span> ${esc(m.b)}</h2><img src="${AV(m.b)}" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--gold)"></div>
    <div class="timer" id="tnum">${left}</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="tgo">Go!</button><button class="btn ghost" id="tclose">Close</button></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center"><span class="eyebrow">Who won?</span><button class="btn" data-twin="a">👑 ${esc(m.a)}</button><button class="btn" data-twin="b">👑 ${esc(m.b)}</button><button class="btn ghost" id="ttie">⚔️ It's a tie</button></div></div>`;
  document.body.appendChild(ov);
  const live=()=>ov.isConnected;
  const stop=()=>{clearInterval(iv);clearTimeout(to);iv=0;to=0;XM.hush()};
  const close=()=>{stop();ov.remove();stopSong();if(S.phase==="play")playSong("board")};
  ov.querySelector("#tclose").onclick=close;
  ov.querySelectorAll("[data-twin]").forEach(b=>b.onclick=()=>{stop();m.win=m[b.dataset.twin];ov.remove();stopSong();render();XM.celebrate(m.win);fallen(m.win===m.a?m.b:m.a);if(S.phase==="play")setTimeout(()=>playSong("board"),4200)});
  ov.querySelector("#ttie").onclick=()=>{stop();ov.remove();tiebreak([m.a,m.b],m)};
  const word=["zero","one","two","three","four","five"];
  const num=(t,hot)=>{const el=ov.querySelector("#tnum");if(!el)return;el.textContent=t;el.style.color=hot?"#ff6b5e":"";el.animate([{transform:"scale(1.6)",opacity:.3},{transform:"scale(1)",opacity:1}],{duration:350,easing:"cubic-bezier(.2,1.4,.4,1)"})};
  const go=ov.querySelector("#tgo");
  go.onclick=()=>{stop();go.disabled=true;left=total;stopSong();playSong("battle");
    // 5, 4, 3, 2, 1 ... BOOM, then the clock runs
    let c=5;num(c,true);sfx("drum");XM.say("Five",null,{pitch:.1,rate:1,interrupt:true});
    iv=setInterval(()=>{if(!live())return stop();c--;
      if(c>0){num(c,true);sfx(c===1?"thud":"drum");XM.say(word[c],null,{pitch:.1,rate:1,interrupt:true});return}
      clearInterval(iv);num("GO!",true);sfx("cannon");sfx("go");confetti(160);XM.say("Go!",null,{pitch:.3,rate:1,interrupt:true});
      ov.animate([{transform:"translate(-14px,6px)"},{transform:"translate(12px,-6px)"},{transform:"none"}],{duration:350});
      to=setTimeout(()=>{if(!live())return;num(left,false);
        iv=setInterval(()=>{if(!live())return stop();left--;
          if(left>0&&left<=5){num(left,true);sfx("tock");XM.say(word[left],null,{pitch:.1,rate:1,interrupt:true})}
          else if(left>0)num(left,false);
          if(left<=0){clearInterval(iv);iv=0;stopSong();sfx("cannon");num("TIME!",true);XM.say("Time!",null,{pitch:.05,rate:.8,interrupt:true});confetti(120);go.disabled=false;go.textContent="Run it again"}},1000)},900);
    },1000)};
}
function tiebreak(names,match){
  stopSong();XM.tiebreaker({game:S.game,tied:names||[],noSave:!!match,lock:!!match,onWinner:w=>{if(match&&(w===match.a||w===match.b)){match.win=w;render();setTimeout(()=>fallen(w===match.a?match.b:match.a),300)}},onClose:()=>{if(S.phase==="play")playSong("board");else if(S.phase==="champ"&&S.second2)XM.walkUp(S.second2).then(ok=>{if(!ok&&S.phase==="champ")playSong("lobby")});else if(S.phase==="champ")playSong("lobby")}});
}

/* ---------- views ---------- */
const topBtns=()=>`<button class="btn ghost" data-mute aria-label="Mute">${XM.sound?"🔊":"🔇"}</button><button class="btn ghost" id="tb">⚔️ Tiebreaker</button><button class="btn ghost" id="back">← Back to the show</button>`;
function render(){
  if(S.second&&S.matches[0]&&S.matches[0].win&&!S.secPend){S.secPend=1;setTimeout(()=>{if(S.second&&S.matches[0]&&S.matches[0].win)finishSecond(S.matches[0].win)},3200)}
  document.getElementById("app").innerHTML=S.phase==="setup"?setup():S.phase==="champ"?champ():arena();wire();drawWheel();saveS();
}
function setup(){
  return `<div class="bar" style="justify-content:flex-end">${topBtns()}</div>
  <section style="display:grid;gap:18px;justify-items:center;text-align:center"><img class="emblem" src="/xmas/emblem.png" alt="">
    <div class="eyebrow">The 2026 Christmas Games</div><h1 class="title">The Matchup Wheel</h1>
    <p class="tiny" style="max-width:56ch;font-size:1.05rem">Spin to pair up. Winners stay on. Last one standing wins.</p>
    <div class="seg" role="group" aria-label="Which game">${Object.entries(GAMES).map(([k,g])=>`<button data-game="${k}" aria-pressed="${S.game===k}">${g.name}</button>`).join("")}</div>
    <div class="eyebrow">Who's playing? Tap to sit someone out</div>
    <div class="chips">${NAMES.map(n=>`<button class="chip" data-here="${esc(n)}" aria-pressed="${S.present[n]}"><img src="${AV(n)}" alt="">${esc(n)}</button>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="start" style="font-size:1.2rem">Load the wheel</button><button class="btn ghost" id="music" style="font-size:.85rem;opacity:.7">🔔 Music</button></div>
  </section>`;
}
function arena(){
  const g=G(),playing=S.phase==="play",done=S.matches.length&&S.matches.every(m=>m.win);
  const remaining=S.matches.length?S.matches.filter(m=>!m.win).length:0;
  const now=S.pick?`<div class="eyebrow">First tribute</div><div class="vs"><div class="p"><img src="${AV(S.pick)}" alt=""><b>${esc(S.pick)}</b></div><span class="x">vs</span><span class="q">?</span></div><div class="tiny">Spin again for their opponent</div>`
    :S.last?`<div class="eyebrow">${esc(g.verb)}!</div><div class="vs"><div class="p"><img src="${AV(S.last.a)}" alt=""><b>${esc(S.last.a)}</b></div><span class="x">vs</span><div class="p"><img src="${AV(S.last.b)}" alt=""><b>${esc(S.last.b)}</b></div></div>`
    :playing?`<div class="eyebrow">All matched up</div><b style="font-family:var(--display);font-size:1.6rem;color:var(--gold)">Let the face-offs begin!</b>`
    :`<div class="eyebrow">${S.second?"Second Chance (the champion sits out)":"Round "+S.round}</div><b style="font-family:var(--display);font-size:1.6rem;color:var(--gold)">Spin to pick a tribute</b>`;
  return `<div class="bar"><div><div class="eyebrow">${esc(g.name)}</div><h1 class="title" style="text-align:left;font-size:clamp(1.6rem,3.6vw,2.6rem)">${S.second?"🎡 Second Chance":"Round "+S.round}</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap">${topBtns()}<button class="btn ghost" id="reset">Start over</button></div></div>
  <div class="layout">
    <div class="wheelbox"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="1000" height="1000" role="img" aria-label="Wheel with ${S.pool.length} names"></canvas><div class="hub"></div></div>
    <div class="side">
      <div class="panel now" aria-live="polite">${now}</div>
      ${S.phase==="spin"?`<button class="btn red" id="spin" style="font-size:1.4rem;padding:1em" ${S.spinning?"disabled":""}>${S.spinning?"Spinning…":"🎡 SPIN"}</button><div class="tiny" style="text-align:center">Space: spin · ${S.pool.length} left on the wheel</div>`:""}
      ${S.matches.length||S.bye?`<div class="panel"><div class="eyebrow">Round ${S.round} matchups · tap the winner</div>
        ${S.matches.map((m,i)=>`<div class="mrow"><div class="match">
          <button class="who ${m.win&&m.win!==m.a?"lost":""}" data-win="${i}|a" aria-pressed="${m.win===m.a}"><img src="${AV(m.a)}" alt="">${esc(m.a)}</button><span class="v">vs</span>
          <button class="who ${m.win&&m.win!==m.b?"lost":""}" data-win="${i}|b" aria-pressed="${m.win===m.b}"><img src="${AV(m.b)}" alt="">${esc(m.b)}</button></div>
          <div class="tools"><span>${m.win?"🏆 "+esc(m.win)+" advances":"Who won? Tap their name"}</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini-btn" data-vs="${i}">🆚 Show</button><button class="mini-btn" data-timer="${i}">⏱ ${g.timer}s timer</button><button class="mini-btn" data-tie="${i}">⚔️ Tie?</button></span></div></div>`).join("")}
        ${S.bye?`<div class="bye">🍀 ${esc(S.bye)} gets a free pass to the next round</div>`:""}</div>`:""}
      ${playing?`<button class="btn" id="nextr" ${done?"":"disabled"}>${done?(S.second?"🥈 Crown the Second Victor":S.matches.length===1&&!S.bye?"👑 Crown the champion":"🎡 Winners back on the wheel"):`${remaining} matchup${remaining===1?"":"s"} left`}</button>`:""}
      <div class="tiny" style="text-align:center">${esc(g.rule)}</div>
      ${scoreboard()}
    </div></div>`;
}
function scoreboard(){
  const wins={};const add=n=>{if(n)wins[n]=(wins[n]||0)+1};
  S.history.forEach(r=>r.matches.forEach(m=>add(m.win)));S.matches.forEach(m=>add(m.win));
  const rows=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  if(!rows.length&&!S.history.length)return "";
  return `<div class="panel"><div class="eyebrow">🏆 Scoreboard · face-offs won</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${rows.map(([n,c])=>`<span class="chip" style="cursor:default"><img src="${AV(n)}" alt="">${esc(n)} <b style="color:var(--gold)">${"🏆".repeat(c)}</b></span>`).join("")}</div>
    ${S.history.map(r=>`<div class="tiny">Round ${r.round}: ${r.matches.map(m=>`<b style="color:var(--ink)">${esc(m.win)}</b> beat ${esc(m.win===m.a?m.b:m.a)}`).join(" · ")}${r.bye?` · ${esc(r.bye)} had a free pass`:""}</div>`).join("")}</div>`;
}
function champ(){
  return `<div class="overlay" style="position:relative;background:none;min-height:85vh"><div class="inner champ"><div class="eyebrow" style="font-size:1rem">${esc(G().name)} champion</div>
    <div class="crown">👑</div><img src="${AV(S.champ)}" alt=""><h1 class="title" style="font-size:clamp(2.6rem,8vw,5rem)">${esc(S.champ)}</h1>
    <p style="font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.6rem);margin:0">Go claim your major award!</p>
    ${S.second2?`<div style="display:flex;align-items:center;gap:14px;font-size:clamp(1.1rem,2.2vw,1.6rem);font-weight:800"><img src="${AV(S.second2)}" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #c0c8d0">🥈 Second Victor: ${esc(S.second2)} wins a major award too!</div>`
      :`<button class="btn red" id="second" style="font-size:1.4rem;padding:.9em 1.6em">🎡 Second Chance</button><div class="tiny" style="font-size:1rem">Spin for 2 more tributes (never the champion). Their face-off winner is the Second Victor.</div>`}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="save"${S.saved?" disabled":""}>${S.saved?"✅ Saved to The Capitol Has Spoken":"🏆 Save the Victor"}</button><button class="btn ghost" id="reset">Back to setup</button><button class="btn ghost" id="back">← Back to the show</button><button class="btn ghost" data-mute aria-label="Mute">${XM.sound?"🔊":"🔇"}</button></div></div></div>`;
}

/* ---------- controls ---------- */
// the show opens this tab with noopener, so just try to close it; if the browser won't, go back to the wheel slide
function backToShow(){try{window.close()}catch(e){}setTimeout(()=>{location.href="/show#wheel-"+S.game},300)}
function wire(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=()=>{ensureAudio();fn(e)}};
  document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{S.game=b.dataset.game;history.replaceState(null,"","#"+S.game);sfx("tap");if(!loadS(S.game)){clearBracket();S.phase="setup";S.history=[];S.round=1}render()});
  document.querySelectorAll("[data-here]").forEach(b=>b.onclick=()=>{S.present[b.dataset.here]=!S.present[b.dataset.here];XM.store.set("xmas-present",S.present);sfx(S.present[b.dataset.here]?"tap":"untap");render()});
  document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{const[i,s]=b.dataset.win.split("|");const m=S.matches[+i];if(m.fav===undefined&&!m.win)m.fav=favOf(m);m.win=m.win===m[s]?null:m[s];render();if(m.win){XM.celebrate(m.win);fallen(m.win===m.a?m.b:m.a);upsetCheck(m)}else sfx("untap")});
  document.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>{ensureAudio();openTimer(+b.dataset.timer)});
  document.querySelectorAll("[data-vs]").forEach(b=>b.onclick=()=>{ensureAudio();versus(+b.dataset.vs)});
  document.querySelectorAll("[data-tie]").forEach(b=>b.onclick=()=>{const m=S.matches[+b.dataset.tie];tiebreak([m.a,m.b],m)});
  document.querySelectorAll("[data-mute]").forEach(b=>b.onclick=()=>{XM.toggleSound();b.blur()});
  on("start",start);on("spin",spin);on("nextr",nextRound);on("tb",()=>tiebreak());on("back",backToShow);
  on("second",secondChance);
  on("save",e=>{XM.setVictor(S.game,S.champ);if(S.second2)XM.setSecond(S.game,S.second2);e.textContent="✅ Saved to The Capitol Has Spoken";e.disabled=true;sfx("reveal")});
  {const r=document.getElementById("reset");if(r)r.onclick=()=>{ensureAudio();
    if(S.phase==="champ"||r.dataset.sure){clearBracket();S.phase="setup";S.history=[];S.round=1;XM.store.set(SKEY(S.game),null);stopSong();render();return}
    r.dataset.sure=1;r.textContent="Tap again to erase this bracket";setTimeout(()=>{if(r.isConnected){delete r.dataset.sure;r.textContent="Start over"}},3000)}}
  on("music",()=>{stopSong();playSong("lobby")});
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("tov")||XM.tiebreakerOpen())return;
  const vs=document.getElementById("vsov");
  if(vs&&(e.key==="Escape"||e.code==="Space")){e.preventDefault();vs.querySelector("#vs-close").click();return}
  if(e.target.closest&&e.target.closest("button"))return;
  if(e.code==="Space"&&S.phase==="spin"){e.preventDefault();spin()}
  if(e.key==="m"||e.key==="M")XM.toggleSound();
});
document.addEventListener("pointerdown",()=>ensureAudio(),{once:true});
render();
document.fonts&&document.fonts.ready.then(()=>drawWheel());
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/xmas-sw.js").catch(()=>{}));</script>
</body>
</html>
