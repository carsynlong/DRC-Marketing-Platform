<head>
<script>/* if anything breaks while loading, say what on screen (helps fix phone-only problems) */
window.addEventListener("error",function(e){try{var b=document.getElementById("jserr");if(!b){b=document.createElement("div");b.id="jserr";b.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#b3121b;color:#fff;font:600 14px/1.3 system-ui,sans-serif;padding:10px;border-radius:10px;white-space:pre-wrap";(document.body||document.documentElement).appendChild(b)}
b.textContent+=("⚠️ "+(e.message||"error")+" ("+String(e.filename||"").split("/").pop()+":"+(e.lineno||"?")+":"+(e.colno||"?")+")")+"\n";clearTimeout(b._t);b._t=setTimeout(function(){b.remove()},10000)}catch(_){}},true);
/* still stuck after 8 seconds? say so, with a reload button */
setTimeout(function(){var c=document.getElementById("count");if(!c||c.textContent.replace(/\s/g,"")!=="1/1")return;var w=document.createElement("div");w.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#1b1b1b;color:#fff;font:600 15px/1.35 system-ui,sans-serif;padding:12px;border-radius:12px;box-shadow:0 0 0 2px #e8b04b;text-align:center";
w.innerHTML="The show didn't finish loading. Check your connection, and in Brave turn Shields off for this site (lion icon). <button style='font:inherit;margin-top:8px;padding:6px 14px;border-radius:999px;border:0;background:#e8b04b;color:#2a1c05' onclick='location.reload()'>Reload</button>";document.body.appendChild(w)},8000);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The 2026 Christmas Games</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap" media="print" onload="this.media='all'">   <!-- fonts never hold up the page scripts -->
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
html,body{overflow:hidden}
body{cursor:default}
/* The stage is designed at 1920x1080 and scaled to fit any screen (TV or laptop). */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;z-index:5}
.slide{isolation:isolate;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 130px 70px;text-align:center}
/* 📱 Your Phone, Explained */
.pg{position:relative;display:grid;grid-template-columns:420px 1fr;gap:120px;align-items:center;width:100%;height:100%;text-align:left}
.pg-phone{position:relative;justify-self:end;width:420px;padding:16px;border-radius:58px;background:#0b0b0d;box-shadow:0 0 0 3px #2a2a30,0 30px 80px rgba(0,0,0,.65)}
.pg-phone::before{content:"";position:absolute;left:50%;top:22px;width:110px;height:26px;border-radius:14px;background:#0b0b0d;transform:translateX(-50%);z-index:3}
.pg-screen{position:relative;border-radius:44px;overflow:hidden;aspect-ratio:390/844}
.pg-screen img{display:block;width:100%;height:100%;object-fit:cover}
.pg-screen .dim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .5s}
.pg.on .pg-screen .dim{opacity:1}
.pg-hl{position:absolute;border-radius:18px;box-shadow:0 0 0 5px var(--gold),0 0 28px 10px rgba(232,176,75,.85),0 0 0 2000px rgba(0,0,0,.42);opacity:0;
  transition:left .55s cubic-bezier(.3,1.3,.5,1),top .55s cubic-bezier(.3,1.3,.5,1),width .55s,height .55s,opacity .35s;z-index:2;animation:pgpulse 1.4s ease-in-out infinite}
@keyframes pgpulse{50%{box-shadow:0 0 0 7px #ffd36b,0 0 40px 16px rgba(255,211,107,.9),0 0 0 2000px rgba(0,0,0,.42)}}
.pg-right{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto}
.pg-right h1{margin:0 0 10px}
.pg-capwrap{position:relative}
.pg-cap{position:absolute;left:0;right:30px;background:rgba(22,48,42,.96);border-radius:28px;padding:30px 40px;box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.5);
  transition:top .55s cubic-bezier(.3,1.3,.5,1),opacity .3s;display:grid;grid-template-columns:110px 1fr;gap:26px;align-items:center}
.pg-cap .e{font-size:92px;line-height:1;text-align:center}
.pg-cap b{display:block;font-family:var(--display);font-weight:400;color:var(--gold);font-size:60px;line-height:1.05}
.pg-cap span{display:block;font-size:38px;line-height:1.3;margin-top:10px}
.pg-cap small{display:block;font-size:28px;opacity:.85;margin-top:14px}
.pg-dots{display:flex;gap:12px;padding-top:12px}.pg-dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);transition:.3s}.pg-dots i.on{background:var(--gold);transform:scale(1.3)}
.pg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
.pg svg path{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(232,176,75,.8))}
.slide.leaving{animation:leave .35s ease-in both;pointer-events:none}
@keyframes leave{to{opacity:0;transform:scale(.94);filter:blur(4px)}}
#stage.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{translate:-4px 2px}20%,80%{translate:8px -3px}30%,50%,70%{translate:-14px 4px}40%,60%{translate:14px -4px}}

/* entrance animations, staggered with --d */
.slam,.spin,.fl,.fr,.fu,.fd,.pop,.fade,.drop,.flip,.zoom{animation-duration:.8s;animation-delay:var(--d,0s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,1.25,.4,1)}
.slam{animation-name:slam;animation-duration:.75s}
.spin{animation-name:spinIn;animation-duration:1.1s}
.fl{animation-name:fl}.fr{animation-name:fr}.fu{animation-name:fu}.fd{animation-name:fd}
.pop{animation-name:popIn;animation-duration:.6s}
.fade{animation-name:fade;animation-timing-function:ease}
.drop{animation-name:drop;animation-duration:1s;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
.flip{animation-name:flip;animation-duration:.9s}
.zoom{animation-name:zoom;animation-duration:1.2s;animation-timing-function:ease-out}
@keyframes fl{from{transform:translateX(-1400px) rotate(-14deg);opacity:0}}
@keyframes fr{from{transform:translateX(1400px) rotate(14deg);opacity:0}}
@keyframes fu{from{transform:translateY(900px) rotate(6deg);opacity:0}}
@keyframes fd{from{transform:translateY(-900px) rotate(-6deg);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(20px)}}
@keyframes drop{0%{transform:translateY(-1300px) rotate(var(--r,0deg));opacity:0}100%{transform:rotate(var(--r,0deg))}}
@keyframes flip{from{transform:perspective(900px) rotateY(-100deg) scale(.6);opacity:0}}
@keyframes zoom{from{transform:scale(.3);opacity:0;filter:blur(12px)}}

.title-xl{font-family:var(--display);font-size:150px;line-height:1;color:var(--gold);text-shadow:0 8px 0 var(--red-d),0 20px 50px rgba(0,0,0,.6)}
.title-l{font-family:var(--display);font-size:96px;line-height:1.05;color:var(--gold);text-shadow:0 6px 0 var(--red-d)}
.title-m{font-family:var(--display);font-size:72px;line-height:1.05;color:var(--gold);text-shadow:0 5px 0 var(--red-d)}
.eb{text-transform:uppercase;letter-spacing:.3em;font-weight:800;font-size:26px;color:var(--muted)}
.pill{display:inline-block;padding:10px 30px;border-radius:999px;background:var(--red);color:var(--ink);font-weight:800;font-size:30px;letter-spacing:.06em;box-shadow:0 5px 0 var(--red-d)}
.pill.gold{background:var(--gold);color:#2a1c05;box-shadow:0 5px 0 var(--gold-d)}
.motto{font-style:italic;font-size:36px;color:var(--ink);opacity:.9}
.bigbtn{font-size:40px;padding:26px 60px;border-radius:999px}
.card{background:rgba(22,48,42,.92);border-radius:28px;box-shadow:0 0 0 2px var(--line),0 20px 50px rgba(0,0,0,.45)}

/* sunburst for game title slides */
.burst{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,var(--gc) 0 7.5deg,color-mix(in srgb,var(--gc) 72%,#000) 7.5deg 15deg);animation:rays 40s linear infinite;opacity:.95}
.burst+.vign{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 20%,rgba(6,16,12,.85) 75%)}
@keyframes rays{to{transform:rotate(360deg)}}
.gicon{width:300px;height:300px;border-radius:50%;background:#fbf6ea;display:grid;place-items:center;box-shadow:0 0 0 12px var(--gold),0 24px 60px rgba(0,0,0,.5)}
.gicon img{width:62%;height:62%;object-fit:contain}

/* corner controls */
.hud{position:fixed;z-index:45;display:flex;gap:10px;align-items:center}
body:has(.moment) .hud.bl{z-index:54}body:has(.moment) .hud.bl button:not(#mute){visibility:hidden}   /* 🔊 stays reachable during intermission, interviews, etc. */
.hud.br{right:18px;bottom:14px}
.hud.bl{left:18px;bottom:14px}
.hud button{width:44px;height:44px;border-radius:50%;background:rgba(13,31,24,.7);box-shadow:inset 0 0 0 2px var(--line);font-size:18px;opacity:.55;transition:opacity .2s}
.hud button:hover{opacity:1}
#count{font-weight:800;font-size:15px;color:var(--muted);background:rgba(13,31,24,.7);padding:6px 12px;border-radius:999px;opacity:.7;font-variant-numeric:tabular-nums}
.tbcorner{position:absolute;top:64px;right:60px;font-size:26px;padding:14px 28px;z-index:3}
.corner{position:absolute;top:60px;right:200px;display:flex;gap:14px;z-index:6}
.corner .btn{font-size:24px;padding:12px 24px}
/* victor picker */
.vpick{position:fixed;inset:0;z-index:52;background:rgba(6,16,12,.95);display:grid;place-items:center;padding:50px 20px 20px;text-align:center;animation:fade .3s both}
.vpick .faces{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1100px}
.vpick .face{display:grid;justify-items:center;gap:6px;padding:8px;border-radius:18px;transition:transform .15s}
.vpick .face:hover{transform:translateY(-4px);background:rgba(232,176,75,.12)}
.vpick .face img{width:min(110px,12vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--line)}
.vpick .face.on img{box-shadow:0 0 0 6px var(--gold)}
.vpick .face b{font-weight:800;font-size:1.1rem}
.moment .face{display:grid;justify-items:center;gap:6px;padding:8px;border-radius:18px;transition:transform .15s;cursor:pointer}
.moment .face:hover{transform:translateY(-4px);background:rgba(232,176,75,.15)}
.moment .face img{width:min(150px,16vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--gold)}
.moment .face b{font-weight:800;font-size:1.3rem}
.ultimate{display:flex;align-items:center;gap:30px;justify-content:center;padding:18px 40px;border-radius:30px;background:linear-gradient(160deg,rgba(232,176,75,.25),rgba(22,48,42,.95));box-shadow:0 0 0 4px var(--gold),0 0 60px rgba(232,176,75,.35)}
.ultimate img{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--gold),0 0 0 12px var(--red)}

/* themed flying things (cookies on the Smart Cookie Showdown slides) */
.fly{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}  /* behind the slide text */
.fly i{position:absolute;font-style:normal;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));will-change:transform}
.fly i.fall{top:-160px;animation:fall var(--t) linear var(--d) infinite}
.fly i.across{left:-200px;animation:across var(--t) linear var(--d) infinite}
.fly i.boom{left:50%;top:45%;animation:boomOut 1.6s cubic-bezier(.15,.8,.3,1) var(--d) both}
@keyframes fall{to{transform:translate(var(--dx),1400px) rotate(var(--r))}}
@keyframes across{to{transform:translate(2400px,var(--dy)) rotate(var(--r))}}
@keyframes boomOut{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.1);opacity:0}}
.fly .sb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#e4edf6 60%,#a9bfd4 100%);box-shadow:0 8px 16px rgba(0,0,0,.35)}
.fly .sb.arc{animation:arc var(--t) cubic-bezier(.3,.1,.7,.9) var(--d) infinite}
@keyframes arc{0%{transform:translate(0,0)}50%{transform:translate(calc(var(--dx)*.5),var(--up))}100%{transform:translate(var(--dx),var(--down))}}
.fly .sb.hit{animation:hit .55s cubic-bezier(.5,0,1,.6) both}
@keyframes hit{from{transform:translate(-50%,-50%) scale(.15)}to{transform:translate(-50%,-50%) scale(1)}}
.fly .splat{position:absolute;transform:translate(-50%,-50%);animation:melt 2.6s ease-in both}
.fly .splat i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0 55%,#eef4fa 70%,rgba(238,244,250,0) 72%)}
.fly .bb{display:grid;place-items:center;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,var(--bc) 55%,#1a1a1a)}
.fly .bb .f{font-size:.19em;width:3.2em;height:3.2em;border-radius:50%;background:#fbf6ea;color:#13271f;display:grid;place-items:center;align-content:center;font-weight:800;line-height:.95;font-family:var(--body)}
@keyframes melt{0%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-30%) scaleY(1.15)}}
.inter .clock{font-family:var(--display);font-size:min(20vh,16vw);color:var(--gold);line-height:1;text-shadow:0 8px 0 var(--red-d);font-variant-numeric:tabular-nums}
.inter .clock.done{color:#ff6b5e;animation:pulse .5s infinite alternate}
.inter .fact{max-width:1000px;min-height:5.5em;font-size:clamp(1.1rem,2.2vw,1.7rem);font-weight:600;transition:opacity .6s}
.inter .row .btn{font-size:1.2rem}
.inter .row .btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--ink)}
/* keep the Play buttons above flying effects */
.slide a.bigbtn{position:relative;z-index:5}
/* on fire tribute frames */
.fire{position:absolute;inset:-110px -80px -40px;pointer-events:none;z-index:-1}
.fire span{position:absolute;bottom:0;width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);border-radius:50% 50% 30% 30%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 78%,#fff7b0 0 10%,#ffc21a 28%,#ff6a1a 50%,rgba(255,40,0,0) 70%);filter:blur(3px);mix-blend-mode:screen;transform-origin:50% 100%;
  animation:flame var(--s) ease-in-out var(--d) infinite alternate}
.fire span.side{bottom:auto;top:var(--top)}
@keyframes flame{0%{transform:scale(1,.75) translateY(0);opacity:.85}100%{transform:scale(.8,1.25) translateY(-14px);opacity:1}}
.fire .spark{position:absolute;bottom:10%;width:8px;height:8px;border-radius:50%;background:#ffd36b;box-shadow:0 0 10px #ff9a1a;animation:spark var(--s) linear var(--d) infinite}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),-600px);opacity:0}}
/* district effects around a tribute's photo (each district's industry from the books) */
.dfx{position:absolute;inset:-150px -190px -80px;pointer-events:none;z-index:-1}
.dfx .aura{position:absolute;inset:40px 60px 20px;border-radius:60px;background:radial-gradient(ellipse at center,var(--g1) 0%,var(--g1) 38%,var(--g2) 62%,transparent 80%);filter:blur(22px);animation:aura 2.6s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.8;transform:scale(.97)}to{opacity:1;transform:scale(1.06)}}
.dfx i{position:absolute;font-style:normal;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));will-change:transform,opacity}
.dfx i.rise{bottom:0;animation:dRise var(--s) linear var(--d) infinite}
@keyframes dRise{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-980px) rotate(var(--r));opacity:0}}
.dfx i.fall{top:-40px;animation:dFall var(--s) linear var(--d) infinite}
@keyframes dFall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(var(--dx),980px) rotate(var(--r));opacity:0}}
.dfx i.across{left:-60px;animation:dAcross var(--s) linear var(--d) infinite}
@keyframes dAcross{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(840px);opacity:0}}
.dfx i.twinkle{animation:dTw var(--s) ease-in-out var(--d) infinite}
@keyframes dTw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
.dfx .bolt{position:absolute;inset:0;border-radius:40px;background:radial-gradient(ellipse at center,rgba(255,250,200,.95),rgba(255,230,80,.4) 40%,transparent 70%);opacity:0;animation:dBolt 2.4s steps(1) var(--d) infinite}
@keyframes dBolt{0%,100%{opacity:0}8%{opacity:1}11%{opacity:0}14%{opacity:.8}17%{opacity:0}}
.dbadge{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);z-index:4;white-space:nowrap;background:var(--red);color:#fff;font-weight:800;letter-spacing:.14em;font-size:24px;padding:8px 22px;border-radius:999px;box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(0,0,0,.5)}
.qcrown{position:absolute;left:50%;top:auto;bottom:calc(100% - 34px);font-size:140px;line-height:1;transform:translateX(-50%);z-index:3;animation:crownIn 1.2s .6s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
@keyframes crownIn{from{transform:translate(-50%,-900px) rotate(-40deg)}to{transform:translateX(-50%)}}
.chute{position:fixed;left:50%;top:0;z-index:54;display:grid;justify-items:center;animation:chuteDown 3s cubic-bezier(.3,.6,.4,1) both;pointer-events:none}
.chute .canopy{width:300px;height:150px;border-radius:150px 150px 20px 20px;background:repeating-linear-gradient(90deg,#f4f6f8 0 40px,#c9d1d9 40px 80px);box-shadow:inset 0 -12px 20px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.5)}
.chute .lines{width:240px;height:130px;background:linear-gradient(to bottom right,transparent 49%,#ddd 50%,transparent 51%),linear-gradient(to bottom left,transparent 49%,#ddd 50%,transparent 51%)}
.chute .pod{width:120px;height:110px;border-radius:18px;background:linear-gradient(160deg,#eef2f5,#9aa6b2);box-shadow:0 0 0 4px var(--gold),0 10px 30px rgba(0,0,0,.6);display:grid;place-items:center;font-size:56px}
@keyframes chuteDown{0%{transform:translate(-50%,-110%) rotate(-6deg)}40%{transform:translate(-55%,6vh) rotate(5deg)}70%{transform:translate(-46%,10vh) rotate(-4deg)}100%{transform:translate(-50%,12vh) rotate(0)}}
.live{position:fixed;inset:0;z-index:53;background:#000;display:grid;place-items:center}
.live video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.live .tag{position:absolute;top:44px;left:30px;background:#c41e1e;color:#fff;font-weight:800;font-size:clamp(1rem,2vw,1.6rem);padding:.3em .8em;border-radius:8px;letter-spacing:.08em;animation:blinkTag 1.2s infinite}
@keyframes blinkTag{50%{opacity:.6}}
.live .logo{position:absolute;top:40px;right:30px;width:clamp(70px,9vw,130px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.live .lower{position:absolute;left:0;right:0;bottom:0}
.live .lower .bar{background:linear-gradient(90deg,var(--red),#7a1712);color:#fff;font-family:var(--display);font-size:clamp(1.4rem,3.2vw,2.8rem);padding:.25em 1em;display:flex;justify-content:space-between;align-items:center}
.live .ticker{background:#0d1f18;color:var(--gold);font-weight:800;font-size:clamp(1rem,2vw,1.6rem);white-space:nowrap;overflow:hidden;padding:.45em 0;border-top:3px solid var(--gold)}
.live .ticker span{display:inline-block;padding-left:100%;animation:tick 70s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.live .x{position:absolute;top:44px;left:50%;transform:translateX(-50%)}
.interview .q{font-size:clamp(1.8rem,4.2vw,3.6rem);font-weight:800;max-width:26ch;line-height:1.2;min-height:2.5em}
/* Thanksgiving touches */
#leaves{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#leaves i{position:absolute;top:-80px;font-style:normal;opacity:.85;animation:leafFall var(--t) linear var(--d) infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
@keyframes leafFall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--sw),25vh) rotate(90deg)}50%{transform:translate(calc(var(--sw)*-1),50vh) rotate(180deg)}75%{transform:translate(var(--sw),75vh) rotate(270deg)}100%{transform:translate(0,110vh) rotate(360deg)}}
.lights i.fall{background:#ff8a1f!important;box-shadow:0 0 12px #ff8a1f!important}
.tg{display:inline-block;animation:tgBob 1.4s ease-in-out infinite alternate;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tg.r{animation-delay:.7s}
@keyframes tgBob{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-10px) rotate(8deg)}}
/* phones: QR, reactions, live corner */
.qrbox{display:grid;justify-items:center;gap:8px;padding:16px 18px;background:#fbf6ea;color:#13271f;border-radius:22px;box-shadow:0 0 0 6px var(--gold),0 20px 50px rgba(0,0,0,.5)}
.qrbox svg{width:var(--qs,230px);height:var(--qs,230px);display:block}
.qrbox b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--red)}
.qrbox span{font-weight:800;font-size:18px}
.joined{display:flex;flex-wrap:wrap;gap:6px;max-width:520px}
.joined img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold);animation:popIn .5s both}
.preact{position:fixed;z-index:57;pointer-events:none;display:grid;justify-items:center;animation:preact 3.2s ease-out forwards}
.preact .e{font-size:clamp(40px,5vw,80px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.preact .n{font-weight:800;font-size:clamp(14px,1.4vw,22px);background:rgba(13,31,24,.85);color:var(--gold);padding:2px 10px;border-radius:999px;margin-top:-6px}
@keyframes preact{0%{transform:translateY(0) scale(.4);opacity:0}12%{transform:translateY(-6vh) scale(1.15);opacity:1}100%{transform:translateY(-70vh) scale(.9);opacity:0}}
#livecorner{position:fixed;right:14px;bottom:70px;top:200px;z-index:56;display:flex;flex-direction:column-reverse;flex-wrap:wrap-reverse;align-content:flex-start;gap:8px 10px;pointer-events:none}
.livecam{display:grid;justify-items:center;gap:4px;animation:popIn .5s both}
.livecam{gap:2px}
.livecam img{width:clamp(64px,6.2vw,118px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #c41e1e,0 0 0 6px var(--gold),0 8px 18px rgba(0,0,0,.6);background:#000}
.livecam b{font-weight:800;font-size:clamp(10px,.85vw,14px);background:#c41e1e;color:#fff;padding:1px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
#miniqr{position:absolute;top:22px;right:22px;z-index:7;padding:8px 8px 6px;border-radius:14px;box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(0,0,0,.45)}
#miniqr b{font-size:17px}
#miniqr[hidden]{display:none}
/* Gamemaker twists */
.moment.twist{background:radial-gradient(ellipse at center,rgba(90,10,10,.94),rgba(6,10,8,.98))}
.moment.twist.ice{background:radial-gradient(ellipse at center,rgba(40,110,160,.94),rgba(4,16,30,.98))}
.moment.twist.feast{background:radial-gradient(ellipse at center,rgba(120,80,10,.94),rgba(20,12,4,.98))}
.moment.twist .big{font-size:clamp(5rem,16vh,11rem);line-height:1}
.moment.twist .say{font-size:clamp(1.4rem,3vw,2.6rem);font-weight:800;max-width:24ch}
.moment.twist .rule{font-family:var(--display);font-size:clamp(2rem,5vw,4.4rem);color:#fff;background:var(--red);padding:.3em .8em;border-radius:24px;box-shadow:0 0 0 6px var(--gold)}
.tfly{position:fixed;z-index:54;pointer-events:none;font-size:clamp(50px,7vw,120px);animation:tfly var(--t,1.6s) linear forwards}
@keyframes tfly{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(var(--r,0deg))}}
.flash{position:fixed;inset:0;z-index:55;background:#fff;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#banners{position:fixed;left:14px;top:96px;z-index:52;display:grid;gap:6px;justify-items:start;width:max-content;max-width:min(380px,24vw)}
#banners div{background:var(--red);color:#fff;font-weight:800;font-size:clamp(13px,1.3vw,22px);padding:5px 16px;border-radius:999px;box-shadow:0 0 0 3px var(--gold);cursor:pointer;animation:popIn .4s both;text-align:center}
#banners div[data-k="decree"]{background:#6a3c9c}#banners div[data-k^="silence"]{background:#333}#banners div[data-k^="bounty"]{background:#8a5a00}#banners div[data-k^="alliance"]{background:#1f6b4a}#banners div[data-k^="swap"]{background:#2d73a8}
.reel{display:flex;gap:30px;align-items:center;justify-content:center;min-height:240px}
.reel img{width:min(220px,24vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 7px var(--gold)}
.reel .p{font-family:var(--display);font-size:clamp(2rem,4.6vw,4rem);color:#fff;max-width:18ch;line-height:1.1}
.duo{display:flex;gap:26px;align-items:center;justify-content:center}
.duo img{width:min(200px,22vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px var(--gold)}
.duo b{display:block;font-weight:800;font-size:1.4rem;margin-top:6px}
.duo .x{font-size:clamp(3rem,7vh,5rem)}
/* side quests + points */
.moment.quest .qface{width:min(230px,24vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 7px var(--gold),0 0 50px rgba(232,176,75,.6)}
.moment.quest .qclock{font-family:var(--display);font-size:clamp(5rem,16vh,10rem);line-height:1;color:#fff}
.moment.quest .qclock.low{color:#ff6b5b;animation:popIn .4s}
.moment.quest .res{font-family:var(--display);font-size:clamp(3rem,8vw,6rem);line-height:1}
.ptsrow{display:grid;grid-template-columns:60px 70px 1fr 90px;gap:16px;align-items:center;font-size:clamp(1.2rem,2.2vw,2rem);font-weight:800;text-align:left;width:min(820px,90vw)}
.ptsrow img{width:62px;height:62px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.ptsrow .v{text-align:right;color:var(--gold)}
.ptsrow .v.neg{color:#ff8a7a}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:58;background:rgba(13,31,24,.95);color:var(--ink);font-weight:800;font-size:clamp(18px,2vw,30px);padding:12px 26px;border-radius:999px;box-shadow:0 0 0 3px var(--gold);animation:popIn .4s both;pointer-events:none}
.chute{position:fixed;left:50%;top:-30vh;z-index:54;font-size:clamp(90px,12vw,190px);line-height:.9;text-align:center;pointer-events:none;animation:chute 4.2s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes chute{0%{transform:translate(-50%,0) rotate(-8deg)}25%{transform:translate(-40%,30vh) rotate(8deg)}50%{transform:translate(-58%,55vh) rotate(-6deg)}75%{transform:translate(-46%,75vh) rotate(5deg)}100%{transform:translate(-50%,130vh) rotate(0)}}
/* votes, bets, snitches, draft, awards, photo booth */
.vgrid2{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 22px;width:min(1500px,92vw)}
.vgrid2 .vc{display:grid;justify-items:center;gap:4px;position:relative}
.vgrid2 img{width:min(120px,12vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--line);transition:box-shadow .3s,transform .3s}
.vgrid2 .vc.lead img{box-shadow:0 0 0 6px var(--gold);transform:scale(1.08)}
.vgrid2 b{font-weight:800;font-size:1.1rem}
.vgrid2 .n{position:absolute;top:-6px;right:12%;min-width:42px;height:42px;border-radius:21px;background:var(--red);color:#fff;font-weight:900;font-size:1.4rem;display:grid;place-items:center;box-shadow:0 0 0 3px var(--gold)}
.vgrid2 .n:empty{display:none}
.snitch{position:fixed;left:18px;bottom:80px;z-index:58;display:flex;gap:12px;align-items:center;background:#2a0a0a;border-radius:20px;padding:12px 18px;box-shadow:0 0 0 3px #ff4d4d,0 14px 30px rgba(0,0,0,.6);animation:popIn .4s both;max-width:min(640px,60vw)}
.snitch img{width:70px;height:70px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.snitch div{font-weight:800;font-size:clamp(16px,1.6vw,26px);line-height:1.2}
.draftrow{display:grid;grid-template-columns:110px 66px 1fr 70px;gap:12px;align-items:center;font-size:clamp(1.1rem,1.8vw,1.7rem);font-weight:800;text-align:left;width:min(700px,44vw);animation:popIn .5s both}
.draftrow img{width:60px;height:60px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.draftrow .pk{font-family:var(--display);color:var(--gold)}
.award{display:grid;justify-items:center;gap:10px;animation:popIn .6s both}
.award img{width:min(240px,26vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px var(--gold),0 0 60px rgba(232,176,75,.6)}
.booth{position:relative;width:min(1100px,86vw);aspect-ratio:16/9;border-radius:26px;overflow:hidden;box-shadow:0 0 0 10px var(--gold),0 0 0 20px var(--red)}
.booth video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
.booth .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-family:var(--display);font-size:clamp(1.6rem,3.4vw,3rem);color:var(--gold);text-shadow:0 3px 0 var(--red-d)}
.booth .cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(6rem,18vh,12rem);color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.6)}
.flashw{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:flash .6s ease-out forwards}
/* 📸 phone photo toast + 🕯️ fallen tributes */
.phtoast{position:fixed;left:40px;bottom:96px;z-index:57;background:#fbf6ea;padding:12px 12px 44px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-4deg);width:min(300px,20vw);animation:phin .5s both}
.phtoast img{width:100%;display:block;border-radius:2px}.phtoast b{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#2a1a10;font:800 20px Outfit,sans-serif}
@keyframes phin{from{opacity:0;transform:translateY(40px) rotate(-12deg)}}
.moment.fallen{background:radial-gradient(ellipse at 50% 35%,rgba(30,34,48,.96),rgba(3,5,8,.99))}
.fallen .fl{display:grid;grid-template-columns:auto auto;gap:60px;align-items:center;justify-content:center;animation:flin 1.6s both}
@keyframes flin{from{opacity:0;filter:blur(8px)}}
.fallen .pol{background:#f3ecdc;padding:18px 18px 70px;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.7);transform:rotate(var(--r,-4deg));filter:grayscale(.55) sepia(.25);position:relative}
.fallen .pol img{width:min(520px,34vw);max-height:62vh;object-fit:cover;display:block}
.fallen .pol b{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:400 30px Rye,Georgia,serif;color:#3a2a1a}
.fallen .txt{text-align:left;display:grid;gap:14px;max-width:640px}
.fallen .eb2{letter-spacing:.4em;font-weight:800;color:#c9c2b0;font-size:22px}
.fallen h1{font-family:var(--display);font-weight:400;color:#e8dcc0;font-size:clamp(3rem,6vw,6rem);line-height:1;margin:0;text-shadow:0 6px 0 rgba(0,0,0,.6)}
.fallen .dist{font-weight:800;letter-spacing:.2em;color:var(--gold);font-size:24px}
.fallen .line{font-size:clamp(1.4rem,2.4vw,2.2rem);font-style:italic;color:#ddd5c4}
.fallen .bar{position:fixed;bottom:22px;left:0;right:0;display:flex;gap:12px;justify-content:center}
.fallen .grp{display:grid;gap:26px;justify-items:center;animation:flin 2s both}
.fallen .grp .faces{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1100px}
.fallen .grp .faces img{width:110px;height:110px;border-radius:50%;object-fit:cover;filter:grayscale(.6);box-shadow:0 0 0 4px rgba(232,176,75,.6)}
@media (max-height:900px){.fallen .pol img{max-height:52vh;width:min(420px,32vw)}.fallen .grp .faces img{width:84px;height:84px}}
.polaroid{position:fixed;right:40px;bottom:90px;z-index:8;background:#fbf6ea;padding:14px 14px 50px;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(4deg);width:min(460px,28vw)}
.polaroid img{width:100%;display:block;border-radius:3px}
.polaroid.drift{right:auto;bottom:auto;z-index:-1;width:min(250px,14vw);padding:9px 9px 34px;transition:left 14s ease-in-out,top 14s ease-in-out,transform 14s ease-in-out,opacity .9s;opacity:0;pointer-events:none}
.polaroid.drift b{bottom:8px;font-size:clamp(11px,1vw,16px)}
.polaroid b{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#13271f;font-family:var(--display);font-size:clamp(14px,1.4vw,22px)}
/* news ticker, arena clock, shout-outs, rehearsal badge */
#ticker{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(1300px,66vw);height:56px;z-index:50;display:flex;align-items:center;overflow:hidden;border-radius:999px;background:rgba(10,20,16,.92);box-shadow:0 0 0 2px var(--gold);pointer-events:none}
#ticker b{flex:none;background:var(--red);color:#fff;font-weight:900;letter-spacing:.12em;font-size:20px;height:100%;display:grid;place-items:center;padding:0 16px;z-index:1}
#ticker .tk{flex:1;overflow:hidden;position:relative;height:100%}
#ticker .tk span{position:absolute;white-space:nowrap;top:50%;transform:translate(100%,-50%);left:0;font-weight:700;font-size:26px;color:var(--ink)}
#arenaclock{position:fixed;left:56px;top:28px;z-index:51;font-family:var(--display);font-size:clamp(26px,2.6vw,46px);color:#fff;background:rgba(110,23,18,.92);padding:6px 20px;border-radius:16px;box-shadow:0 0 0 3px var(--gold);pointer-events:none}
#arenaclock.low{animation:popIn .5s infinite alternate;background:#c41e1e}
.shout{position:fixed;z-index:57;left:100vw;white-space:nowrap;font-weight:900;font-size:clamp(24px,3vw,48px);color:#fff;background:rgba(110,23,18,.9);padding:10px 26px;border-radius:999px;box-shadow:0 0 0 4px var(--gold);animation:shout 11s linear forwards;pointer-events:none}
@keyframes shout{to{transform:translateX(calc(-100vw - 110%))}}
#rehearsal{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:62;background:#7a3fb0;color:#fff;font-weight:900;letter-spacing:.2em;font-size:14px;padding:3px 14px;border-radius:999px;pointer-events:none}
/* 📲 tap race */
.track{display:grid;gap:8px;width:min(1240px,86vw)}
.lane{position:relative;height:clamp(44px,6vh,66px);border-radius:999px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 40px,rgba(255,255,255,.02) 40px 80px);box-shadow:inset 0 0 0 2px var(--line)}
.lane::after{content:"🏁";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:clamp(24px,3vh,38px)}
.lane .rn{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;transition:left .9s linear,transform .9s linear;white-space:nowrap}
.lane img{width:clamp(40px,5.4vh,60px);height:clamp(40px,5.4vh,60px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.lane b{font-weight:800;font-size:clamp(14px,1.4vw,22px);background:rgba(13,31,24,.85);padding:2px 10px;border-radius:999px}
.lane.win{box-shadow:inset 0 0 0 3px var(--gold),0 0 30px rgba(232,176,75,.6)}
.racego{font-family:var(--display);font-size:clamp(4rem,12vh,8rem);color:#fff;line-height:1;min-height:1em}
/* bounty board, coronation, birthday */
.bboard{display:grid;gap:10px;width:min(1200px,88vw);text-align:left}
.bboard .it{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.07);border-radius:16px;padding:12px 18px;font-weight:800;font-size:clamp(1.1rem,2vw,1.8rem)}
.bboard .it button{margin-left:auto;font-size:1rem}
.crowned{position:relative;display:inline-block}
.coro.many .crowned img{width:min(260px,28vh)}.coro.many .crowned .cr{font-size:110px;top:-86px}.coro.many h1{font-size:clamp(1.8rem,3.6vw,3.4rem);max-width:30vw}
.crowned img{width:min(380px,40vh);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px var(--gold),0 0 0 22px #6a3c9c,0 0 90px rgba(232,176,75,.8)}
.crowned .cr{position:absolute;left:50%;top:-130px;font-size:170px;transform:translateX(-50%);animation:crownIn 1.6s 1.2s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.balloon{position:fixed;bottom:-140px;z-index:56;font-size:clamp(60px,7vw,110px);pointer-events:none;animation:balloon var(--s) ease-in var(--d) forwards}
@keyframes balloon{to{transform:translate(var(--dx),-130vh) rotate(var(--r))}}
.tb,#xm-tb{z-index:56!important}
@media (max-height:820px){.moment.inter .clock{font-size:clamp(3rem,9vh,6rem)!important}.moment.inter .qrbox svg{width:90px!important;height:90px!important}.moment.inter h1{font-size:clamp(2rem,6vh,4rem)}}
/* lobby */
.lobbycard{position:relative;width:560px;height:520px}
/* who's joined on their phone: all 12 tributes, dim until they join */
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 8px;width:770px;margin-top:8px}
.tgrid .t{display:grid;justify-items:center;gap:4px;opacity:.32;filter:grayscale(1);transition:opacity .5s,filter .5s}
.tgrid .t img{width:70px;height:70px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.tgrid .t span{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:0;line-height:1.05;text-align:center;white-space:normal;max-width:126px}
.tgrid .t.in{opacity:1;filter:none}.tgrid .t.in img{box-shadow:0 0 0 4px var(--gold),0 0 18px rgba(232,176,75,.6)}
.tgrid .t.in::after{content:"✓";position:absolute;margin:-4px 0 0 52px;width:24px;height:24px;border-radius:50%;background:#19a35a;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.tgrid .t{position:relative}.tgrid .t.pop{animation:popIn .6s cubic-bezier(.2,1.8,.4,1)}
.jhead{font-size:26px;font-weight:800;margin-top:14px;text-align:center;width:560px}.jhead b{color:var(--gold);font-size:34px}
.jnew{position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:3;background:var(--gold);color:#2a1c05;font-weight:900;font-size:30px;padding:10px 26px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;animation:popIn .5s cubic-bezier(.2,1.8,.4,1)}
.lobbycard .lc{position:absolute;inset:0;display:grid;justify-items:center;align-content:start;gap:18px;opacity:0;transition:opacity .35s ease,transform .6s ease;transform:scale(.94)}
.lobbycard .lc.on{transition-delay:.35s}
.lobbycard .lc.on{opacity:1;transform:none}
.lobbycard img{width:340px;height:340px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px var(--gold),0 0 0 22px var(--red),0 30px 70px rgba(0,0,0,.6)}
/* full-screen moments: intermission, unboxing, interview, photo */
/* ✅ APPROVED stamp on profiles */
.apstamp{position:absolute;right:-30px;bottom:90px;z-index:20;display:grid;justify-items:center;padding:12px 30px 14px;border:10px double #c0261d;border-radius:16px;color:#c0261d;
  font-family:var(--display);font-size:66px;line-height:.95;letter-spacing:.04em;transform:rotate(-14deg);background:rgba(255,248,240,.9);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:stampIn .32s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.apstamp small{font-family:var(--body,inherit);font-size:22px;font-weight:900;letter-spacing:.22em}
@keyframes stampIn{from{opacity:0;transform:rotate(-14deg) scale(2.6)}}
/* 🥣 Reaping bowl on Meet the Tributes */
.reaprow{display:flex;align-items:center;justify-content:center;gap:60px}
.bowl{position:relative;width:230px;height:170px}
.bowl .glass{position:absolute;inset:0;border-radius:0 0 115px 115px;background:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.45),rgba(200,230,255,.10) 45%,rgba(255,255,255,.05));
  box-shadow:inset 0 -8px 20px rgba(255,255,255,.18),0 0 0 4px rgba(255,255,255,.35),0 18px 30px rgba(0,0,0,.4);overflow:hidden}
.bowl .glass::before{content:"";position:absolute;left:-6%;right:-6%;top:-10px;height:22px;border-radius:50%;border:4px solid rgba(255,255,255,.45)}
.bowl .slips{position:absolute;left:18px;right:18px;bottom:14px;height:70px}
.bowl .slips i{position:absolute;width:46px;height:22px;background:#fbf6ea;border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.bowl .pulled{position:absolute;left:50%;top:40px;z-index:3;transform:translateX(-50%);background:#fbf6ea;color:#13271f;font-family:var(--display);font-size:30px;padding:8px 18px;border-radius:6px;
  white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.5);animation:slipUp .5s cubic-bezier(.2,1.4,.5,1) both}
@keyframes slipUp{from{opacity:0;transform:translate(-50%,60px) rotate(-10deg) scale(.5)}to{opacity:1;transform:translate(-50%,-70px) rotate(-4deg)}}
.rp{opacity:0;transform:scale(.5) rotateY(90deg);transition:opacity .35s,transform .5s cubic-bezier(.2,1.5,.5,1)}
.rp.in{opacity:1;transform:none}
/* 👑 ALL RISE flash */
.allrise{position:fixed;left:50%;top:50%;z-index:52;transform:translate(-50%,-50%);font-family:var(--display);font-size:140px;padding:20px 70px 30px;border-radius:40px;background:rgba(28,8,40,.9);box-shadow:0 0 0 6px var(--gold),0 30px 80px rgba(0,0,0,.6);color:var(--gold);text-shadow:0 10px 0 var(--red-d),0 0 60px rgba(255,210,120,.6);
  pointer-events:none;animation:riseIn 3.6s ease both;white-space:nowrap}
@keyframes riseIn{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-55%)}}
/* 🚪 lobby entrance */
.lobbycard .lc.enter img{box-shadow:0 0 0 8px var(--gold),0 0 60px 20px rgba(255,200,90,.55)!important}
.lobbycard .entertag{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:900;font-size:26px;padding:8px 20px;border-radius:999px;white-space:nowrap;z-index:3;
  box-shadow:0 0 0 4px var(--gold);animation:slipIn .4s both}
@keyframes slipIn{from{opacity:0;transform:translate(-50%,20px)}}
/* 🎖️ Victory Tour */
.moment.vtour .vt{display:grid;justify-items:center;gap:18px}
.vt .gtile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.vt .gtile img{width:62%}
.vt .ph{position:relative;width:260px;height:260px}
.vt .ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px var(--gold),0 0 0 16px var(--red)}
.vt .crown{position:absolute;left:50%;top:-110px;font-size:140px;transform:translateX(-50%);animation:crownDrop 1s cubic-bezier(.4,1.6,.5,1) both}
@keyframes crownDrop{from{opacity:0;transform:translate(-50%,-260px) rotate(-30deg)}}
.vt .cardin{animation:vtIn .55s cubic-bezier(.2,1.3,.5,1) both}
@keyframes vtIn{from{opacity:0;transform:scale(.6) translateY(40px)}}
.moment{position:fixed;inset:0;z-index:53;display:grid;place-items:safe center;text-align:center;padding:50px 20px 20px;background:rgba(6,16,12,.96);animation:fade .25s both;overflow-y:auto;overscroll-behavior:contain}
.moment .xcorner{position:fixed;top:14px;right:18px;z-index:2}
.moment .inner{display:grid;justify-items:center;gap:clamp(10px,2vh,22px);max-width:1300px}
.moment .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media (max-height:1000px){
  .moment{padding:28px 16px 14px}
  .moment .inner{gap:clamp(6px,1.3vh,14px)}
  .moment h1{font-size:clamp(2rem,7vh,4.4rem)}
  .moment.twist .big{font-size:clamp(3.5rem,11vh,7rem)}
  .moment.twist .say{font-size:clamp(1.1rem,3.2vh,2rem)}
  .moment.twist .rule{font-size:clamp(1.6rem,5vh,3.2rem)}
  .moment.quest .qface{width:16vh}
  .moment.quest .qclock{font-size:clamp(3.5rem,11vh,7rem)}
  .moment .btn{padding:.55em 1.3em}
  .vgrid2{gap:8px 16px}.vgrid2 img{width:min(110px,9.5vh)}.vgrid2 b{font-size:1rem}
  .duo img{width:min(180px,17vh)}
  .reel{min-height:0}.reel img{width:min(200px,18vh)}
  .lane{height:clamp(36px,4.6vh,60px)}.lane img{width:clamp(32px,4.2vh,56px);height:clamp(32px,4.2vh,56px)}
  .moment .ptsrow img{width:48px;height:48px}
}
.moment h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,6rem);color:var(--gold);text-shadow:0 5px 0 var(--red-d);line-height:1;margin:0}
.capint{background:rgba(40,4,4,.96)}
.capint::before{content:"";position:absolute;inset:0;pointer-events:none;animation:alarm .5s steps(2) 6;background:rgba(255,40,40,.35)}
@keyframes alarm{50%{opacity:0}}
.capint .victim img{width:clamp(160px,28vh,280px);aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px var(--gold),0 0 0 16px var(--red)}
.capint .victim b{display:block;font-family:var(--display);font-size:clamp(2rem,5vw,4rem);color:#fff;margin-top:10px}
.capint .dare{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:800;max-width:24ch;line-height:1.2;min-height:2.6em}
.unbox .gift{font-size:clamp(6rem,16vh,10rem);animation:shakeg .18s infinite alternate}
@keyframes shakeg{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.06)}}
.unbox::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 18%,rgba(0,0,0,.75) 55%)}
.unbox .inner{position:relative;z-index:1}
.photo .num{font-family:var(--display);font-size:min(50vh,40vw);color:var(--gold);line-height:1;text-shadow:0 10px 0 var(--red-d)}
.photo .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.rate{font-size:1.4rem;padding:.8em 1.6em}
/* start screen */
#start{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(6,16,12,.9);text-align:center;cursor:pointer}
#start img{width:min(240px,40vw);animation:bob 1.4s ease-in-out infinite alternate}
#start h1{font-size:clamp(2rem,5vw,4rem);color:var(--gold);text-shadow:0 4px 0 var(--red-d);margin:18px 0 8px}
#start p{font-size:clamp(1rem,2vw,1.4rem);color:var(--muted);margin:6px}
@keyframes bob{to{transform:translateY(-10px) rotate(3deg)}}

/* tribute bits */
.ring{border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px var(--gold),0 0 0 22px var(--red),0 30px 70px rgba(0,0,0,.6)}
.dtag{position:absolute;background:var(--red);color:var(--ink);font-family:var(--display);font-size:40px;padding:8px 26px;border-radius:12px;box-shadow:0 6px 0 var(--red-d);transform:rotate(-8deg)}
.stat{display:flex;align-items:center;gap:26px;padding:22px 30px;text-align:left}
.stat img{width:76px;height:76px;object-fit:contain;flex:none}
.stat .k{font-size:20px;letter-spacing:.2em;font-weight:800;color:var(--muted)}
.stat .v{font-size:40px;font-weight:800;line-height:1.15}

/* steps */
.step{display:flex;align-items:center;gap:28px;text-align:left;padding:22px 30px}
.step .n{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:42px;color:#fff;background:var(--gc);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.step .t{font-size:38px;font-weight:600;line-height:1.2}

/* polaroids */
.pola{position:absolute;background:#fbf6ea;padding:18px 18px 70px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.pola img{display:block;width:300px;height:300px;object-fit:cover}
.memorial{position:fixed;inset:0;z-index:55;background:#050b08;display:grid;place-items:center;overflow:hidden}
.memorial .ph{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 2.2s ease}
.memorial .ph.on{opacity:1}
.memorial .ph .pola{position:relative;padding:3vh 3vh 11vh}
.memorial .ph img{width:min(62vh,70vw);height:min(62vh,70vw)}
.memorial .ph.on .pola{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(.92) rotate(var(--r))}to{transform:scale(1.04) rotate(calc(var(--r) * -1))}}
.memorial .cap{position:absolute;bottom:4vh;left:0;right:0;text-align:center;font-family:var(--display);color:var(--gold);font-size:clamp(1.2rem,3vw,2.4rem);text-shadow:0 3px 0 #000}
.memorial .x{position:absolute;top:46px;right:20px;z-index:2}
.memorial::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.85) 100%);animation:flick 3s infinite alternate}
@keyframes flick{50%{opacity:.85}}

/* victors board */
.vcard{display:flex;align-items:center;gap:22px;padding:14px 24px;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;width:100%}
.vcard:hover{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.45)}
.vcard .ic{width:84px;height:84px;border-radius:20px;background:var(--gc);display:grid;place-items:center;flex:none}
.vcard .ic img{width:62%;height:62%;object-fit:contain}
.vcard .gn{font-size:24px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.vcard .vn{font-size:40px;font-weight:800;display:flex;align-items:center;gap:14px;min-height:56px}
.vcard .vn .lab{color:var(--gold);font-family:var(--display);font-weight:400}
.vcard .vn img{width:56px;height:56px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.vcard .sec2{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font-size:30px;font-weight:800;color:var(--muted);padding:2px 10px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line)}
.vcard .sec2:hover{color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold)}
.vcard .sec2 img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.vcard input{font:inherit;font-weight:800;font-size:36px;width:100%;background:rgba(0,0,0,.35);color:var(--ink);border:3px solid var(--gold);border-radius:14px;padding:4px 14px}

/* order shuffle */
.ochips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1500px}
.ochip{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-size:24px;background:rgba(13,31,24,.6)}
.ochip img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.ochip[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
.ogrid{display:grid;grid-template-columns:repeat(6,220px);gap:22px;justify-content:center}
.oslot{position:relative;cursor:default;display:grid;justify-items:center;gap:8px;padding:18px 10px;border-radius:24px}
.oslot img{width:140px;height:140px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 5px var(--gold)}
.oslot b{font-size:28px;font-weight:800}
.oslot .num{position:absolute;top:4px;left:18px;width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-size:34px;display:grid;place-items:center;box-shadow:0 4px 0 var(--red-d);z-index:1}
.oslot.first img{box-shadow:0 0 0 7px var(--gold),0 0 40px rgba(232,176,75,.8)}
.oslot.blur img{filter:blur(3px) brightness(.8)}

/* video */
.vframe{width:1340px;height:754px;border-radius:28px;background:#05100c;box-shadow:0 0 0 8px var(--gold),0 0 0 16px var(--red-d),0 30px 80px rgba(0,0,0,.6);overflow:hidden;position:relative;display:grid;place-items:center}
.vframe video{width:100%;height:100%;background:#000}
.soon{display:grid;justify-items:center;gap:22px}
.soon img{width:200px;animation:pulseb 1.6s ease-in-out infinite alternate}
@keyframes pulseb{to{transform:scale(1.1);filter:drop-shadow(0 0 30px rgba(232,176,75,.7))}}
.wheelimg{width:640px;height:640px;filter:drop-shadow(0 25px 50px rgba(0,0,0,.6))}
.ball{width:420px;height:420px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0 8%,#17998a 60%,#053b33);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.ball .face{width:62%;aspect-ratio:1;border-radius:50%;background:#fbf6ea;color:#13271f;display:grid;place-items:center;align-content:center;line-height:.9}
@media (prefers-reduced-motion:reduce){.slide *{animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="leaves" aria-hidden="true"></div>
<div id="lights"></div>
<div id="stage" aria-live="polite"></div>
<div id="livecorner" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="hud bl"><button id="intbtn" aria-label="Intermission" title="Intermission (I)">☕</button><button id="livebtn" aria-label="Live broadcast" title="Live broadcast (W)">🎥</button><button data-mute id="mute" aria-label="Mute sound" title="Mute (M)">🔊</button><button id="fs" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button></div>
<div class="hud br"><button id="prev" aria-label="Previous slide">◀</button><span id="count">1 / 1</span><button id="next" aria-label="Next slide">▶</button></div>
<div id="start" role="button" tabindex="0" aria-label="Start the show">
  <div><img src="/xmas/emblem.png" alt=""><h1>The 2026 Christmas Games</h1><p>Gamemaker, click anywhere to start the show (sound on).</p>
  <p style="font-size:1rem"><a href="/cheatsheet" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--gold)">📋 Gamemaker cheat sheet</a></p>
  <p style="font-size:1rem">→ / Space / click: next · ←: back · F: fullscreen · M: mute</p></div>
</div>
<script src="/xmas/xmas.js"></script>
<script src="/qrcode.js"></script>
<script src="/remote-tv.js"></script>
<script>XM.useNicknames()</script>
<script>
const {esc,TRIBUTES,GAMES,TB}=XM;
document.getElementById("lights").outerHTML=XM.lights(30);
const SNOW=XM.snow(document.getElementById("snow"));
// autumn leaves drifting with the snow, and some pumpkin-orange bulbs in the lights
(()=>{const R=(a,b)=>a+Math.random()*(b-a);document.getElementById("leaves").innerHTML=Array.from({length:14},(_,k)=>
  `<i style="left:${R(0,98)}vw;font-size:${R(22,46)}px;--t:${R(11,20)}s;--d:${-R(0,20)}s;--sw:${R(30,90)}px">${["🍁","🍂","🍁","🍂","🍃"][k%5]}</i>`).join("");
  document.querySelectorAll(".lights i").forEach((b,i)=>{if(i%5===2)b.classList.add("fall")})})();
const stage=document.getElementById("stage");
const ICON=k=>`/xmas/icons/${k}.png`;

/* ---------- helpers ---------- */
const d=s=>`data-d="${s}"`;
const victorLabel=g=>{const v=XM.victors()[g],s2=XM.seconds()[g];return v?`🏆 ${esc(v)}${s2?` · 🥈 ${esc(s2)}`:""}`:"🏆 Record victor"};
const AWARD={treasure:"💎",mystery:"❓",junk:"🗑️"};
const awards=()=>XM.store.get("xmas-awards",{});
const tbBtn=g=>`<div class="corner" data-corner="${g}">${g!=="mitten"&&XM.victors()[g]?`<button class="btn ghost" data-interview="${g}" title="Victor's interview">🎤</button>`:""}${g!=="mitten"&&XM.victors()[g]?`<button class="btn ghost" data-unbox="${g}">🎁 ${[awards()[g],awards()[g+"_2"]].filter(Boolean).map(r=>AWARD[r]).join("")||"Unbox"}</button>`:""}${g!=="mitten"?`<button class="btn ${XM.victors()[g]?"":"ghost"}" data-victor="${g}">${victorLabel(g)}</button>`:""}${GAMES[g].tb?`<button class="btn red" data-tb="${g}">⚔️ Tiebreaker</button>`:""}</div>`;
const openBtn=(url,label,cls="")=>`<a class="btn bigbtn ${cls}" href="${url}" target="_blank" rel="noopener">${label}</a>`;

// st(): like setTimeout, but skipped if the presenter has already moved to another slide
function st(fn,ms){const el=curEl;return setTimeout(()=>{if(curEl===el)fn()},ms)}
/* ---------- slide builders ---------- */
function gameTitle(k){
  const g=GAMES[k];
  return {id:"game-"+k,music:"hh_"+k,enter(el){XM.sfx("gong");st(()=>XM.sfx("stinger"),500);st(()=>XM.confetti(90),900);
      // excited announcer: "Game three! ... Mitten Mayhem!"
      announcer.stop();const my=announcer.gen(),ok=()=>my===announcer.gen()&&curEl===el;
      st(()=>ok()&&announcer.say(`Game ${NUM[g.n]}!`,()=>st(()=>ok()&&announcer.say(`${g.name.replace("?","")}!`,null,{pitch:1.35,rate:1.12,female:true}),200),{pitch:1.3,rate:1.1,female:true,fallback:700}),900)},
    html:()=>`<div class="burst" style="--gc:${g.color}"></div><div class="vign"></div>${tbBtn(k)}
    <div style="position:relative;display:grid;justify-items:center;gap:34px">
      <span class="pill drop" ${d(.1)}>GAME ${g.n}</span>
      <div class="gicon spin" ${d(.3)}><img src="${ICON(k)}" alt=""></div>
      <h1 class="title-xl slam" ${d(.9)} style="font-size:130px;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.45),0 20px 50px rgba(0,0,0,.6)">${esc(g.name)}</h1>
      ${g.url?openBtn(g.url,`▶ Play ${esc(g.name)}`,"pop"):`<span class="pill gold pop" ${d(1.4)}>${esc(g.tag)}</span>`}
      ${g.url?`<div class="fade" ${d(1.6)} style="font-size:24px;color:var(--ink);opacity:.85">Close that tab when the game ends.</div>`:""}
    </div>`};
}
function howTo(k,steps,win,extra=""){
  const g=GAMES[k];
  return {id:"how-"+k,music:null,html:()=>`${tbBtn(k)}<div style="--gc:${g.color};display:grid;gap:40px;width:100%">
    <div><div class="eb fd" ${d(0)}>${esc(g.name)}</div><h1 class="title-l slam" ${d(.15)}>How to Play</h1></div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:50px;align-items:center">
      <div style="display:grid;gap:22px">${steps.map((s,i)=>`<div class="card step" data-say="Step ${i+1}. ${esc(s)}" data-anim="fl" style="opacity:0"><span class="n">${i+1}</span><span class="t">${esc(s)}</span></div>`).join("")}</div>
      <div class="card" data-say="How to win. ${esc(win)}" data-anim="pop" style="opacity:0;padding:50px 40px;display:grid;justify-items:center;gap:20px;box-shadow:0 0 0 4px var(--gold),0 20px 50px rgba(0,0,0,.5)">
        <img src="${ICON("trophy")}" alt="" style="width:150px" class="spin"><div class="eb" style="color:var(--gold)">HOW TO WIN</div>
        <div style="font-size:38px;font-weight:600;line-height:1.25">${esc(win)}</div>${extra}</div>
    </div></div>`,enter(el){narrate(el,`How to play. ${g.name.replace("?","")}.`)}};
}
function wheelSlide(k){
  const g=GAMES[k];
  return {id:"wheel-"+k,music:null,html:()=>`${tbBtn(k)}<div style="display:grid;grid-template-columns:auto 1fr;gap:80px;align-items:center;text-align:left">
    <img class="wheelimg zoom" src="${ICON("wheel")}" alt="" id="wimg">
    <div style="display:grid;gap:28px;justify-items:start">
      <div class="eb fr" ${d(.2)}>WHO'S FACING WHO?</div>
      <h1 class="title-l slam" ${d(.4)}>Spin the Matchup Wheel</h1>
      <p class="fr" ${d(.8)} style="font-size:38px;line-height:1.3;margin:0;max-width:24ch">Win your face-off, stay on the wheel. Last one standing wins.</p>
      <div class="pop" ${d(1.2)}>${openBtn("/wheel#"+k,"🎡 SPIN THE WHEEL","red")}</div>
      <div class="fade" ${d(1.4)} style="font-size:24px;opacity:.8">Close the wheel tab to come back.</div>
    </div></div>`,
    enter(el){const w=el.querySelector("#wimg");XM.sfx("whoosh");w.animate([{transform:"rotate(0)"},{transform:"rotate(1440deg)"}],{duration:3500,easing:"cubic-bezier(.1,.7,.2,1)",fill:"forwards"});
      let n=0;const t=setInterval(()=>{if(curEl!==el){clearInterval(t);return}XM.sfx("tick");if(++n>18)clearInterval(t)},90+n*4);st(()=>clearInterval(t),3000)}};
}
const VIDNAME={cookie:"smart-cookie-showdown",scoop:"blind-snowball-scoop",lrc:"left-right-capitol"};
function videoSlide(k){
  const g=GAMES[k];
  return {id:"video-"+k,music:"stop",html:()=>`${tbBtn(k)}<div style="display:grid;justify-items:center;gap:30px">
    <h1 class="title-l slam" ${d(0)}>Watch How It's Done</h1>
    <div class="vframe zoom" ${d(.3)} id="vf"></div>
    <div class="fade" ${d(.8)} style="font-size:30px">${esc(g.name)}: the how-to video</div></div>`,
    enter(el){loadVideo(k,el.querySelector("#vf"))},leave(el){const v=el.querySelector("video");if(v)v.pause()}};
}
function tieSlide(k){
  const g=GAMES[k],t=TB[g.tb];
  return {id:"tie-"+k,music:null,html:()=>`<div style="display:grid;justify-items:center;gap:30px">
    <div class="eb fd">${esc(g.name)}</div><h1 class="title-xl slam" ${d(.2)} style="font-size:120px">Was There a Tie?</h1>
    <div class="card flip" ${d(.9)} style="padding:36px 60px;display:grid;justify-items:center;gap:14px;max-width:1200px">
      <div style="font-size:90px" class="spin" ${d(1.1)}>${t.ic}</div>
      <div class="eb" style="color:var(--gold)">THIS GAME'S TIEBREAKER</div>
      <div style="font-family:var(--display);font-size:64px;color:var(--gold)">${esc(t.title)}</div>
      <div style="font-size:34px;line-height:1.3">${esc(t.rules)}</div></div>
    <div class="pop" ${d(1.6)} style="display:flex;gap:30px"><button class="btn red bigbtn" data-tb="${k}">⚔️ Yes, there's a tie</button><button class="btn bigbtn" data-notie="${k}">No tie: record the victor ▶</button></div>
    </div>`,
    enter(){st(()=>XM.sfx("thud"),400)}};
}
// "HOW TO PLAY... IDK. ASK ___." joke slide (Mitten Mayhem, Left Right Capitol)
function idkSlide(k,img,who,spoken){
  return {id:"idk-"+k,music:"stop",html:()=>`${tbBtn(k)}<div style="display:grid;justify-items:center;gap:24px;height:100%;grid-template-rows:auto 1fr auto">

/* ---------- engine ---------- */
let cur=-1,started=false,curEl=null;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();
function shake(){stage.classList.remove("shake");void stage.offsetWidth;stage.classList.add("shake")}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));if(i===cur&&curEl)return;
  const old=curEl,oldS=SLIDES[cur];announcer.stop();
  if(old){if(oldS.leave)oldS.leave(old);old.classList.add("leaving");setTimeout(()=>old.remove(),360)}
  cur=i;const s=SLIDES[i];
  const el=document.createElement("section");el.className="slide";el.setAttribute("aria-label",s.id);el.innerHTML=s.html();el.querySelectorAll("[data-d]").forEach(n=>n.style.setProperty("--d",n.dataset.d+"s"));stage.appendChild(el);curEl=el;
  try{history.replaceState(null,"","#"+s.id)}catch(e){}XM.store.set("xmas-slide",s.id);
  document.getElementById("count").textContent=`${i+1} / ${SLIDES.length}`;
  {const tk=document.getElementById("ticker");if(tk)tk.style.display=s.id==="lobby"||s.id==="phoneguide"||s.big||/^(idk|video)-/.test(s.id)?"none":""}
  if(started){
    // "until the next game" reminders go away when a game starts
    if(s.id.startsWith("game-"))document.querySelectorAll('#banners [data-k^="swap:"],#banners [data-k^="silence:"],#banners [data-k^="bounty:"],#banners [data-k^="alliance:"]').forEach(b=>b.remove());
    if(s.music==="stop")XM.stopSong();else if(s.music)XM.playSong(s.music);
    beginTrack(s.id);
    // every slam lands with a thump and a little screen shake
    el.querySelectorAll(".slam").forEach(n=>{const dl=parseFloat(getComputedStyle(n).animationDelay)||0;setTimeout(()=>{if(curEl===el){XM.sfx("thud");shake()}},dl*1000+380)});
    if(s.enter)s.enter(el);
  }
  wireSlide(el);
  showMiniQR(s.id!=="lobby");
  if(started)setTimeout(()=>{if(curEl===el)publishSlide(s,el)},400);
  if(s.id.endsWith("-cookie"))cookieStorm(el,s.id==="game-cookie");
  if(s.id.endsWith("-scoop"))snowballFight(el,s.id==="game-scoop");
  const light=!s.id.startsWith("game-");
  if(s.id==="game-tribute")emojiStorm(el,true,()=>"🔍",true);
  if(s.id==="game-feud")emojiStorm(el,true,()=>"🏆",true);
  if(s.id==="game-secrets")emojiStorm(el,true,()=>"🕵️",true);
  if(s.id.endsWith("-mitten"))emojiStorm(el,s.id==="game-mitten",()=>`<img src="/xmas/icons/mitten.png" alt="" style="width:1em;height:1em;display:block;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 2px #fff)">`,light);
  if(s.id.endsWith("-lrc"))emojiStorm(el,s.id==="game-lrc",()=>"🎲",light);
  if(s.id.includes("bingo"))emojiStorm(el,s.id==="game-bingo",()=>{const n=1+Math.floor(Math.random()*75),l=Math.floor((n-1)/15);
    return `<b class="bb" style="--bc:${["#b8322a","#1f6b4a","#c8921f","#2f6fb3","#7a3fb0"][l]}"><span class="f">${"BINGO"[l]}<br>${n}</span></b>`});
}
// ❄️ snowballs thrown everywhere: arcs across the screen, plus hits that splat on the "glass" and melt
function snowballFight(el,big){
  const R=(a,b)=>a+Math.random()*(b-a);let h="";
  for(let k=0;k<6;k++){const fromLeft=k%2===0,size=R(40,90),y=R(250,950);
    h+=`<span class="sb arc" style="width:${size}px;height:${size}px;top:${y}px;left:${fromLeft?-120:1960}px;--dx:${fromLeft?2200:-2200}px;--up:${-R(250,600)}px;--down:${R(-150,250)}px;--t:${R(2.2,4)}s;--d:${-R(0,4)}s"></span>`}
  if(big)for(let k=0;k<14;k++){const a=Math.random()*6.283,dist=R(500,1300),size=R(40,100);
    h+=`<span class="sb boomsb" style="width:${size}px;height:${size}px;left:50%;top:45%;animation:boomOut 1.5s cubic-bezier(.15,.8,.3,1) ${R(0,.3)}s both;--x:${Math.cos(a)*dist}px;--y:${Math.sin(a)*dist*.7}px;--r:0deg"></span>`}
  const f=document.createElement("div");f.className="fly";f.innerHTML=h;el.appendChild(f);
  const hit=()=>{if(curEl!==el||!f.isConnected){clearInterval(iv);return}
    const x=R(150,1770),y=R(150,930),size=R(120,220);
    const b=document.createElement("span");b.className="sb hit";Object.assign(b.style,{left:x+"px",top:y+"px",width:size+"px",height:size+"px"});f.appendChild(b);
    setTimeout(()=>{b.remove();if(curEl!==el)return;XM.sfx("thud");
      const sp=document.createElement("div");sp.className="splat";sp.style.left=x+"px";sp.style.top=y+"px";
      let g="";for(let k=0;k<9;k++){const r=k?R(size*.12,size*.3):size*.55,a=Math.random()*6.283,d=k?R(size*.35,size*.75):0;
        g+=`<i style="width:${r*2}px;height:${r*2}px;left:${Math.cos(a)*d-r}px;top:${Math.sin(a)*d-r}px"></i>`}
      sp.innerHTML=g;f.appendChild(sp);setTimeout(()=>sp.remove(),2700)},550)};
  const iv=setInterval(hit,big?1800:2600);setTimeout(hit,big?900:600);
}
// 🍪 cookies raining, spinning and flying across the screen
function cookieStorm(el,big){emojiStorm(el,big,()=>"🍪",!big)}  // fewer, smaller cookies on the how-to / wheel / tie slides
function emojiStorm(el,big,item,light){
  const R=(a,b)=>a+Math.random()*(b-a);let h="";const nf=light?4:9,na=light?0:2,sz=light?.55:.8;
  for(let k=0;k<nf;k++)h+=`<i class="fall" style="left:${R(0,1880)}px;font-size:${R(50,120)*sz}px;--t:${R(4,8)}s;--d:${-R(0,8)}s;--dx:${R(-200,200)}px;--r:${R(-720,720)}deg">${item()}</i>`;
  for(let k=0;k<na;k++)h+=`<i class="across" style="top:${R(80,980)}px;font-size:${R(70,140)*sz}px;--t:${R(5,9)}s;--d:${-R(0,9)}s;--dy:${R(-300,300)}px;--r:${R(360,1440)}deg">${item()}</i>`;
  if(big)for(let k=0;k<16;k++){const a=Math.random()*6.283,dist=R(500,1300);h+=`<i class="boom" style="font-size:${R(50,110)}px;--d:${R(0,.3)}s;--x:${Math.cos(a)*dist}px;--y:${Math.sin(a)*dist*.7}px;--r:${R(-900,900)}deg">${item()}</i>`}
  const f=document.createElement("div");f.className="fly";f.innerHTML=h;el.appendChild(f);
}
function wireSlide(el){
  el.querySelectorAll("[data-tb]").forEach(b=>b.onclick=e=>{e.stopPropagation();const prev=XM.currentSong();XM.tiebreaker({game:b.dataset.tb,onClose:()=>{const s=SLIDES[cur];const m=prev||(s.music&&s.music!=="stop"?s.music:null);if(m)XM.playSong(m,true)}})});
  el.querySelectorAll("a[target]").forEach(a=>{if(a.dataset.w)return;a.dataset.w=1;a.addEventListener("click",()=>{XM.stopSong();XM.sfx("go")})});
  el.querySelectorAll("[data-victor]").forEach(b=>b.onclick=e=>{e.stopPropagation();pickVictor(b.dataset.victor)});
  el.querySelectorAll("[data-unbox]").forEach(b=>b.onclick=e=>{e.stopPropagation();unbox(b.dataset.unbox)});
  el.querySelectorAll("[data-interview]").forEach(b=>b.onclick=e=>{e.stopPropagation();interview(b.dataset.interview)});
  el.querySelectorAll("[data-skip]").forEach(b=>b.onclick=e=>{e.stopPropagation();XM.sfx("whoosh");next()});
  // "No tie": record the victor, then move on once the victor (and 2nd place) pop-ups are done
  el.querySelectorAll("[data-notie]").forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.notie,was=XM.victors()[k];pickVictor(k);
    const me=curEl;let free=0;const iv=setInterval(()=>{if(curEl!==me){clearInterval(iv);return}
      if(busy()||(window.speechSynthesis&&speechSynthesis.speaking)){free=0;return}free+=400;
      if(XM.victors()[k]===was&&free>=800){clearInterval(iv);return}   // cancelled: stay here
      if(XM.victors()[k]&&XM.victors()[k]!==was&&free>=3000){clearInterval(iv);next()}},400)});
  const m=el.querySelector("#memo");if(m)m.onclick=e=>{e.stopPropagation();memorial()};
}
const next=()=>{const s=SLIDES[cur];if(s&&s.onNext&&curEl&&s.onNext(curEl))return;go(cur+1)},
  prev=()=>{const s=SLIDES[cur];if(s&&s.onPrev&&curEl&&s.onPrev(curEl))return;go(cur-1)};
function begin(){
  if(started)return;started=true;XM.ensureAudio();XM.setSound(XM.sound);
  if(!hostPin())setTimeout(()=>toast("🔑 Unlock your PIN on /host (Side quests) so phones can follow along",9000),1500);
  startPhonePoll();scheduleSponsor();scheduleChaos();setTimeout(tickerLoop,4000);rehearsalBadge();
  const st=document.getElementById("start");st.remove();
  const i=cur;cur=-1;curEl&&curEl.remove();curEl=null;go(i);
}
// 📱 Carsyn's remote sees (and can press) every button on the TV
const SLIDE_TITLES=SLIDES.map(s=>{let t="";try{const d=document.createElement("div");d.innerHTML=s.html();const h=d.querySelector("h1,h2");t=h?h.textContent.replace(/\s+/g," ").trim():""}catch(e){}
  return [s.id,(XM.nick?XM.nick(t||s.id):t||s.id).slice(0,60)]});
if(window.RemoteTV)RemoteTV.start({page:"show",exclude:".hud",ready:()=>started,
  extra:()=>({slide:SLIDES[cur]?SLIDES[cur].id:"",slides:SLIDE_TITLES,video:!!(curEl&&curEl.querySelector("video"))}),
  opened:()=>{XM.stopSong();XM.sfx("go")},
  blocked:()=>toast("🚫 Chrome blocked the new tab. On this laptop: click the blocked pop-up icon at the right of the address bar, choose Always allow, then tap it again.",12000)});
const startI=(()=>{const id=location.hash.slice(1)||"";const i=SLIDES.findIndex(s=>s.id===id);return i<0?0:i})();
go(startI);
document.getElementById("start").addEventListener("click",e=>{e.stopPropagation();begin()});
document.getElementById("next").onclick=e=>{e.stopPropagation();next()};
document.getElementById("prev").onclick=e=>{e.stopPropagation();prev()};
document.getElementById("livebtn").onclick=e=>{e.stopPropagation();if(started)liveBroadcast()};
document.getElementById("intbtn").onclick=e=>{e.stopPropagation();if(started)intermission()};
document.getElementById("mute").onclick=e=>{e.stopPropagation();XM.toggleSound();if(!XM.sound&&window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById("fs").onclick=e=>{e.stopPropagation();toggleFS()};
XM.setSound(XM.sound);
function toggleFS(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button,a");if(b)setTimeout(()=>b.blur(),0)},true);
const busy=()=>XM.tiebreakerOpen()||document.querySelector(".memorial,.vpick,.moment,.brf");
document.addEventListener("click",e=>{
  if(!started||busy())return;
  if(e.target.closest("button,a,input,video,label,textarea,select,.vcard,.noadv,.hud"))return;
  next();
});
document.addEventListener("keydown",e=>{
  if(!started){if(["Enter"," ","ArrowRight","PageDown"].includes(e.key)){e.preventDefault();begin()}return}
  if(busy())return;
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  const k=e.key;
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(k)){
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); // never re-press a clicked button
    e.preventDefault();next()}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(k)){e.preventDefault();prev()}
  else if(k==="f"||k==="F"){toggleFS()}
  else if(k==="i"||k==="I"){intermission()}
  else if(k==="w"||k==="W"){liveBroadcast()}
  else if(k==="m"||k==="M"){XM.toggleSound();if(!XM.sound&&window.speechSynthesis)speechSynthesis.cancel()}
  else if(k==="Home")go(0);else if(k==="End")go(SLIDES.length-1);
});
addEventListener("hashchange",()=>{const i=SLIDES.findIndex(x=>x.id===location.hash.slice(1));if(i>=0&&i!==cur&&started)go(i)});

/* ---------- record a game's victor from its slides ---------- */
function pickVictor(g,place=1){
  if(document.querySelector(".vpick"))return;XM.ensureAudio();
  const first=XM.victors()[g],cur=place===1?first:XM.seconds()[g];const ov=document.createElement("div");ov.className="vpick";
  ov.innerHTML=`<div style="display:grid;gap:20px;justify-items:center"><div class="eyebrow" style="font-size:1rem">${esc(GAMES[g].name)}</div>
    <h1 style="font-family:var(--display);font-size:clamp(2rem,5vw,4rem);color:var(--gold);text-shadow:0 4px 0 var(--red-d)">${place===1?"🥇 Who won?":"🥈 The Battle for Silver"}</h1>
    ${place===2?`<div class="eyebrow" style="font-size:.95rem;color:var(--ink)">Second place wins a major award, but you have to fight for it. Tap everyone who was close, then FIGHT.</div>`:""}
    <div class="faces">${TRIBUTES.filter(t=>place===1||t.name!==first).map(t=>`<button class="face ${cur===t.name?"on":""}" data-n="${esc(t.name)}"><img src="${t.img}" alt=""><b>${esc(t.name)}</b></button>`).join("")}</div>
    <div style="display:flex;gap:12px">${place===2?`<button class="btn red" id="vp-fight" disabled>⚔️ FIGHT!</button>`:""}${cur?`<button class="btn ghost" id="vp-clear">Clear ${place===1?"victor":"second place"}</button>`:""}<button class="btn ghost" id="vp-x">${place===2?"Skip (Esc)":"Cancel (Esc)"}</button></div></div>`;
  document.body.appendChild(ov);XM.sfx("whoosh");
  const close=ov._close=()=>{ov.remove();document.removeEventListener("keydown",key,true)};
  const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close()}};document.addEventListener("keydown",key,true);
  if(place===2){const fb=ov.querySelector("#vp-fight");ov.querySelectorAll(".face").forEach(b=>b.classList.remove("on"));
    const picked=()=>[...ov.querySelectorAll(".face.on")].map(b=>b.dataset.n);
    const upd=()=>{const n=picked().length;fb.disabled=!n;fb.textContent=n===1?"🥈 Award 2nd place":"⚔️ FIGHT!"};
    ov.querySelectorAll("[data-n]").forEach(b=>b.onclick=e=>{e.stopPropagation();b.classList.toggle("on");XM.sfx(b.classList.contains("on")?"tap":"untap");upd()});
    fb.onclick=e=>{e.stopPropagation();const p=picked();if(!p.length)return;close();
      if(p.length===1){XM.setSecond(g,p[0]);refreshCorners();XM.stopSong();XM.celebrate(p[0],{intro:"And in second place"})}else silverBattle(g,p)};
  }else
  ov.querySelectorAll("[data-n]").forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.dataset.n;
    if(place===1){XM.setVictor(g,n);if(XM.seconds()[g]===n)XM.setSecond(g,"")}else XM.setSecond(g,n);
    close();refreshCorners();XM.stopSong();
    if(place===1){setTimeout(()=>walkUp(n),4200);
      if(betState&&betState.state!=="paid"&&Object.keys(betState.bets||{}).length&&(betState.game===GAMES[g].name||betState.game==="the next game"))setTimeout(()=>hostCall({a:"betpay",winner:n}),2500);
      XM.celebrate(n,{intro:`Your ${GAMES[g].name.replace("?","")} victor`});if(g!=="mitten"&&g!=="bingo")setTimeout(()=>{if(!document.querySelector(".vpick,.moment")&&!XM.tiebreakerOpen())pickVictor(g,2)},1800)}
    else XM.celebrate(n,{intro:"And in second place"})});
  const c=ov.querySelector("#vp-clear");if(c)c.onclick=e=>{e.stopPropagation();if(place===1)XM.setVictor(g,"");else XM.setSecond(g,"");close();refreshCorners();XM.sfx("untap")};
  ov.querySelector("#vp-x").onclick=e=>{e.stopPropagation();close()};
  ov.onclick=e=>e.stopPropagation();
}
/* ---------- The Battle for Silver: contenders fight for the 2nd place major award ---------- */
const SILVER=[["✊","Rock, Paper, Scissors","Best two out of three. Losers drop out until one is left."],
 ["👀","Staring Contest","Eyes locked. First to blink or laugh is out."],
 ["👍","Thumb War","One, two, three, four, I declare a thumb war. Pin their thumb for three seconds."],
 ["🎄","Christmas Movie Showdown","Take turns naming Christmas movies. No repeats. Pause for 3 seconds and you're out."],
 ["🥄","Spoon on the Nose","Hang a spoon on your nose. Last spoon standing wins."],
 ["🦩","Flamingo Stand","Stand on one foot, eyes closed. Last one standing wins."],
 ["🎤","Effie Trinket Impression","Everyone says \"May the odds be ever in your favor!\" The room cheers for the best one."],
 ["🤫","Silent Treatment","The room tries to make them laugh. Last straight face wins."],
 ["🦌","Name the Reindeer","Take turns naming one of Santa's reindeer. Miss or repeat one and you're out."],

  const close=()=>{if(!alive)return;alive=false;timers.forEach(clearTimeout);m.remove();announcer.stop();document.removeEventListener("keydown",key,true);if(m.onClose)m.onClose();
    if(!document.querySelector(".moment")){pausedV.forEach(v=>{if(v.isConnected)v.play().catch(()=>{})});if(begP&&SLIDES[cur].id==="begin")BEGIN.play().catch(()=>{})}
