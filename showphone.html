<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join the Christmas Games</title>
<link rel="icon" href="/xmas/emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/xmas/xmas.css">
<style>
body{min-height:100%;overflow-x:hidden}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:46px max(16px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1.t{font-family:var(--display);font-weight:400;color:var(--gold);text-shadow:0 3px 0 var(--red-d);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.05;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid button{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px var(--line)}
.grid button img{width:72px;height:72px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.grid button b{font-size:.9rem}
.grid button:active{transform:scale(.96)}
.grid button.taken{opacity:.35}
.card{background:rgba(22,48,42,.95);border-radius:18px;padding:14px 16px;box-shadow:0 0 0 1px var(--line)}
.me{display:flex;align-items:center;gap:12px}
.me img{width:54px;height:54px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold)}
.me b{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.4rem}
.me .x{margin-left:auto;font-size:.85rem;color:var(--muted);text-decoration:underline}
.tv .eyebrow{display:flex;justify-content:space-between}
.tv h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.5rem;margin:6px 0}
.tv p{margin:0;white-space:pre-line;line-height:1.4;font-size:1.02rem}
.reacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.reacts button{font-size:2rem;min-height:64px;border-radius:14px;background:rgba(255,255,255,.06)}
.reacts button:active{background:rgba(232,176,75,.3);transform:scale(.94)}
.live{display:grid;gap:10px;justify-items:center}
.live video{width:180px;height:180px;border-radius:50%;object-fit:cover;transform:scaleX(-1);box-shadow:0 0 0 4px #c41e1e}
.pop{position:fixed;font-size:2.4rem;pointer-events:none;z-index:9;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-220px) scale(1.4);opacity:0}}
.tiny{text-align:center}
.host{box-shadow:0 0 0 2px var(--gold)}
.host h3{font-family:var(--display);font-weight:400;color:var(--gold);margin:0 0 8px;text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.hgrid button{min-height:58px;border-radius:14px;background:rgba(255,255,255,.07);font-weight:800;font-size:.92rem;line-height:1.15}
.hgrid button .i{display:block;font-size:1.5rem}
.hgrid button:active{background:rgba(232,176,75,.35);transform:scale(.95)}
.hgrid.twists button{background:rgba(196,30,30,.25)}
.qov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#8a1414,#200606);animation:qin .3s both}
.qov.ok{background:radial-gradient(ellipse at center,#1f7a45,#06200f)}
.qov .in{display:grid;gap:14px;justify-items:center}
.qov h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:2.2rem;margin:0;line-height:1}
.qov .q{font-size:1.5rem;font-weight:800;line-height:1.25}
.qov .ic{font-size:4.5rem;line-height:1}
.qov .clk{font-family:var(--display);font-size:5.5rem;line-height:1;color:#fff}
@keyframes qin{from{opacity:0;transform:scale(1.1)}}
.qfaces{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}
.qfaces button{display:grid;justify-items:center;gap:2px;padding:4px 0;border-radius:12px;font-size:.68rem;font-weight:800;background:rgba(255,255,255,.05)}
.qfaces img,.qfaces .r{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--line);display:grid;place-items:center;font-size:1.6rem}
.qfaces button.on img,.qfaces button.on .r{box-shadow:0 0 0 3px var(--gold)}
.qfaces button.on{background:rgba(232,176,75,.25)}
select,textarea{width:100%;font:600 1rem inherit;padding:10px;border-radius:12px;border:0;margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{flex:1;padding:9px 0;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800}
.chips button.on{background:var(--gold);color:#13271f}
.vfaces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vfaces button{display:grid;justify-items:center;gap:3px;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.72rem;font-weight:800}
.vfaces img{width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--line)}
.vfaces button.on{background:rgba(232,176,75,.28)}.vfaces button.on img{box-shadow:0 0 0 3px var(--gold)}
.vote{box-shadow:0 0 0 2px var(--gold)}
.sb{display:grid;gap:6px}
.sb .g{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.sb .g b{color:var(--gold)}
.dlayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dlayer i{position:absolute;top:-60px;font-style:normal;opacity:.35;animation:dfall var(--s) linear var(--d) infinite}
@keyframes dfall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
.race{position:fixed;inset:0;z-index:25;display:grid;grid-template-rows:auto 1fr auto;padding:24px 16px max(24px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at center,#1d3b32,#06100c);text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.race .tapb{align-self:center;justify-self:center;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff6a5a,#b8322a 60%,#6e1712);color:#fff;font-family:var(--display);font-size:3.4rem;box-shadow:0 0 0 8px var(--gold),0 20px 40px rgba(0,0,0,.6);touch-action:manipulation}
.race .tapb:active{transform:scale(.94)}
.race .tapb:disabled{filter:grayscale(.7);opacity:.6}
.race .bar{height:18px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.race .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd36b);width:0;transition:width .15s}
.htabs{position:sticky;top:26px;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px -6px 10px;padding:6px;background:rgba(13,31,24,.97);border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.htabs button{padding:8px 0;border-radius:10px;font-weight:800;font-size:.72rem;line-height:1.1;background:transparent;color:var(--ink)}
.htabs button .i{display:block;font-size:1.3rem}
.htabs button.on{background:var(--gold);color:#13271f}
.hpane{display:none}.hpane.on{display:block}
#score summary{cursor:pointer;list-style:none;font-family:var(--display);color:var(--gold);font-size:1.2rem;text-align:center}
#score summary::-webkit-details-marker{display:none}
.mcard{box-shadow:0 0 0 2px #6a3c9c;background:rgba(40,20,60,.95)}
.qov.spy{background:radial-gradient(ellipse at center,#3a1f5c,#0a0612)}
.pin{display:flex;gap:8px;justify-content:center}
.pin input{width:9ch;font:800 1.4rem var(--body,inherit);text-align:center;letter-spacing:.3em;border-radius:12px;border:0;padding:8px}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="lights"></div>
<div class="app" id="app"></div>
<script src="/xmas/xmas.js"></script>
<script>XM.useNicknames()</script>
<script>
/* Phone companion for the Christmas Games show: join as your tribute, read what's on the TV,
   send emoji reactions to the TV, and go live in a corner of the TV with your camera. */
document.getElementById("lights").outerHTML=XM.lights(14);
XM.snow(document.getElementById("snow"));
const {esc,TRIBUTES}=XM;
const EMOJI=["🏹","🔥","🌹","🍞","🐦","🎁","😱","😂"];
// Android phones vibrate. iPhones can't (Apple blocks it for websites), so they get a flash and a sound instead.
function buzz(p){try{if(navigator.vibrate&&navigator.vibrate(p))return}catch(e){}
  const big=Array.isArray(p)||p>=150;if(!big)return;const f=document.createElement("div");f.style.cssText="position:fixed;inset:0;z-index:99;background:#fff;pointer-events:none;transition:opacity .5s";document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.opacity="0"});setTimeout(()=>f.remove(),600);try{XM.sfx("stinger")}catch(e){}}
const pid=(()=>{try{let p=localStorage.getItem("xmas-sh-pid");if(!p){p=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("xmas-sh-pid",p)}return p}catch(e){return "p"+Math.random()}})();
let myEpoch=XM.store.get("xmas-sh-epoch",null);
let me=XM.store.get("xmas-sh-me",null),slide=null,taken=[],skew=0,points={},quest=null,qTimer=0;
const api=(body)=>fetch("/api/show",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pid,...body})}).then(r=>r.json().then(j=>({ok:r.ok,status:r.status,...j}))).catch(()=>({ok:false}));

function render(){
  const app=document.getElementById("app");
  if(!me){
    app.innerHTML=`<img src="/xmas/emblem.png" alt="" style="width:90px;justify-self:center"><h1 class="t">The 2026 Christmas Games</h1>
      <div class="sub">Tap your face to join, tribute.</div>
      <div class="grid">${TRIBUTES.map(t=>`<button data-n="${esc(t.name)}"><img src="${t.img}" alt=""><b>${esc(XM.dn(t.name))}</b>${XM.aka(t.name)?`<span style="font-size:.7rem;color:var(--gold);font-weight:700">${esc(XM.aka(t.name))}</span>`:""}</button>`).join("")}</div>`;
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await api({a:"join",name:b.dataset.n});
      if(r.ok){me=r.me;myEpoch=r.epoch||0;XM.store.set("xmas-sh-me",me);XM.store.set("xmas-sh-epoch",myEpoch);render()}else{b.disabled=false;alert(r.status===409?"Someone else's phone is already using that tribute.":"Couldn't join. Check your internet and try again.")}});
    return;
  }
  const t=TRIBUTES.find(x=>x.name===me);
  app.innerHTML=`<div class="card me"><img src="${t.img}" alt=""><div><div class="eyebrow">District ${t.d}${XM.aka(me)?` · a.k.a. ${esc(XM.aka(me))}`:""}</div><b>${esc(XM.dn(me))}</b><div class="tiny" id="mypts" style="text-align:left"></div></div><a href="#" class="x" id="notme">Not you?</a></div>
    ${me==="Carsyn"?`<div class="card host" id="host"></div>`:""}
    <div class="card tv"><div class="eyebrow"><span>📺 Now on the TV</span><span id="tvn"></span></div><h2 id="tvt">Waiting for the Gamemaker...</h2><p id="tvb"></p></div>
    <div id="extras" style="display:grid;gap:16px"></div>
    <div class="card"><div class="eyebrow" style="text-align:center;margin-bottom:8px">Tap to send to the TV</div><div class="reacts">${EMOJI.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div></div>
    ${me==="Carsyn"?"":`<div class="card"><div class="eyebrow" style="margin-bottom:8px">🚨 Snitch on someone (it pops up on the TV)</div>
      <div class="vfaces" id="snf">${TRIBUTES.filter(t=>t.name!==me).map(t=>`<button data-sn="${esc(t.name)}"><img src="${t.img}" alt="">${esc(t.name==="QUEEN MOTHER"?"QUEEN":XM.dn(t.name))}</button>`).join("")}</div>
      <select id="snwhy" style="margin-top:10px">${XM.SNITCH.map(w=>`<option>${esc(w)}</option>`).join("")}</select>
      <button class="btn red" id="snsend" style="width:100%">🚨 Report them</button><div class="tiny" id="snmsg"></div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">🤝 Send someone your points (bribes welcome)</div>
      <div class="vfaces" id="gvf">${TRIBUTES.filter(t=>t.name!==me).map(t=>`<button data-gv="${esc(t.name)}"><img src="${t.img}" alt="">${esc(t.name==="QUEEN MOTHER"?"QUEEN":XM.dn(t.name))}</button>`).join("")}</div>
      <div class="chips" style="margin-top:10px">${[1,2,3].map(n=>`<button data-gn="${n}">${n} point${n>1?"s":""}</button>`).join("")}</div>
      <button class="btn" id="gvsend" style="width:100%">🤝 Send points</button><div class="tiny" id="gvmsg"></div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">💌 Shout-out on the TV</div>
      <textarea id="sotext" rows="2" maxlength="90" placeholder="Happy Thanksmas Granny!"></textarea><button class="btn" id="sosend" style="width:100%">💌 Send shout-out</button><div class="tiny" id="somsg">The Gamemaker approves it first.</div></div>
    <div class="card"><div class="eyebrow" style="margin-bottom:8px">🎵 Your walk-up song (plays on the TV when you win)</div>
      <select id="wsel"><option value="">Pick a song...</option>${XM.WALKUPS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select>
      <div style="display:flex;gap:8px"><button class="btn ghost" id="wprev" style="flex:1">▶ Preview</button><button class="btn" id="wsave" style="flex:1">Save</button></div><div class="tiny" id="wmsg"></div></div>`}
    <div class="card live" id="live"><button class="btn red" id="golive" style="font-size:1.1rem">🎥 Go live on the TV</button><div class="tiny">Your camera shows up in a corner of the TV for 20 seconds.</div></div>`;
  app.querySelector("#notme").onclick=e=>{e.preventDefault();stopLive();me=null;walkup=null;quest=null;mission=null;predict=null;vote=null;bet=null;XM.store.set("xmas-sh-me",null);document.querySelectorAll(".qov,#race,#mcard").forEach(n=>n.remove());render()};
  app.querySelectorAll("[data-e]").forEach(b=>b.onclick=ev=>{const e=b.dataset.e;const f=document.createElement("div");f.className="pop";f.textContent=e;
    f.style.left=(ev.clientX-20)+"px";f.style.top=(ev.clientY-30)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1300);
    buzz(15);api({a:"react",name:me,e}).then(r=>{if(r.status===403){me=null;XM.store.set("xmas-sh-me",null);render()}})});
  app.querySelector("#golive").onclick=goLive;
  if(app.querySelector("#snsend")){let sn=null;app.querySelectorAll("[data-sn]").forEach(b=>b.onclick=()=>{sn=b.dataset.sn;app.querySelectorAll("[data-sn]").forEach(x=>x.classList.toggle("on",x===b))});
  app.querySelector("#snsend").onclick=async()=>{const m=app.querySelector("#snmsg");if(!sn){m.textContent="Tap who you're reporting first.";return}
    const r=await api({a:"snitch",name:me,to:sn,why:app.querySelector("#snwhy").value});m.textContent=r.ok?`🚨 Reported ${sn}. The Gamemaker will decide.`:r.status===429?"Easy, snitch. Wait 30 seconds.":"Couldn't send.";if(r.ok&&navigator.vibrate)navigator.vibrate(40)};
  const ws=app.querySelector("#wsel");if(walkup)ws.value=walkup;
  app.querySelector("#wprev").onclick=()=>{if(!ws.value)return;XM.ensureAudio&&XM.ensureAudio();XM.playSong(ws.value);setTimeout(()=>XM.stopSong(),9000)};
  app.querySelector("#wsave").onclick=async()=>{if(!ws.value)return;XM.stopSong();const r=await api({a:"walkup",name:me,song:ws.value});app.querySelector("#wmsg").textContent=r.ok?"🎵 Saved! It plays on the TV when you win.":"Couldn't save.";if(r.ok)walkup=ws.value};
  let gv=null,gn=null;app.querySelectorAll("[data-gv]").forEach(b=>b.onclick=()=>{gv=b.dataset.gv;app.querySelectorAll("[data-gv]").forEach(x=>x.classList.toggle("on",x===b))});
  app.querySelectorAll("[data-gn]").forEach(b=>b.onclick=()=>{gn=+b.dataset.gn;app.querySelectorAll("[data-gn]").forEach(x=>x.classList.toggle("on",x===b))});
  app.querySelector("#gvsend").onclick=async()=>{const m=app.querySelector("#gvmsg");if(!gv||!gn){m.textContent="Pick who and how many.";return}
    const r=await api({a:"give",name:me,to:gv,n:gn});m.textContent=r.ok?`🤝 Sent ${gv} ${gn} point${gn>1?"s":""}.`:(r.error||"Couldn't send.")};
  app.querySelector("#sosend").onclick=async()=>{const t=app.querySelector("#sotext"),m=app.querySelector("#somsg");if(!t.value.trim()){m.textContent="Type a message first.";return}
    const r=await api({a:"shout",name:me,text:t.value.trim()});m.textContent=r.ok?"💌 Sent! It shows on the TV once the Gamemaker approves it.":(r.error||"Couldn't send.");if(r.ok)t.value=""};
  }
  districtLook();lastExtras="";showExtras();
  showSlide();
  if(me==="Carsyn"){hostCard();scoreCard()}
}
/* ---- hot seat questions and shout-outs waiting for the Gamemaker ---- */
let listT=0;
async function hostLists(){
  clearTimeout(listT);const pin=XM.store.get("xmas-sh-pin",null);const A=document.getElementById("asks"),S=document.getElementById("shouts");if(!pin||!A||me!=="Carsyn")return;
  try{const [a,sh]=await Promise.all([fetch("/api/show?a=asks&pin="+encodeURIComponent(pin),{cache:"no-store"}).then(r=>r.json()),fetch("/api/show?a=shouts&pin="+encodeURIComponent(pin),{cache:"no-store"}).then(r=>r.json())]);
    const ak=JSON.stringify(a),sk=JSON.stringify(sh);
    if(A.dataset.k!==ak){A.dataset.k=ak;A.innerHTML=a.hot?`<div class="eyebrow" style="margin:6px 0">🎭 Questions for ${esc(a.hot.to)} (tap to show on the TV)</div>${(a.asks||[]).map(x=>`<button class="btn ghost" data-ask="${esc(x.q)}" style="width:100%;text-align:left;margin-bottom:6px;font-size:.95rem">${esc(x.q)}</button>`).join("")||'<div class="tiny">No questions yet.</div>'}`:"";
      A.querySelectorAll("[data-ask]").forEach(b=>b.onclick=async()=>{await api({a:"askshow",pin,q:b.dataset.ask});b.style.opacity=.4})}
    if(S.dataset.k!==sk){S.dataset.k=sk;S.innerHTML=(sh.shouts||[]).length?`<div class="eyebrow" style="margin:6px 0">💌 Shout-outs waiting</div>${sh.shouts.map(x=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><div style="flex:1;font-size:.95rem"><b>${esc(x.from)}:</b> ${esc(x.text)}</div><button class="btn" data-so="${x.id}" style="padding:.4em .8em">✅</button><button class="btn ghost" data-sx="${x.id}" style="padding:.4em .8em">✖</button></div>`).join("")}`:"";
      S.querySelectorAll("[data-so]").forEach(b=>b.onclick=async()=>{await api({a:"shoutok",pin,id:+b.dataset.so});S.dataset.k="";hostLists()});
      S.querySelectorAll("[data-sx]").forEach(b=>b.onclick=async()=>{await api({a:"shoutno",pin,id:+b.dataset.sx});S.dataset.k="";hostLists()})}}catch(e){}
  listT=setTimeout(hostLists,4000)}
/* ---- 📋 the Gamemaker's scoreboard: who won what, ties, points ---- */
let scoreTimer=0,scoreOpen=false;
async function scoreCard(){
  clearTimeout(scoreTimer);if(me!=="Carsyn")return;let box=document.getElementById("score");
  if(!box){const h=document.getElementById("host");if(!h)return;box=document.createElement("div");box.className="card host";box.id="score";h.before(box)}
  try{const j=await (await fetch("/api/show?a=results",{cache:"no-store"})).json();const r=j.results,pts=j.points||{};
    if(!r){box.innerHTML=`<h3>📋 Scoreboard</h3><div class="tiny">Nothing yet. It fills in from the TV laptop as you record victors.</div>`}
    else{const G=Object.entries(r.games||{}).sort((a,b)=>a[1].n-b[1].n);const AW={treasure:"💎",mystery:"❓",junk:"🗑️"};
      const bingo=r.bingo||{};const bl={line:"Regular",corners:"Four Corners",x:"Big X",frame:"Picture Frame"};
      const ties=(r.ties||[]).slice().reverse();const P=Object.entries(pts).filter(([,v])=>v).sort((a,b)=>b[1]-a[1]);
      const led=Object.entries(r.victors||{}).filter(([,n])=>n).length;
      box.innerHTML=`<details ${scoreOpen?"open":""}><summary>📋 Scoreboard <span style="font-family:var(--body,inherit);font-size:.8rem;color:var(--muted)">(${led} of ${G.length} games recorded · tap)</span></summary><div class="sb">${G.map(([k,g])=>`<div class="g"><span>${g.n}. ${esc(g.name)}</span><span style="text-align:right">${k==="bingo"?
          (Object.keys(bingo).length?Object.entries(bingo).map(([m,c])=>`${esc(bl[m]||m)}: <b>#${[].concat(c).join(", #")}</b>`).join("<br>"):"<i>no rounds yet</i>")
          :`🥇 <b>${esc(r.victors[k]||"...")}</b>${r.awards&&r.awards[k]?" "+(AW[r.awards[k]]||""):""}${k==="mitten"?"":`<br>🥈 ${esc(r.seconds[k]||"...")}`}`}</span></div>`).join("")}</div>
        ${r.ultimate?`<div style="margin-top:8px;font-weight:800">👑 Ultimate Victor: <b style="color:var(--gold)">${esc(r.ultimate.names.join(" & "))}</b> (${r.ultimate.max} wins)</div>`:""}
        <div class="eyebrow" style="margin:10px 0 4px">⚔️ Tiebreakers</div>${ties.length?ties.map(t=>`<div class="tiny" style="text-align:left">${esc((r.games[t.game]||{}).name||"Tiebreaker")}: ${esc(t.tied.join(" vs "))} → <b style="color:var(--gold)">${esc(t.winner)}</b>${t.how?" ("+esc(t.how)+")":""}</div>`).join(""):`<div class="tiny" style="text-align:left">None yet</div>`}

    <div class="eyebrow" style="margin:4px 0 6px">🎭 Hot seat · 🏳️ Mercy · 🔮 Predictions (use the tribute picked at the top)</div>

      <button id="mclose"><span class="i">⚖️</span>Mercy verdict</button><button id="pro"><span class="i">🔮</span>Open predictions</button><button id="prl"><span class="i">🔒</span>Lock predictions</button><button data-c="predictreveal"><span class="i">🎉</span>Reveal predictions</button></div>
    <div id="asks"></div><div id="shouts"></div>
    <div class="eyebrow" style="margin:4px 0 6px">⏰ Arena clock · 🎲 Chaos · 📺 Ticker</div>
    <div class="hgrid" style="grid-template-columns:repeat(4,1fr)">${[5,10,15,20,30].map(n=>`<button data-c="clock:${n}"><span class="i">⏰</span>${n} min</button>`).join("")}<button data-c="clock:off"><span class="i">⏹️</span>Stop clock</button><button data-c="chaos:on"><span class="i">🎲</span>Chaos ON</button><button data-c="chaos:off"><span class="i">😌</span>Chaos OFF</button><button data-c="ticker:on"><span class="i">📺</span>Ticker ON</button><button data-c="ticker:off"><span class="i">🚫</span>Ticker OFF</button><button data-c="recap"><span class="i">📼</span>Night recap</button></div>
    <div class="eyebrow" style="margin:4px 0 6px">📲 Tap race (everyone's phone)</div>
    <div class="hgrid">${[30,50,100].map(n=>`<button data-race="${n}"><span class="i">📲</span>Race to ${n}</button>`).join("")}<button id="raceend"><span class="i">⏹️</span>End race</button></div>
    <div class="eyebrow" style="margin:4px 0 6px">🎉 Big moments</div>
    <div class="hgrid"><button id="bdaygo"><span class="i">🎂</span>QUEEN MOTHER's birthday</button><button data-c="board"><span class="i">📜</span>Bounty board</button><button data-c="crown"><span class="i">👑</span>Crown the Ultimate Victor</button><button data-c="photo"><span class="i">📸</span>Photo booth</button><button data-c="draft"><span class="i">🎁</span>Award draft order</button><button data-c="awards"><span class="i">🏁</span>End-of-night awards</button></div>
    <div class="eyebrow" style="margin-bottom:6px">The show</div><div class="hgrid">${SHOW_BTNS.map(b).join("")}</div>
    <div class="eyebrow" style="margin-bottom:6px">Twists (only you can do these)</div><div class="hgrid twists">${TWIST_BTNS.map(b).join("")}</div><div class="tiny" id="hmsg"></div>`;
  tabify(box);
  let qn=null,qs=null;const qmsg=t=>{const m=box.querySelector("#qmsg");m.textContent=t;clearTimeout(m._t);m._t=setTimeout(()=>m.textContent="",3000)};
  const call=async body=>{const r=await api({pin,...body});if(r.status===403&&r.error==="Gamemaker only"){XM.store.set("xmas-sh-pin",null);hostCard()}return r};
  box.querySelectorAll("[data-qn]").forEach(x=>x.onclick=()=>{qn=x.dataset.qn;box.querySelectorAll("[data-qn]").forEach(y=>y.classList.toggle("on",y===x))});
  const sel=box.querySelector("#qsel"),own=box.querySelector("#qown");
  const setSecs=n=>{qs=n;box.querySelectorAll("[data-s]").forEach(y=>y.classList.toggle("on",+y.dataset.s===n))};
  sel.onchange=()=>{own.style.display=sel.value==="own"?"":"none";if(sel.value!=="own")setSecs(XM.QUESTS[+sel.value][2])};setSecs(XM.QUESTS[0][2]);
  box.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>setSecs(+x.dataset.s));
  box.querySelector("#qsend").onclick=async()=>{if(!qn){qmsg("Tap who gets the quest first.");return}
    const Q=sel.value==="own"?["📜",own.value.trim()]:XM.QUESTS[+sel.value];if(!Q[1]){qmsg("Type your side quest first.");return}
    const r=await call({a:"quest",to:qn,q:Q[1],ic:Q[0],secs:qs||15,double:dbl});qmsg(r.ok?`⚔️ Sent to ${r.quest.to}!`:"Couldn't send. Try again.")};
  box.querySelector("#qdone").onclick=async()=>{const r=await call({a:"questdone",result:"done"});qmsg(r.ok?`✅ +1 for ${r.quest.to}`:r.status===409?"No side quest running.":"Couldn't send.")};
  box.querySelector("#qfail").onclick=async()=>{const r=await call({a:"questdone",result:"fail"});qmsg(r.ok?`❌ -1 for ${r.quest.to}`:r.status===409?"No side quest running.":"Couldn't send.")};
  const pts=n=>async()=>{if(!qn||qn==="random"){qmsg("Tap a tribute first.");return}const r=await call({a:"pointsadd",to:qn,n});qmsg(r.ok?`${n>0?"⭐ +1":"💀 -1"} for ${qn}`:"Couldn't send.")};
  let dbl=false;const db=box.querySelector("#qdbl");db.onclick=()=>{dbl=!dbl;db.classList.toggle("on",dbl);db.textContent=`🎲 Double or nothing: ${dbl?"ON":"OFF"}`};
  box.querySelectorAll("[data-tw]").forEach(x=>x.onclick=async()=>{const r=await call({a:"tw",kind:x.dataset.tw,to:qn||"random"});
    qmsg(!r.ok?"Couldn't send.":r.tw.mission?`🕵️ ${r.tw.to}'s mission: ${r.tw.mission}`:`${x.querySelector(".i").textContent} Sent${r.tw.to?" ("+r.tw.to+(r.tw.with?" + "+r.tw.with:"")+")":""}`)});
  box.querySelectorAll("[data-sab]").forEach(x=>x.onclick=async()=>{if(!qn||(x.dataset.allbut&&qn==="random")){qmsg("Tap a tribute first.");return}
    const r=await call({a:"sab",to:qn,kind:x.dataset.sab,allBut:!!x.dataset.allbut});qmsg(r.ok?`${x.querySelector(".i").textContent} Got ${r.sab.to}!`:"Couldn't send.")});
  const ps=box.querySelector("#psel"),po=box.querySelector("#pown");ps.onchange=()=>po.style.display=ps.value==="own"?"":"none";
  box.querySelector("#popen").onclick=async()=>{const q=ps.value==="own"?po.value.trim():ps.value;if(!q){qmsg("Type your question first.");return}const r=await call({a:"pollopen",q});qmsg(r.ok?"🗳️ Vote is open on everyone's phone":"Couldn't open the vote.")};
  box.querySelector("#pclose").onclick=async()=>{const r=await call({a:"pollclose"});qmsg(r.ok?(r.win.length?`🏁 Winner: ${r.win.join(" & ")}`:"🏁 Nobody voted"):"No vote running.")};
  box.querySelector("#bopen").onclick=async()=>{const r=await call({a:"betopen",game:box.querySelector("#bgame").value});qmsg(r.ok?"💰 Betting is open":"Couldn't open bets.")};
  box.querySelector("#block").onclick=async()=>{const r=await call({a:"betlock"});qmsg(r.ok?"🔒 Bets locked":"No open betting.")};
  box.querySelector("#bpay").onclick=async()=>{if(!qn||qn==="random"){qmsg("Tap who WON at the top first.");return}const r=await call({a:"betpay",winner:qn});qmsg(r.ok?`🏆 Paid out on ${qn} (${r.results.length} bets)`:"No betting round.")};
  box.querySelector("#bcancel").onclick=async()=>{const r=await call({a:"betcancel"});qmsg(r.ok?"↩️ Bets canceled":"No betting round.")};
  box.querySelector("#bdaygo").onclick=async()=>{const r=await call({a:"bday"});qmsg(r.ok?"🎂 Happy birthday, QUEEN MOTHER!":"Couldn't send.")};
  box.querySelectorAll("[data-race]").forEach(x=>x.onclick=async()=>{const r=await call({a:"raceopen",goal:+x.dataset.race});qmsg(r.ok?`📲 Race to ${x.dataset.race} starts in 6 seconds!`:"Couldn't start.")});
  box.querySelector("#raceend").onclick=async()=>{await call({a:"raceend"});qmsg("⏹️ Race over")};
  box.querySelector("#saysend").onclick=async()=>{const t=box.querySelector("#saytext");if(!t.value.trim())return;const r=await call({a:"say",text:t.value.trim()});qmsg(r.ok?"🔊 Announced":"Couldn't send.");if(r.ok)t.value=""};
  box.querySelector("#hotgo").onclick=async()=>{const r=await call({a:"hotseat",to:qn||"random"});qmsg(r.ok?`🎭 ${r.hot.to} is in the hot seat`:"Couldn't start.");hostLists()};
  box.querySelector("#hotend").onclick=async()=>{await call({a:"hotend"});qmsg("⏹️ Hot seat over");hostLists()};
  box.querySelector("#mgo").onclick=async()=>{const r=await call({a:"mercyopen",to:qn||"random"});qmsg(r.ok?`🏳️ Mercy vote on ${r.mercy.to}`:"Couldn't start.")};
  box.querySelector("#mclose").onclick=async()=>{const r=await call({a:"mercyclose"});qmsg(r.ok?(r.spared?`🏳️ ${r.to} spared (${r.up} to ${r.down})`:`⚔️ No mercy for ${r.to} (${r.up} to ${r.down})`):"No mercy vote running.")};
  box.querySelector("#pro").onclick=async()=>{const r=await call({a:"predictopen"});qmsg(r.ok?"🔮 Predictions open":"Couldn't open.")};
  box.querySelector("#prl").onclick=async()=>{const r=await call({a:"predictlock"});qmsg(r.ok?"🔒 Predictions locked":"Couldn't lock.")};
  hostLists();
  box.querySelector("#pplus").onclick=pts(1);box.querySelector("#pminus").onclick=pts(-1);
  box.querySelectorAll("[data-c]").forEach(x=>x.onclick=async()=>{buzz(20);
    const r=await api({a:"cmd",name:me,pin,cmd:x.dataset.c});
    if(r.ok)qmsg("✅ Sent to the TV");else if(r.status===403&&r.error==="Gamemaker only"){XM.store.set("xmas-sh-pin",null);hostCard()}else if(r.status===403){qmsg("Another phone took your name. Tap Not you? and rejoin.")}else qmsg("Couldn't send. Try again.")});
}
function signedOut(){if(!me)return;stopLive();me=null;myEpoch=null;XM.store.set("xmas-sh-me",null);XM.store.set("xmas-sh-epoch",null);XM.store.set("xmas-sh-pin",null);
  document.querySelectorAll(".qov").forEach(n=>n.remove());render();alert("The Gamemaker reset the phones. Tap your face to join again.")}
function showSlide(){
  const n=document.getElementById("tvn"),t=document.getElementById("tvt"),b=document.getElementById("tvb");if(!t)return;
  if(!slide){t.textContent="Waiting for the Gamemaker...";b.textContent="";n.textContent="";return}
  n.textContent=slide.total?`${slide.n} / ${slide.total}`:"";t.textContent=slide.title||"";b.textContent=slide.body||"";
}
let pollN=0;
async function poll(){
  pollN++;try{const r=await fetch("/api/show?a=phone"+(me?"&me="+encodeURIComponent(me):"")+(pollN%5===1?"&full=1":""),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();const s=j.slide;
    if(JSON.stringify(s)!==JSON.stringify(slide)){slide=s;showSlide()}
    if(me&&typeof j.epoch==="number"&&myEpoch!==null&&j.epoch!==myEpoch){signedOut();return setTimeout(poll,2000)}   // the Gamemaker cleared all phones
    if(me&&myEpoch===null&&typeof j.epoch==="number"){myEpoch=j.epoch;XM.store.set("xmas-sh-epoch",myEpoch)}
    skew=(j.now||Date.now())-Date.now();points=j.points||{};online(true);showMyPoints();myQuest(j.quest);if(j.mission!==undefined)myMission(j.mission);vote=j.vote||null;bet=j.bet||null;hot=j.hot||null;mercy=j.mercy||null;predict=j.predict||null;myRace(j.race||null);myBday(j.bday||null);if(j.walkup!==undefined&&walkup===null)walkup=j.walkup;showExtras()}catch(e){online(false)}
  const busyNow=(quest&&quest.status==="live")||(race&&race.state==="live");
  setTimeout(poll,busyNow?1000:(vote||bet||mercy||hot||(predict&&predict.open))?2000:3000);
}

/* ---- go live: send a small camera frame about twice a second for 20 seconds ---- */
let stream=null,liveUntil=0,liveTimer=0;
let liveStarting=false;
async function goLive(){
  const box=document.getElementById("live");if(stream||liveStarting)return;liveStarting=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480},height:{ideal:480}},audio:false})}
  catch(e){liveStarting=false;box.querySelector(".tiny").textContent="Camera blocked. Allow camera access for this site in your phone's settings, then try again.";return}
  liveStarting=false;
  liveUntil=Date.now()+20000;
  box.innerHTML=`<video autoplay playsinline muted></video><div class="eyebrow" id="lv" style="color:#ff8a7a">🔴 LIVE ON THE TV</div><button class="btn ghost" id="stop">Stop</button>`;
  const v=box.querySelector("video");v.srcObject=stream;box.querySelector("#stop").onclick=stopLive;
  const c=document.createElement("canvas");c.width=c.height=240;const x=c.getContext("2d");
  const send=async()=>{if(!stream)return;const left=Math.ceil((liveUntil-Date.now())/1000);
    if(left<=0){stopLive();return}
    const lv=document.getElementById("lv");if(lv)lv.textContent=`🔴 LIVE ON THE TV · ${left}s`;
    if(v.videoWidth){const s=Math.min(v.videoWidth,v.videoHeight);x.save();x.translate(240,0);x.scale(-1,1);
      x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,240,240);x.restore();
      await api({a:"cam",name:me,img:c.toDataURL("image/jpeg",.55)})}
    liveTimer=setTimeout(send,450)};
  send();
}
function stopLive(){
  clearTimeout(liveTimer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;if(me)api({a:"camoff",name:me})}
  const box=document.getElementById("live");if(box){box.innerHTML=`<button class="btn red" id="golive" style="font-size:1.1rem">🎥 Go live on the TV</button><div class="tiny">Your camera shows up in a corner of the TV for 20 seconds.</div>`;box.querySelector("#golive").onclick=goLive}
}
addEventListener("pagehide",stopLive);
["touchend","click"].forEach(t=>addEventListener(t,()=>{try{XM.ensureAudio()}catch(e){}},{passive:true}));
render();poll();
// keep our name claimed while the page is open
setInterval(()=>{if(me)api({a:"join",name:me,epoch:myEpoch}).then(r=>{if(r.status===410)signedOut();else if(r.status===409){me=null;XM.store.set("xmas-sh-me",null);render()}})},20000);
